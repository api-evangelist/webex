      summary: List Sessions
      operationId: List Sessions
      description: 'List hot desk sessions.


        Use query parameters to filter the response.

        The `orgId` parameter is for use by partner administrators acting on a managed organization.

        The `personId` and `workspaceId` parameters are optional and are used to filter the response to only include sessions for a specific person or workspace.

        When used together they are used as an AND filter.'
      tags:
      - Hot Desk
      parameters:
      - name: orgId
        in: query
        description: List sessions in this organization. Only admin users of another organization (such as partners) may use this parameter.
        example: Y2lzY29...
        schema:
          type: string
      - name: personId
        in: query
        description: List sessions for this person.
        example: YL34EmA...
        schema:
          type: string
      - name: workspaceId
        in: query
        description: List sessions for this workspace.
        example: YL34EmB...
        schema:
          type: string
