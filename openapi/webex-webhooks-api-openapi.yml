      summary: Create a Webhook
      operationId: Create a Webhook
      description: 'Creates a webhook.


        To learn more about how to create and use webhooks, see The [Webhooks Guide](/docs/api/guides/webhooks).'
      tags:
      - Webhooks
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              name: My Awesome Webhook
              targetUrl: https://example.com/mywebhook
              resource: messages
              event: created
              filter: roomId=Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
              secret: 86dacc007724d8ea666f88fc77d918dad9537a15
              ownedBy: org
            schema:
              type: object
              required:
              - name
              - targetUrl
              - resource
              - event
              properties:
                name:
                  type: string
                  example: My Awesome Webhook
                  description: A user-friendly name for the webhook.
                targetUrl:
                  type: string
                  example: https://example.com/mywebhook
                  description: URL that receives POST requests for each event.
                resource:
                  type: string
                  enum:
                  - attachmentActions
                  - dataSources
                  - memberships
                  - messages
                  - rooms
                  - meetings
                  - recordings
                  - convergedRecordings
                  - meetingParticipants
                  - meetingTranscripts
                  - telephony_calls
                  - telephony_conference
                  - telephony_mwi
                  - uc_counters
                  - serviceApp
                  - adminBatchJobs
                  description: "Resource type for the webhook. Creating a webhook requires 'read' scope on the resource the\
                    \ webhook is for.\n * `attachmentActions` - [Attachment Actions](/docs/api/v1/attachment-actions) resource.\n\
                    \ * `dataSources` - [data sources](/docs/api/v1/data-sources) resource.\n * `memberships` - [Memberships](/docs/api/v1/memberships)\
                    \ resource.\n * `messages` - [Messages](/docs/api/v1/messages) resource.\n * `rooms` - [Rooms](/docs/api/v1/rooms)\
                    \ resource.\n * `meetings` - [Meetings](/docs/api/v1/meetings) resource.\n * `recordings` - [Recordings](/docs/api/v1/recordings)\
                    \ resource.\n * `convergedRecordings` - [CallRecordings](/docs/api/v1/converged-recordings) resource.\n\
                    \ * `meetingParticipants` - [Meeting Participants](/docs/api/v1/meeting-participants) resource.\n * `meetingTranscripts`\
                    \ - [Meeting Transcripts](/docs/api/v1/meeting-transcripts) resource.\n * `telephony_calls` - [Webex Calling](/docs/webex-calling-overview)\
                    \ call resources.\n * `telephony_conference` - [Webex Calling](/docs/webex-calling-overview) conference\
                    \ controls resource.\n * `telephony_mwi` - [Webex Calling](/docs/webex-calling-overview) voicemail message\
                    \ waiting indicator resource.\n * `uc_counters` - Performance counter for a dedicated instance.\n * `serviceApp`\
                    \ - Service App authorization notification.\n * `adminBatchJobs` - Admin Batch Jobs notification.\n"
                event:
                  type: string
                  enum:
                  - created
                  - updated
                  - deleted
                  - started
                  - ended
                  - joined
                  - left
                  - migrated
                  - authorized
                  - deauthorized
                  - statusChanged
                  description: "Event type for the webhook.\n * `created` - An object is created.\n * `updated` - An object\
                    \ is updated.\n * `deleted` - An object is deleted.\n * `started` - A meeting is started.\n * `ended`\
                    \ - A meeting is ended.\n * `joined` - A participant joined.\n * `left` - A participant left.\n * `migrated`\
                    \ - A room was migrated to a different geography. The roomId has changed.\n * `authorized` - A Service\
                    \ App was authorized.\n * `deauthorized` - A Service App was deauthorized.\n * `statusChanged` - Status\
                    \ of admin batch job was changed.\n"
                filter:
                  type: string
                  example: roomId=Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
                  description: Filter that defines the webhook scope. See [Filtering Webhooks](/docs/api/guides/webhooks#filtering-webhooks)
                    for more information. Please note that if a filter of `hostEmail`, `hostUserId`, `ownerEmail` or `ownerId`
                    is specified, `ownedBy` must be set to `org`.
                secret:
                  type: string
                  example: 86dacc007724d8ea666f88fc77d918dad9537a15
                  description: Secret used to generate payload signature.
                ownedBy:
                  type: string
                  example: org
                  description: Specify `org` when creating an org/admin level webhook. Supported for `meetings`, `recordings`,
                    `convergedRecordings`,`meetingParticipants`, `meetingTranscripts`, `videoMeshAlerts`, `controlHubAlerts`,
                    `rooms`, `messaging` and `adminBatchJobs` (for Compliance Officers and messages with file attachments
                    only - see [inline file DLP](/docs/api/guides/webex-real-time-file-dlp-basics)) resources.
