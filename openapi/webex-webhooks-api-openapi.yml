      summary: Update a Webhook
      operationId: Update a Webhook
      description: 'Updates a webhook, by ID. You cannot use this call to deactivate a webhook, only to activate a webhook
        that was auto deactivated.

        The fields that can be updated are `name`, `targetURL`, `secret` and `status`. All other fields, if supplied, are
        ignored.


        Specify the webhook ID in the `webhookId` parameter in the URI.'
      tags:
      - Webhooks
      parameters:
      - name: webhookId
        in: path
        description: The unique identifier for the webhook.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1dFQkhPT0svOTZhYmMyYWEtM2RjYy0xMWU1LWExNTItZmUzNDgxOWNkYzlh
        schema:
          type: string
