      summary: List Workspace Locations
      operationId: List Workspace Locations
      description: '<div><Callout type="warning">The Workspace Locations API is deprecated and will be decommissioned November 30, 2024. Please use the [/locations API](/docs/api/v1/locations) for future projects, and use `locationId` instead of `workspaceLocationId` when interacting with device or workspace APIs.</Callout></div>


        List workspace locations. Use query parameters to filter the response. The `orgId` parameter can only be used by admin users of another

        organization (such as partners). The `displayName`, `address`, `countryCode` and `cityName` parameters are all optional.

        Requires an administrator auth token with the `spark-admin:workspace_locations_read` scope.'
      tags:
      - Workspace Locations
      parameters:
      - name: orgId
        in: query
        description: List workspace locations in this organization. Only admin users of another organization (such as partners) may use this parameter.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: displayName
        in: query
        description: Location display name.
        example: Cisco Barcelona
        schema:
          type: string
      - name: address
        in: query
        description: Location address.
        example: Carrer de Pere IV, Barcelona, Spain
        schema:
          type: string
      - name: countryCode
        in: query
        description: Location country code (ISO 3166-1).
        example: ES
        schema:
          type: string
      - name: cityName
        in: query
        description: Location city name.
        example: Barcelona
        schema:
          type: string
      deprecated: true
