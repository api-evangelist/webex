      summary: Create a Workspace Location
      operationId: Create a Workspace Location
      description: '<div><Callout type="warning">The Workspace Locations API is deprecated and will be decommissioned November 30, 2024. Please use the [/locations API](/docs/api/v1/locations) for future projects, and use `locationId` instead of `workspaceLocationId` when interacting with device or workspace APIs.</Callout></div>


        Create a location. The `cityName` and `notes` parameters are optional, and omitting them will result in the creation of a location without values for those attributes.

        Requires an administrator auth token with the `spark-admin:workspace_locations_write` scope.'
      tags:
      - Workspace Locations
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              displayName: Cisco Barcelona
              address: Carrer de Pere IV, Barcelona, Spain
              countryCode: ES
              cityName: Barcelona
              latitude: 41.406615
              longitude: 2.200717
              notes: A note about the location
            schema:
              $ref: '#/components/schemas/WorkspaceLocationsCreationRequest'
      deprecated: true
