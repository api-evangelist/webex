      summary: Update Group Meeting Control Status
      operationId: updateGroupMeetingControl
      description: Update meeting recording control status by a service app which has group meeting access. The service app can use this API to start, stop, pause, or resume meeting recording by providing an `action` value. The `personId` parameter or `hostEmail` header of the person to whom the meeting belongs must be specified. The service app which invokes the API manages one or more groups, and it also manages one or more sites. The user specified by `hostEmail` or `personId` must be in a group that is managed by the service app. The meeting specified by `meetingId` must be on a site that is managed by the service app. Please note that once the meeting recording has been controlled by a person in the meeting, the recording control of this meeting can no longer be controlled by the service app via the API.
      tags:
      - Meetings
      parameters:
      - name: personId
        in: query
        description: Person ID of the user whose meeting control will be updated. The person ID can be retrieved from the [People APIs](/docs/api/v1/people), e.g. [Lit People](/docs/api/v1/people/list-people). Note that a person ID retrieved from the People APIs is a Base64-encoded string, e.g. `Y2lzY29zcGFyazovL3VzL1BFT1BMRS9kNDdiMmU3ZC01ZTBmLTRmNjktYWVmNC1lNGZmOTBhZWE3Yzk`. The person ID in the raw UUID format which is the last part of the Base64-decoded string, e.g. `d47b2e7d-5e0f-4f69-aef4-e4ff90aea7c9`, is also supported. The `personId` parameter is optional, but one of the `personId` parameter and `hostEmail` header must be specified.
        required: false
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9kNDdiMmU3ZC01ZTBmLTRmNjktYWVmNC1lNGZmOTBhZWE3Yzk
        schema:
          type: string
      - name: hostEmail
        in: header
        description: Email of the user whose meeting control will be updated. The `hostEmail` parameter is optional, but one of the `personId` parameter and `hostEmail` header must be specified.
        required: false
        schema:
          type: string
        example: john.andersen@example.com
      requestBody:
        content:
          application/json:
            example:
              meetingId: 560d7b784f5143e3be2fc3064a5c4999
              action: startRecording
            schema:
              type: object
              properties:
                meetingId:
                  type: string
                  description: Unique identifier for the meeting.
                  example: 560d7b784f5143e3be2fc3064a5c4999
                action:
                  type: string
                  description: Action to apply to the meeting recording.
                  enum:
                  - startRecording
                  - stopRecording
                  - pauseRecording
                  - resumeRecording
                  example: startRecording
              required:
              - meetingId
              - action
        required: true
