          description: "Registrant's status.\n * `approved` - Registrant has been approved.\n * `pending` - Registrant is in a pending list waiting for host or cohost approval.\n * `rejected` - Registrant has been rejected by the host or cohost.\n"
        orderType:
          type: string
          enum:
          - DESC
          - ASC
          description: Sort order for the registrants.
        orderBy:
          type: string
          enum:
          - firstName
          - lastName
          - status
          - email
          description: "Registrant ordering field. Ordered by `registrationTime` by default.\n * `firstName` - Registrant's first name.\n * `lastName` - Registrant's last name.\n * `status` - Registrant's status.\n * `email` - registrant's email.\n"
        emails:
          type: array
          items:
            type: string
            example: bob@example.com
          description: List of registrant email addresses.
    MeetingSessionTypeObject:
      type: object
      required:
