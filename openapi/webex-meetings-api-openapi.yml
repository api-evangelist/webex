      summary: Join a Meeting
      operationId: meetingJoin
      description: 'Retrieves links for a meeting with a specified `meetingId`, `meetingNumber`, or `webLink` that allow users to start or join the meeting directly without logging in and entering a password.


        * Please note that `meetingId`, `meetingNumber` and `webLink` are mutually exclusive and they cannot be specified simultaneously.


        * If `joinDirectly` is true or not specified, the response will have HTTP response code 302 and the request will be redirected to `joinLink`; otherwise, the response will have HTTP response code 200 and `joinLink` will be returned in response body.


        * Only the meeting host or cohost can generate the `startLink`.


        * An admin user or a [Service App](/docs/service-apps) can generate the `startLink` and `joinLink` on behalf of another meeting host using the `hostEmail` parameter. When a [Service App](/docs/service-apps) generates the `startLink` and `joinLink`, the `hostEmail` parameter is required. The `hostEmail` parameter only applies to meetings, not webinars.


        * For Service Apps, `hostEmail` must be provided in the request.


        * Generating a join link or a start link before the time specified by `joinBeforeHostMinutes` for a webinar is not supported.


        * The `joinLink` and `startLink` generated by the API only work in a web browser, not in mobile apps. When the `joinLink` or `startLink` is used in a mobile app, the user can''t join or start the meeting directly by the dial-in or dial-out phone numbers displayed in the app.


        * When `createJoinLinkAsWebLink` or `createStartLinkAsWebLink` is set to true, a user cannot join or start the meeting using the `joinLink` or `startLink` returned in the response, and must complete the login flow. Those options are typically useful if mandatory user login is configured in Control Hub.


        * Appending the parameter `&launchApp=true` to the weblink will launch directly into the browser experience without showing the user the download selection for the native client.


        * [Embedded Apps](/docs/embedded-apps) are not supported in a meeting which is started from the `startLink` generated by this API.


        <div><Callout type="warning">When the `email` or `displayName` is omitted from the API request, the backend inserts the data from the user making the request. That may lead to situations where an attendee is shown in the roster with the hostname which should be avoided. In the future, we will make those two fields required.</Callout></div>'
      tags:
      - Meetings
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              meetingId: 98d8c2212c9d62b162b9565932735e59
              meetingNumber: '123456789'
              webLink: https://site4-example.webex.com/site4/j.php?MTID=md41817da6a55b0925530cb88b3577b1e
              joinDirectly: false
              email: brenda.song@example.com
              displayName: Brenda Song
              password: BgJep@43
              expirationMinutes: 5
              hostEmail: john.andersen@example.com
              createJoinLinkAsWebLink: false
              createStartLinkAsWebLink: false
            schema:
              $ref: '#/components/schemas/JoinMeetingObject'
