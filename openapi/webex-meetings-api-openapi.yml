        in: path
        description: Unique identifier for the meeting to be ended.
        required: true
        example: e8a6557d3c964824ba346a0800d92575
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              reason: Agenda has been completed and the meeting is ended.
