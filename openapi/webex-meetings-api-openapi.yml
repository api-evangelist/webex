        href:
          type: string
          example: /api/v1/meetings/2c87cf8ece4e414a9fe5516e4a0aac76/globalCallinNumbers
          description: Target resource URI (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
        method:
          type: string
          example: GET
          description: Target resource method (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
    JoinMeetingLinkObject:
      type: object
      properties:
        startLink:
          type: string
          example: https://example.dmz.webex.com/wbxmjs/joinservice/sites/example/meeting/download/b9dd6cac53564877b65589cc17d4233e?siteurl=example&
          description: The link is used to start a meeting as the meeting host. Only the meeting host or cohost can generate the `startLink`.
        joinLink:
          type: string
          example: https://example.webex.com/wbxmjs/joinservice/sites/example/meeting/download/cdedf9ae847b4f9993f87e62a8889dad?siteurl=example&integrationJoinToken=QUhTSwAAAIVAFMmwcApsg+NPn9DlUdF1yv2eVVq2HaXr2vu0/4Ttl9P38kCzoA3A5CKTcDnLr79X4FSvZnZUmUPlv/4F/4/iverF7eOgZaYM5rgUayI3L9ye6lNyYGNb7ZYEAL6oo4xFUDRo8oE3+H/iBeu+nzQnkKcmnTQQPjzZVJQcZVM9tQ==&principal=QUhTSwAAAIXf3TeZvJmVBoXnIhYAIpNdFJ5pfxSftfCOhmwAlckVkd1ZuyfEMosdWeWGHDsThiN+5I55up8e5By/SIu5dUkL9QPu6qVPVhH24xIxkBHfhasau2XB0VZgyIG64tCkEcwf4s0/gJO3N/2RhWkmB669
          description: The link is used to join the meeting.
        expiration:
          type: string
          example: '2022-05-30T09:44:08Z'
          description: Expiration time of `joinLink`. When both `createJoinLinkAsWebLink` and `createStartLinkAsWebLink` are true, this attribute is not returned in the response.
    PreMeetingBreakoutSessionObject:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: 18d2e565770c4eee918784ee333510ec
          description: Unique identifier for breakout session.
        name:
          type: string
          example: Breakout Session Name
          description: Name for breakout session.
        invitees:
          type: array
          items:
            type: string
          description: Invitees for breakout session. Only applies to breakout sessions which are created when meeting is scheduled.
    ReassignMeetingRequestObject:
      type: object
      required:
      - hostEmail
      - meetingIds
      properties:
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address of the new meeting host.
        meetingIds:
          type: array
          items:
            type: string
          description: List of meeting series IDs to be reassigned the new host. The size is between 1 and 100. All the meetings of `meetingIds` should belong to the same site, which is the `siteUrl` in the request header, if specified, or the admin user's preferred site, if not specified. All available Webex sites and the preferred sites of a user can be retrieved by [Get Site List](/docs/api/v1/meeting-preferences/get-site-list) API.
    MeetingObjectForListMeeting:
      type: object
      required:
      - id
      - meetingSeriesId
      - title
      - password
      - meetingType
      - state
      - timezone
      - start
      - end
      - hostUserId
      - hostDisplayName
      - hostEmail
      - hostKey
      - siteUrl
      - webLink
      - telephony
      - enabledBreakoutSessions
      properties:
        id:
          type: string
          example: dfb45ece33264639a7bc3dd9535d53f7_20200516T230000Z
          description: Unique identifier for meeting. For a meeting series, the `id` is used to identify the entire series. For scheduled meetings from a series, the `id` is used to identify that scheduled meeting. For a meeting instance that is in progress or has concluded, the `id` is used to identify that instance.
        meetingSeriesId:
          type: string
          example: dfb45ece33264639a7bc3dd9535d53f7
          description: Unique identifier for meeting series. It only apples to scheduled meeting and meeting instance. If it's a scheduled meeting from a series or a meeting instance that is happening or has happened, the `meetingSeriesId` is the `id` of the primary series.
        scheduledMeetingId:
          type: string
          example: dfb45ece33264639a7bc3dd9535d53f7
          description: Unique identifier for scheduled meeting which current meeting is associated with. It only apples to meeting instance which is happening or has happened. It's the `id` of the scheduled meeting this instance is associated with.
        meetingNumber:
          type: string
          example: '123456789'
          description: Meeting number. Applies to meeting series, scheduled meeting, and meeting instances, but not to meeting instances which have ended.
        title:
          type: string
          example: John's Meeting
          description: Meeting title. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        agenda:
          type: string
          example: John's Agenda
          description: Meeting agenda. The agenda can be a maximum of 1300 characters long. This attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        password:
          type: string
          example: BgJep@43
          description: Meeting password. Applies to meeting series, scheduled meetings, and in-progress meeting instances, but not to meeting instances which have ended. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        phoneAndVideoSystemPassword:
          type: string
          example: '12345678'
          description: 8-digit numeric password used to join a meeting from audio and video devices. This attribute applies to meeting series, scheduled meetings, and in-progress meeting instances, but not to meeting instances which have ended.
        meetingType:
          type: string
          enum:
          - meetingSeries
          - scheduledMeeting
          - meeting
          description: "Meeting type.\n * `meetingSeries` - Primary instance of a scheduled series of meetings which consists of one or more scheduled meetings based on a `recurrence` rule. When a non-recurring meeting is scheduled with no `recurrence`, its `meetingType` is also `meetingSeries` which is a meeting series with only one occurrence in Webex meeting modeling.\n * `scheduledMeeting` - Instance from a primary meeting series.\n * `meeting` - Meeting instance that is in progress or has completed.\n"
        state:
          type: string
          enum:
          - active
          - scheduled
          - ready
          - lobby
          - inProgress
          - ended
          - missed
          - expired
          description: "Meeting state.\n * `active` - Only applies to a meeting series. Indicates that one or more future scheduled meetings exist for this meeting series.\n * `scheduled` - Only applies to scheduled meeting. Indicates that the meeting is scheduled in the future.\n * `ready` - Only applies to scheduled meeting. Indicates that this scheduled meeting is ready to start or join immediately.\n * `lobby` - Only applies to meeting instances. Indicates that a locked meeting has been joined by participants, but no hosts have joined.\n * `inProgress` - Applies to meeting series and meeting instance. For meeting series, indicates that an instance of this series is in progress; for a meeting instances, indicates that the meeting has been joined and unlocked.\n * `ended` - Applies to scheduled meetings and meeting instances. For scheduled meetings, indicates that the meeting was started and is now over. For meeting instances, indicates that the meeting instance has concluded.\n * `missed` - This state only applies to scheduled meetings. Indicates that the meeting was scheduled in the past but never happened.\n * `expired` - This state only applies to a meeting series. Indicates that all scheduled meetings of this series have passed.\n"
        hostDidJoin:
          type: boolean
          description: Only applies to meeting series in the `inProgress` state, scheduled meetings in the `ready` state, and meeting instances in the `inProgress` state, whether or not the meeting host joined the meeting. If true, the meeting host has joined the meeitng even if they dropped off; otherwise, the meeting host hasn't ever join the meeting. Indicates that someone is waiting in the lobby and the host hasn't joined the meeting if `attendeeDidJoin` is true and `hostDidJoin` is false.
        attendeeDidJoin:
          type: boolean
          description: Only applies to meeting series in the `inProgress` state, scheduled meetings in the `ready` state, and meeting instances in the `inProgress` state. Whether or not anyone has joined the meeting. If true, the meeting host or any attendee has joined the meeting; otherwise, no one has joined the meeting. Indicates that someone is waiting in the lobby and the host hasn't joined the meeting if `attendeeDidJoin` is true and `hostDidJoin` is false.
        isModified:
          type: boolean
          description: This state only applies to scheduled meeting. Flag identifying whether or not the scheduled meeting has been modified.
        timezone:
          type: string
          example: UTC
          description: '[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) of `start` and `end`, conforming with the [IANA time zone database](https://www.iana.org/time-zones).'
        start:
          type: string
          example: '2019-03-18T11:26:30Z'
          description: Start time for meeting in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If the meetingType of a meeting is `meetingSeries`, `start` is the scheduled start time of the first occurrence of this series. If the meeting is a meeting series and the `current` filter is true, `start` is the date and time the upcoming or ongoing meeting of the series starts. If the meetingType of a meeting is `scheduledMeeting`, `start` is the scheduled start time of this occurrence. If the meetingType of a meeting is `meeting`, `start` is the actual start time of the meeting instance. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        end:
          type: string
          example: '2019-03-18T12:26:30Z'
          description: End time for a meeting in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If the meetingType of a meeting is `meetingSeries`, `end` is the scheduled end time of the first occurrence of this series. If the meeting is a meeting series and the current filter is true, `end` is the date and time the upcoming or ongoing meeting of the series ends. If the meetingType of a meeting is `scheduledMeeting`, `end` is the scheduled end time of this occurrence. If the meetingType of a meeting is `meeting`, `end` is the actual end time of the meeting instance. If a meeting instance is in progress, `end` is not available. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        recurrence:
          type: string
          example: FREQ=DAILY;INTERVAL=1;COUNT=10
          description: Meeting series recurrence rule (conforming with [RFC 2445](https://www.ietf.org/rfc/rfc2445.txt)). Applies only to a recurring meeting series, not to a meeting series with only one scheduled meeting. Can be modified for a meeting series using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API. Multiple days or dates for monthly or yearly `recurrence` rule are not supported, only the first day or date specified is taken. For example, "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10,11,12" is not supported and it will be partially supported as "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10".
        hostUserId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83QkFCQkU5OS1CNDNFLTREM0YtOTE0Ny1BMUU5RDQ2QzlDQTA
          description: Unique identifier for the meeting host.
        hostDisplayName:
          type: string
          example: John Andersen
          description: Display name for the meeting host.
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host.
        hostKey:
          type: string
          example: '123456'
          description: Key for joining the meeting as host.
        siteUrl:
          type: string
          example: site4-example.webex.com
          description: Site URL for the meeting.
        webLink:
          type: string
          example: https://site4-example.webex.com/site4/j.php?MTID=md41817da6a55b0925530cb88b3577b1
          description: Link to a meeting information page where the meeting client is launched if the meeting is ready to start or join.
        sipAddress:
          type: string
          example: 123456789@site4-example.webex.com
          description: SIP address for callback from a video system.
        dialInIpAddress:
          type: string
          example: 192.168.100.100
          description: IP address for callback from a video system.
        roomId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JPT00vNDMzZjk0ZjAtOTZhNi0xMWViLWJhOTctOTU3OTNjZDhiY2Q2
          description: Room ID of the associated Webex space. Only applies to ad-hoc meetings and space meetings.
        enabledAutoRecordMeeting:
          type: boolean
          description: Whether or not meeting is recorded automatically. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        allowAnyUserToBeCoHost:
          type: boolean
          description: Whether or not to allow any attendee with a host account on the target site to become a cohost when joining the meeting. The target site is specified by a `siteUrl` parameter when creating the meeting. If not specified, it's a user's preferred site. The `allowAnyUserToBeCoHost` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        enabledJoinBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to join the meeting before the host joins the meeting. The `enabledJoinBeforeHost` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        enableConnectAudioBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to connect to audio before the host joins the meeting. Only applicable if the `enabledJoinBeforeHost` attribute is set to `true`. The `enableConnectAudioBeforeHost` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        joinBeforeHostMinutes:
          type: number
          example: 15
          description: Number of minutes an attendee can join the meeting before the meeting start time and the host joins. Only applicable if the `enabledJoinBeforeHost` attribute is set to true. The `joinBeforeHostMinutes` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API. Valid options for a meeting are `0`, `5`, `10`, and `15`, and valid options for a webinar are `0`, `15`, `30`, `45`, and `60`. The default is `0` if not specified.
        excludePassword:
          type: boolean
          description: Whether or not to exclude the meeting password from the email invitation.
        publicMeeting:
          type: boolean
          description: Whether or not to allow the meeting to be listed on the public calendar.
        reminderTime:
          type: number
          example: 10
          description: The number of minutes before the meeting begins, that an email reminder is sent to the host.
        unlockedMeetingJoinSecurity:
          type: string
          enum:
          - allowJoin
          - allowJoinWithLobby
          - blockFromJoin
          description: "Specifies how the people who aren't on the invite can join the unlocked meeting.\n * `allowJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoin`, people can join the unlocked meeting directly.\n * `allowJoinWithLobby` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoinWithLobby`, people will wait in the lobby until the host admits them.\n * `blockFromJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `blockFromJoin`, people can't join the unlocked meeting.\n"
        sessionTypeId:
          type: number
          example: 3
          description: Unique identifier for a meeting session type for the user. This attribute is required when scheduling a webinar meeting. All available meeting session types enabled for the user can be retrieved using the [List Meeting Session Types](/docs/api/v1/meetings/list-meeting-session-types) API.
        scheduledType:
          type: string
          enum:
          - meeting
          - webinar
          - personalRoomMeeting
          description: "Specifies whether the meeting is a regular meeting, a webinar, or a meeting scheduled in the user's [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings).\n * `meeting` - If the value of `scheduledType` attribute is `meeting`, it is a regular meeting.\n * `webinar` - If the value of `scheduledType` attribute is `webinar`, it is a webinar meeting.\n * `personalRoomMeeting` - If the value of `scheduledType` attribute is `personalRoomMeeting`, it is a meeting scheduled in the user's [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings).\n"
        enabledWebcastView:
          type: boolean
          description: Whether or not webcast view is enabled.
        panelistPassword:
          type: string
          example: GwLqa@78
          description: Password for panelists of a webinar meeting. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details. If not specified, a random password conforming to the site's password rules will be generated automatically.
        phoneAndVideoSystemPanelistPassword:
          type: string
          example: '12345678'
          description: 8-digit numeric panelist password to join a webinar meeting from audio and video devices.
        enableAutomaticLock:
          type: boolean
          description: Whether or not to automatically lock the meeting after it starts.
        automaticLockMinutes:
          type: number
          example: 10
          description: The number of minutes after the meeting begins, for automatically locking it.
        allowFirstUserToBeCoHost:
          type: boolean
          description: Whether or not to allow the first attendee of the meeting with a host account on the target site to become a cohost. The target site is specified by the `siteUrl` parameter when creating the meeting. If not specified, it's a user's preferred site. The `allowFirstUserToBeCoHost` attribute can be modified for a meeting series or a scheduled meeting uisng the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        allowAuthenticatedDevices:
          type: boolean
          description: Whether or not to allow authenticated video devices in the meeting's organization to start or join the meeting without a prompt. This attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        hasChat:
          type: boolean
          description: Whether or not this meeting instance has chat.
        hasRecording:
          type: boolean
          description: Whether or not this meeting instance has been recorded. `true` if the meeting instance has been recorded even if the recording has been deleted.
        hasTranscription:
          type: boolean
          description: Whether or not this meeting instance has a transcription.
        hasClosedCaption:
          type: boolean
          description: Whether or not this meeting instance has closed captions.
        hasPolls:
          type: boolean
          description: Whether or not this meeting instance has polls.
        hasQA:
          type: boolean
          description: Whether or not this meeting instance has Q&A.
        hasSlido:
          type: boolean
          description: Whether or not this meeting instance has Slido interactions. It's true if Slido is enabled in the meeting and there are interactions like Q&A or polling in Slido.
        hasRegistration:
          type: boolean
          description: Whether or not this meeting instance has a registration form. Only applies to ended meeting or webinar instances. Doesn't apply to meeting series, scheduled meetings, or in-progress meeting or webinar instances.
        hasRegistrants:
          type: boolean
          description: Whether or not someone has registered a this meeting instance via the registration form. Only applies to ended meeting or webinar instances. Doesn't apply to meeting series, scheduled meetings, or in-progress meeting or webinar instances.
        hasPostEventSurvey:
          type: boolean
          description: Whether this meeting instance has a survey and someone has responded to the survey. Only applies to ended webinar instances. Doesn't apply to meeting series, scheduled meetings, in-progress meeting or webinar instances, or ended meeting instances.
        telephony:
          type: object
          required:
          - accessCode
          - callInNumbers
          properties:
            accessCode:
              type: string
              example: '1234567890'
              description: Code for authenticating a user to join teleconference. Users join the teleconference using the call-in number or the global call-in number, followed by the value of the `accessCode`.
            callInNumbers:
              type: array
              items:
                type: object
                required:
                - label
                - callInNumber
                - tollType
                properties:
                  label:
                    type: string
                    example: Call-in toll-free number (US/Canada)
                    description: Label for the call-in number.
                  callInNumber:
                    type: string
                    example: '123456789'
                    description: Call-in number to join the teleconference from a phone.
                  tollType:
                    type: string
                    enum:
                    - toll
                    - tollFree
                    description: Type of toll for the call-in number.
              description: Array of call-in numbers for joining a teleconference from a phone.
            links:
              type: array
              items:
                $ref: '#/components/schemas/LinksObjectForTelephony'
              description: '[HATEOAS](https://en.wikipedia.org/wiki/HATEOAS) information of global call-in numbers for joining a teleconference from a phone.'
          description: Information for callbacks from a meeting to phone or for joining a teleconference using a phone.
        meetingOptions:
          type: object
          properties:
            enabledChat:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat in the meeting. Also depends on the session type.
            enabledVideo:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to have video in the meeting. Also depends on the session type.
            enabledPolling:
              type: boolean
              description: Whether or not to allow any attendee to poll in the meeting. Can only be set `true` for a webinar. The value of this attribute depends on the session type for a meeting. Please contact your site admin if this attribute is not available. Not supported if the site has been migrated to the Webex Suite meeting platform.
            enabledNote:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to take notes in the meeting. The value of this attribute also depends on the session type. Not supported if the site has been migrated to the Webex Suite meeting platform.
            noteType:
              type: string
              enum:
              - allowAll
              - allowOne
              description: "Whether note taking is enabled. If the value of `enabledNote` is false, users cannot set this attribute and get the default value `allowAll`. Not supported if the site has been migrated to the Webex Suite meeting platform.\n * `allowAll` - If the value of `noteType` attribute is `allowAll`, all participants can take notes.\n * `allowOne` - If the value of `noteType` attribute is `allowOne`, only a single note taker is allowed.\n"
            enabledFileTransfer:
              type: boolean
              description: Whether or not to allow any attendee to transfer files in the meeting. The value of this attribute also depends on the session type.
            enabledUCFRichMedia:
              type: boolean
              description: Whether or not to allow any attendee to share [Universal Communications Format](https://www.cisco.com/c/en/us/td/docs/collaboration/training_center/wbs30/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions_chapter_0110.pdf) media files in the meeting. The value of this attribute also depends on the sessionType. Not supported if the site has been migrated to the Webex Suite meeting platform.
          description: Meeting Options.
        attendeePrivileges:
          type: object
          properties:
            enabledShareContent:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to share content in the meeting.
            enabledSaveDocument:
              type: boolean
              description: Whether or not to allow any attendee to save shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledPrintDocument:
              type: boolean
              description: Whether or not to allow any attendee to print shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledAnnotate:
              type: boolean
              description: Whether or not to allow any attendee to annotate shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledViewParticipantList:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to view participants.
            enabledViewThumbnails:
              type: boolean
              description: Whether or not to allow any attendee to see a small preview image of any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledRemoteControl:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to control applications, web browsers, or desktops remotely.
            enabledViewAnyDocument:
              type: boolean
              description: Whether or not to allow any attendee to view any shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledViewAnyPage:
              type: boolean
              description: Whether or not to allow any attendee to scroll through any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledContactOperatorPrivately:
              type: boolean
              description: Whether or not to allow any attendee to contact the operator privately.
            enabledChatHost:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the host in private.
            enabledChatPresenter:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the presenter in private.
            enabledChatOtherParticipants:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with other participants in private.
          description: Attendee Privileges. This attribute is not supported for a webinar.
        registration:
          type: object
          properties:
            autoAcceptRequest:
              type: boolean
              description: Whether or not meeting registration requests are accepted automatically.
            requireFirstName:
              type: boolean
              example: true
              description: Whether or not a registrant's first name is required for meeting registration.
            requireLastName:
              type: boolean
              example: true
              description: Whether or not a registrant's last name is required for meeting registration.
            requireEmail:
              type: boolean
              example: true
              description: Whether or not a registrant's email is required for meeting registration.
            requireJobTitle:
              type: boolean
              description: Whether or not a registrant's job title is shown or required for meeting registration.
            requireCompanyName:
              type: boolean
              description: Whether or not a registrant's company name is shown or required for meeting registration.
            requireAddress1:
              type: boolean
              description: Whether or not a registrant's first address field is shown or required for meeting registration.
            requireAddress2:
              type: boolean
              description: Whether or not a registrant's second address field is shown or required for meeting registration.
            requireCity:
              type: boolean
              description: Whether or not a registrant's city is shown or required for meeting registration.
            requireState:
              type: boolean
              description: Whether or not a registrant's state is shown or required for meeting registration.
            requireZipCode:
              type: boolean
              description: Whether or not a registrant's postal code is shown or required for meeting registration.
            requireCountryRegion:
              type: boolean
              description: Whether or not a registrant's country or region is shown or required for meeting registration.
            requireWorkPhone:
              type: boolean
              description: Whether or not a registrant's work phone number is shown or required for meeting registration.
            requireFax:
              type: boolean
              description: Whether or not a registrant's fax number is shown or required for meeting registration.
            maxRegisterNum:
              type: number
              example: 1000
              description: Maximum number of meeting registrations. This only applies to meetings. The maximum number of participants for meetings and webinars, with the limit based on the user capacity and controlled by a toggle at the site level. The default maximum number of participants for webinars is 10000, but the actual maximum number of participants is limited by the user capacity.
          description: Meeting registration. When this option is enabled, meeting invitees must register personal information in order to join the meeting. Meeting invitees will receive an email with a registration link for the registration. When the registration form has been submitted and approved, an email with a real meeting link will be received. By clicking that link the meeting invitee can join the meeting. Please note that meeting registration does not apply to a meeting when it's a recurring meeting with a `recurrence` field or no `password` or when the feature toggle `DecoupleJBHWithRegistration` is disabled the `Join Before Host` option is enabled for the meeting, See [Register for a Meeting in Cisco Webex Meetings](https://help.webex.com/en-us/nmgmeff/Register-for-a-Meeting-in-Cisco-Webex-Meetings) for details.
        integrationTags:
          type: array
          items:
            type: string
          description: External keys created by an integration application in its domain, for example, Zendesk ticket IDs, Jira IDs, Salesforce Opportunity IDs, etc.
        simultaneousInterpretation:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              description: Whether or not simultaneous interpretation is enabled.
            interpreters:
              type: array
              items:
                $ref: '#/components/schemas/InterpreterObjectForSimultaneousInterpretationOfGetOrListMeeting'
              description: Interpreters for meeting.
          description: Simultaneous interpretation information for the meeting.
        enabledBreakoutSessions:
          type: boolean
          description: Whether or not breakout sessions are enabled.
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinksObjectForBreakoutSessions'
          description: '[HATEOAS](https://en.wikipedia.org/wiki/HATEOAS) Breakout Sessions information for meeting.'
        trackingCodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCodeItemForGetMeetingObject'
          description: Tracking codes information.
        enabledAudioWatermark:
          type: boolean
          description: Whether or not the audio watermark is enabled.
        enabledVisualWatermark:
          type: boolean
          description: Whether or not the visual watermark is enabled.
        visualWatermarkOpacity:
          type: number
          example: 10
          description: Opacity level for visual watermark.
        audioConnectionOptions:
          type: object
          properties:
            audioConnectionType:
              type: string
              enum:
              - webexAudio
              - VoIP
              - other
              - none
              description: "Choose how meeting attendees join the audio portion of the meeting.\n * `webexAudio` - Provide a hybrid audio option, allowing attendees to join using their computer audio or a phone.\n * `VoIP` - Only restricts attendees to join the audio portion of the meeting using their computer instead of a telephone option.\n * `other` - Other teleconference services.\n * `none` - The way of attendees join the audio portion of the meeting is the default value.\n"
            enabledTollFreeCallIn:
              type: boolean
              example: true
              description: Whether or not to show toll-free call-in numbers.
            enabledGlobalCallIn:
              type: boolean
              example: true
              description: Whether or not to show global call-in numbers to attendees.
            enabledAudienceCallBack:
              type: boolean
              description: Whether or not to allow attendees to receive a call-back and call-in is available. Can only be set `true` for a webinar.
            entryAndExitTone:
              type: string
              enum:
              - beep
              - announceName
              - noTone
              description: "Select the sound you want users who have a phone audio connection to hear when someone enters or exits the meeting.\n * `beep` - All call-in users joining the meeting will hear the beep.\n * `announceName` - All call-in users joining the meeting will hear their names.\n * `noTone` - Turn off beeps and name announcements.\n"
            allowHostToUnmuteParticipants:
              type: boolean
              description: Whether or not to allow the host to unmute participants.
            allowAttendeeToUnmuteSelf:
              type: boolean
              example: true
              description: Whether or not to allow attendees to unmute themselves.
            muteAttendeeUponEntry:
              type: boolean
              description: Whether or not to auto-mute attendees when attendees enter meetings.
          description: Audio connection options.
        requireAttendeeLogin:
          type: boolean
          description: Require attendees to sign in before joining the webinar.
        restrictToInvitees:
          type: boolean
          description: Restrict webinar to invited attendees only.
        enabledLiveStream:
          type: boolean
          description: Whether or not live streaming is enabled. If it's enabled, the `liveStream` must be specified. The RTMP streaming specified by `liveStream.rtmpUrl` can be started and viewed during the meeting without any ad-hoc settings.
        liveStream:
          $ref: '#/components/schemas/LiveStreamObject'
          description: Live streaming settings. It applies when `enabledLiveStream` is `true`.
    LinksObjectForBreakoutSessions:
      type: object
      required:
      - rel
      - href
      - method
      properties:
        rel:
          type: string
          example: breakoutSessions
          description: Link relation describing how the target resource is related to the current context (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
        href:
          type: string
          example: /api/v1/meetings/2c87cf8ece4e414a9fe5516e4a0aac76/breakoutSessions
          description: Target resource URI (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
        method:
          type: string
          example: GET
          description: Target resource method (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
    UpdateMeetingBreakoutSessionsObject:
      type: object
      properties:
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This parameter is only used if the user or application calling the API has the admin-level scopes. If set, the admin may specify the email of a user in a site they manage and the API will return details for a meeting that is hosted by that user.
        sendEmail:
          type: boolean
          example: true
          description: Whether or not to send emails to host and invitees. It is an optional field and default value is true.
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreMeetingBreakoutSessionWithoutIdObject'
          description: Breakout sessions are smaller groups that are split off from the main meeting or webinar. They allow a subset of participants to collaborate and share ideas over audio and video. Use breakout sessions for workshops, classrooms, or for when you need a moment to talk privately with a few participants outside of the main session. Please note that maximum number of breakout sessions in a meeting or webinar is 100. In webinars, if hosts preassign attendees to breakout sessions, the role of `attendee` will be changed to `panelist`. Breakout session is not supported for a meeting with simultaneous interpretation.
    SurveyLinkRequestObject:
      type: object
      properties:
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This parameter is only used if the user or application calling the API has the admin on-behalf-of scopes. An admin can specify the email of the meeting host who is in a site he manages and the API returns post survey links on behalf of the meeting host.
        meetingStartTimeFrom:
          type: string
          example: '2019-03-18T09:30:00Z'
          description: Start date and time (inclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format for the meeting objects being requested and conforms with the `timezone` in the request header if specified. `meetingStartTimeFrom` cannot be after `meetingStartTimeTo`. Only applies when `meetingId` is not an instance ID. The API generates survey links for the last instance of `meetingId` in the time range specified by `meetingStartTimeFrom` and `meetingStartTimeTo`. If not specified, `meetingStartTimeFrom` equals `meetingStartTimeTo` minus `1` month; if `meetingStartTimeTo` is also not specified, the default value for `meetingStartTimeFrom` is `1` month before the current date and time.
        meetingStartTimeTo:
          type: string
          example: '2019-03-25T09:30:00Z'
          description: End date and time (exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format for the meeting objects being requested and conforms with the `timezone` in the request header if specified. `meetingStartTimeTo` cannot be prior to `meetingStartTimeFrom`. Only applies when `meetingId` is not an instance ID. The API generates survey links for the last instance of `meetingId` in the time range specified by `meetingStartTimeFrom` and `meetingStartTimeTo`. If not specified, `meetingStartTimeTo` equals `meetingStartTimeFrom` plus `1` month; if `meetingStartTimeFrom` is also not specified, the default value for `meetingStartTimeTo` is the current date and time.
        emails:
          type: array
          items:
            type: string
          description: Participants' email list. The maximum size of `emails` is 100.
    InvitationSourceCreateObject:
      type: object
      required:
      - sourceId
      - sourceEmail
      properties:
        sourceId:
          type: string
          example: cisco
          description: Source ID for the invitation.
        sourceEmail:
          type: string
          example: john001@example.com
          description: Email for invitation source.
    SurveyLinkObject:
      type: object
      properties:
        email:
          type: string
          example: kingu1@example.com
          description: Participant email.
        surveyLink:
          type: string
          example: https://example.webex.com/webappng/sites/example/meeting/surveyPage/fa1fc86f70d74c08bc7dc5a3b499ab98?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..SDJTSwAAAIVIzXgb0wNfEdKwDeRiGzxLWfhoSG5blNcDoCslAiserg
          description: Meeting survey Link for the participant.
    TrackingCodeItemForCreateMeetingObject:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          example: Department
          description: Name of the tracking code. The name cannot be empty and the maximum size is 120 characters.
        value:
          type: string
          description: Value for the tracking code. `value` cannot be empty and the maximum size is 120 characters.
    UpdateMeetingObject:
      type: object
      properties:
        title:
          type: string
          example: John's Meeting
          description: Meeting title. The title can be a maximum of 128 characters long.
        agenda:
          type: string
          example: John's Agenda
          description: Meeting agenda. The agenda can be a maximum of 1300 characters long.
        password:
          type: string
          example: BgJep@43
          description: Meeting password. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details.
        start:
          type: string
          example: '2020-05-15T20:30:00-08:00'
          description: Date and time for the start of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `start` cannot be before current date and time or after `end`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Refer to the [Webex Meetings](/docs/meetings#restrictions-on-updating-a-meeting) guide for more information about restrictions on updating date and time for a meeting. Please note that when a meeting is being updated, `start` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, if `start` is within the same minute as the current time, `start` will be adjusted to the upcoming minute; otherwise, `start` will be adjusted with seconds and milliseconds stripped off. For instance, if the current time is `2022-03-01T10:32:16.657+08:00`, `start` of `2022-03-01T10:32:28.076+08:00` or `2022-03-01T10:32:41+08:00` will be adjusted to `2022-03-01T10:33:00+08:00`, and `start` of `2022-03-01T11:32:28.076+08:00` or `2022-03-01T11:32:41+08:00` will be adjusted to `2022-03-01T11:32:00+08:00`.
        end:
          type: string
          example: '2020-05-15T21:30:00-08:00'
          description: Date and time for the end of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `end` cannot be before current date and time or before `start`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Refer to the [Webex Meetings](/docs/meetings#restrictions-on-updating-a-meeting) guide for more information about restrictions on updating date and time for a meeting. Please note that when a meeting is being updated, `end` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, `end` will be adjusted with seconds and milliseconds stripped off. For instance, `end` of `2022-03-01T11:52:28.076+08:00` or `2022-03-01T11:52:41+08:00` will be adjusted to `2022-03-01T11:52:00+08:00`.
        timezone:
          type: string
          example: America/Los_Angeles
          description: '[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) in which the meeting was originally scheduled (conforming with the [IANA time zone database](https://www.iana.org/time-zones)).'
        recurrence:
          type: string
          example: FREQ=DAILY;INTERVAL=1;COUNT=20
          description: Meeting series recurrence rule (conforming with [RFC 2445](https://www.ietf.org/rfc/rfc2445.txt)). Applies only to a recurring meeting series, not to a meeting series with only one scheduled meeting. Multiple days or dates for monthly or yearly `recurrence` rule are not supported, only the first day or date specified is taken. For example, "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10,11,12" is not supported and it will be partially supported as "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10".
        enabledAutoRecordMeeting:
          type: boolean
          description: Whether or not meeting is recorded automatically.
        allowAnyUserToBeCoHost:
          type: boolean
          description: Whether or not to allow any attendee with a host account on the target site to become a cohost when joining the meeting. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's user's preferred site.
        enabledJoinBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to join the meeting before the host joins the meeting.
        enableConnectAudioBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to connect audio in the meeting before the host joins the meeting. This attribute is only applicable if the `enabledJoinBeforeHost` attribute is set to true.
        joinBeforeHostMinutes:
          type: number
          example: 15
          description: Number of minutes an attendee can join the meeting before the meeting start time and the host joins. Only applicable if the `enabledJoinBeforeHost` attribute is set to true. Valid options for a meeting are `0`, `5`, `10`, and `15`, and valid options for a webinar are `0`, `15`, `30`, `45`, and `60`. The default is `0` if not specified.
        excludePassword:
          type: boolean
          description: Whether or not to exclude the meeting password from the email invitation.
        publicMeeting:
          type: boolean
          description: Whether or not to allow the meeting to be listed on the public calendar.
        reminderTime:
          type: number
          example: 30
          description: The number of minutes before the meeting begins, that an email reminder is sent to the host.
        unlockedMeetingJoinSecurity:
          type: string
          enum:
          - allowJoin
          - allowJoinWithLobby
          - blockFromJoin
          description: "Specifies how the people who aren't on the invite can join the unlocked meeting.\n * `allowJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoin`, people can join the unlocked meeting directly.\n * `allowJoinWithLobby` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoinWithLobby`, people will wait in the lobby until the host admits them.\n * `blockFromJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `blockFromJoin`, people can't join the unlocked meeting.\n"
        sessionTypeId:
          type: number
          example: 3
          description: Unique identifier for a meeting session type for the user. This attribute is required while scheduling webinar meeting. All available meeting session types enabled for the user can be retrieved by [List Meeting Session Types](/docs/api/v1/meetings/list-meeting-session-types) API.
        enabledWebcastView:
          type: boolean
          description: Whether or not webcast view is enabled.
        panelistPassword:
          type: string
          example: GwLqa@78
          description: Password for panelists of a webinar meeting. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details. If not specified, a random password conforming to the site's password rules will be generated automatically.
        enableAutomaticLock:
          type: boolean
          description: Whether or not to automatically lock the meeting after it starts.
        automaticLockMinutes:
          type: number
          example: 10
          description: The number of minutes after the meeting begins, for automatically locking it.
        allowFirstUserToBeCoHost:
          type: boolean
          description: Whether or not to allow the first attendee of the meeting with a host account on the target site to become a cohost. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's user's preferred site.
        allowAuthenticatedDevices:
          type: boolean
          description: Whether or not to allow authenticated video devices in the meeting's organization to start or join the meeting without a prompt.
        sendEmail:
          type: boolean
          example: true
          description: Whether or not to send emails to host and invitees. It is an optional field and default value is true.
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This attribute should only be set if the user or application calling the API has the admin-level scopes. When used, the admin may specify the email of a user in a site they manage to be the meeting host. The field is not editable and is only used to update a meeting on behalf of the real meeting host. Please use the [Reassign Meetings to a New Host](/docs/api/v1/meetings/reassign-meetings-to-a-new-host) API if you need to update the meeting host.
        meetingOptions:
          type: object
          properties:
            enabledChat:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat in the meeting. Also depends on the session type.
            enabledVideo:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to have video in the meeting. Also depends on the session type.
            enabledPolling:
              type: boolean
              description: Whether or not to allow any attendee to poll in the meeting. Can only be set `true` for a webinar. The value of this attribute depends on the session type for a meeting. Please contact your site admin if this attribute is not available. Not supported if the site has been migrated to the Webex Suite meeting platform.
            enabledNote:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to take notes in the meeting. The value of this attribute also depends on the session type. Not supported if the site has been migrated to the Webex Suite meeting platform.
            noteType:
              type: string
              enum:
              - allowAll
              - allowOne
              description: "Whether note taking is enabled. If the value of `enabledNote` is false, users cannot set this attribute and get the default value `allowAll`. Not supported if the site has been migrated to the Webex Suite meeting platform.\n * `allowAll` - If the value of `noteType` attribute is `allowAll`, all participants can take notes.\n * `allowOne` - If the value of `noteType` attribute is `allowOne`, only a single note taker is allowed.\n"
            enabledFileTransfer:
              type: boolean
              description: Whether or not to allow any attendee to transfer files in the meeting. The value of this attribute also depends on the session type.
            enabledUCFRichMedia:
              type: boolean
              description: Whether or not to allow any attendee to share [Universal Communications Format](https://www.cisco.com/c/en/us/td/docs/collaboration/training_center/wbs30/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions_chapter_0110.pdf) media files in the meeting. The value of this attribute also depends on the sessionType. Not supported if the site has been migrated to the Webex Suite meeting platform.
          description: Meeting Options.
        attendeePrivileges:
          type: object
          properties:
            enabledShareContent:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to share content in the meeting.
            enabledSaveDocument:
              type: boolean
              description: Whether or not to allow any attendee to save shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledPrintDocument:
              type: boolean
              description: Whether or not to allow any attendee to print shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledAnnotate:
              type: boolean
              description: Whether or not to allow any attendee to annotate shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewParticipantList:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to view participants.
            enabledViewThumbnails:
              type: boolean
              description: Whether or not to allow any attendee to see a small preview image of any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledRemoteControl:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to control applications, web browsers, or desktops remotely. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewAnyDocument:
              type: boolean
              description: Whether or not to allow any attendee to view any shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewAnyPage:
              type: boolean
              description: Whether or not to allow any attendee to scroll through any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledContactOperatorPrivately:
              type: boolean
              description: Whether or not to allow any attendee to contact the operator privately. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatHost:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the host in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatPresenter:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the presenter in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatOtherParticipants:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with other participants in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
          description: Attendee Privileges. This attribute is not supported for a webinar.
        integrationTags:
          type: array
          items:
            type: string
          description: External keys created by an integration application in its own domain, for example Zendesk ticket IDs, Jira IDs, Salesforce Opportunity IDs, etc. The integration application queries meetings by a key in its own domain. The maximum size of `integrationTags` is 3 and each item of `integrationTags` can be a maximum of 64 characters long. Please note that an empty or null `integrationTags` will delete all existing integration tags for the meeting implicitly. Developer can update integration tags for a `meetingSeries` but he cannot update it for a `scheduledMeeting` or a `meeting` instance.
        enabledBreakoutSessions:
          type: boolean
          description: Whether or not breakout sessions are enabled. If the value of `enabledBreakoutSessions` is false, users can not set breakout sessions. If the value of `enabledBreakoutSessions` is true, users can update breakout sessions using the [Update Breakout Sessions](/docs/api/v1/meetings/{meetingId}/breakoutSessions) API. Updating breakout sessions are not supported by this API.
        trackingCodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCodeItemForCreateMeetingObject'
          description: Tracking codes information. All available tracking codes and their options for the specified site can be retrieved by [List Meeting Tracking Codes](/docs/api/v1/meetings/list-meeting-tracking-codes) API. If an optional tracking code is missing from the `trackingCodes` array and there's a default option for this tracking code, the default option is assigned automatically. If the `inputMode` of a tracking code is `select`, its value must be one of the site-level options or the user-level value. Tracking code is not supported for a personal room meeting or an ad-hoc space meeting.
        enabledAudioWatermark:
          type: boolean
          description: Whether or not the audio watermark is enabled. If it's `true`, `scheduledType` equals or defaults to `meeting`, and `audioConnectionOptions.audioConnectionType` equals `VoIP`, the audio for this meeting will have a watermark. In this case, a unique identifier is embedded into the audio that plays out of each Webex app and device. An administrator can use this watermark when analyzing an unauthorized recording to identify which Webex app or device was the source of the recording.
        enabledVisualWatermark:
          type: boolean
          description: Whether or not the visual watermark is enabled. If it's `true`, the video for this meeting will have a watermark. In this case, Webex superimposes a watermark image pattern on top of the meeting video and shared content to deter participants from leaking meeting information. Each participant viewing the meeting sees a watermark image pattern with their email address. If the participant is not signed in, the watermark image pattern includes their display name and email address.
        visualWatermarkOpacity:
          type: number
          example: 10
          description: Opacity level for the visual watermark. The value must be between 5 and 80, inclusive. A smaller value means less distraction for meeting participants, while a larger value shows a clearer watermark. It's supported when `enabledVisualWatermark` is `true`.
        audioConnectionOptions:
          type: object
          properties:
            audioConnectionType:
              type: string
              enum:
              - webexAudio
              - VoIP
              - other
              - none
              description: "Choose how meeting attendees join the audio portion of the meeting.\n * `webexAudio` - Provide a hybrid audio option, allowing attendees to join using their computer audio or a phone.\n * `VoIP` - Only restricts attendees to join the audio portion of the meeting using their computer instead of a telephone option.\n * `other` - Other teleconference services.\n * `none` - The way of attendees join the audio portion of the meeting is the default value.\n"
            enabledTollFreeCallIn:
              type: boolean
              example: true
              description: Whether or not to show toll-free call-in numbers.
            enabledGlobalCallIn:
              type: boolean
              example: true
              description: Whether or not to show global call-in numbers to attendees.
            enabledAudienceCallBack:
              type: boolean
              description: Whether or not to allow attendees to receive a call-back and call-in is available. Can only be set `true` for a webinar.
            entryAndExitTone:
              type: string
              enum:
              - beep
              - announceName
              - noTone
              description: "Select the sound you want users who have a phone audio connection to hear when someone enters or exits the meeting.\n * `beep` - All call-in users joining the meeting will hear the beep.\n * `announceName` - All call-in users joining the meeting will hear their names.\n * `noTone` - Turn off beeps and name announcements.\n"
            allowHostToUnmuteParticipants:
              type: boolean
              description: Whether or not to allow the host to unmute participants.
            allowAttendeeToUnmuteSelf:
              type: boolean
              example: true
              description: Whether or not to allow attendees to unmute themselves.
            muteAttendeeUponEntry:
              type: boolean
              description: Whether or not to auto-mute attendees when attendees enter meetings.
          description: Audio connection options.
        requireAttendeeLogin:
          type: boolean
          description: Require attendees to sign in before joining the webinar. This option works when the value of `scheduledType` attribute is `webinar`. Please note that `requireAttendeeLogin` cannot be set if someone has already registered for the webinar.
        restrictToInvitees:
          type: boolean
          description: Restrict webinar to invited attendees only. This option works when the registration option is disabled and the value of `scheduledType` attribute is `webinar`. Please note that `restrictToInvitees` cannot be set to `true` if `requireAttendeeLogin` is `false`.
        enabledLiveStream:
          type: boolean
          description: Whether or not live streaming is enabled.
        liveStream:
          $ref: '#/components/schemas/LiveStreamObject'
          description: Live streaming settings. It applies when `enabledLiveStream` is `true`.
    PreMeetingBreakoutSessionsObject:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreMeetingBreakoutSessionObject'
          description: Breakout sessions information for meeting.
    GetMeetingSimultaneousInterpretationObject:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether or not simultaneous interpretation is enabled.
        interpreters:
          type: array
          items:
            $ref: '#/components/schemas/InterpreterObjectForSimultaneousInterpretationOfGetOrListMeeting'
          description: Interpreters for meeting.
    QuestionObject:
      type: object
      required:
      - id
      - question
      - type
      properties:
        id:
          type: number
          example: 3388057
          description: Unique identifier for the question.
        question:
          type: string
          example: Do you like cisco?
          description: Details for the question.
        type:
          type: string
          enum:
          - text
          - rating
          - checkbox
          - singleDropdown
          - singleRadio
          description: "Type for the question.\n * `text` - Text input.\n * `rating` - Rating.\n * `checkbox` - Check box which requires `options`.\n * `singleDropdown` - Drop down list box which requires `options`.\n * `singleRadio` - Single radio button which requires `options`.\n"
        fromScore:
          type: number
          example: 1
          description: The lowest score of the rating question. This attribute will be ingnored, if the value of `type` attribute is not `rating`.
        fromLabel:
          type: string
          example: disagree
          description: The lowest score label of the rating question. This attribute will be ingnored, if the value of `type` attribute is not `rating`.
        toScore:
          type: number
          example: 5
          description: The highest score of the rating question. This attribute will be ingnored, if the value of `type` attribute is not `rating`.
        toLabel:
          type: string
          example: agree
          description: The highest score label of the rating question. This attribute will be ingnored, if the value of `type` attribute is not `rating`.
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionObject'
          description: Options for the question. This attribute will be ingnored, if the value of `type` attribute is `text` or `rating`.
    PrePostMeetingBreakoutSessionsObject:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrePostMeetingBreakoutSessionObject'
          description: Breakout sessions information for meeting.
    CreateMeetingObject:
      type: object
      required:
      - title
      - start
      - end
      properties:
        adhoc:
          type: boolean
          description: Whether or not to create an ad-hoc meeting for the room specified by `roomId`. When `true`, `roomId` is required.
        roomId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JPT00vNDMzZjk0ZjAtOTZhNi0xMWViLWJhOTctOTU3OTNjZDhiY2Q2
          description: Unique identifier for the Webex space which the meeting is to be associated with. It can be retrieved by [List Rooms](/docs/api/v1/rooms/list-rooms). `roomId` is required when `adhoc` is `true`. When `roomId` is specified, the parameter `hostEmail` will be ignored.
        templateId:
          type: string
          example: N2Q3ZWE1ZjQyYjkyMWVhY2UwNTM4NmNhMjRhZDczMGU6VS0yMDA5NzItTUMtZW5fVVM
          description: Unique identifier for meeting template. Please note that `start` and `end` are optional when `templateId` is specified. The list of meeting templates that is available for the authenticated user can be retrieved from [List Meeting Templates](/docs/api/v1/meetings/list-meeting-templates). This parameter is ignored for an ad-hoc meeting.
        title:
          type: string
          example: John's Meeting
          description: Meeting title. The title can be a maximum of 128 characters long. The default value for an ad-hoc meeting is the user's name if not specified.
        agenda:
          type: string
          example: John's Agenda
          description: Meeting agenda. The agenda can be a maximum of 1300 characters long.
        password:
          type: string
          example: BgJep@43
          description: Meeting password. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details. If not specified, a random password conforming to the site's password rules will be generated automatically.
        start:
          type: string
          example: '2020-05-15T20:30:00-08:00'
          description: Date and time for the start of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `start` cannot be before current date and time or after `end`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Please note that when a meeting is being scheduled, `start` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, if `start` is within the same minute as the current time, `start` will be adjusted to the upcoming minute; otherwise, `start` will be adjusted with seconds and milliseconds stripped off. For instance, if the current time is `2022-03-01T10:32:16.657+08:00`, `start` of `2022-03-01T10:32:28.076+08:00` or `2022-03-01T10:32:41+08:00` will be adjusted to `2022-03-01T10:33:00+08:00`, and `start` of `2022-03-01T11:32:28.076+08:00` or `2022-03-01T11:32:41+08:00` will be adjusted to `2022-03-01T11:32:00+08:00`. The default value for an ad-hoc meeting is 5 minutes after the current time and the user's input value will be ignored. An ad-hoc meeting can be started immediately even if the `start` is 5 minutes after the current time.
        end:
          type: string
          example: '2020-05-15T21:30:00-08:00'
          description: Date and time for the end of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `end` cannot be before current date and time or before `start`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Please note that when a meeting is being scheduled, `end` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, `end` will be adjusted with seconds and milliseconds stripped off. For instance, `end` of `2022-03-01T11:52:28.076+08:00` or `2022-03-01T11:52:41+08:00` will be adjusted to `2022-03-01T11:52:00+08:00`. The default value for an ad-hoc meeting is 20 minutes after the current time and the user's input value will be ignored.
        timezone:
          type: string
          example: America/Los_Angeles
          description: '[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) in which the meeting was originally scheduled (conforming with the [IANA time zone database](https://www.iana.org/time-zones)). The default value for an ad-hoc meeting is `UTC` and the user''s input value will be ignored.'
        recurrence:
          type: string
          example: FREQ=DAILY;INTERVAL=1;COUNT=20
          description: Meeting series recurrence rule (conforming with [RFC 2445](https://www.ietf.org/rfc/rfc2445.txt)), applying only to meeting series. It doesn't apply to a scheduled meeting or an ended or ongoing meeting instance. This parameter is ignored for an ad-hoc meeting. Multiple days or dates for monthly or yearly `recurrence` rule are not supported, only the first day or date specified is taken. For example, "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10,11,12" is not supported and it will be partially supported as "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10".
        enabledAutoRecordMeeting:
          type: boolean
          description: Whether or not meeting is recorded automatically.
        allowAnyUserToBeCoHost:
          type: boolean
          description: Whether or not to allow any attendee with a host account on the target site to become a cohost when joining the meeting. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's the user's preferred site. The default value for an ad-hoc meeting is `true` and the user's input value will be ignored.
        enabledJoinBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to join the meeting before the host joins the meeting. The default value for an ad-hoc meeting is `true` and the user's input value will be ignored.
        enableConnectAudioBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to connect audio in the meeting before the host joins the meeting. This attribute is only applicable if the `enabledJoinBeforeHost` attribute is set to true. The default value for an ad-hoc meeting is `true` and the user's input value will be ignored.
        joinBeforeHostMinutes:
          type: number
          example: 15
          description: Number of minutes an attendee can join the meeting before the meeting start time and the host joins. This attribute is only applicable if the `enabledJoinBeforeHost` attribute is set to true. Valid options for a meeting are `0`, `5`, `10`, and `15`, and valid options for a webinar are `0`, `15`, `30`, `45`, and `60`. The default value for an ad-hoc meeting is 0 and the user's input value will be ignored.
        excludePassword:
          type: boolean
          description: Whether or not to exclude the meeting password from the email invitation. This parameter is ignored for an ad-hoc meeting.
        publicMeeting:
          type: boolean
          description: Whether or not to allow the meeting to be listed on the public calendar. The default value for an ad-hoc meeting is `false` and the user's input value will be ignored.
        reminderTime:
          type: number
          example: 10
          description: The number of minutes before the meeting begins, that an email reminder is sent to the host. This parameter is ignored for an ad-hoc meeting.
        unlockedMeetingJoinSecurity:
          type: string
          enum:
          - allowJoin
          - allowJoinWithLobby
          - blockFromJoin
          description: "Specifies how the people who aren't on the invite can join the unlocked meeting. The default value for an ad-hoc meeting is `allowJoinWithLobby` and the user's input value will be ignored.\n * `allowJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoin`, people can join the unlocked meeting directly.\n * `allowJoinWithLobby` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoinWithLobby`, people will wait in the lobby until the host admits them.\n * `blockFromJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `blockFromJoin`, people can't join the unlocked meeting.\n"
        sessionTypeId:
          type: number
          example: 3
          description: Unique identifier for a meeting session type for the user. This attribute is required when scheduling a webinar meeting. All available meeting session types enabled for the user can be retrieved using the [List Meeting Session Types](/docs/api/v1/meetings/list-meeting-session-types) API.
        scheduledType:
          type: string
          enum:
          - meeting
          - webinar
          - personalRoomMeeting
          description: "When set as an attribute in a POST request body, specifies whether it's a regular meeting, a webinar, or a meeting scheduled in the user's [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings). If not specified, it's a regular meeting by default. The default value for an ad-hoc meeting is `meeting` and the user's input value will be ignored.\n * `meeting` - Set the value of `scheduledType` attribute to `meeting` for creating a regular meeting.\n * `webinar` - Set the value of `scheduledType` attribute to `webinar` for creating a webinar meeting.\n * `personalRoomMeeting` - Set the value of `scheduledType` attribute to `personalRoomMeeting` for creating a meeting in the user's [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings). Please note that `templateId`, `roomId`, `integrationTags`, `enabledWebcastView`, `enabledAutoRecordMeeting` and `registration` are not supported when creating a personal room meeting.\n"
        enabledWebcastView:
          type: boolean
          description: Whether or not webcast view is enabled. This parameter is ignored for an ad-hoc meeting.
        panelistPassword:
          type: string
          example: GwLqa@78
          description: Password for panelists of a webinar meeting. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details. If not specified, a random password conforming to the site's password rules will be generated automatically. This parameter is ignored for an ad-hoc meeting.
        enableAutomaticLock:
          type: boolean
          description: Whether or not to automatically lock the meeting after it starts. The default value for an ad-hoc meeting is `false` and the user's input value will be ignored.
        automaticLockMinutes:
          type: number
          example: 10
          description: The number of minutes after the meeting begins, for automatically locking it. The default value for an ad-hoc meeting is null and the user's input value will be ignored.
        allowFirstUserToBeCoHost:
          type: boolean
          description: Whether or not to allow the first attendee of the meeting with a host account on the target site to become a cohost. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's user's preferred site. The default value for an ad-hoc meeting is `false` and the user's input value will be ignored.
        allowAuthenticatedDevices:
          type: boolean
          description: Whether or not to allow authenticated video devices in the meeting's organization to start or join the meeting without a prompt. The default value for an ad-hoc meeting is `true` and the user's input value will be ignored.
        invitees:
          type: array
          items:
            $ref: '#/components/schemas/InviteeObjectForCreateMeeting'
          description: Invitees for meeting. The maximum size of invitees is 1000. If `roomId` is specified and `invitees` is missing, all the members in the space are invited implicitly. If both `roomId` and `invitees` are specified, only those in the `invitees` list are invited. `coHost` for each invitee is `true` by default if `roomId` is specified when creating a meeting, and anyone in the invitee list that is not qualified to be a cohost will be invited as a non-cohost invitee. The user's input value will be ignored for an ad-hoc meeting and the the members of the room specified by `roomId` except "me" will be used by default.
        sendEmail:
          type: boolean
          example: true
          description: Whether or not to send emails to host and invitees. It is an optional field and default value is true. The default value for an ad-hoc meeting is `false` and the user's input value will be ignored.
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This attribute should only be set if the user or application calling the API has the admin-level scopes. When used, the admin may specify the email of a user in a site they manage to be the meeting host.
        siteUrl:
          type: string
          example: example.webex.com
          description: URL of the Webex site which the meeting is created on. If not specified, the meeting is created on user's preferred site. All available Webex sites and preferred site of the user can be retrieved by `Get Site List` API.
        meetingOptions:
          type: object
          properties:
            enabledChat:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat in the meeting. Also depends on the session type.
            enabledVideo:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to have video in the meeting. Also depends on the session type.
            enabledPolling:
              type: boolean
              description: Whether or not to allow any attendee to poll in the meeting. Can only be set `true` for a webinar. The value of this attribute depends on the session type for a meeting. Please contact your site admin if this attribute is not available. Not supported if the site has been migrated to the Webex Suite meeting platform.
            enabledNote:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to take notes in the meeting. The value of this attribute also depends on the session type. Not supported if the site has been migrated to the Webex Suite meeting platform.
            noteType:
              type: string
              enum:
              - allowAll
              - allowOne
              description: "Whether note taking is enabled. If the value of `enabledNote` is false, users cannot set this attribute and get the default value `allowAll`. Not supported if the site has been migrated to the Webex Suite meeting platform.\n * `allowAll` - If the value of `noteType` attribute is `allowAll`, all participants can take notes.\n * `allowOne` - If the value of `noteType` attribute is `allowOne`, only a single note taker is allowed.\n"
            enabledFileTransfer:
              type: boolean
              description: Whether or not to allow any attendee to transfer files in the meeting. The value of this attribute also depends on the session type.
            enabledUCFRichMedia:
              type: boolean
              description: Whether or not to allow any attendee to share [Universal Communications Format](https://www.cisco.com/c/en/us/td/docs/collaboration/training_center/wbs30/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions_chapter_0110.pdf) media files in the meeting. The value of this attribute also depends on the sessionType. Not supported if the site has been migrated to the Webex Suite meeting platform.
          description: Meeting Options.
        attendeePrivileges:
          type: object
          properties:
            enabledShareContent:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to share content in the meeting.
            enabledSaveDocument:
              type: boolean
              description: Whether or not to allow any attendee to save shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledPrintDocument:
              type: boolean
              description: Whether or not to allow any attendee to print shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledAnnotate:
              type: boolean
              description: Whether or not to allow any attendee to annotate shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewParticipantList:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to view participants.
            enabledViewThumbnails:
              type: boolean
              description: Whether or not to allow any attendee to see a small preview image of any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledRemoteControl:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to control applications, web browsers, or desktops remotely. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewAnyDocument:
              type: boolean
              description: Whether or not to allow any attendee to view any shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewAnyPage:
              type: boolean
              description: Whether or not to allow any attendee to scroll through any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledContactOperatorPrivately:
              type: boolean
              description: Whether or not to allow any attendee to contact the operator privately. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatHost:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the host in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatPresenter:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the presenter in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatOtherParticipants:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with other participants in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
          description: Attendee Privileges. This attribute is not supported for a webinar.
        registration:
          type: object
          properties:
            autoAcceptRequest:
              type: boolean
              description: Whether or not meeting registration request is accepted automatically.
            requireFirstName:
              type: boolean
              example: true
              description: Whether or not a registrant's first name is required for meeting registration. This option must always be `true`.
            requireLastName:
              type: boolean
              example: true
              description: Whether or not a registrant's last name is required for meeting registration. This option must always be `true`.
            requireEmail:
              type: boolean
              example: true
              description: Whether or not a registrant's email is required for meeting registration. This option must always be `true`.
            requireJobTitle:
              type: boolean
              description: Whether or not a registrant's job title is shown or required for meeting registration.
            requireCompanyName:
              type: boolean
              description: Whether or not a registrant's company name is shown or required for meeting registration.
            requireAddress1:
              type: boolean
              description: Whether or not a registrant's first address field is shown or required for meeting registration.
            requireAddress2:
              type: boolean
              description: Whether or not a registrant's second address field is shown or required for meeting registration.
            requireCity:
              type: boolean
              description: Whether or not a registrant's city is shown or required for meeting registration.
            requireState:
              type: boolean
              description: Whether or not a registrant's state is shown or required for meeting registration.
            requireZipCode:
              type: boolean
              description: Whether or not a registrant's postal code is shown or required for meeting registration.
            requireCountryRegion:
              type: boolean
              description: Whether or not a registrant's country or region is shown or required for meeting registration.
            requireWorkPhone:
              type: boolean
              description: Whether or not a registrant's work phone number is shown or required for meeting registration.
            requireFax:
              type: boolean
              description: Whether or not a registrant's fax number is shown or required for meeting registration.
            maxRegisterNum:
              type: number
              example: 1000
              description: Maximum number of meeting registrations. This only applies to meetings. The maximum number of participants for meetings and webinars, with the limit based on the user capacity and controlled by a toggle at the site level. The default maximum number of participants for webinars is 10000, but the actual maximum number of participants is limited by the user capacity.
            customizedQuestions:
              type: array
              items:
                $ref: '#/components/schemas/CustomizedQuestionForCreateMeeting'
              description: Customized questions for meeting registration.
            rules:
              type: array
              items:
                $ref: '#/components/schemas/StandardRegistrationApproveRule'
              description: The approval rules for standard questions.
          description: Meeting registration. When this option is enabled, meeting invitees must register personal information in order to join the meeting. Meeting invitees will receive an email with a registration link for the registration. When the registration form has been submitted and approved, an email with a real meeting link will be received. By clicking that link the meeting invitee can join the meeting. Please note that meeting registration does not apply to a meeting when it's a recurring meeting with a `recurrence` field or no `password` or when the feature toggle `DecoupleJBHWithRegistration` is disabled the `Join Before Host` option is enabled for the meeting, See [Register for a Meeting in Cisco Webex Meetings](https://help.webex.com/en-us/nmgmeff/Register-for-a-Meeting-in-Cisco-Webex-Meetings) for details.
        integrationTags:
          type: array
          items:
            type: string
          description: External keys created by an integration application in its own domain, for example Zendesk ticket IDs, Jira IDs, Salesforce Opportunity IDs, etc. The integration application queries meetings by a key in its own domain. The maximum size of `integrationTags` is 3 and each item of `integrationTags` can be a maximum of 64 characters long. This parameter is ignored for an ad-hoc meeting.
        simultaneousInterpretation:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              description: Whether or not simultaneous interpretation is enabled.
            interpreters:
              type: array
              items:
                $ref: '#/components/schemas/InterpreterObjectForSimultaneousInterpretationOfCreateOrUpdateMeeting'
              description: Interpreters for meeting.
          description: Simultaneous interpretation information for a meeting.
        enabledBreakoutSessions:
          type: boolean
          description: Whether or not breakout sessions are enabled.
        breakoutSessions:
          type: array
          items:
            $ref: '#/components/schemas/PreMeetingBreakoutSessionWithoutIdObject'
          description: Breakout sessions are smaller groups that are split off from the main meeting or webinar. They allow a subset of participants to collaborate and share ideas over audio and video. Use breakout sessions for workshops, classrooms, or for when you need a moment to talk privately with a few participants outside of the main session. Please note that maximum number of breakout sessions in a meeting or webinar is 100. In webinars, if hosts preassign attendees to breakout sessions, the role of `attendee` will be changed to `panelist`. Breakout session is not supported for a meeting with simultaneous interpretation.
        trackingCodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCodeItemForCreateMeetingObject'
          description: Tracking codes information. All available tracking codes and their options for the specified site can be retrieved by [List Meeting Tracking Codes](/docs/api/v1/meetings/list-meeting-tracking-codes) API. If an optional tracking code is missing from the `trackingCodes` array and there's a default option for this tracking code, the default option is assigned automatically. If the `inputMode` of a tracking code is `select`, its value must be one of the site-level options or the user-level value. Tracking code is not supported for a personal room meeting or an ad-hoc space meeting.
        enabledAudioWatermark:
          type: boolean
          description: Whether or not the audio watermark is enabled. If it's `true`, `scheduledType` equals or defaults to `meeting`, and `audioConnectionOptions.audioConnectionType` equals `VoIP`, the audio for this meeting will have a watermark. In this case, a unique identifier is embedded into the audio that plays out of each Webex app and device. An administrator can use this watermark when analyzing an unauthorized recording to identify which Webex app or device was the source of the recording.
        enabledVisualWatermark:
          type: boolean
          description: Whether or not the visual watermark is enabled. If it's `true`, the video for this meeting will have a watermark. In this case, Webex superimposes a watermark image pattern on top of the meeting video and shared content to deter participants from leaking meeting information. Each participant viewing the meeting sees a watermark image pattern with their email address. If the participant is not signed in, the watermark image pattern includes their display name and email address.
        visualWatermarkOpacity:
          type: number
          example: 10
          description: Opacity level for the visual watermark. The value must be between 5 and 80, inclusive. A smaller value means less distraction for meeting participants, while a larger value shows a clearer watermark. It's supported when `enabledVisualWatermark` is `true`.
        audioConnectionOptions:
          type: object
          properties:
            audioConnectionType:
              type: string
              enum:
              - webexAudio
              - VoIP
              - other
              - none
              description: "Choose how meeting attendees join the audio portion of the meeting.\n * `webexAudio` - Provide a hybrid audio option, allowing attendees to join using their computer audio or a phone.\n * `VoIP` - Only restricts attendees to join the audio portion of the meeting using their computer instead of a telephone option.\n * `other` - Other teleconference services.\n * `none` - The way of attendees join the audio portion of the meeting is the default value.\n"
            enabledTollFreeCallIn:
              type: boolean
              example: true
              description: Whether or not to show toll-free call-in numbers.
            enabledGlobalCallIn:
              type: boolean
              example: true
              description: Whether or not to show global call-in numbers to attendees.
            enabledAudienceCallBack:
              type: boolean
              description: Whether or not to allow attendees to receive a call-back and call-in is available. Can only be set `true` for a webinar.
            entryAndExitTone:
              type: string
              enum:
              - beep
              - announceName
              - noTone
              description: "Select the sound you want users who have a phone audio connection to hear when someone enters or exits the meeting.\n * `beep` - All call-in users joining the meeting will hear the beep.\n * `announceName` - All call-in users joining the meeting will hear their names.\n * `noTone` - Turn off beeps and name announcements.\n"
            allowHostToUnmuteParticipants:
              type: boolean
              description: Whether or not to allow the host to unmute participants.
            allowAttendeeToUnmuteSelf:
              type: boolean
              example: true
              description: Whether or not to allow attendees to unmute themselves.
            muteAttendeeUponEntry:
              type: boolean
              description: Whether or not to auto-mute attendees when attendees enter meetings.
          description: Audio connection options.
        requireAttendeeLogin:
          type: boolean
          description: Require attendees to sign in before joining the webinar. This option works when the value of `scheduledType` attribute is `webinar`. Please note that `requireAttendeeLogin` cannot be set if someone has already registered for the webinar.
        restrictToInvitees:
          type: boolean
          description: Restrict webinar to invited attendees only. This option works when the registration option is disabled and the value of `scheduledType` attribute is `webinar`. Please note that `restrictToInvitees` cannot be set to `true` if `requireAttendeeLogin` is `false`.
        enabledLiveStream:
          type: boolean
          description: Whether or not live streaming is enabled. If it's enabled, the `liveStream` must be specified. The RTMP streaming specified by `liveStream.rtmpUrl` can be started and viewed during the meeting without any ad-hoc settings.
        liveStream:
          $ref: '#/components/schemas/LiveStreamObject'
          description: Live streaming settings. It applies when `enabledLiveStream` is `true`.
    ReassignMeetingResponseObject:
      type: object
      required:
      - meetingId
      - httpStatus
      properties:
        meetingId:
          type: string
          example: 560d7b784f5143e3be2fc3064a5c5888
          description: Unique identifier for the meeting to be reassigned host.
        httpStatus:
          type: string
          example: '404'
          description: HTTP status code for the meeting reassignment result.
        message:
          type: string
          example: The requested resource could not be found.
          description: General message for the host reassignment of `meetingId` if it fails.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ReassignMeetingErrorDescriptionObject'
          description: Detailed descriptions for the host reassignment of `meetingId` if it fails.
    EndMeetingRequestObject:
