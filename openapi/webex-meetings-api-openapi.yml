          type: string
          example: dfb45ece33264639a7bc3dd9535d53f7
          description: Unique identifier for scheduled meeting which current meeting is associated with. It only apples to meeting instance which is happening or has happened. It's the `id` of the scheduled meeting this instance is associated with.
        meetingNumber:
          type: string
          example: '123456789'
          description: Meeting number. Applies to meeting series, scheduled meeting, and meeting instances, but not to meeting instances which have ended.
        title:
          type: string
          example: John's Meeting
          description: Meeting title. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        meetingType:
          type: string
          enum:
          - meetingSeries
          - scheduledMeeting
          - meeting
          description: "Meeting type.\n * `meetingSeries` - Primary instance of a scheduled series of meetings which consists of one or more scheduled meetings based on a `recurrence` rule. When a non-recurring meeting is scheduled with no `recurrence`, its `meetingType` is also `meetingSeries` which is a meeting series with only one occurrence in Webex meeting modeling.\n * `scheduledMeeting` - Instance from a primary meeting series.\n * `meeting` - Meeting instance that is in progress or has completed.\n"
        state:
          type: string
          enum:
          - active
          - scheduled
          - ready
          - lobby
          - inProgress
          - ended
          - missed
          - expired
          description: "Meeting state.\n * `active` - Only applies to a meeting series. Indicates that one or more future scheduled meetings exist for this meeting series.\n * `scheduled` - Only applies to scheduled meeting. Indicates that the meeting is scheduled in the future.\n * `ready` - Only applies to scheduled meeting. Indicates that this scheduled meeting is ready to start or join immediately.\n * `lobby` - Only applies to meeting instances. Indicates that a locked meeting has been joined by participants, but no hosts have joined.\n * `inProgress` - Applies to meeting series and meeting instance. For meeting series, indicates that an instance of this series is in progress; for a meeting instances, indicates that the meeting has been joined and unlocked.\n * `ended` - Applies to scheduled meetings and meeting instances. For scheduled meetings, indicates that the meeting was started and is now over. For meeting instances, indicates that the meeting instance has concluded.\n * `missed` - This state only applies to scheduled meetings. Indicates that the meeting was scheduled in the past but never happened.\n * `expired` - This state only applies to a meeting series. Indicates that all scheduled meetings of this series have passed.\n"
        hostDidJoin:
          type: boolean
          description: Only applies to meeting series in the `inProgress` state, scheduled meetings in the `ready` state, and meeting instances in the `inProgress` state, whether or not the meeting host joined the meeting. If true, the meeting host has joined the meeitng even if they dropped off; otherwise, the meeting host hasn't ever join the meeting. Indicates that someone is waiting in the lobby and the host hasn't joined the meeting if `attendeeDidJoin` is true and `hostDidJoin` is false.
        attendeeDidJoin:
          type: boolean
          description: Only applies to meeting series in the `inProgress` state, scheduled meetings in the `ready` state, and meeting instances in the `inProgress` state. Whether or not anyone has joined the meeting. If true, the meeting host or any attendee has joined the meeting; otherwise, no one has joined the meeting. Indicates that someone is waiting in the lobby and the host hasn't joined the meeting if `attendeeDidJoin` is true and `hostDidJoin` is false.
        isModified:
          type: boolean
          description: This state only applies to scheduled meeting. Flag identifying whether or not the scheduled meeting has been modified.
        timezone:
          type: string
          example: UTC
          description: '[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) of `start` and `end`, conforming with the [IANA time zone database](https://www.iana.org/time-zones).'
        start:
          type: string
          example: '2019-03-18T11:26:30Z'
          description: Start time for meeting in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If the meetingType of a meeting is `meetingSeries`, `start` is the scheduled start time of the first occurrence of this series. If the meeting is a meeting series and the `current` filter is true, `start` is the date and time the upcoming or ongoing meeting of the series starts. If the meetingType of a meeting is `scheduledMeeting`, `start` is the scheduled start time of this occurrence. If the meetingType of a meeting is `meeting`, `start` is the actual start time of the meeting instance. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        end:
          type: string
          example: '2019-03-18T12:26:30Z'
          description: End time for a meeting in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If the meetingType of a meeting is `meetingSeries`, `end` is the scheduled end time of the first occurrence of this series. If the meeting is a meeting series and the current filter is true, `end` is the date and time the upcoming or ongoing meeting of the series ends. If the meetingType of a meeting is `scheduledMeeting`, `end` is the scheduled end time of this occurrence. If the meetingType of a meeting is `meeting`, `end` is the actual end time of the meeting instance. If a meeting instance is in progress, `end` is not available. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        recurrence:
          type: string
          example: FREQ=DAILY;INTERVAL=1;COUNT=10
          description: Meeting series recurrence rule (conforming with [RFC 2445](https://www.ietf.org/rfc/rfc2445.txt)). Applies only to a recurring meeting series, not to a meeting series with only one scheduled meeting. Can be modified for a meeting series using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API. Multiple days or dates for monthly or yearly `recurrence` rule are not supported, only the first day or date specified is taken. For example, "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10,11,12" is not supported and it will be partially supported as "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10".
        hostUserId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83QkFCQkU5OS1CNDNFLTREM0YtOTE0Ny1BMUU5RDQ2QzlDQTA
          description: Unique identifier for the meeting host.
        hostDisplayName:
          type: string
          example: John Andersen
          description: Display name for the meeting host.
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host.
        siteUrl:
          type: string
          example: site4-example.webex.com
          description: Site URL for the meeting.
        roomId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JPT00vNDMzZjk0ZjAtOTZhNi0xMWViLWJhOTctOTU3OTNjZDhiY2Q2
          description: Room ID of the associated Webex space. Only applies to ad-hoc meetings and space meetings.
        enabledAutoRecordMeeting:
          type: boolean
          description: Whether or not meeting is recorded automatically. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        allowAnyUserToBeCoHost:
          type: boolean
          description: Whether or not to allow any attendee with a host account on the target site to become a cohost when joining the meeting. The target site is specified by a `siteUrl` parameter when creating the meeting. If not specified, it's a user's preferred site. The `allowAnyUserToBeCoHost` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        enabledJoinBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to join the meeting before the host joins the meeting. The `enabledJoinBeforeHost` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        enableConnectAudioBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to connect to audio before the host joins the meeting. Only applicable if the `enabledJoinBeforeHost` attribute is set to `true`. The `enableConnectAudioBeforeHost` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        joinBeforeHostMinutes:
          type: number
          example: 15
          description: Number of minutes an attendee can join the meeting before the meeting start time and the host joins. Only applicable if the `enabledJoinBeforeHost` attribute is set to true. The `joinBeforeHostMinutes` attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API. Valid options for a meeting are `0`, `5`, `10`, and `15`, and valid options for a webinar are `0`, `15`, `30`, `45`, and `60`. The default is `0` if not specified.
        excludePassword:
          type: boolean
          description: Whether or not to exclude the meeting password from the email invitation.
        publicMeeting:
          type: boolean
          description: Whether or not to allow the meeting to be listed on the public calendar.
        reminderTime:
          type: number
          example: 10
          description: The number of minutes before the meeting begins, that an email reminder is sent to the host.
        unlockedMeetingJoinSecurity:
          type: string
          enum:
          - allowJoin
          - allowJoinWithLobby
          - blockFromJoin
          description: "Specifies how the people who aren't on the invite can join the unlocked meeting.\n * `allowJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoin`, people can join the unlocked meeting directly.\n * `allowJoinWithLobby` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoinWithLobby`, people will wait in the lobby until the host admits them.\n * `blockFromJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `blockFromJoin`, people can't join the unlocked meeting.\n"
        sessionTypeId:
          type: number
          example: 3
          description: Unique identifier for a meeting session type for the user. This attribute is required when scheduling a webinar meeting. All available meeting session types enabled for the user can be retrieved using the [List Meeting Session Types](/docs/api/v1/meetings/list-meeting-session-types) API.
        scheduledType:
          type: string
          enum:
          - meeting
          - webinar
          - personalRoomMeeting
          description: "Specifies whether the meeting is a regular meeting, a webinar, or a meeting scheduled in the user's [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings).\n * `meeting` - If the value of `scheduledType` attribute is `meeting`, it is a regular meeting.\n * `webinar` - If the value of `scheduledType` attribute is `webinar`, it is a webinar meeting.\n * `personalRoomMeeting` - If the value of `scheduledType` attribute is `personalRoomMeeting`, it is a meeting scheduled in the user's [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings).\n"
        enabledWebcastView:
          type: boolean
          description: Whether or not webcast view is enabled.
        enableAutomaticLock:
          type: boolean
          description: Whether or not to automatically lock the meeting after it starts.
        automaticLockMinutes:
          type: number
          example: 10
          description: The number of minutes after the meeting begins, for automatically locking it.
        allowFirstUserToBeCoHost:
          type: boolean
          description: Whether or not to allow the first attendee of the meeting with a host account on the target site to become a cohost. The target site is specified by the `siteUrl` parameter when creating the meeting. If not specified, it's a user's preferred site. The `allowFirstUserToBeCoHost` attribute can be modified for a meeting series or a scheduled meeting uisng the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        allowAuthenticatedDevices:
          type: boolean
          description: Whether or not to allow authenticated video devices in the meeting's organization to start or join the meeting without a prompt. This attribute can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        hasChat:
          type: boolean
          description: Whether or not this meeting instance has chat.
        hasRecording:
          type: boolean
          description: Whether or not this meeting instance has been recorded. `true` if the meeting instance has been recorded even if the recording has been deleted.
        hasTranscription:
          type: boolean
          description: Whether or not this meeting instance has a transcription.
        hasSummary:
          type: boolean
          description: Whether or not this meeting instance has a summary.
        hasClosedCaption:
          type: boolean
          description: Whether or not this meeting instance has closed captions.
        hasPolls:
          type: boolean
          description: Whether or not this meeting instance has polls.
        hasQA:
          type: boolean
          description: Whether or not this meeting instance has Q&A.
        hasRegistration:
          type: boolean
          description: Whether or not this meeting instance has a registration form. Only applies to ended meeting or webinar instances. Doesn't apply to meeting series, scheduled meetings, or in-progress meeting or webinar instances.
        hasRegistrants:
          type: boolean
          description: Whether or not someone has registered a this meeting instance via the registration form. Only applies to ended meeting or webinar instances. Doesn't apply to meeting series, scheduled meetings, or in-progress meeting or webinar instances.
        hasPostEventSurvey:
          type: boolean
          description: Whether this meeting instance has a survey and someone has responded to the survey. Only applies to ended webinar instances. Doesn't apply to meeting series, scheduled meetings, in-progress meeting or webinar instances, or ended meeting instances.
        telephony:
          type: object
          required:
          - callInNumbers
          properties:
            callInNumbers:
              type: array
              items:
                type: object
                required:
                - label
                - callInNumber
                - tollType
                properties:
                  label:
                    type: string
                    example: Call-in toll-free number (US/Canada)
                    description: Label for the call-in number.
                  callInNumber:
                    type: string
                    example: '123456789'
                    description: Call-in number to join the teleconference from a phone.
                  tollType:
                    type: string
                    enum:
                    - toll
                    - tollFree
                    description: Type of toll for the call-in number.
              description: Array of call-in numbers for joining a teleconference from a phone.
            links:
              type: array
              items:
                $ref: '#/components/schemas/LinksObjectForTelephony'
              description: '[HATEOAS](https://en.wikipedia.org/wiki/HATEOAS) information of global call-in numbers for joining a teleconference from a phone.'
          description: Information for callbacks from a meeting to phone or for joining a teleconference using a phone.
        meetingOptions:
          type: object
          properties:
            enabledChat:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat in the meeting. Also depends on the session type.
            enabledVideo:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to have video in the meeting. Also depends on the session type.
            enabledPolling:
              type: boolean
              description: Whether or not to allow any attendee to poll in the meeting. Can only be set `true` for a webinar. The value of this attribute depends on the session type for a meeting. Please contact your site admin if this attribute is not available. Not supported if the site has been migrated to the Webex Suite meeting platform.
            enabledNote:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to take notes in the meeting. The value of this attribute also depends on the session type. Not supported if the site has been migrated to the Webex Suite meeting platform.
            noteType:
              type: string
              enum:
              - allowAll
              - allowOne
              description: "Whether note taking is enabled. If the value of `enabledNote` is false, users cannot set this attribute and get the default value `allowAll`. Not supported if the site has been migrated to the Webex Suite meeting platform.\n * `allowAll` - If the value of `noteType` attribute is `allowAll`, all participants can take notes.\n * `allowOne` - If the value of `noteType` attribute is `allowOne`, only a single note taker is allowed.\n"
            enabledFileTransfer:
              type: boolean
              description: Whether or not to allow any attendee to transfer files in the meeting. The value of this attribute also depends on the session type.
            enabledUCFRichMedia:
              type: boolean
              description: Whether or not to allow any attendee to share [Universal Communications Format](https://www.cisco.com/c/en/us/td/docs/collaboration/training_center/wbs30/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions_chapter_0110.pdf) media files in the meeting. The value of this attribute also depends on the sessionType. Not supported if the site has been migrated to the Webex Suite meeting platform.
          description: Meeting Options.
        attendeePrivileges:
          type: object
          properties:
            enabledShareContent:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to share content in the meeting.
            enabledSaveDocument:
              type: boolean
              description: Whether or not to allow any attendee to save shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledPrintDocument:
              type: boolean
              description: Whether or not to allow any attendee to print shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledAnnotate:
              type: boolean
              description: Whether or not to allow any attendee to annotate shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledViewParticipantList:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to view participants.
            enabledViewThumbnails:
              type: boolean
              description: Whether or not to allow any attendee to see a small preview image of any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledRemoteControl:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to control applications, web browsers, or desktops remotely.
            enabledViewAnyDocument:
              type: boolean
              description: Whether or not to allow any attendee to view any shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledViewAnyPage:
              type: boolean
              description: Whether or not to allow any attendee to scroll through any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledContactOperatorPrivately:
              type: boolean
              description: Whether or not to allow any attendee to contact the operator privately.
            enabledChatHost:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the host in private.
            enabledChatPresenter:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the presenter in private.
            enabledChatOtherParticipants:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with other participants in private.
          description: Attendee Privileges. This attribute is not supported for a webinar.
        integrationTags:
          type: array
          items:
            type: string
          description: External keys created by an integration application in its domain, for example, Zendesk ticket IDs, Jira IDs, Salesforce Opportunity IDs, etc.
        simultaneousInterpretation:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              description: Whether or not simultaneous interpretation is enabled.
            interpreters:
              type: array
              items:
                $ref: '#/components/schemas/InterpreterObjectForSimultaneousInterpretationOfGetOrListMeeting'
              description: Interpreters for meeting.
          description: Simultaneous interpretation information for the meeting.
        enabledBreakoutSessions:
          type: boolean
          description: Whether or not breakout sessions are enabled.
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinksObjectForBreakoutSessions'
          description: '[HATEOAS](https://en.wikipedia.org/wiki/HATEOAS) Breakout Sessions information for meeting.'
        trackingCodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCodeItemForGetMeetingObject'
          description: Tracking codes information.
        enabledAudioWatermark:
          type: boolean
          description: Whether or not the audio watermark is enabled.
        enabledVisualWatermark:
          type: boolean
          description: Whether or not the visual watermark is enabled.
        visualWatermarkOpacity:
          type: number
          example: 10
          description: Opacity level for visual watermark.
        audioConnectionOptions:
          type: object
          properties:
            audioConnectionType:
              type: string
              enum:
              - webexAudio
              - VoIP
              - other
              - none
              description: "Choose how meeting attendees join the audio portion of the meeting.\n * `webexAudio` - Provide a hybrid audio option, allowing attendees to join using their computer audio or a phone.\n * `VoIP` - Only restricts attendees to join the audio portion of the meeting using their computer instead of a telephone option.\n * `other` - Other teleconference services.\n * `none` - The way of attendees join the audio portion of the meeting is the default value.\n"
            enabledTollFreeCallIn:
              type: boolean
              example: true
              description: Whether or not to show toll-free call-in numbers.
            enabledGlobalCallIn:
              type: boolean
              example: true
              description: Whether or not to show global call-in numbers to attendees.
            enabledAudienceCallBack:
              type: boolean
              description: Whether or not to allow attendees to receive a call-back and call-in is available. Can only be set `true` for a webinar.
            entryAndExitTone:
              type: string
              enum:
              - beep
              - announceName
              - noTone
              description: "Select the sound you want users who have a phone audio connection to hear when someone enters or exits the meeting.\n * `beep` - All call-in users joining the meeting will hear the beep.\n * `announceName` - All call-in users joining the meeting will hear their names.\n * `noTone` - Turn off beeps and name announcements.\n"
            allowHostToUnmuteParticipants:
              type: boolean
              description: Whether or not to allow the host to unmute participants.
            allowAttendeeToUnmuteSelf:
              type: boolean
              example: true
              description: Whether or not to allow attendees to unmute themselves.
            muteAttendeeUponEntry:
              type: boolean
              description: Whether or not to auto-mute attendees when attendees enter meetings.
          description: Audio connection options.
        requireAttendeeLogin:
          type: boolean
          description: Require attendees to sign in before joining the webinar.
        restrictToInvitees:
          type: boolean
          description: Restrict webinar to invited attendees only.
        enabledLiveStream:
          type: boolean
          description: Whether or not live streaming is enabled. If enabled, the `liveStream` must be specified. The RTMP streaming specified by `liveStream.rtmpUrl` can be started and viewed during the meeting without any ad-hoc settings.
        liveStream:
          $ref: '#/components/schemas/LiveStreamObject'
          description: Live streaming settings. Applies when `enabledLiveStream` is `true`.
    Control:
      type: object
      properties:
        locked:
          type: boolean
          description: Whether the meeting is locked or not.
        recordingStarted:
          type: boolean
          example: true
          description: The value can be true or false, it indicates the meeting recording started or not.
        recordingPaused:
          type: boolean
          example: true
          description: The value can be true or false, it indicates the meeting recording paused or not.
    QuestionOptionObject:
      type: object
      required:
      - id
      - value
      properties:
        id:
          type: number
          example: 1
          description: Unique identifier for the question option.
        value:
          type: string
          example: 'Yes'
          description: Value for the question option.
    CustomizedQuestionForCreateMeeting:
      type: object
      required:
      - question
      - type
      properties:
        question:
          type: string
          example: How are you
          description: Title of the customized question.
        required:
          type: boolean
          example: true
          description: Whether or not the customized question is required to be answered by participants.
        type:
          type: string
          enum:
          - singleLineTextBox
          - multiLineTextBox
          - checkbox
          - dropdownList
          - radioButtons
          description: "Type of the question being asked.\n * `singleLineTextBox` - Single line text box.\n * `multiLineTextBox` - Multiple line text box.\n * `checkbox` - Check box which requires `options`.\n * `dropdownList` - Drop down list box which requires `options`.\n * `radioButtons` - Single radio button which requires `options`.\n"
        maxLength:
          type: number
          description: The maximum length of a string that can be entered by the user, ranging from `0` to `999`. Only required by `singleLineTextBox` and `multiLineTextBox`.
        options:
          type: array
          items:
            type: object
            required:
            - value
            properties:
              value:
                type: string
                example: green
                description: The content of the option.
          description: The content of `options`. Required if the question type is one of `checkbox`, `dropdownList`, or `radioButtons`.
        rules:
          type: array
          items:
            type: object
            required:
            - condition
            - value
            - result
            properties:
              condition:
                type: string
                enum:
                - contains
                - notContains
                - beginsWith
                - endsWith
                - equals
                - notEquals
                description: "Judgment expression for approval rules.\n * `contains` - The content of the answer contains the value.\n * `notContains` - The content of the answer does not contain the value\n * `beginsWith` - The content of the answer begins with the value.\n * `endsWith` - The content of the answer ends with the value.\n * `equals` - The content of the answer is the same as the value.\n * `notEquals` - The content of the answer is not the same as the value.\n"
              value:
                type: string
                example: tom
                description: The keyword for the approval rule. If the rule matches the keyword, the corresponding action will be executed.
              result:
                type: string
                enum:
                - approve
                - reject
                description: "The automatic approval result for the approval rule.\n * `approve` - If the user's registration value meets the criteria, the registration form will be automatically approved.\n * `reject` - If the user's registration value meets the criteria, the registration form will be automatically rejected.\n"
              matchCase:
                type: boolean
                example: true
                description: Whether to check the case of values.
          description: The automatic approval rules for customized questions.
    UpdateMeetingSimultaneousInterpretationObject:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether or not simultaneous interpretation is enabled.
        interpreters:
          type: array
          items:
            $ref: '#/components/schemas/InterpreterObjectForSimultaneousInterpretationOfCreateOrUpdateMeeting'
          description: Interpreters for meeting.
    InviteeObjectForCreateMeeting:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          example: brenda.song@example.com
          description: Email address of meeting invitee.
        displayName:
          type: string
          example: Brenda Song
          description: Display name of meeting invitee. The maximum length of `displayName` is 128 characters. If not specified but the email has been registered, user's registered name for the email will be taken as `displayName`. If not specified and the email hasn't been registered, the email will be taken as `displayName`.
        coHost:
          type: boolean
          description: Whether or not invitee is allowed to be a cohost for the meeting. `coHost` for each invitee is `true` by default if `roomId` is specified when creating a meeting, and anyone in the invitee list that is not qualified to be a cohost will be invited as a non-cohost invitee.
        panelist:
          type: boolean
          description: Whether or not an invitee is allowed to be a panelist. Only applies to webinars.
    SurveyObject:
      type: object
      required:
      - id
      - surveyName
      - meetingId
      - questions
      properties:
        id:
          type: string
          example: 18d2e565770c4eee918784ee333510ec
          description: Unique identifier for the survey.
        surveyName:
          type: string
          example: Survey name
          description: Name for the survey.
        meetingId:
          type: string
          example: 560d7b784f5143e3be2fc3064a5c4999
          description: Unique identifier for the meeting.
        description:
          type: string
          example: Survey name
          description: Description for the survey.
        allowAnonymousSubmit:
          type: boolean
          example: true
          description: Whether the survey allows attendees to submit anonymously.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionObject'
          description: Questions for the survey.
    PatchMeetingObject:
      type: object
      properties:
        title:
          type: string
          example: John's Meeting
          description: Meeting title. The title can be a maximum of 128 characters long.
        agenda:
          type: string
          example: John's Agenda
          description: Meeting agenda. The agenda can be a maximum of 1300 characters long. It can be specified `null` so that it becomes null and hidden from the response after the patch.
        password:
          type: string
          example: BgJep@43
          description: Meeting password. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details.
        start:
          type: string
          example: '2020-05-15T20:30:00-08:00'
          description: Date and time for the start of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `start` cannot be before current date and time or after `end`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Refer to the [Webex Meetings](/docs/meetings#restrictions-on-updating-a-meeting) guide for more information about restrictions on updating date and time for a meeting. Please note that when a meeting is being updated, `start` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, if `start` is within the same minute as the current time, `start` will be adjusted to the upcoming minute; otherwise, `start` will be adjusted with seconds and milliseconds stripped off. For instance, if the current time is `2022-03-01T10:32:16.657+08:00`, `start` of `2022-03-01T10:32:28.076+08:00` or `2022-03-01T10:32:41+08:00` will be adjusted to `2022-03-01T10:33:00+08:00`, and `start` of `2022-03-01T11:32:28.076+08:00` or `2022-03-01T11:32:41+08:00` will be adjusted to `2022-03-01T11:32:00+08:00`.
        end:
          type: string
          example: '2020-05-15T21:30:00-08:00'
          description: Date and time for the end of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `end` cannot be before current date and time or before `start`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Refer to the [Webex Meetings](/docs/meetings#restrictions-on-updating-a-meeting) guide for more information about restrictions on updating date and time for a meeting. Please note that when a meeting is being updated, `end` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, `end` will be adjusted with seconds and milliseconds stripped off. For instance, `end` of `2022-03-01T11:52:28.076+08:00` or `2022-03-01T11:52:41+08:00` will be adjusted to `2022-03-01T11:52:00+08:00`.
        timezone:
          type: string
          example: America/Los_Angeles
          description: '[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) in which the meeting was originally scheduled (conforming with the [IANA time zone database](https://www.iana.org/time-zones)).'
        recurrence:
          type: string
          example: FREQ=DAILY;INTERVAL=1;COUNT=20
          description: Meeting series recurrence rule (conforming with [RFC 2445](https://www.ietf.org/rfc/rfc2445.txt)). Applies only to a recurring meeting series, not to a meeting series with only one scheduled meeting. Multiple days or dates for monthly or yearly `recurrence` rule are not supported, only the first day or date specified is taken. For example, "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10,11,12" is not supported and it will be partially supported as "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10". It can be specified `null` so that the meeting becomes non-recurring and the `recurrence` attribute becomes null and hidden from the response after the patch.
        enabledAutoRecordMeeting:
          type: boolean
          description: Whether or not meeting is recorded automatically.
        allowAnyUserToBeCoHost:
          type: boolean
          description: Whether or not to allow any attendee with a host account on the target site to become a cohost when joining the meeting. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's user's preferred site.
        enabledJoinBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to join the meeting before the host joins the meeting.
        enableConnectAudioBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to connect audio in the meeting before the host joins the meeting. This attribute is only applicable if the `enabledJoinBeforeHost` attribute is set to true.
        joinBeforeHostMinutes:
          type: number
          example: 15
          description: Number of minutes an attendee can join the meeting before the meeting start time and the host joins. Only applicable if the `enabledJoinBeforeHost` attribute is set to true. Valid options for a meeting are `0`, `5`, `10`, and `15`, and valid options for a webinar are `0`, `15`, `30`, `45`, and `60`. The default is `0` if not specified.
        excludePassword:
          type: boolean
          description: Whether or not to exclude the meeting password from the email invitation.
        publicMeeting:
          type: boolean
          description: Whether or not to allow the meeting to be listed on the public calendar.
        reminderTime:
          type: number
          example: 30
          description: The number of minutes before the meeting begins, that an email reminder is sent to the host.
        unlockedMeetingJoinSecurity:
          type: string
          enum:
          - allowJoin
          - allowJoinWithLobby
          - blockFromJoin
          description: "Specifies how the people who aren't on the invite can join the unlocked meeting.\n * `allowJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoin`, people can join the unlocked meeting directly.\n * `allowJoinWithLobby` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoinWithLobby`, people will wait in the lobby until the host admits them.\n * `blockFromJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `blockFromJoin`, people can't join the unlocked meeting.\n"
        sessionTypeId:
          type: number
          example: 3
          description: Unique identifier for a meeting session type for the user. This attribute is required while scheduling webinar meeting. All available meeting session types enabled for the user can be retrieved by [List Meeting Session Types](/docs/api/v1/meetings/list-meeting-session-types) API.
        enabledWebcastView:
          type: boolean
          description: Whether or not webcast view is enabled.
        panelistPassword:
          type: string
          example: GwLqa@78
          description: Password for panelists of a webinar meeting. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details. If not specified, a random password conforming to the site's password rules will be generated automatically.
        enableAutomaticLock:
          type: boolean
          description: Whether or not to automatically lock the meeting after it starts.
        automaticLockMinutes:
          type: number
          example: 10
          description: The number of minutes after the meeting begins, for automatically locking it.
        allowFirstUserToBeCoHost:
          type: boolean
          description: Whether or not to allow the first attendee of the meeting with a host account on the target site to become a cohost. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's user's preferred site.
        allowAuthenticatedDevices:
          type: boolean
          description: Whether or not to allow authenticated video devices in the meeting's organization to start or join the meeting without a prompt.
        sendEmail:
          type: boolean
          example: true
          description: Whether or not to send emails to host and invitees. It is an optional field and default value is true.
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This attribute should only be set if the user or application calling the API has the admin-level scopes. When used, the admin may specify the email of a user in a site they manage to be the meeting host. The field is not editable and is only used to patch a meeting on behalf of the real meeting host. Please use the [Reassign Meetings to a New Host](/docs/api/v1/meetings/reassign-meetings-to-a-new-host) API if you need to update the meeting host.
        meetingOptions:
          type: object
          properties:
            enabledChat:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat in the meeting. Also depends on the session type.
            enabledVideo:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to have video in the meeting. Also depends on the session type.
            enabledPolling:
              type: boolean
              description: Whether or not to allow any attendee to poll in the meeting. Can only be set `true` for a webinar. The value of this attribute depends on the session type for a meeting. Please contact your site admin if this attribute is not available. Not supported if the site has been migrated to the Webex Suite meeting platform.
            enabledNote:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to take notes in the meeting. The value of this attribute also depends on the session type. Not supported if the site has been migrated to the Webex Suite meeting platform.
            noteType:
              type: string
              enum:
              - allowAll
              - allowOne
              description: "Whether note taking is enabled. If the value of `enabledNote` is false, users cannot set this attribute and get the default value `allowAll`. Not supported if the site has been migrated to the Webex Suite meeting platform.\n * `allowAll` - If the value of `noteType` attribute is `allowAll`, all participants can take notes.\n * `allowOne` - If the value of `noteType` attribute is `allowOne`, only a single note taker is allowed.\n"
            enabledFileTransfer:
              type: boolean
              description: Whether or not to allow any attendee to transfer files in the meeting. The value of this attribute also depends on the session type.
            enabledUCFRichMedia:
              type: boolean
              description: Whether or not to allow any attendee to share [Universal Communications Format](https://www.cisco.com/c/en/us/td/docs/collaboration/training_center/wbs30/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions_chapter_0110.pdf) media files in the meeting. The value of this attribute also depends on the sessionType. Not supported if the site has been migrated to the Webex Suite meeting platform.
          description: Meeting Options.
        attendeePrivileges:
          type: object
          properties:
            enabledShareContent:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to share content in the meeting.
            enabledSaveDocument:
              type: boolean
              description: Whether or not to allow any attendee to save shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledPrintDocument:
              type: boolean
              description: Whether or not to allow any attendee to print shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledAnnotate:
              type: boolean
              description: Whether or not to allow any attendee to annotate shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application.
            enabledViewParticipantList:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to view participants.
            enabledViewThumbnails:
              type: boolean
              description: Whether or not to allow any attendee to see a small preview image of any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledRemoteControl:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to control applications, web browsers, or desktops remotely.
            enabledViewAnyDocument:
              type: boolean
              description: Whether or not to allow any attendee to view any shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledViewAnyPage:
              type: boolean
              description: Whether or not to allow any attendee to scroll through any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application.
            enabledContactOperatorPrivately:
              type: boolean
              description: Whether or not to allow any attendee to contact the operator privately.
            enabledChatHost:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the host in private.
            enabledChatPresenter:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the presenter in private.
            enabledChatOtherParticipants:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with other participants in private.
          description: Attendee Privileges. This attribute is not supported for a webinar.
        integrationTags:
          type: array
          items:
            type: string
          description: External keys created by an integration application in its own domain, for example Zendesk ticket IDs, Jira IDs, Salesforce Opportunity IDs, etc. The integration application queries meetings by a key in its own domain. The maximum size of `integrationTags` is 3 and each item of `integrationTags` can be a maximum of 64 characters long. Please note that an empty or null `integrationTags` will delete all existing integration tags for the meeting implicitly. Developer can update integration tags for a `meetingSeries` but he cannot update it for a `scheduledMeeting` or a `meeting` instance.
        enabledBreakoutSessions:
          type: boolean
          description: Whether or not breakout sessions are enabled. If the value of `enabledBreakoutSessions` is false, users can not set breakout sessions. If the value of `enabledBreakoutSessions` is true, users can update breakout sessions using the [Update Breakout Sessions](/docs/api/v1/meetings/{meetingId}/breakoutSessions) API. Updating breakout sessions are not supported by this API.
        trackingCodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCodeItemForCreateMeetingObject'
          description: Tracking codes information. All available tracking codes and their options for the specified site can be retrieved by [List Meeting Tracking Codes](/docs/api/v1/meetings/list-meeting-tracking-codes) API. If an optional tracking code is missing from the `trackingCodes` array and there's a default option for this tracking code, the default option is assigned automatically. If the `inputMode` of a tracking code is `select`, its value must be one of the site-level options or the user-level value. Tracking code is not supported for a personal room meeting or an ad-hoc space meeting. It can be specified `null` so that it becomes null and hidden from the response after the patch.
        enabledAudioWatermark:
          type: boolean
          description: Whether or not the audio watermark is enabled. If it's `true`, `scheduledType` equals or defaults to `meeting`, and `audioConnectionOptions.audioConnectionType` equals `VoIP`, the audio for this meeting will have a watermark. In this case, a unique identifier is embedded into the audio that plays out of each Webex app and device. An administrator can use this watermark when analyzing an unauthorized recording to identify which Webex app or device was the source of the recording.
        enabledVisualWatermark:
          type: boolean
          description: Whether or not the visual watermark is enabled. If it's `true`, the video for this meeting will have a watermark. In this case, Webex superimposes a watermark image pattern on top of the meeting video and shared content to deter participants from leaking meeting information. Each participant viewing the meeting sees a watermark image pattern with their email address. If the participant is not signed in, the watermark image pattern includes their display name and email address.
        visualWatermarkOpacity:
          type: number
          example: 10
          description: Opacity level for the visual watermark. The value must be between 5 and 80, inclusive. A smaller value means less distraction for meeting participants, while a larger value shows a clearer watermark. It's supported when `enabledVisualWatermark` is `true`.
        audioConnectionOptions:
          type: object
          properties:
            audioConnectionType:
              type: string
              enum:
              - webexAudio
              - VoIP
              - other
              - none
              description: "Choose how meeting attendees join the audio portion of the meeting.\n * `webexAudio` - Provide a hybrid audio option, allowing attendees to join using their computer audio or a phone.\n * `VoIP` - Only restricts attendees to join the audio portion of the meeting using their computer instead of a telephone option.\n * `other` - Other teleconference services.\n * `none` - The way of attendees join the audio portion of the meeting is the default value.\n"
            enabledTollFreeCallIn:
              type: boolean
              example: true
              description: Whether or not to show toll-free call-in numbers.
            enabledGlobalCallIn:
              type: boolean
              example: true
              description: Whether or not to show global call-in numbers to attendees.
            enabledAudienceCallBack:
              type: boolean
              description: Whether or not to allow attendees to receive a call-back and call-in is available. Can only be set `true` for a webinar.
            entryAndExitTone:
              type: string
              enum:
              - beep
              - announceName
              - noTone
              description: "Select the sound you want users who have a phone audio connection to hear when someone enters or exits the meeting.\n * `beep` - All call-in users joining the meeting will hear the beep.\n * `announceName` - All call-in users joining the meeting will hear their names.\n * `noTone` - Turn off beeps and name announcements.\n"
            allowHostToUnmuteParticipants:
              type: boolean
              description: Whether or not to allow the host to unmute participants.
            allowAttendeeToUnmuteSelf:
              type: boolean
              example: true
              description: Whether or not to allow attendees to unmute themselves.
            muteAttendeeUponEntry:
              type: boolean
              description: Whether or not to auto-mute attendees when attendees enter meetings.
          description: Audio connection options.
        requireAttendeeLogin:
          type: boolean
          description: Require attendees to sign in before joining the webinar. This option works when the value of `scheduledType` attribute is `webinar`. Please note that `requireAttendeeLogin` cannot be set if someone has already registered for the webinar.
        restrictToInvitees:
          type: boolean
          description: Restrict webinar to invited attendees only. This option works when the registration option is disabled and the value of `scheduledType` attribute is `webinar`. Please note that `restrictToInvitees` cannot be set to `true` if `requireAttendeeLogin` is `false`.
        enabledLiveStream:
          type: boolean
          description: Whether or not live streaming is enabled.
        liveStream:
          $ref: '#/components/schemas/LiveStreamObject'
          description: Live streaming settings. It applies when `enabledLiveStream` is `true`.
    CustomizedQuestionForGetMeeting:
      type: object
      required:
      - id
      - question
      - type
      properties:
        id:
          type: number
          example: 330521
          description: Unique identifier for the question.
        question:
          type: string
          example: How are you
          description: Title of the customized question.
        required:
          type: boolean
          example: true
          description: Whether or not the customized question is required to be answered by participants.
        type:
          type: string
          enum:
          - singleLineTextBox
          - multiLineTextBox
          - checkbox
          - dropdownList
          - radioButtons
          description: "Type of the question being asked.\n * `singleLineTextBox` - Single line text box.\n * `multiLineTextBox` - Multiple line text box.\n * `checkbox` - Check box which requires `options`.\n * `dropdownList` - Drop down list box which requires `options`.\n * `radioButtons` - Single radio button which requires `options`.\n"
        maxLength:
          type: number
          description: The maximum length of a string that can be entered by the user, ranging from `0` to `999`. Only required by `singleLineTextBox` and `multiLineTextBox`.
        options:
          type: array
          items:
            type: object
            required:
            - id
            - value
            properties:
              id:
                type: number
                example: 1
                description: The unique id of options.
              value:
                type: string
                example: green
                description: The content of the option.
          description: TThe content of `options`. Required if the question type is one of `checkbox`, `dropdownList`, or `radioButtons`.
        rules:
          type: array
          items:
            type: object
            required:
            - condition
            - value
            - result
            - order
            properties:
              condition:
                type: string
                enum:
                - contains
                - notContains
                - beginsWith
                - endsWith
                - equals
                - notEquals
                description: "Judgment expression for approval rules.\n * `contains` - The content of the answer contains the value.\n * `notContains` - The content of the answer does not contain the value\n * `beginsWith` - The content of the answer begins with the value.\n * `endsWith` - The content of the answer ends with the value.\n * `equals` - The content of the answer is the same as the value.\n * `notEquals` - The content of the answer is not the same as the value.\n"
              value:
                type: string
                example: tom
                description: The keyword for the approval rule. If the rule matches the keyword, the corresponding action will be executed.
              result:
                type: string
                enum:
                - approve
                - reject
                description: "The automatic approval result for the approval rule.\n * `approve` - If the user's registration value meets the criteria, the registration form will be automatically approved.\n * `reject` - If the user's registration value meets the criteria, the registration form will be automatically rejected.\n"
              matchCase:
                type: boolean
                example: true
                description: Whether to check the case of values.
              order:
                type: number
                example: 1
                description: The priority number of the approval rule. Approval rules for standard questions and custom questions need to be ordered together.
          description: The automatic approval rules for customized questions.
    InterpreterObjectForSimultaneousInterpretationOfGetOrListMeeting:
      type: object
      required:
      - id
      - languageCode1
      - languageCode2
      properties:
        id:
          type: string
          example: OGQ0OGRiM2U3ZTAxNDZiMGFjYzJjMzYxNDNmNGZhN2RfZTA5MTJiZDBjNWVlNDA4YjgxMTZlMjU4Zjg2NWIzZmM
          description: Unique identifier for meeting interpreter.
        languageCode1:
          type: string
          example: en
          description: Forms a set of simultaneous interpretation channels together with `languageCode2`. Standard language format from [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) code. Read [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) for details.
        languageCode2:
          type: string
          example: de
          description: Forms a set of simultaneous interpretation channels together with `languageCode1`. Standard language format from [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) code. Read [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) for details.
        email:
          type: string
          example: marcus.hoffmann@example.com
          description: Email address of meeting interpreter.
        displayName:
          type: string
          example: Hoffmann
          description: Display name of meeting interpreter.
    ReassignMeetingErrorDescriptionObject:
      type: object
      required:
      - description
      properties:
        description:
          type: string
          example: The meeting is not found.
          description: Detailed description for the host reassignment of `meetingId` if it fails.
    OptionsForTrackingCodeObject:
      type: object
      required:
      - value
      - defaultValue
      properties:
        value:
          type: string
          description: The value of a tracking code option. `value` cannot be empty and the maximum size is 120 characters.
        defaultValue:
          type: boolean
          description: Whether or not the option is the default option of a tracking code.
    SurveyResultObject:
      type: object
      required:
      - id
      - surveyName
      - meetingId
      - email
      - displayName
      - createTime
      - questions
      properties:
        id:
          type: string
          example: 18d2e565770c4eee918784ee333510ec
          description: Unique identifier for the survey result.
        surveyName:
          type: string
          example: Survey name
          description: Name for the survey.
        meetingId:
          type: string
          example: 560d7b784f5143e3be2fc3064a5c4999
          description: Unique identifier for the meeting.
        email:
          type: string
          example: bob@example.com
          description: Email address of the user who submits the survey.
        displayName:
          type: string
          example: Bob
          description: Name of the user who submits the survey.
        createTime:
          type: string
          example: '2022-07-06T14:13:06+08:00'
          description: The time when the user submits the survey.
        questions:
          type: array
