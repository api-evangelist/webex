      summary: List Meeting Registrants
      operationId: listMeetingRegistrants
      description: Meeting's host and cohost can retrieve the list of registrants for a meeting with a specified meeting Id.
      tags:
      - Meetings
      parameters:
      - name: meetingId
        in: path
        description: Unique identifier for the meeting. Only the ID of the meeting series is supported for meetingId. IDs of scheduled meetings, meeting instances, or scheduled personal room meetings are not supported. See the [Meetings Overview](/docs/meetings#meeting-series-scheduled-meetings-and-meeting-instances) for more information about meeting types.
        required: true
        example: 560d7b784f5143e3be2fc3064a5c4999
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of registrants in the response, up to 100. The default is 10.
        example: 100
        schema:
          type: number
      - name: hostEmail
        in: query
        description: Email address for the meeting host. This parameter is only used if the user or application calling the API has the admin-level scopes. If set, the admin may specify the email of a user in a site they manage and the API will return details for a meeting that is hosted by that user.
        example: john.andersen@example.com
        schema:
          type: string
      - name: current
        in: query
        description: Whether or not to retrieve only the current scheduled meeting of the meeting series, i.e. the meeting ready to join or start or the upcoming meeting of the meeting series. If it's `true`, return details for the current scheduled meeting of the series, i.e. the scheduled meeting ready to join or start or the upcoming scheduled meeting of the meeting series. If it's `false` or not specified, return details for the entire meeting series. This parameter only applies to meeting series.
        example: false
        schema:
          type: boolean
          default: false
      - name: email
        in: query
        description: Registrant's email to filter registrants.
        example: abc@test.com
        schema:
          type: string
      - name: registrationTimeFrom
        in: query
        description: The time registrants register a meeting starts from the specified date and time (inclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If `registrationTimeFrom` is not specified, it equals `registrationTimeTo` minus 7 days.
        example: '2022-10-22T09:30:00'
        schema:
          type: string
      - name: registrationTimeTo
        in: query
        description: The time registrants register a meeting before the specified date and time (exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If `registrationTimeTo` is not specified, it equals `registrationTimeFrom` plus 7 days. The interval between `registrationTimeFrom` and `registrationTimeTo` must be within 90 days.
        example: '2022-10-25T09:30:00'
        schema:
          type: string
