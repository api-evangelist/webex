          - meeting
          - webinar
          - privateMeeting
          description: "Meeting session type.\n * `meeting` - Meeting session type for a meeting.\n * `webinar` - Meeting session type for a webinar.\n * `privateMeeting` - Meeting session type for a private meeting.\n"
        attendeesCapacity:
          type: number
          example: 1000
          description: The maximum number of attendees for the meeting session type.
    MeetingTrackingCodesObject:
      type: object
      required:
      - id
      - name
      - siteUrl
      - options
      - inputMode
      - service
      - type
      properties:
        id:
          type: string
          example: '1'
          description: Unique identifier for the tracking code.
        name:
          type: string
          example: Department
          description: Name for the tracking code.
        siteUrl:
          type: string
          example: example.webex.com
          description: Site URL for the tracking code.
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionsForTrackingCodeObject'
          description: Tracking code option list. The options here differ from those in the [site-level tracking codes](/docs/api/v1/tracking-codes/get-a-tracking-code) and the [user-level tracking codes](/docs/api/v1/tracking-codes/get-user-tracking-codes). It is the result of a selective combination of the two. If there's user-level value for a tracking code, the user-level value becomes the default option for the tracking code, and the site-level default value becomes non-default.
        inputMode:
          type: string
          enum:
          - text
          - select
          - editableSelect
          - hostProfileSelect
          description: "The input mode in which the tracking code value can be assigned.\n * `text` - Text input.\n * `select` - Drop down list which requires `options`.\n * `editableSelect` - Both text input and select from list.\n * `hostProfileSelect` - An input method which is only available for the host profile and sign-up pages.\n"
        service:
          type: string
          enum:
          - All
          - MeetingCenter
          - EventCenter
          - TrainingCenter
          - SupportCenter
          description: "Service for schedule or sign up pages\n * `All` - Tracking codes apply to all services.\n * `MeetingCenter` - Users can set tracking codes when scheduling a meeting.\n * `EventCenter` - Users can set tracking codes when scheduling an event.\n * `TrainingCenter` - Users can set tracking codes when scheduling a training session.\n * `SupportCenter` - Users can set tracking codes when scheduling a support meeting.\n"
        type:
          type: string
          enum:
          - optional
          - required
          - adminSet
          - notUsed
          - notApplicable
          description: "Type for meeting scheduler or meeting start pages.\n * `optional` - Available to be chosen but not compulsory.\n * `required` - Officially compulsory.\n * `adminSet` - The value is set by admin.\n * `notUsed` - The value cannot be used.\n * `notApplicable` - This value only applies to the service of `All`. When the type of `All` for a tracking code is `notApplicable`, there are different types for different services. For example, `required` for `MeetingCenter`, `optional` for `EventCenter` and `notUsed` for others.\n"
    Registrants:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: '123456'
          description: Registrant ID.
    LiveStreamObject:
      type: object
      required:
      - destination
      - rtmpUrl
      - streamUrl
      properties:
        destination:
          type: string
          example: Facebook
          description: A descriptive text to describe the destination of the live streaming.
        rtmpUrl:
          type: string
          example: rtmps://example.com:1935/MediaLive/WebexStreaming
          description: Live streaming RTMP URL.
        streamUrl:
          type: string
          example: https://example.com/Webex-Streaming/index_a.m3u8
          description: The URL to view the live streaming, i.e. the playback URL.
        layoutWithoutSharedContent:
          type: string
          enum:
          - grid
          - stack
          - focus
          description: "Live streaming layout when there's no shared content.\n * `grid` - The video layout that allows you to see multiple participants in a meeting in grids.\n * `stack` - The video layout that displays the active speaker on the stage and up to six participants in thumbnails across the top.\n * `focus` - The video layout that only displays the active speaker.\n"
        layoutWithSharedContent:
          type: string
          enum:
          - stack
          - focusedContentWithActiveSpeaker
          - focusedContent
          description: "Live streaming layout when there's shared content.\n * `stack` - The video layout that displays the shared content on the stage and up to six participants in thumbnails across the top.\n * `focusedContentWithActiveSpeaker` - The layout that displays the shared content in the main part of the screen and a large thumbnail of the active speaker in the upper right corner.\n * `focusedContent` - The layout that only displays the shared content in the main part of the screen and does not display the participants.\n"
        allowChangeLayoutInMeeting:
          type: boolean
          description: Whether or not to allow change the live streaming layout in the meeitng.
        followStageLayoutWhenSynced:
          type: boolean
          example: true
          description: Whether or not to follow the stage layout when it's being synchronized.
        resolution:
          type: string
          example: 1920x1080
          description: Resolution of the live streaming.
    UpdateInterpreterObject:
      type: object
      required:
      - languageCode1
      - languageCode2
      properties:
        languageCode1:
          type: string
          example: en
          description: The pair of `languageCode1` and `languageCode2` form a bi-directional simultaneous interpretation language channel. The language codes conform with [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes).
        languageCode2:
          type: string
          example: de
          description: The pair of `languageCode1` and `languageCode2` form a bi-directional simultaneous interpretation language channel. The language codes conform with [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes).
        email:
          type: string
          example: marcus.tuchel@example.com
          description: Email address of meeting interpreter. If not specified, it'll be an empty interpreter for the bi-directional language channel. Please note that multiple interpreters with different emails can be assigned to the same bi-directional language channel, but the same email cannot be assigned to more than one interpreter.
        displayName:
          type: string
          example: Tuchel
          description: Display name of meeting interpreter. If the interpreter is already an invitee of the meeting and it has a different display name, that invitee's display name will be overwritten by this attribute.
        hostEmail:
          type: string
          example: brenda.song@example.com
          description: Email address for the meeting host. This attribute should only be set if the user or application calling the API has the admin on-behalf-of scopes. When used, the admin may specify the email of a user in a site they manage to be the meeting host.
        sendEmail:
          type: boolean
          example: true
          description: If `true`, send email to the interpreter.
    GetInterpreterObject:
      type: object
      required:
      - id
      - languageCode1
      - languageCode2
      properties:
        id:
          type: string
          example: OGQ0OGRiM2U3ZTAxNDZiMGFjYzJjMzYxNDNmNGZhN2RfZTA5MTJiZDBjNWVlNDA4YjgxMTZlMjU4Zjg2NWIzZmM
          description: Unique identifier for meeting interpreter.
        languageCode1:
          type: string
          example: en
          description: The pair of `languageCode1` and `languageCode2` form a bi-directional simultaneous interpretation language channel. The language codes conform with [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes).
        languageCode2:
          type: string
          example: de
          description: The pair of `languageCode1` and `languageCode2` form a bi-directional simultaneous interpretation language channel. The language codes conform with [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes).
        email:
          type: string
          example: marcus.hoffmann@example.com
          description: Email address of meeting interpreter.
        displayName:
          type: string
          example: Hoffmann
          description: Display name of meeting interpreter.
    PatchGroupMeetingObject:
      type: object
      properties:
        title:
          type: string
          example: John's Meeting
          description: Meeting title. The title can be a maximum of 128 characters long.
        agenda:
          type: string
          example: John's Agenda
          description: Meeting agenda. The agenda can be a maximum of 1300 characters long. It can be specified `null` so that it becomes null and hidden from the response after the patch.
        password:
          type: string
          example: BgJep@43
          description: Meeting password. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details.
        start:
          type: string
          example: '2020-05-15T20:30:00-08:00'
          description: Date and time for the start of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `start` cannot be before current date and time or after `end`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Refer to the [Webex Meetings](/docs/meetings#restrictions-on-updating-a-meeting) guide for more information about restrictions on updating date and time for a meeting. Please note that when a meeting is being updated, `start` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, if `start` is within the same minute as the current time, `start` will be adjusted to the upcoming minute; otherwise, `start` will be adjusted with seconds and milliseconds stripped off. For instance, if the current time is `2022-03-01T10:32:16.657+08:00`, `start` of `2022-03-01T10:32:28.076+08:00` or `2022-03-01T10:32:41+08:00` will be adjusted to `2022-03-01T10:33:00+08:00`, and `start` of `2022-03-01T11:32:28.076+08:00` or `2022-03-01T11:32:41+08:00` will be adjusted to `2022-03-01T11:32:00+08:00`.
        end:
          type: string
          example: '2020-05-15T21:30:00-08:00'
          description: Date and time for the end of meeting in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `end` cannot be before current date and time or before `start`. Duration between `start` and `end` cannot be shorter than 10 minutes or longer than 23 hours 59 minutes. Refer to the [Webex Meetings](/docs/meetings#restrictions-on-updating-a-meeting) guide for more information about restrictions on updating date and time for a meeting. Please note that when a meeting is being updated, `end` of the meeting will be accurate to minutes, not seconds or milliseconds. Therefore, `end` will be adjusted with seconds and milliseconds stripped off. For instance, `end` of `2022-03-01T11:52:28.076+08:00` or `2022-03-01T11:52:41+08:00` will be adjusted to `2022-03-01T11:52:00+08:00`.
        timezone:
          type: string
          example: America/Los_Angeles
          description: '[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) in which the meeting was originally scheduled (conforming with the [IANA time zone database](https://www.iana.org/time-zones)).'
        recurrence:
          type: string
          example: FREQ=DAILY;INTERVAL=1;COUNT=20
          description: Meeting series recurrence rule (conforming with [RFC 2445](https://www.ietf.org/rfc/rfc2445.txt)). Applies only to a recurring meeting series, not to a meeting series with only one scheduled meeting. Multiple days or dates for monthly or yearly `recurrence` rule are not supported, only the first day or date specified is taken. For example, "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10,11,12" is not supported and it will be partially supported as "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10". It can be specified `null` so that the meeting becomes non-recurring and the `recurrence` attribute becomes null and hidden from the response after the patch. If you specify a `recurrence` like `FREQ=DAILY;INTERVAL=1` which never ends, the furthest date of the series is unlimited. You can also specify a `recurrence` with a very distant ending date in the future, e.g. `FREQ=DAILY;INTERVAL=1;UNTIL=21241001T000000Z`, but the actual furthest date accepted for the recurring meeting is five years from now. Specifically, if it has an ending date, there can be up to 5 occurrences for a yearly meeting, 60 occurrences for a monthly meeting, 261 occurrences for a weekly meeting, or 1826 occurrences for a daily meeting.
        enabledAutoRecordMeeting:
          type: boolean
          description: Whether or not meeting is recorded automatically.
        allowAnyUserToBeCoHost:
          type: boolean
          description: Whether or not to allow any attendee with a host account on the target site to become a cohost when joining the meeting. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's user's preferred site.
        enabledJoinBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to join the meeting before the host joins the meeting.
        enableConnectAudioBeforeHost:
          type: boolean
          description: Whether or not to allow any attendee to connect audio in the meeting before the host joins the meeting. This attribute is only applicable if the `enabledJoinBeforeHost` attribute is set to true.
        joinBeforeHostMinutes:
          type: number
          example: 15
          description: Number of minutes an attendee can join the meeting before the meeting start time and the host joins. Only applicable if the `enabledJoinBeforeHost` attribute is set to true. Valid options for a meeting are `0`, `5`, `10`, and `15`, and valid options for a webinar are `0`, `15`, `30`, `45`, and `60`. The default is `0` if not specified.
        excludePassword:
          type: boolean
          description: Whether or not to exclude the meeting password from the email invitation.
        publicMeeting:
          type: boolean
          description: Whether or not to allow the meeting to be listed on the public calendar.
        reminderTime:
          type: number
          example: 30
          description: The number of minutes before the meeting begins, that an email reminder is sent to the host.
        unlockedMeetingJoinSecurity:
          type: string
          enum:
          - allowJoin
          - allowJoinWithLobby
          - blockFromJoin
          description: "Specifies how the people who aren't on the invite can join the unlocked meeting.\n * `allowJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoin`, people can join the unlocked meeting directly.\n * `allowJoinWithLobby` - If the value of `unlockedMeetingJoinSecurity` attribute is `allowJoinWithLobby`, people will wait in the lobby until the host admits them.\n * `blockFromJoin` - If the value of `unlockedMeetingJoinSecurity` attribute is `blockFromJoin`, people can't join the unlocked meeting.\n"
        sessionTypeId:
          type: number
          example: 3
          description: Unique identifier for a meeting session type for the user. This attribute is required while scheduling webinar meeting. All available meeting session types enabled for the user can be retrieved by [List Meeting Session Types](/docs/api/v1/meetings/list-meeting-session-types) API.
        enabledWebcastView:
          type: boolean
          description: Whether or not webcast view is enabled.
        panelistPassword:
          type: string
          example: GwLqa@78
          description: Password for panelists of a webinar meeting. Must conform to the site's password complexity settings. Read [password management](https://help.webex.com/en-us/zrupm6/Manage-Security-Options-for-Your-Site-in-Webex-Site-Administration) for details. If not specified, a random password conforming to the site's password rules will be generated automatically.
        enableAutomaticLock:
          type: boolean
          description: Whether or not to automatically lock the meeting after it starts.
        automaticLockMinutes:
          type: number
          example: 10
          description: The number of minutes after the meeting begins, for automatically locking it.
        allowFirstUserToBeCoHost:
          type: boolean
          description: Whether or not to allow the first attendee of the meeting with a host account on the target site to become a cohost. The target site is specified by `siteUrl` parameter when creating the meeting; if not specified, it's user's preferred site.
        allowAuthenticatedDevices:
          type: boolean
          description: Whether or not to allow authenticated video devices in the meeting's organization to start or join the meeting without a prompt.
        sendEmail:
          type: boolean
          example: true
          description: Whether or not to send emails to host and invitees. It is an optional field and default value is true.
        meetingOptions:
          type: object
          properties:
            enabledChat:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat in the meeting. Also depends on the session type.
            enabledVideo:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to have video in the meeting. Also depends on the session type.
            enabledPolling:
              type: boolean
              description: Whether or not to allow any attendee to poll in the meeting. Can only be set `true` for a webinar. The value of this attribute depends on the session type for a meeting. Please contact your site admin if this attribute is not available. Not supported if the site has been migrated to the Webex Suite meeting platform.
            enabledNote:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to take notes in the meeting. The value of this attribute also depends on the session type. Not supported if the site has been migrated to the Webex Suite meeting platform.
            noteType:
              type: string
              enum:
              - allowAll
              - allowOne
              description: "Whether note taking is enabled. If the value of `enabledNote` is false, users cannot set this attribute and get the default value `allowAll`. Not supported if the site has been migrated to the Webex Suite meeting platform.\n * `allowAll` - If the value of `noteType` attribute is `allowAll`, all participants can take notes.\n * `allowOne` - If the value of `noteType` attribute is `allowOne`, only a single note taker is allowed.\n"
            enabledFileTransfer:
              type: boolean
              description: Whether or not to allow any attendee to transfer files in the meeting. The value of this attribute also depends on the session type.
            enabledUCFRichMedia:
              type: boolean
              description: Whether or not to allow any attendee to share [Universal Communications Format](https://www.cisco.com/c/en/us/td/docs/collaboration/training_center/wbs30/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions/WebEx_BK_TE1FB6C1_00_training-center-frequently-asked-questions_chapter_0110.pdf) media files in the meeting. The value of this attribute also depends on the sessionType. Not supported if the site has been migrated to the Webex Suite meeting platform.
          description: Meeting Options.
        attendeePrivileges:
          type: object
          properties:
            enabledShareContent:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to share content in the meeting.
            enabledSaveDocument:
              type: boolean
              description: Whether or not to allow any attendee to save shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledPrintDocument:
              type: boolean
              description: Whether or not to allow any attendee to print shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledAnnotate:
              type: boolean
              description: Whether or not to allow any attendee to annotate shared documents, slides, or whiteboards when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewParticipantList:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to view participants.
            enabledViewThumbnails:
              type: boolean
              description: Whether or not to allow any attendee to see a small preview image of any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledRemoteControl:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to control applications, web browsers, or desktops remotely. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewAnyDocument:
              type: boolean
              description: Whether or not to allow any attendee to view any shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledViewAnyPage:
              type: boolean
              description: Whether or not to allow any attendee to scroll through any page of shared documents or slides when they are shared as files in the content viewer instead of in a window or application. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledContactOperatorPrivately:
              type: boolean
              description: Whether or not to allow any attendee to contact the operator privately. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatHost:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the host in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatPresenter:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with the presenter in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
            enabledChatOtherParticipants:
              type: boolean
              example: true
              description: Whether or not to allow any attendee to chat with other participants in private. This option is no longer supported for meetings on a site which has been migrated to the Webex Suite Meeting Platform (WSMP).
          description: Attendee Privileges. This attribute is not supported for a webinar.
        integrationTags:
          type: array
          items:
            type: string
          description: External keys created by an integration application in its own domain, for example Zendesk ticket IDs, Jira IDs, Salesforce Opportunity IDs, etc. The integration application queries meetings by a key in its own domain. The maximum size of `integrationTags` is 3 and each item of `integrationTags` can be a maximum of 64 characters long. Please note that an empty or null `integrationTags` will delete all existing integration tags for the meeting implicitly. Developer can update integration tags for a `meetingSeries` but he cannot update it for a `scheduledMeeting` or a `meeting` instance.
        enabledBreakoutSessions:
          type: boolean
          description: Whether or not breakout sessions are enabled. If the value of `enabledBreakoutSessions` is false, users can not set breakout sessions. If the value of `enabledBreakoutSessions` is true, users can update breakout sessions using the [Update Breakout Sessions](/docs/api/v1/meetings/{meetingId}/breakoutSessions) API. Updating breakout sessions are not supported by this API.
        trackingCodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCodeItemForCreateMeetingObject'
          description: Tracking codes information. All available tracking codes and their options for the specified site can be retrieved by [List Meeting Tracking Codes](/docs/api/v1/meetings/list-meeting-tracking-codes) API. If an optional tracking code is missing from the `trackingCodes` array and there's a default option for this tracking code, the default option is assigned automatically. If the `inputMode` of a tracking code is `select`, its value must be one of the site-level options or the user-level value. Tracking code is not supported for a personal room meeting or an ad-hoc space meeting. It can be specified `null` so that it becomes null and hidden from the response after the patch.
        enabledAudioWatermark:
          type: boolean
          description: Whether or not the audio watermark is enabled. If it's `true`, `scheduledType` equals or defaults to `meeting`, and `audioConnectionOptions.audioConnectionType` equals `VoIP`, the audio for this meeting will have a watermark. In this case, a unique identifier is embedded into the audio that plays out of each Webex app and device. An administrator can use this watermark when analyzing an unauthorized recording to identify which Webex app or device was the source of the recording.
        enabledVisualWatermark:
          type: boolean
          description: Whether or not the visual watermark is enabled. If it's `true`, the video for this meeting will have a watermark. In this case, Webex superimposes a watermark image pattern on top of the meeting video and shared content to deter participants from leaking meeting information. Each participant viewing the meeting sees a watermark image pattern with their email address. If the participant is not signed in, the watermark image pattern includes their display name and email address.
        visualWatermarkOpacity:
          type: number
          example: 10
          description: Opacity level for the visual watermark. The value must be between 5 and 80, inclusive. A smaller value means less distraction for meeting participants, while a larger value shows a clearer watermark. It's supported when `enabledVisualWatermark` is `true`.
        audioConnectionOptions:
          type: object
          properties:
            audioConnectionType:
              type: string
              enum:
              - webexAudio
              - VoIP
              - other
              - none
              description: "Choose how meeting attendees join the audio portion of the meeting.\n * `webexAudio` - Provide a hybrid audio option, allowing attendees to join using their computer audio or a phone.\n * `VoIP` - Only restricts attendees to join the audio portion of the meeting using their computer instead of a telephone option.\n * `other` - Other teleconference services.\n * `none` - The way of attendees join the audio portion of the meeting is the default value.\n"
            enabledTollFreeCallIn:
              type: boolean
              example: true
              description: Whether or not to show toll-free call-in numbers.
            enabledGlobalCallIn:
              type: boolean
              example: true
              description: Whether or not to show global call-in numbers to attendees.
            enabledAudienceCallBack:
              type: boolean
              description: Whether or not to allow attendees to receive a call-back and call-in is available. Can only be set `true` for a webinar.
            entryAndExitTone:
              type: string
              enum:
              - beep
              - announceName
              - noTone
              description: "Select the sound you want users who have a phone audio connection to hear when someone enters or exits the meeting.\n * `beep` - All call-in users joining the meeting will hear the beep.\n * `announceName` - All call-in users joining the meeting will hear their names.\n * `noTone` - Turn off beeps and name announcements.\n"
            allowHostToUnmuteParticipants:
              type: boolean
              description: Whether or not to allow the host to unmute participants.
            allowAttendeeToUnmuteSelf:
              type: boolean
              example: true
              description: Whether or not to allow attendees to unmute themselves.
            muteAttendeeUponEntry:
              type: boolean
              description: Whether or not to auto-mute attendees when attendees enter meetings.
          description: Audio connection options.
        requireAttendeeLogin:
          type: boolean
          description: Require attendees to sign in before joining the webinar. This option works when the value of `scheduledType` attribute is `webinar`. Please note that `requireAttendeeLogin` cannot be set if someone has already registered for the webinar.
        restrictToInvitees:
          type: boolean
          description: Restrict webinar to invited attendees only. This option works when the registration option is disabled and the value of `scheduledType` attribute is `webinar`. Please note that `restrictToInvitees` cannot be set to `true` if `requireAttendeeLogin` is `false`.
        enabledLiveStream:
          type: boolean
          description: When `true`, live streaming is enabled.
        liveStream:
          $ref: '#/components/schemas/LiveStreamObject'
          description: Live streaming settings. Applies when `enabledLiveStream` is `true`.
    PreMeetingBreakoutSessionWithoutIdObject:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: Breakout Session Name
          description: Name for breakout session.
        invitees:
          type: array
          items:
            type: string
          description: Invitees for breakout session. Please note that one invitee cannot be assigned to more than one breakout session.
    JoinMeetingObject:
      type: object
      properties:
        meetingId:
          type: string
          example: 98d8c2212c9d62b162b9565932735e59
          description: Unique identifier for the meeting. This parameter applies to meeting series and scheduled meetings. It doesn't apply to ended or in-progress meeting instances. Please note that currently meeting ID of a scheduled [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings) meeting is also supported for this API.
        meetingNumber:
          type: string
          example: '123456789'
          description: Meeting number. Applies to meeting series, scheduled meeting, and meeting instances, but not to meeting instances which have ended.
        webLink:
          type: string
          example: https://site4-example.webex.com/site4/j.php?MTID=md41817da6a55b0925530cb88b3577b1e
          description: Link to a meeting information page where the meeting client is launched if the meeting is ready to start or join.
        joinDirectly:
          type: boolean
          description: Whether or not to redirect to `joinLink`. It is an optional field and default value is true.
        email:
          type: string
          example: brenda.song@example.com
          description: Email address of meeting participant. If `email` is specified, the link is generated for the user of `email`; otherwise, the API returns the link for the user calling the API. `email` is required for a [guest issuer](https://developer.webex.com/docs/guest-issuer).
        displayName:
          type: string
          example: Brenda Song
          description: Display name of meeting participant. If `displayName` is specified, `email` must be specified as well. If `email` is specified and `displayName` is not, display name is the same as `email`. If neither `displayName` nor `email` is specified, the API returns the link for the user calling the API. The maximum length of `displayName` is 128 characters. `displayName` is required for a [guest issuer](https://developer.webex.com/docs/guest-issuer).
        password:
          type: string
          example: BgJep@43
          description: Required when the meeting is protected by a password and the current user is not privileged to view it if they are not a host, cohost, or invitee.
        expirationMinutes:
          type: number
          example: 5
          description: Expiration duration of `joinLink` in minutes. Must be between 1 and 60.
        registrationId:
          type: string
          example: '1111'
          description: Required when the meeting is webinar-enabled and enabled registration ID.
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This attribute should be set if the user or application calling the API has the admin on-behalf-of scopes. This parameter is required for a [Service App](/docs/service-apps). It only applies to meetings, not webinars.
        createJoinLinkAsWebLink:
          type: boolean
          description: When `createJoinLinkAsWebLink` is true, the returned `joinLink` is the webLink of the meeting, otherwise, the normal `joinLink` is returned. This parameter is applicable when the option to force the user to log in is set in Control Hub. When true, a user cannot join the meeting by the link directly and must go through the login flow.
        createStartLinkAsWebLink:
          type: boolean
          description: When `createStartLinkAsWebLink` is true, the returned `startLink` is the webLink of the meeting, otherwise, the normal `startLink` is returned. This parameter is applicable when the option to force the user to log in is set in Control Hub. When true, a user cannot start the meeting using the link and must go through the login flow.
    DetailedTemplateObject:
      type: object
      required:
      - id
      - name
      - locale
      - siteUrl
      - templateType
      - isDefault
      - isStandard
      - meeting
      properties:
        id:
          type: string
          example: N2Q3ZWE1ZjQyYjkyMWVhY2UwNTM4NmNhMjRhZDczMGU6VS0yMDA5NzItTUMtZW5fVVM
          description: Unique identifier for meeting template.
        name:
          type: string
          example: Meeting template 1
          description: Meeting template name.
        locale:
          type: string
          example: en_US
          description: Meeting template locale.
        siteUrl:
          type: string
          example: site4-example.webex.com
          description: Site URL for the meeting template.
        templateType:
          type: string
          enum:
          - meeting
          - webinar
          description: "Meeting template type.\n * `meeting` - Webex meeting.\n * `webinar` - Webex webinar.\n"
        isDefault:
          type: boolean
          description: Whether or not the meeting template is a default template.
        isStandard:
          type: boolean
          description: Whether or not the meeting template is a standard template.
        meeting:
          $ref: '#/components/schemas/CreateMeetingObject'
          description: Meeting object which is used to create a meeting by the meeting template. Please note that the meeting object should be used to create a meeting immediately after retrieval since the `start` and `end` may be invalid quickly after generation.
    Registration:
      type: object
      properties:
        autoAcceptRequest:
          type: boolean
          description: Whether or not meeting registration requests are accepted automatically.
        requireFirstName:
          type: boolean
          example: true
          description: Whether or not a registrant's first name is required for meeting registration. This option must always be `true`.
        requireLastName:
          type: boolean
          example: true
          description: Whether or not a registrant's last name is required for meeting registration. This option must always be `true`.
        requireEmail:
          type: boolean
          example: true
          description: Whether or not a registrant's email is required for meeting registration. This option must always be `true`.
        requireJobTitle:
          type: boolean
          description: Whether or not a registrant's job title is shown or required for meeting registration.
        requireCompanyName:
          type: boolean
          description: Whether or not a registrant's company name is shown or required for meeting registration.
        requireAddress1:
          type: boolean
          description: Whether or not a registrant's first address field is shown or required for meeting registration.
        requireAddress2:
          type: boolean
          description: Whether or not a registrant's second address field is shown or required for meeting registration.
        requireCity:
          type: boolean
          description: Whether or not a registrant's city is shown or required for meeting registration.
        requireState:
          type: boolean
          description: Whether or not a registrant's state is shown or required for meeting registration.
        requireZipCode:
          type: boolean
          description: Whether or not a registrant's postal code is shown or required for meeting registration.
        requireCountryRegion:
          type: boolean
          description: Whether or not a registrant's country or region is shown or required for meeting registration.
        requireWorkPhone:
          type: boolean
          description: Whether or not a registrant's work phone number is shown or required for meeting registration.
        requireFax:
          type: boolean
          description: Whether or not a registrant's fax number is shown or required for meeting registration.
        customizedQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CustomizedQuestionForGetMeeting'
          description: Customized questions for meeting registration.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StandardRegistrationApproveRule'
          description: The approval rules for standard questions.
    InvitationSourceObject:
      type: object
      required:
      - id
      - sourceId
      - sourceEmail
      properties:
        id:
          type: string
          example: '1'
          description: Unique identifier for invitation source.
        sourceId:
          type: string
          example: cisco
          description: Source ID for invitation.
        sourceEmail:
          type: string
          example: john001@example.com
          description: Email for invitation source.
        joinLink:
          type: string
          example: https://example.webex.com/example/j.php?MTID=m6d75f1c875b3e3c5d18c7598036bdd8b
          description: The link bound to `sourceId` can directly join the meeting. If the meeting requires registration,`joinLink` is not returned.
        registerLink:
          type: string
          example: https://example.webex.com/example/j.php?RGID=rb05b31307b5b820e16594da9d1cfc588
          description: The link bound to `sourceId` can directly register the meeting. If the meeting requires registration, `registerLink` is returned.
    Registrant:
      type: object
      properties:
        id:
          type: string
          example: fbd83190-97b2-4bb0-b56b-8fde463d137b
          description: New registrant's ID.
        status:
          type: string
          enum:
          - approved
          - pending
          - rejected
          description: "New registrant's status.\n * `approved` - Registrant has been approved.\n * `pending` - Registrant is in a pending list waiting for host or cohost approval.\n * `rejected` - Registrant has been rejected by the host or cohost.\n"
        firstName:
          type: string
          example: bob
          description: Registrant's first name.
        lastName:
          type: string
          example: Lee
          description: Registrant's last name.
        email:
          type: string
          example: bob@example.com
          description: Registrant's email.
        jobTitle:
          type: string
          example: manager
          description: Registrant's job title.
        companyName:
          type: string
          example: cisco
          description: Registrant's company.
        address1:
          type: string
          example: address1 string
          description: Registrant's first address line.
        address2:
          type: string
          example: address2 string
          description: Registrant's second address line.
        city:
          type: string
          example: New York
          description: Registrant's city name.
        state:
          type: string
          example: New York
          description: Registrant's state.
        zipCode:
          type: number
          example: 123456
          description: Registrant's postal code.
        countryRegion:
          type: string
          example: United States
          description: Registrant's country or region.
        workPhone:
          type: string
          example: +1 123456
          description: Registrant's work phone number.
        fax:
          type: string
          example: '123456'
          description: Registrant's FAX number.
        registrationTime:
          type: string
          example: '2021-09-07T09:29:13+08:00'
          description: Registrant's registration time.
        customizedQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CustomizedRegistrant'
          description: Registrant's answers for customized questions, Registration options define whether or not this is required.
        sourceId:
          type: string
          example: cisco
          description: Registrant's source id.The `sourceId` is from [Create Invitation Sources](/docs/api/v1/meetings/create-invitation-sources) API.
        registrationId:
          type: string
          example: '1111'
          description: Registrant's registration ID. Registrants have a special number to identify a registrations if it is webinar-enabled and enabled registration ID.
    MeetingSeriesObject:
      type: object
      required:
      - id
      - title
      - password
      - meetingType
      - state
      - timezone
      - start
      - end
      - hostUserId
      - hostDisplayName
      - hostEmail
      - hostKey
      - siteUrl
      - webLink
      - telephony
      - enabledBreakoutSessions
      properties:
        id:
          type: string
          example: dfb45ece33264639a7bc3dd9535d53f7_20200516T230000Z
          description: Unique identifier for meeting. For a meeting series, the `id` is used to identify the entire series. For scheduled meetings from a series, the `id` is used to identify that scheduled meeting. For a meeting instance that is in progress or has concluded, the `id` is used to identify that instance.
        meetingNumber:
          type: string
          example: '123456789'
          description: Meeting number. Applies to meeting series, scheduled meeting, and meeting instances, but not to meeting instances which have ended.
        title:
          type: string
          example: John's Meeting
          description: Meeting title. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        agenda:
          type: string
          example: John's Agenda
          description: Meeting agenda. The agenda can be a maximum of 1300 characters long. This attribute can be modified for a meeting series or a scheduled meeting using the  [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        password:
          type: string
          example: BgJep@43
          description: Meeting password. Applies to meeting series, scheduled meetings, and in-progress meeting instances, but not to meeting instances which have ended. Can be modified for a meeting series or a scheduled meeting using the [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        phoneAndVideoSystemPassword:
          type: string
          example: '12345678'
          description: 8-digit numeric password used to join a meeting from audio and video devices. This attribute applies to meeting series, scheduled meetings, and in-progress meeting instances, but not to meeting instances which have ended.
        meetingType:
          type: string
          enum:
          - meetingSeries
          - scheduledMeeting
          - meeting
          description: "Meeting type.\n * `meetingSeries` - Primary instance of a scheduled series of meetings which consists of one or more scheduled meetings based on a `recurrence` rule. When a non-recurring meeting is scheduled with no `recurrence`, its `meetingType` is also `meetingSeries` which is a meeting series with only one occurrence in Webex meeting modeling.\n * `scheduledMeeting` - Instance from a primary meeting series.\n * `meeting` - Meeting instance that is in progress or has completed.\n"
        state:
          type: string
          enum:
          - active
          - scheduled
          - ready
          - lobby
          - inProgress
          - ended
          - missed
          - expired
          description: "Meeting state.\n * `active` - Only applies to a meeting series. Indicates that one or more future scheduled meetings exist for this meeting series.\n * `scheduled` - Only applies to scheduled meeting. Indicates that the meeting is scheduled in the future.\n * `ready` - Only applies to scheduled meeting. Indicates that this scheduled meeting is ready to start or join immediately.\n * `lobby` - Only applies to meeting instances. Indicates that a locked meeting has been joined by participants, but no hosts have joined.\n * `inProgress` - Applies to meeting series and meeting instances. For a meeting series, indicates that an instance of this series is happening now. For a meeting instance, indicates that the meeting has been joined and unlocked.\n * `ended` - Applies to scheduled meetings and meeting instances. For scheduled meetings, indicates that the meeting was started and is now over. For meeting instances, indicates that the meeting instance has concluded.\n * `missed` - This state only applies to scheduled meetings. Indicates that the meeting was scheduled in the past but never happened.\n * `expired` - This state only applies to a meeting series. Indicates that all scheduled meetings of this series have passed.\n"
        hostDidJoin:
          type: boolean
          description: Only applies to meeting series in the `inProgress` state, scheduled meetings in the `ready` state, and meeting instances in the `inProgress` state, whether or not the meeting host joined the meeting. If true, the meeting host has joined the meeitng even if they dropped off; otherwise, the meeting host hasn't ever join the meeting. Indicates that someone is waiting in the lobby and the host hasn't joined the meeting if `attendeeDidJoin` is true and `hostDidJoin` is false.
        attendeeDidJoin:
          type: boolean
          description: Only applies to meeting series in the `inProgress` state, scheduled meetings in the `ready` state, and meeting instances in the `inProgress` state. Whether or not anyone has joined the meeting. If true, the meeting host or any attendee has joined the meeting; otherwise, no one has joined the meeting. Indicates that someone is waiting in the lobby and the host hasn't joined the meeting if `attendeeDidJoin` is true and `hostDidJoin` is false.
        timezone:
          type: string
          example: UTC
          description: '[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) of `start` and `end`, conforming with the [IANA time zone database](https://www.iana.org/time-zones).'
        start:
          type: string
          example: '2019-03-18T11:26:30Z'
          description: Start time for meeting in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If the meeting is a meeting series, `start` is the date and time the first meeting of the series starts. If the meeting is a meeting series and the `current` filter is true, `start` is the date and time the upcoming or ongoing meeting of the series starts. If the meeting is a scheduled meeting from a meeting series, `start` is the date and time when that scheduled meeting starts. If the meeting is a meeting instance that has happened or is happening, `start` is the date and time that the instance actually starts. Can be modified for a meeting series or a scheduled meeting using the  [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        end:
          type: string
          example: '2019-03-18T12:26:30Z'
          description: End time for a meeting in ISO 8601 compliant format. If the meeting is a meeting series, `end` is the date and time the first meeting of the series ends. If the meeting is a meeting series and the current filter is true, `end` is the date and time the upcoming or ongoing meeting of the series ends. If the meeting is a scheduled meeting from a meeting series, `end` is the date and time when that scheduled meeting ends. If the meeting is a meeting instance that has happened, `end` is the date and time that instance actually ends. If a meeting instance is in progress, `end` is not available. Can be modified for a meeting series or a scheduled meeting using the  [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API.
        recurrence:
          type: string
          example: FREQ=DAILY;INTERVAL=1;COUNT=10
          description: Meeting series recurrence rule (conforming with [RFC 2445](https://www.ietf.org/rfc/rfc2445.txt)). Applies only to a recurring meeting series, not to a meeting series with only one scheduled meeting. Can be modified for a meeting series using the  [Update a Meeting](/docs/api/v1/meetings/update-a-meeting) API. Multiple days or dates for monthly or yearly `recurrence` rule are not supported, only the first day or date specified is taken. For example, "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10,11,12" is not supported and it will be partially supported as "FREQ=MONTHLY;INTERVAL=1;COUNT=10;BYMONTHDAY=10". For a non-recurring meeting which has no `recurrence`, its `meetingType` is also `meetingSeries` which is a meeting series with only one occurrence in Webex meeting modeling.
        hostUserId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83QkFCQkU5OS1CNDNFLTREM0YtOTE0Ny1BMUU5RDQ2QzlDQTA
          description: Unique identifier for the meeting host.
        hostDisplayName:
          type: string
          example: John Andersen
          description: Display name for the meeting host.
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host.
        hostKey:
          type: string
          example: '123456'
          description: Key for joining the meeting as host.
        siteUrl:
          type: string
          example: site4-example.webex.com
          description: Site URL for the meeting.
        webLink:
          type: string
          example: https://site4-example.webex.com/site4/j.php?MTID=md41817da6a55b0925530cb88b3577b1
          description: Link to a meeting information page where the meeting client is launched if the meeting is ready to start or join.
        registerLink:
          type: string
          example: https://site4-example.webex.com/weblink/register/ra1c92369995314c0db8d53b2a44d78f6
          description: Link to register a meeting which has enabled registration.
        sipAddress:
          type: string
          example: 123456789@site4-example.webex.com
          description: SIP address for callback from a video system.
