      summary: List Meeting Templates
      operationId: listTemplates
      description: 'Retrieves the list of meeting templates that is available for the authenticated user.


        There are separate lists of meeting templates for different `templateType`, `locale` and `siteUrl`.


        * If `templateType` is specified, the operation returns an array of meeting template objects specified by the `templateType`; otherwise, returns an array of meeting template objects of all template types.


        * If `locale` is specified, the operation returns an array of meeting template objects specified by the `locale`; otherwise, returns an array of meeting template objects of the default `en_US` locale. Refer to [Meeting Template Locales](/docs/meetings#meeting-template-locales) for all the locales supported by Webex.


        * If the parameter `siteUrl` has a value, the operation lists meeting templates on the specified site; otherwise, lists meeting templates on the user''s preferred site. All available Webex sites and preferred site of the user can be retrieved by `Get Site List` API.'
      tags:
      - Meetings
      parameters:
      - name: templateType
        in: query
        description: Meeting template type for the meeting template objects being requested. If not specified, return meeting templates of all types.
        example: meeting
        schema:
          type: string
          enum:
          - meeting
          - webinar
      - name: locale
        in: query
        description: Locale for the meeting template objects being requested. If not specified, return meeting templates of the default `en_US` locale. Refer to [Meeting Template Locales](/docs/meetings#meeting-template-locales) for all the locales supported by Webex.
        example: en_US
        schema:
          type: string
      - name: isDefault
        in: query
        description: The value is `true` or `false`. If it's `true`, return the default meeting templates; if it's `false`, return the non-default meeting templates. If it's not specified, return both default and non-default meeting templates.
        example: false
        schema:
          type: boolean
      - name: isStandard
        in: query
        description: The value is `true` or `false`. If it's `true`, return the standard meeting templates; if it's `false`, return the non-standard meeting templates. If it's not specified, return both standard and non-standard meeting templates.
        example: false
        schema:
          type: boolean
      - name: hostEmail
        in: query
        description: Email address for the meeting host. This parameter is only used if the user or application calling the API has the admin-level scopes. If set, the admin may specify the email of a user in a site they manage and the API will return meeting templates that are available for that user.
