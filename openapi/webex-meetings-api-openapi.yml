      summary: List Meeting Survey Results
      operationId: listSurveyResultsByMeetingId
      description: 'Retrieves results for a meeting survey identified by `meetingId`.


        #### Request Header


        * `timezone`: Time zone for time stamps in response body, defined in conformance with the [IANA time zone database](https://www.iana.org/time-zones). The default value is `UTC` if not specified.


        * `hostEmail`: Email address for the meeting host. This parameter is only used if the user or application calling the API has the admin on-behalf-of scopes. If set, the admin may specify the email of a user in a site they manage and the API will return the survey results of that user.'
      tags:
      - Meetings
      parameters:
      - name: meetingId
        in: path
        description: Unique identifier for the meeting. Please note that only the meeting ID of a scheduled webinar is supported for this API.
        required: true
        example: 560d7b784f5143e3be2fc3064a5c4999
        schema:
          type: string
      - name: meetingStartTimeFrom
        in: query
        description: 'Start date and time (inclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format for the meeting objects being requested. `meetingStartTimeFrom` cannot be after `meetingStartTimeTo`. This parameter will be ignored if `meetingId` is the unique identifier for the specific meeting instance.

          When `meetingId` is not the unique identifier for the specific meeting instance, the `meetingStartTimeFrom`, if not specified, equals `meetingStartTimeTo` minus `1` month; if `meetingStartTimeTo` is also not specified, the default value for `meetingStartTimeFrom` is `1` month before the current date and time.

          '
        example: '2019-03-18T09:30:00Z'
        schema:
          type: string
      - name: meetingStartTimeTo
        in: query
        description: 'End date and time (exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format for the meeting objects being requested. `meetingStartTimeTo` cannot be prior to `meetingStartTimeFrom`. This parameter will be ignored if `meetingId` is the unique identifier for the specific meeting instance.

          When `meetingId` is not the unique identifier for the specific meeting instance, if `meetingStartTimeFrom` is also not specified, the default value for `meetingStartTimeTo` is the current date and time;For example,if `meetingStartTimeFrom` is a month ago, the default value for `meetingStartTimeTo` is `1` month after `meetingStartTimeFrom`.Otherwise it is the current date and time.

          '
        example: '2019-03-25T09:30:00Z'
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of meetings in the response, up to 100. The default is 10.
        example: 100
        schema:
          type: number
      - name: timezone
        in: header
        description: e.g. UTC
        required: false
        schema:
          type: string
        example: UTC
      - name: hostEmail
        in: header
        description: e.g. john.andersen@example.com
        required: false
        schema:
          type: string
        example: john.andersen@example.com
