      summary: Create a BroadWorks Billing Report
      operationId: Create a BroadWorks Billing Report
      description: 'Generate a monthly reconciliation report.


        <div>

        <Callout type=''info''>

        Partners who have moved to extended wholesale subscription model should generate reports via [Wholesale Billing Reports](/docs/api/v1/wholesale-billing).

        </Callout>

        </div>'
      tags:
      - BroadWorks Billing Reports
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              billingPeriod: 2020-11
            schema:
              type: object
              required:
              - billingPeriod
              properties:
                billingPeriod:
                  type: string
                  example: 2020-11
                  description: The year and month (`YYYY-MM`) for which the billing report is to be generated.
