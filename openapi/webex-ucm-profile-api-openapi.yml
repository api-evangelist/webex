      summary: Read the List of UC Manager Profiles
      operationId: Read the List of UC Manager Profiles
      description: 'List all calling UC Manager Profiles for the organization.


        UC Manager Profiles are applicable if your organization uses Jabber in Team Messaging mode or Calling in Webex (Unified
        CM).


        The UC Manager Profile has an organization-wide default and may be overridden for individual persons, although currently
        only setting at a user level is supported by Webex APIs.


        Retrieving this list requires a full or read-only administrator auth token with a scope of `spark-admin:people_read`
        as this API is designed to be used in conjunction with calling behavior at the user level.'
      tags:
      - UCM Profile
      parameters:
      - name: orgId
        in: query
        description: List manager profiles in this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
