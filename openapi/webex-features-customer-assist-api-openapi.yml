components:
  schemas:
    UpdateWrapUpReasonPayload:
      type: object
      properties:
        name:
          type: string
          example: Wrap up reason 1
          description: Name of the wrap-up reason.
        description:
          type: string
          example: This is a description for wrap-up reason 1
          description: Description of the wrap-up reason.
        queuesToAssign:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvOGY1MDI2ZjMtMDZjYi00OTU3LWE0MDQtNDYyM2UzYjJjYzVi
          description: List of queue IDs to assign to the wrap-up reason.
        queuesToUnassign:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvMTM1NDg0YTMtN2Y0Yi00MTlhLWI2ZGQtMTk4NmY5MmQwYWQ1
          description: List of queue IDs to unassign from the wrap-up reason.
        assignAllQueuesEnabled:
          type: boolean
          description: Denotes whether all queues are assigned to the wrap-up reason.
        unassignAllQueuesEnabled:
          type: boolean
          description: Denotes whether all queues are unassigned from the wrap-up reason.
    WrapUpReasonDetailsObject:
      type: object
      required:
      - name
      - defaultWrapupQueuesCount
      - queues
      properties:
        name:
          type: string
          example: Wrap up reason 1
          description: Name of the wrap-up reason.
        description:
          type: string
          example: This is a description for wrap-up reason 1
          description: Description of the wrap-up reason.
        defaultWrapupQueuesCount:
          type: number
          example: 1
          description: Number of queues assigned to the wrap-up reason.
        queues:
          type: array
          items:
            $ref: '#/components/schemas/QueueObjectWithDefaultEnabled'
          description: List of queues assigned to the wrap-up reason.
    ModifyScreenPopConfigurationPayload:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Enable/disable screen pop.
        screenPopUrl:
          type: string
          example: https://www.salesforce.com/page
          description: The screen pop URL that integrates Webex calls with other business apps like CRM, ticketing tools, and order entry systems.
        desktopLabel:
          type: string
          example: CRM Integration with Webex CallQueue screen pop
          description: A label for the screen pop configuration.
        queryParams:
          $ref: '#/components/schemas/QueryParamsObject'
          description: The additional user-defined key-value pairs that must be sent to the agent.
    GetScreenPopConfigurationObject:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Enable/disable screen pop.
        screenPopUrl:
          type: string
          example: https://www.salesforce.com/page
          description: The screen pop URL that integrates Webex calls with other business apps like CRM, ticketing tools, and order entry systems.
        desktopLabel:
          type: string
          example: CRM Integration with Webex CallQueue screen pop
