      summary: Update a Participant
      operationId: Update a Participant
      description: 'Mute, un-mute, expel, or admit a participant in a live meeting. The `participantId` is required to identify
        the meeting and the participant.


        Notes:


        * The owner of the OAuth token calling this API needs to be the meeting host or co-host.


        * The `expel` attribute always takes precedence over `admit` and `muted`. The request can have all `expel`, `admit`
        and `muted` or any of them.


        <div><Callout type="warning">There is an inconsistent behavior in Webex Meetings App when all active meeting participants
        join using Webex Meetings App and the host attempts to change meeting participant status using this API. Requests
        to mute, un-mute, admit, or expel a meeting participant return a successful response and update the state in the API,
        but the changes will not be applied to the Webex Meetings App participants. The inconsistent behavior in Webex Meetings
        App will be corrected in a future release.

        **Workaround**: [Enable closed captions](https://help.webex.com/en-us/article/WBX47352/How-Do-I-Enable-Closed-Captions?)
        or enable the [Webex Assistant](https://help.webex.com/en-us/article/n91uf2x/Turn-on-or-turn-off-Webex-Assistant-during-a-meeting-or-webinar).</Callout></div>'
      tags:
      - Participants
      parameters:
      - name: participantId
        in: path
        description: The unique identifier for the meeting and the participant.
        required: true
        example: 560d7b784f5143e3be2fc3064a5c4999_3c2e2338-e950-43bf-b588-573773ee43d1
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              muted: false
            schema:
              type: object
              properties:
                muted:
                  type: boolean
                  description: If `true`, participant is muted.
                admit:
                  type: boolean
                  description: If `true` the participant admit a participant in the lobby to the meeting. Has no effect if
                    the participant is not in the lobby or when the value is set to `false`.
                expel:
                  type: boolean
                  description: If `true` the participant is expelled from the meeting.
