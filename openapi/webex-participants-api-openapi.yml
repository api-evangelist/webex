components:
  schemas:
    CalloutResponse:
      type: object
      properties:
        participantId:
          type: string
          example: d8c3347d7ec04242ba9b856184b334ac_I_630641605678082408_57514861-50f7-3f5b-864f-ce0e308bf653
          description: Participant ID. It can be used in the "Cancel Call Out a SIP Participant" API.
        invitationCorrelationId:
          type: string
          example: 871ab255-64e6-4cd2-a5af-d33953898356
          description: An internal ID that is associated with the call-out invitation.
        meetingNumber:
          type: string
          example: '79100342367'
          description: Number of the meeting to which the SIP participant is to be called out.
        meetingId:
          type: string
          example: d8c3347d7ec04242ba9b856184b334ac
          description: Unique identifier of the meeting to which the SIP participant is to be called out.
        address:
          type: string
          example: SIP:9053523155@examplezone.cisco.com
          description: SIP address of the invited SIP participant.
        addressType:
          type: string
          enum:
          - sipAddress
          description: "Type of the `address`.\n * `sipAddress` - SIP address.\n"
        displayName:
          type: string
          example: Brenda DX80
          description: The display name of the invited SIP participant.
        state:
          type: string
          enum:
          - pending
          description: "The state of the invited SIP participant.\n * `pending` - The invited SIP participant is waiting for\
            \ approval. Participants in the `pending` state will not be listed by the \"List Meeting Participants\" API.\n"
    AdmitParticipant:
      type: object
      properties:
        participantId:
          type: string
          example: 560d7b784f5143e3be2fc3064a5c4999_I_204252993233618782_23e16d67-17f3-3ef1-b830-f33d17c0232e
          description: The ID that identifies the meeting participant.
        breakoutSessionId:
          type: string
          example: 23e16d67-17f3-3ef1-b830-f33d17c0232e
          description: The breakout session ID that identifies which breakout session to admit the participant into. Admit
            into the main session if the value is empty.
    Device:
      type: object
      properties:
        correlationId:
          type: string
          example: 8ccced6c-b812-4dff-a5dd-4c5c28f8d47d
          description: An internal ID that is associated with each join.
        deviceType:
          type: string
          example: webex_meeting_center_mac
          description: The type of the device.
        audioType:
          type: string
          enum:
          - pstn
          - voip
          - inactive
          description: "The audio type that the participant is using.\n * `pstn` - `PSTN`\n * `voip` - `VoIP`\n * `inactive`\
            \ - The participant is not connected to audio.\n"
        joinedTime:
          type: string
          example: '2019-04-23T17:31:00.000Z'
          description: The time the device joined the meeting. If the field is non-existent or shows `1970-01-    01T00:00:00.000Z`
            the meeting may be still ongoing and the `joinedTime` will be filled in after the meeting ended. If you need real-time
            joined     events, please refer to the webhooks guide.
        leftTime:
          type: string
          example: '2019-04-23T17:32:00.000Z'
          description: The time the device left the meeting, `leftTime` is the exact moment when a specific devi    ce left
            the meeting. If the field is non-existent or shows `1970-01-01T00:00:00.000Z` the meeting may be still ongoing
            and the `leftTime` will     be filled in after the meeting ended. If you need real-time left events, please refer
            to the webhooks guide.
        durationSecond:
          type: number
          example: 60
          description: The duration in seconds the device stayed in the meeting.
        callType:
          type: string
          enum:
          - callIn
          - callBack
          description: "The PSTN call type in which the device joined the meeting.\n * `callIn` - Connect audio by dialing\
            \ a toll or toll-free phone number provided by the meeting.\n * `callBack` - Connect audio by dialing out a phone\
            \ number from the meeting.\n"
        phoneNumber:
          type: string
          example: '745273328'
          description: 'The PSTN phone number from which the device joined the meeting. Only [compliance officer](/docs/compliance#compliance)
            can retrieve the `phoneNumber`. The meeting host and admin users cannot retrieve it. NOTE: The `phoneNumber` will
            be returned after the meeting ends; it is not returned while the meeting is in progress.'
    InProgressDevice:
      type: object
      properties:
        correlationId:
          type: string
          example: 8ccced6c-b812-4dff-a5dd-4c5c28f8d47d
          description: An internal ID that is associated with each join.
        deviceType:
          type: string
          example: mac
          description: The type of device.
        audioType:
          type: string
          enum:
          - pstn
          - voip
          - inactive
          description: "The audio type that the participant is using.\n * `pstn` - `PSTN`\n * `voip` - `VoIP`\n * `inactive`\
            \ - The participant is not connected to audio.\n"
        joinedTime:
          type: string
          example: '2019-04-23T17:31:00.000Z'
          description: The time the device joined the meeting. If the field is non-existent or shows `1970-01-01T00:00:00.000Z`
            the meeting may be still ongoing and the `joinedTime` will be filled in after the meeting ended. If you need real-time
            joined events, please refer to the webhooks guide.
        leftTime:
          type: string
          example: '2019-04-23T17:32:00.000Z'
          description: The time the device left the meeting, `leftTime` is the exact moment when a specific device left the
            meeting. If the field is non-existent or shows `1970-01-01T00:00:00.000Z` the meeting may be still ongoing and
            the `leftTime` will be filled in after the meeting ended. If you need real-time left events, please refer to the
            webhooks guide.
    Participant:
      type: object
      properties:
        id:
          type: string
          example: 560d7b784f5143e3be2fc3064a5c4999_3c2e2338-e950-43bf-b588-573773ee43d1
          description: The ID that identifies the meeting and the participant.
        orgId:
          type: string
          example: 1eb65fdf-9643-417f-9974-ad72cae0e10f
          description: The ID that identifies the organization. It only applies to participants of ongoing meetings.
        host:
          type: boolean
          example: true
          description: Whether or not the participant is the host of the meeting.
        coHost:
          type: boolean
          description: Whether or not the participant has host privilege in the meeting.
        spaceModerator:
          type: boolean
          description: Whether or not the participant is the team space moderator. This field returns only if the meeting
            is associated with a Webex space.
        email:
          type: string
          example: joeDoe@cisco.com
          description: The email address of the participant.
        displayName:
          type: string
          example: Joe Doe
          description: The name of the participant.
        invitee:
          type: boolean
          description: Whether or not the participant is invited to the meeting.
        muted:
          type: boolean
          description: Whether or not the participant's audio is muted.
        meetingStartTime:
          type: string
          example: '2020-10-02T17:31:00Z'
          description: The time the meeting started.
        video:
          type: string
          enum:
          - 'on'
          - 'off'
          description: "The status of the participant's video.\n * `on` - The video is turned on.\n * `off` - The video is\
            \ turned off.\n"
        state:
          type: string
          enum:
          - lobby
          - end
          - joined
          - breakoutSession
          description: "The status of the participant in the meeting. The value of `state` is `breakoutSession` which is only\
            \ returned when the meeting is in progress and the breakout session is enabled.\n * `lobby` - The participant\
            \ is waiting in the meeting lobby.\n * `end` - The participant has left the meeting.\n * `joined` - The participant\
            \ has joined the meeting and is in the main session.\n * `breakoutSession` - The participant has joined a breakout\
            \ session.\n"
        breakoutSessionId:
          type: string
          example: 2e373567-465b-8530-a18a-7025e1871d40
          description: The ID of the breakout session including the participant.
        joinedTime:
          type: string
          example: '2022-10-25T09:00:00Z'
          description: The time the participant joined the meeting. If the field is non-existent or shows `1970-01-01T00:00:00.000Z`
            the meeting may be still ongoing and the `joinedTime` will be filled in after the meeting ended. If you need real-time
            join events, please refer to the webhooks guide.
        leftTime:
          type: string
          example: '2022-10-25T09:30:00Z'
          description: The time the participant left the meeting. If the field is non-existent or shows `1970-01-01T00:00:00.000Z`
            the meeting may be still ongoing and the `leftTime` will be filled in after the meeting ended. If you need real-time
            left events, please refer to the webhooks guide.
        siteUrl:
          type: string
          example: example.webex.com
          description: The site URL.
        meetingId:
          type: string
          example: 3a688f62840346e8b87dde2b50703511_I_197977258267247872
          description: A unique identifier for the meeting which the participant belongs to.
        hostEmail:
          type: string
          example: janeDoe@cisco.com
          description: The email address of the host.
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        breakoutSessionsAttended:
          type: array
          items:
            $ref: '#/components/schemas/BreakoutSessionAttended'
          description: The breakout sessions attended by the participant. Only applies to ended meeting instances.
        sourceId:
          type: string
          example: cisco
          description: The source ID of the participant. The `sourceId` is from the [Create Invitation Sources](/docs/api/v1/meetings/create-invitation-sources)
            API.
    AdmitParticipantsObject:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdmitParticipant'
    CancelCalloutRequest:
      type: object
      required:
      - participantId
      properties:
        participantId:
          type: string
          example: d8c3347d7ec04242ba9b856184b334ac_I_630641605678082408_57514861-50f7-3f5b-864f-ce0e308bf653
          description: ID of the SIP participant on whom the callout is to be cancelled. It can be retrieved from the response
