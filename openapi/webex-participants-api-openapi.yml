      summary: List Meeting Participants
      operationId: List Meeting Participants
      description: 'List all participants in an in-progress meeting or an ended meeting. The `meetingId` parameter is required,
        which is the unique identifier for the meeting.


        The authenticated user calling this API must either have an Administrator role with the `meeting:admin_participants_read`
        scope, or be the meeting host.


        * If the `meetingId` value specified is for a meeting series, the operation returns participants'' details for the
        last instance in the meeting series. If the `meetingStartTimeFrom` value and the `meetingStartTimeTo` value are specified,
        the operation returns participants'' details for the last instance in the meeting series in the time range.


        * If the `meetingId` value specified is for a scheduled meeting from a meeting series, the operation returns participants''
        details for that scheduled meeting. If the `meetingStartTimeFrom` value and the `meetingStartTimeTo` value are specified,
        the operation returns participants'' details for the last instance in the scheduled meeting in the time range.


        * If the `meetingId` value specified is for a meeting instance which is in progress or ended, the operation returns
        participants'' details for that meeting instance.


        * If the meeting is in progress, the operation returns all the real-time participants. If the meeting is ended, the
        operation returns all the participants that have joined the meeting.


        * If the `breakoutSessionId` parameter is specified, the operation returns participants who joined the specified breakout
        session. It only applies to end meeting instances.


        * The `breakoutSessionsAttended` attribute is only returned for a participant of an ended meeting instance if the
        participant joined breakout sessions in the meeitng.


        * The `meetingStartTimeFrom` and `meetingStartTimeTo` only apply when `meetingId` is a series ID or an occurrence
        ID.


        * If the webinar is in progress when the attendee has ever been unmuted to speak in the webinar, this attendee becomes
        a panelist. The operation returns include the people who have been designated as panelists when the webinar is created
        and have joined the webinar, and the attendees who have joined the webinar and are unmuted to speak in the webinar
        temporarily. If the webinar is ended, the operation returns all the participants, including all panelists and all
        attendees who are not panelists.


        #### Request Header


        * `timezone`: Time zone for time stamps in the response body, defined in conformance with the [IANA time zone database](https://www.iana.org/time-zones).'
      tags:
      - Participants
      parameters:
      - name: max
        in: query
        description: Limit the maximum number of participants in the response, up to 100.
        example: '100'
        schema:
          type: number
          default: 10
      - name: meetingId
        in: query
        description: The unique identifier for the meeting. Please note that currently meeting ID of a scheduled [personal
          room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings) meeting is not supported
          for this API.
        required: true
        example: 560d7b784f5143e3be2fc3064a5c4999
        schema:
          type: string
      - name: breakoutSessionId
        in: query
        description: The unique identifier for a breakout session which happened during an ended meeting instance. If the
          `breakoutSessionId` is specified, the operation returns participants who joined the breakout session. Only applies
          to ended meeting instances.
        example: c84ba778-2f46-4dc6-9459-398694732d70
        schema:
          type: string
      - name: meetingStartTimeFrom
        in: query
        description: Meetings start from the specified date and time(exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
          compliant format. If `meetingStartTimeFrom` is not specified, it equals `meetingStartTimeTo` minus 1 month; if `meetingStartTimeTo`
          is also not specified, the default value for `meetingStartTimeFrom` is 1 month before current date and time.
        example: '2022-10-02T17:31:00Z'
        schema:
          type: string
      - name: meetingStartTimeTo
        in: query
        description: Meetings start before the specified date and time(exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
          compliant format. If `meetingStartTimeTo` is not specified, it equals the result of a comparison, `meetingStartTimeFrom`
          plus one month and the current time, and the result is the earlier of the two; if `meetingStartTimeFrom` is also
          not specified, the default value for `meetingStartTimeTo` is current date and time minus 1 month.
        example: '2022-10-30T09:30:00Z'
        schema:
          type: string
      - name: hostEmail
        in: query
        description: Email address for the meeting host. This parameter is only used if the user or application calling the
          API has the admin-level scopes, the admin may specify the email of a user in a site they manage and the API will
          return meeting participants of the meetings that are hosted by that user.
        example: john.andersen@example.com
        schema:
          type: string
      - name: joinTimeFrom
        in: query
        description: The time participants join a meeting starts from the specified date and time (inclusive) in any [ISO
          8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. If `joinTimeFrom` is not specified, it equals `joinTimeTo`
          minus 7 days.
        example: '2022-10-22T09:30:00'
        schema:
          type: string
      - name: joinTimeTo
        in: query
        description: The time participants join a meeting before the specified date and time (exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
          compliant format. If `joinTimeTo` is not specified, it equals `joinTimeFrom` plus 7 days. The interval between `joinTimeFrom`
          and `joinTimeTo` must be within 90 days.
        example: '2022-10-25T09:30:00'
        schema:
          type: string
      - name: timezone
        in: header
        description: e.g. UTC
        required: false
        schema:
          type: string
        example: UTC
