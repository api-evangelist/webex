      summary: Call Out a SIP Participant
      operationId: Call Out a SIP Participant
      description: 'Initiate a call to a SIP participant to join a meeting.


        If a user invoking the API is not a [Service App](/docs/service-apps), the user must join the meeting before invoking
        the API. If a user is a [Service App](/docs/service-apps), the service app can invoke the API without joining the
        meeting. In both cases, the normal user or the service app that invokes the API must be the meeting host or cohost.
        If the meeting is created by the service app on behalf of the real host, the service app cannot use the admin on behalf
        function to invoke this API. Instead the host or cohost must execute the action.


        The authenticated user calling this API must have the `meeting:participants_write` scope.


        The ringing on the invited SIP device stops in 30 seconds if there is no response.'
      tags:
      - Participants
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              meetingId: d8c3347d7ec04242ba9b856184b334ac
              address: SIP:9053523155@examplezone.cisco.com
              addressType: sipAddress
              invitationCorrelationId: 871ab255-64e6-4cd2-a5af-d33953898356
              displayName: Brenda DX80
            schema:
              $ref: '#/components/schemas/CalloutRequest'
