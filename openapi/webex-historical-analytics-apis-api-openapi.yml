      summary: Historical Data related to Meetings
      operationId: Historical Data related to Meetings
      description: 'Return aggregates of various metrics related to meetings for a given Webex site over a specified time
        range.


        <div><Callout type="error">The base URL for these APIs is **analytics.webexapis.com**, which does not work with the
        **Try It** feature.</Callout></div>'
      tags:
      - Historical Analytics APIs
      parameters:
      - name: siteUrl
        in: query
        description: URL of the Webex site for which historical data is requested.
        required: true
        example: cisco.webex.com
        schema:
          type: string
      - name: from
        in: query
        description: UTC Date starting from which the data needs to be returned
        example: '2020-08-01'
        schema:
          type: string
          default: Data related to the date mentioned in 'to' parameter if 'from' parameter is not provided. Yesterday's data
            if neither 'from' nor 'to' are provided
      - name: to
        in: query
        description: UTC Date up to which the data needs to be returned
        example: '2020-08-03'
        schema:
          type: string
          default: Data from the date mentioned in 'from' parameter up to yesterday if 'to' parameter is not provided. Yesterday's
            data is returned if neither 'from' nor 'to' are provided. Yesterday is the earliest date for which there will
            be results.
