      summary: Historical Data related to Room Devices
      operationId: Historical Data related to Room Devices
      description: 'Returns daily aggregates of various metrics related to Room Devices.


        <div><Callout type="error">The base URL for these APIs is **analytics.webexapis.com**, which does not work with the
        **Try It** feature. </Callout></div>'
      tags:
      - Historical Analytics APIs
      parameters:
      - name: from
        in: query
        description: Starting UTC Date from which historical data should be returned.
        example: '2020-08-01'
        schema:
          type: string
          default: Data related to the date specified in 'to' if 'from' is not provided. If neither 'from' nor 'to' are provided
            then yesterday's data is returned.
      - name: to
        in: query
        description: Ending UTC Date for which data should be returned.
        example: '2020-08-03'
        schema:
          type: string
          default: Data from the date mentioned in 'from' parameter up to yesterday if 'to' parameter is not provided. Yesterday's
            data is returned if neither 'from' nor 'to' are provided. Yesterday is the latest day the data series will contain.
  /v1/analytics/meetingsMetrics/aggregates:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  siteUrl:
                    type: string
                    example: cisco.webex.com
                    description: Site related to which the data is returned.
                  startDate:
                    type: string
                    example: '2020-08-01'
                    description: UTC start date of the data set.
                  endDate:
                    type: string
                    example: '2020-08-03'
                    description: UTC end date of the data set.
                  metrics:
                    type: object
                    properties:
                      totalMeetings:
                        type: number
                        example: 123
                        description: Total number of meetings held over the selected date range. includes Webex Meetings,
                          Webex Events, Webex Support, and Webex Training sessions
                      totalParticipants:
                        type: number
                        example: 123
                        description: Total number of joins by participant and devices from all Webex meetings over the selected
                          date range
                      totalUniqueHosts:
                        type: number
                        example: 123
                        description: Total number of unique hosts who started at least one webex meeting over the selected
                          date range
                      totalMeetingMinutes:
                        type: number
                        example: 1234
                        description: Total number of minutes for all meetings over selected date range
                      totalAudioMinutes:
                        type: number
                        example: 1234
                        description: Total number of VoIP and telephony minutes used during meetings over the selected date
                          range
                      totalTelephoneMinutes:
                        type: number
                        example: 1234
                      totalVoIPMinutes:
                        type: number
                        example: 1234
                      videoMeetings:
                        type: number
                        example: 123
                        description: Total number of meetings held where at least one participant enabled video for any amount
                          of time
                      sharingMeetings:
                        type: number
                        example: 123
                        description: Total number of meetings held where at least one participant enabled sharing for any
                          amount of time
                      recordingMeetings:
                        type: number
                        example: 123
                        description: Total number of meetings held where at least one participant enable recording for any
                          amount of time
                      participantsByJoinMethods:
                        type: object
                        properties:
                          webApp:
                            type: number
                            example: 123
                          cloudVideoDevice:
                            type: number
                            example: 123
                          mobileMeetingsApp:
                            type: number
                            example: 123
                        description: Participant Count for each join/client type. This list is dynamic and can change
                      participantsByRoles:
                        type: object
                        properties:
                          host:
                            type: number
                            example: 123
                          attendee:
                            type: number
                            example: 123
                        description: Participant Count for each Role
                      participantsByLocation:
                        type: array
                        items:
                          type: object
                          properties:
                            country:
                              type: string
                              example: United States
                            totalParticipants:
                              type: number
                              example: 123
                        description: Participant Count for each Location. This is a json array of countries
              example:
                siteUrl: cisco.webex.com
                startDate: '2020-08-01'
                endDate: '2020-08-03'
                metrics:
                  totalMeetings: 123
                  totalParticipants: 123
                  totalUniqueHosts: 123
                  totalMeetingMinutes: 1234
                  totalAudioMinutes: 1234
                  totalTelephoneMinutes: 1234
                  totalVoIPMinutes: 1234
                  videoMeetings: 123
                  sharingMeetings: 123
                  recordingMeetings: 123
                  participantsByJoinMethods:
                    webApp: 123
                    cloudVideoDevice: 123
                    mobileMeetingsApp: 123
                  participantsByRoles:
                    host: 123
                    attendee: 123
                  participantsByLocation:
                  - country: United States
                    totalParticipants: 123
        '400':
          description: 'Bad Request: The request was invalid or cannot be otherwise served. An accompanying error message
