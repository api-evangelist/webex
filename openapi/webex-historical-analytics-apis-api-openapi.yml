paths:
  /v1/analytics/messagingMetrics/dailyTotals:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  startDate:
                    type: string
                    example: '2020-08-01'
                    description: UTC start date of the data set.
                  endDate:
                    type: string
                    example: '2020-08-03'
                    description: UTC end date of the data set.
                  metrics:
                    type: object
                    properties:
                      dates:
                        type: string
                        example: '[''2020-08-01'',''2020-08-02'']'
                        description: An Array containing the UTC dates for which the data is returned.
                      dailyActiveUsers:
                        type: string
                        example: '[200, 300]'
                        description: An array containing the aggregated values for each day for which the data is returned.
                      totalMessagesSent:
                        type: string
                        example: '[2000, 3000]'
                      deskTopMessagesSent:
                        type: string
                        example: '[289, 456]'
                      mobileMessagesSent:
                        type: string
                        example: '[122, 233]'
                      totalActiveSpaces:
                        type: string
                        example: '[2,3]'
                      groupActiveSpaces:
                        type: string
                        example: '[3,4]'
                      one2oneActiveSpaces:
                        type: string
                        example: '[5,6]'
                      video:
                        type: string
                      sharing:
                        type: object
                        properties:
                          totalFilesShared:
                            type: string
                            example: '[1,2]'
                          fileShareSize:
                            type: string
                            example: '`[6,7]` ## Bytes'
                      recording:
                        type: string
                      audio:
                        type: string
              example:
                startDate: '2020-08-01'
                endDate: '2020-08-03'
                metrics:
                  dates: '[''2020-08-01'',''2020-08-02'']'
                  dailyActiveUsers: '[200, 300]'
                  totalMessagesSent: '[2000, 3000]'
                  deskTopMessagesSent: '[289, 456]'
                  mobileMessagesSent: '[122, 233]'
                  totalActiveSpaces: '[2,3]'
                  groupActiveSpaces: '[3,4]'
                  one2oneActiveSpaces: '[5,6]'
                  video: ''
                  sharing:
                    totalFilesShared: '[1,2]'
                    fileShareSize: '`[6,7]` ## Bytes'
                  recording: ''
                  audio: ''
        '400':
