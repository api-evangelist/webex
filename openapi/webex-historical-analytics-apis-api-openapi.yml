      summary: Historical Data related to Messaging
      operationId: Historical Data related to Messaging
      description: 'Returns daily aggregates of various metrics related to Webex messaging.


        <div><Callout type="error">The base URL for these APIs is **analytics.webexapis.com**, which does not work with the
        **Try It** feature. </Callout></div>'
      tags:
      - Historical Analytics APIs
      parameters:
      - name: from
        in: query
        description: UTC date starting from which the data needs to be returned.
        example: '2020-08-01'
        schema:
          type: string
          default: Data related to the date mentioned in 'to' parameter if 'from' parameter is not provided. If neither 'from'
            nor 'to' are provided then yesterday's data is returned.
      - name: to
        in: query
        description: UTC date up to which the data needs to be returned
        example: '2020-08-03'
        schema:
          type: string
          default: Data from the date mentioned in 'from' parameter up to yesterday if 'to' parameter is not provided. If
            neither 'from' nor 'to' are provided then yesterday's data is returned. Yesterday's data would be the latest data
            returned.
  /v1/analytics/roomDeviceMetrics/dailyTotals:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  startDate:
                    type: string
                    example: '2020-08-01'
                    description: Data is returned starting from this UTC date.
                  endDate:
                    type: string
                    example: '2020-08-03'
                    description: Data is returned up to this UTC date.
                  metrics:
                    type: object
                    properties:
                      dates:
                        type: string
                        example: '[''2020-08-01'',''2020-08-02'']'
                        description: An Array containing the UTC dates for which the data is returned
                      totalActiveDevices:
                        type: string
                        example: '[200,300]'
                        description: An array containing the aggregated values for each day for which the data is returned.
                      totalAssistantCommands:
                        type: string
                        example: '[2,3]'
                      totalUsageHours:
                        type: string
                        example: '[100,100]'
                      incallUsageDuration:
                        type: string
                        example: '[50,50]'
                      signageUsageDuration:
                        type: string
                        example: '[1,1]'
                      usbpassthroughUsageDuration:
                        type: string
                        example: '[1,2]'
                      whiteboardingUsageDuration:
                        type: string
                        example: '[3,4]'
                      video:
                        type: string
                      sharing:
                        type: object
                        properties:
                          localsharingcableUsageDuration:
                            type: string
                            example: '[1,1]'
                          localsharingwirelessUsageDuration:
                            type: string
                            example: '[2,2]'
                      recording:
                        type: string
                      audio:
                        type: string
              example:
                startDate: '2020-08-01'
                endDate: '2020-08-03'
                metrics:
                  dates: '[''2020-08-01'',''2020-08-02'']'
                  totalActiveDevices: '[200,300]'
                  totalAssistantCommands: '[2,3]'
                  totalUsageHours: '[100,100]'
                  incallUsageDuration: '[50,50]'
                  signageUsageDuration: '[1,1]'
                  usbpassthroughUsageDuration: '[1,2]'
                  whiteboardingUsageDuration: '[3,4]'
                  video: ''
                  sharing:
                    localsharingcableUsageDuration: '[1,1]'
                    localsharingwirelessUsageDuration: '[2,2]'
                  recording: ''
                  audio: ''
