      summary: List Wholesale Subscribers
      operationId: List Wholesale Subscribers
      description: Allows a Service Provider to search for their associated subscribers. There are a number of filter options,
        which can be combined in a single request.
      tags:
      - Wholesale Provisioning
      parameters:
      - name: max
        in: query
        description: Limit the maximum number of subscribers returned in the search response, up to 100 per page. Refer to
          the [Pagination](/docs/basics#pagination) section of [Webex REST API Basics](/docs/api/basics).
        example: '10'
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        description: Offset value to implement [pagination](/docs/basics#pagination).
        example: '4'
        schema:
          type: integer
      - name: customerId
        in: query
        description: Wholesale customer ID.
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
        schema:
          type: string
      - name: personId
        in: query
        description: The person ID of the subscriber used in the [/v1/people API](/docs/api/v1/people).
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
        schema:
          type: string
      - name: externalCustomerId
        in: query
        description: Customer external ID.
        example: c1677a16-557a-4fb4-b48f-24adde57ec99
        schema:
          type: string
      - name: email
        in: query
        description: The email address of the subscriber.
        example: john.anderson@acme.com
        schema:
          type: string
      - name: status
        in: query
        description: The provisioning status of the subscriber.
        example: provisioned
        schema:
          type: string
      - name: after
        in: query
        description: Only include subscribers created after this date and time. Epoch time (in milliseconds) preferred, but
          ISO 8601 date format also accepted.
        example: '1579046400245'
        schema:
          type: string
      - name: lastStatusChange
        in: query
        description: Only include subscribers with a provisioning status change after this date and time. Epoch time (in milliseconds)
          preferred, but ISO 8601 date format also accepted.
        example: '1579046400245'
        schema:
          type: string
      - name: sortBy
        in: query
        description: Supported `sortBy` attributes are `created` and `lastStatusChange`. Default is `created`.
        example: userCreationTimestamp
        schema:
          type: string
      - name: sortOrder
        in: query
        description: Sort by `ASC` (ascending) or `DESC` (descending).
        example: ASC
        schema:
          type: string
      - name: onBehalfOfSubPartnerOrgId
        in: query
        description: The encoded organization ID for the sub partner.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wZTE4MmUxNS05ZmNhLTQ0NzgtYmEzOC1jNGFiMmUyN2FlZDA=
        schema:
          type: string
