                              type: number
                              example: 50
                            attendant_console:
                              type: number
                              example: 50
                          description: Packages followed by their respective limits.
                  description: Provisioning parameters are required when updating an existing package.
                subPartnerAdminEmail:
                  type: string
                  example: admin@subpartnerorg.com
