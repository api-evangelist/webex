      - Wholesale Provisioning
      parameters:
      - name: customerId
        in: path
        description: A unique identifier for the customer to be updated.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0VOVEVSUFJJU0UvNTJjZjU3NmQtNjBhOC00MDdhLWIyMmMtNDY3YzUxNTkxOTA4
