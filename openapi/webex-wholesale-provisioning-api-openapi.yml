          description: "The provisioning status of the sub-partner.\n * `active` - Sub-partner can provision new customers\
            \ and subscribers or update, delete existing ones.\n * `suspended` - Sub-partner cannot provision, update customers\
            \ and subscribers but can delete existing ones.\n"
        created:
          type: string
          example: '''2023'
          description: 02-16T14:10:18.855Z' (string) - The date and time the sub-partner was created.
        billingStartDate:
          type: string
          example: '"2023"'
          description: 02-22T13:43:41.117Z' (string) - The date and time from which new billing for the sub-partner started.
    Customer:
      type: object
      properties:
        id:
          type: string
          example: '''Y2lzY29zcGFyazovL3VzL0VOVEVSUFJJU0UvNTJjZjU3NmQtNjBhOC00MDdhLWIyMmMtNDY3YzUxNTkxOTA4'''
          description: A unique Cisco identifier for the customer. This value should be used for the `customerId` parameter
            in the Wholesale Customers and Wholesale Subscribers API.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
          description: The Organization ID of the enterprise on Cisco Webex, to be used when referencing this customer on
            other Cisco Webex APIs. Only presented when status is `provisioned`.
        externalId:
          type: string
          example: c1677a16-557a-4fb4-b48f-24adde57ec99
          description: External ID of the Customer.
        address:
          $ref: '#/components/schemas/Address'
        status:
          type: string
          enum:
          - provisioned
          - provisioned_with_errors
          - provisioning
          - updating
          - deleting
          - error
          - pending_rpl_review
          description: "The provisioning status of the customer.\n * `provisioned` - Customer is fully provisioned on Cisco\
            \ Webex.\n * `provisioned_with_errors` - Customer is provisioned with errors.\n * `provisioning` - Customer is\
            \ provisioning.\n * `updating` - Customer is updating.\n * `deleting` - Customer is being deleted.\n * `error`\
            \ - An error occurred provisioning the customer on Cisco Webex.\n * `pending_rpl_review` - The customer is pending\
            \ a Denied Party List compliance check.\n"
        packages:
          type: array
          items:
            $ref: '#/components/schemas/WholesalePackagesCustomer'
          description: List of package names provisioned
        resourceDetails:
          $ref: '#/components/schemas/ResourceDetails'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: "List of errors that occurred during that last attempt to provision/update this customer.\n\n *Note:*\n\
            \n+ This list captures errors that occurred during *asynchronous or background* provisioning of the customer,\
            \ *after* the API has been accepted and 202 response returned.\n\n+ Any errors that occur during initial API request\
            \ validation will be captured directly in error response with appropriate HTTP status code."
