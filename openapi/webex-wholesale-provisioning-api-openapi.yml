      summary: Provision a Wholesale Subscriber
      operationId: Provision a Wholesale Subscriber
      description: 'Provision a new Wholesale subscriber for Cisco Webex services.


        This API allows a Service Provider to map the Wholesale subscriber to a Cisco Webex Wholesale customer and assign
        the required licenses and entitlements for Webex, Calling and Meetings.


        **Note:**


        * If this subscriber is an existing Webex Calling entitled user, the `locationId`, `primaryPhoneNumber` and `extension`
        are optional and if provided are ignored.


        **packages Note:**


        * `attendant_console` is dependent on: `webex_calling`, `webex_suite`, `cx_essentials`, `webex_voice`


        <div>

        <Callout type=''info''>

        Either `packages` or `package` field is required but not both.

        </Callout>

        </div>'
      tags:
      - Wholesale Provisioning
      parameters:
      - name: onBehalfOfSubPartnerOrgId
        in: query
        description: The encoded organization ID for the sub partner.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wZTE4MmUxNS05ZmNhLTQ0NzgtYmEzOC1jNGFiMmUyN2FlZDA=
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              customerId: ZjViMzYxODctYzhkZC00NzI3LThiMmYtZjljNDQ3ZjI5MDQ2OjQyODVmNTk0LTViNTEtNDdiZS05Mzk2LTZjMzZlMmFkODNhNQ
              email: john.anderson@acme.com
              packages:
              - webex_calling
              provisioningParameters:
                firstName: John
                lastName: Andersen
                primaryPhoneNumber: '+12405551212'
                extension: '51212'
                locationId: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzAxMjM0NTY3LTg5YWItY2RlZi0wMTIzLTQ1Njc4OWFiY2RlZg==
            schema:
              type: object
              required:
              - customerId
              - email
              - provisioningParameters
              properties:
                customerId:
                  type: string
                  example: ZjViMzYxODctYzhkZC00NzI3LThiMmYtZjljNDQ3ZjI5MDQ2OjQyODVmNTk0LTViNTEtNDdiZS05Mzk2LTZjMzZlMmFkODNhNQ
                  description: ID of the Provisioned Customer for Webex Wholesale.
                email:
                  type: string
                  example: john.anderson@acme.com
                  description: The email address of the subscriber (mandatory for the trusted email provisioning flow).
                package:
                  type: string
                  enum:
                  - webex_calling
                  - webex_meetings
                  - webex_suite
                  - webex_voice
                  - cx_essentials
                  - webex_calling_standard
                  description: "The Webex Wholesale package to be assigned to the subscriber. **NOTE:** This parameter will\
                    \ be deprecated soon. Please\n\nuse `packages` instead.\n * `webex_calling` - Calling Basic Package.\n\
                    \ * `webex_meetings` - Meetings Package.\n * `webex_suite` - Suite Package.\n * `webex_voice` - Voice\
                    \ Package.\n * `cx_essentials` - Customer Assist Package.\n * `webex_calling_standard` - Webex Calling\
                    \ Standard Package.\n"
                packages:
                  type: array
                  items:
                    $ref: '#/components/schemas/WholesalePackagesSubscriber'
                  description: The complete list of Webex Wholesale packages assigned to the subscriber. Currently accepts
                    only one package in the list.
                provisioningParameters:
                  type: object
                  properties:
                    firstName:
                      type: string
                      example: '"John"'
                      description: The first name of the subscriber.
                    lastName:
                      type: string
                      example: '"Andersen"'
                      description: The last name of the subscriber.
                    primaryPhoneNumber:
                      type: string
                      example: '"+12405551212"'
                      description: The primary phone number configured for the subscriber. A primary phone number, extension,
                        or both must be supplied when assigning a calling-enabled package, unless the subscriber is an existing
                        Webex Calling entitled user.
                    extension:
                      type: string
                      example: '"51212"'
                      description: The extension configured for the subscriber. An extension, primary phone number or both
                        must be supplied when assigning a calling-enabled package, unless the subscriber is an existing Webex
                        Calling entitled user.
                    locationId:
                      type: string
                      example: '"Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzAxMjM0NTY3LTg5YWItY2RlZi0wMTIzLTQ1Njc4OWFiY2RlZg=="'
                      description: A unique identifier for the location. This ID should be retrieved via the [List Locations](/docs/api/v1/locations/list-locations)
                        API.
