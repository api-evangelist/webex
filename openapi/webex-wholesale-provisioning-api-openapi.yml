      summary: Update a Wholesale Customer
      operationId: Update a Wholesale Customer
      description: "Updates certain details of a provisioned Wholesale customer for Cisco Webex services.\n\nThe Wholesale\
        \ customer provisioning is asynchronous and thus a background task is created when this endpoint is invoked.\n\n**packages\
        \ Note:**\n\n* `cisco_calling_plan` is dependent on: `common_area_calling`, `webex_calling`, `webex_suite`, `webex_voice`,\
        \ `cx_essentials`, `webex_calling_standard`\n\n* `attendant_console` is dependent on: `webex_calling`, `webex_suite`,\
        \ `cx_essentials`, `webex_voice`\n\n<div>\n        <Callout type='info'>After successful invocation of this endpoint\
        \ a URL will be returned in the `Location` header, which will point to the [Get a Wholesale Customer](/docs/api/v1/wholesale-provisioning/get-a-wholesale-customer)\
        \ endpoint for this customer.</Callout>\n</div>"
