                              description: Determine language for all generated emails and voice announcements.
                            emergencyLocationIdentifier:
                              type: string
                              example: '"95547321"'
                              description: SIP Header for any emergency calls from this location.
                    meetings:
                      type: object
                      properties:
                        timezone:
                          type: string
                          example: '"America/Los_Angeles"'
                          description: Customer timezone for meetings package.
                    packages:
                      type: object
                      properties:
                        limits:
                          type: object
                          properties:
                            webex_calling:
                              type: number
                              example: 50
                            common_area_calling:
                              type: number
                              example: 50
                            webex_meetings:
                              type: number
                              example: 50
                            webex_suite:
