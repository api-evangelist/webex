      summary: Update a Wholesale Subscriber
      operationId: Update a Wholesale Subscriber
      description: 'Updates certain details of a provisioned Wholesale subscriber.


        **Note:**


        * The `provisioningParameters` attributes should only be supplied when changing from the webex_meetings package to
        any calling-enabled package.


        * Even in that scenario, if this subscriber is an existing Webex Calling entitled user, these attributes are optional
        and if provided are ignored.


        **packages Note:**


        * `attendant_console` is dependent on: `webex_calling`, `webex_suite`, `cx_essentials`, `webex_voice`


        <div>

        <Callout type=''info''>

        Either `packages` or `package` field is required but not both.

        </Callout>

        </div>'
      tags:
      - Wholesale Provisioning
      parameters:
      - name: subscriberId
        in: path
        description: A unique identifier for the subscriber in question.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1NVQlNDUklCRVIvNjk3MGU2YmItNzQzOS00ZmZiLWFkMzQtZDNmZjAxNjdkZGFk
        schema:
          type: string
