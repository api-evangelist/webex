      summary: Precheck a Wholesale Subscriber Provisioning
      operationId: Precheck a Wholesale Subscriber Provisioning
      description: 'Allows the Partner sales team to verify likely success of provisioning a wholesale subscriber.

        **packages Note:**


        * `attendant_console` is dependent on: `webex_calling`, `webex_suite`, `cx_essentials`, `webex_voice`


        <div>

        <Callout type=''info''>

        The Prerequisite for using this API is to have `wxc-wholesale` entitlement or `webex-wholesale-partner-testing` setting
        enabled for the Partner Organization. The Provisioning Precheck APIs supports three variants of Wholesale Subscriber
        Provisioning Precheck Requests. Please refer to [Using the Provisioning Precheck API](/docs/api/guides/webex-for-wholesale#using-the-precheck-provisioning-api)
        section in [Webex for Wholesale](/docs/api/guides/webex-for-wholesale) guide for more information.

        </Callout>

        </div>


        <div>

        <Callout type=''info''>

        Either `packages` or `package` field is required but not both.

        </Callout>

        </div>'
      tags:
      - Wholesale Provisioning
      parameters:
      - name: onBehalfOfSubPartnerOrgId
        in: query
        description: The encoded organization ID for the sub partner.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wZTE4MmUxNS05ZmNhLTQ0NzgtYmEzOC1jNGFiMmUyN2FlZDA=
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              customerId: ZjViMzYxODctYzhkZC00NzI3LThiMmYtZjljNDQ3ZjI5MDQ2OjQyODVmNTk0LTViNTEtNDdiZS05Mzk2LTZjMzZlMmFkODNhNQ
              email: alice.anderson@acme.com
            schema:
              type: object
              required:
              - email
              properties:
                provisioningId:
                  type: string
                  example: ZjViMzYxODctYzhkZC00NzI3LThiMmYtZjljNDQ3ZjI5MDQ2
                  description: 'Defines how this wholesale subscriber is to be provisioned for Cisco Webex Services.


                    Each Customer template has its unique provisioning ID. This ID is displayed under the chosen customer
                    template on Cisco Webex Control Hub.'
                customerId:
                  type: string
                  example: ZjViMzYxODctYzhkZC00NzI3LThiMmYtZjljNDQ3ZjI5MDQ2OjQyODVmNTk0LTViNTEtNDdiZS05Mzk2LTZjMzZlMmFkODNhNQ
                  description: ID of the Provisioned Customer for Webex Wholesale.
                email:
                  type: string
                  example: john.anderson@acme.com
                  description: The email address of the subscriber.
                package:
                  type: string
                  enum:
                  - webex_calling
                  - webex_meetings
                  - webex_suite
                  - webex_voice
                  - cx_essentials
                  - webex_calling_standard
                  description: "The Webex Wholesale package to be assigned to the subscriber. **NOTE:** This parameter will\
                    \ be deprecated soon. Please\n\nuse `packages` instead.\n * `webex_calling` - Calling Basic Package.\n\
                    \ * `webex_meetings` - Meetings Package.\n * `webex_suite` - Suite Package.\n * `webex_voice` - Voice\
                    \ Package.\n * `cx_essentials` - Customer Assist Package.\n * `webex_calling_standard` - Webex Calling\
                    \ Standard Package.\n"
                packages:
                  type: array
                  items:
                    $ref: '#/components/schemas/WholesalePackagesSubscriber'
                  description: The complete list of Webex Wholesale packages assigned to the subscriber. Currently accepts
                    only one package in the list.
                provisioningParameters:
                  type: object
                  properties:
                    firstName:
                      type: string
                      example: '"John"'
                      description: The first name of the subscriber.
                    lastName:
                      type: string
                      example: '"Andersen"'
                      description: The last name of the subscriber.
                    primaryPhoneNumber:
                      type: string
                      example: '"+12405551212"'
                      description: The primary phone number configured for the subscriber.
                    extension:
                      type: string
                      example: '"51212"'
                      description: The extension configured for the subscriber. An extension, primary phone number or both
                        must be supplied when creating a subscriber.
                    locationId:
                      type: string
                      example: '"Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzAxMjM0NTY3LTg5YWItY2RlZi0wMTIzLTQ1Njc4OWFiY2RlZg=="'
                      description: A unique identifier for the location. This ID should be retrieved via the Locations API
                        - List Locations.
                customerInfo:
                  type: object
                  required:
                  - primaryEmail
                  properties:
                    primaryEmail:
                      type: string
                      example: '"john.anderson@acme.com"'
                      description: The primary email address of the customer.
