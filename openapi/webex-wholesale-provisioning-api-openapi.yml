      summary: Provision a Wholesale Customer
      operationId: Provision a Wholesale Customer
      description: "Provision a Wholesale customer for Cisco Webex services.\n\nThis API will allow a Service Provider to\
        \ map the Wholesale customer and assign the required licenses and entitlements for Webex, Calling and Meetings.\n\n\
        The Wholesale customer provisioning is asynchronous and thus a background task is created when this endpoint is invoked.\n\
        \n**packages Note:**\n\n* `cisco_calling_plan` is dependent on: `common_area_calling`, `webex_calling`, `webex_suite`,\
        \ `webex_voice`, `cx_essentials`, `webex_calling_standard`\n\n* `attendant_console` is dependent on: `webex_calling`,\
        \ `webex_suite`, `cx_essentials`, `webex_voice`\n\n<div>\n        <Callout type='info'>After successful invocation\
        \ of this endpoint a URL will be returned in the `Location` header, which will point to the [Get a Wholesale Customer](/docs/api/v1/wholesale-provisioning/get-a-wholesale-customer)\
        \ endpoint for this customer.</Callout>\n</div>"
      tags:
      - Wholesale Provisioning
      parameters:
      - name: onBehalfOfSubPartnerOrgId
        in: query
        description: The encoded organization ID for the sub partner.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8wZTE4MmUxNS05ZmNhLTQ0NzgtYmEzOC1jNGFiMmUyN2FlZDA=
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              provisioningId: ZjViMzYxODctYzhkZC00NzI3LThiMmYtZjljNDQ3ZjI5MDQ2
              packages:
              - common_area_calling
              orgId: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi81MmNmNTc2ZC02MGE4LTQwN2EtYjIyYy00NjdjNTE1OTE5MDg
              externalId: c1677a16-557a-4fb4-b48f-24adde57ec99
              address:
                addressLine1: '"771 Alder Drive"'
                addressLine2: '"Cisco Site 5"'
                city: '"Milpitas"'
                stateOrProvince: '"CA"'
                zipOrPostalCode: '"95035"'
                country: '"US"'
              customerInfo:
                name: '"John''s Pizza"'
                primaryEmail: '"john.anderson@acme.com"'
                adminFirstName: '"John"'
                adminLastName: '"Anderson"'
                language: '''en'''
              provisioningParameters:
                calling:
                  location:
                    name: '"Head Office"'
                    address:
                      addressLine1: '"771 Alder Drive"'
                      addressLine2: '"Cisco Site 5"'
                      city: '"Milpitas"'
                      stateOrProvince: '"CA"'
                      zipOrPostalCode: '"95035"'
                      country: '"US"'
                    timezone: '"America/Los_Angeles"'
                    language: '"en_us"'
                    emergencyLocationIdentifier: '"95547321"'
                meetings:
                  timezone: '"America/Los_Angeles"'
                packages:
                  limits:
                    webex_calling: 50
                    common_area_calling: 50
                    webex_meetings: 50
                    webex_suite: 50
                    webex_voice: 50
                    cx_essentials: 50
                    webex_calling_standard: 50
                    attendant_console: 50
              subPartnerAdminEmail: admin@subpartnerorg.com
            schema:
              type: object
              required:
              - provisioningId
              - packages
              - externalId
              - address
              properties:
                provisioningId:
                  type: string
                  example: ZjViMzYxODctYzhkZC00NzI3LThiMmYtZjljNDQ3ZjI5MDQ2
                  description: 'This Provisioning ID defines how this customer is to be provisioned for Webex Services.


                    Each Customer Template will have their own unique Provisioning ID. This ID will be displayed under the
                    chosen Customer Template

                    on [Webex Control Hub](https://admin.webex.com).'
                packages:
                  type: array
                  items:
                    $ref: '#/components/schemas/WholesalePackagesCustomer'
                  description: The complete list of Webex Wholesale packages to be assigned to the customer.
                orgId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi81MmNmNTc2ZC02MGE4LTQwN2EtYjIyYy00NjdjNTE1OTE5MDg
                  description: The organization ID of the enterprise in Webex. Mandatory for existing customers.
                externalId:
                  type: string
                  example: c1677a16-557a-4fb4-b48f-24adde57ec99
                  description: External ID of the Wholesale customer.
                address:
                  type: object
                  required:
                  - addressLine1
                  - city
                  - country
                  properties:
                    addressLine1:
                      type: string
                      example: '"771 Alder Drive"'
                      description: Address line 1.
                    addressLine2:
                      type: string
                      example: '"Cisco Site 5"'
                      description: Address line 2.
                    city:
                      type: string
                      example: '"Milpitas"'
                      description: Customer's city.
                    stateOrProvince:
                      type: string
                      example: '"CA"'
                      description: State or Province of the customer. This attribute may be required in specific geographies,
                        please refer to address section in the admin guide for more information.
                    zipOrPostalCode:
                      type: string
                      example: '"95035"'
                      description: Postal/Zip code of the customer. This attribute may be required in specific geographies,
                        please refer to address section in the admin guide for more information.
                    country:
                      type: string
                      example: '"US"'
                      description: ISO2 country code of the customer size = 2. This attribute is used to determine the default
                        Dial In number for the Webex Meeting Sites. Refer to the Address section of [help page](https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/cloudCollaboration/wholesale_rtm/wbxbw_b_wholesale-rtm-solution-guide/wbxbw_m_overview-of-webex-wholesale.html#Cisco_Reference.dita_7875bb3e-10c0-4214-8173-7845db31c7a6)
                        for more information.
                  description: Billing Address of the customer. (There is a 50 character limit on each address line)
                customerInfo:
                  type: object
                  required:
                  - name
                  - primaryEmail
                  properties:
                    name:
                      type: string
                      example: '"John''s Pizza"'
                      description: The name of the Wholesale customer. Name cannot include the "%" character.
                    primaryEmail:
                      type: string
                      example: '"john.anderson@acme.com"'
                      description: The primary email address of the customer.
                    adminFirstName:
                      type: string
                      example: '"John"'
                      description: The first name of the customer administrator.
                    adminLastName:
                      type: string
                      example: '"Anderson"'
                      description: The last name of the customer administrator.
                    language:
                      type: string
                      example: '''en'''
                      description: The {ISO-639-1}_{ISO-3166} or {ISO-639-1} locale or language code used as preferred language
                        for organization and Webex Meeting Sites. Refer to the [help page](https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/cloudCollaboration/wholesale_rtm/wbxbw_b_wholesale-rtm-solution-guide/wbxbw_m_overview-of-webex-wholesale.html#Cisco_Reference.dita_deb994cb-9c48-4488-b352-54495c54ba1e)
                        for more information.
                  description: Mandatory for new customer. Optional if Organization ID is provided.
                provisioningParameters:
                  type: object
                  properties:
                    calling:
                      type: object
                      required:
                      - location
                      properties:
                        location:
                          type: object
                          required:
                          - name
                          - address
                          - timezone
                          - language
                          properties:
                            name:
                              type: string
                              example: '"Head Office"'
                              description: Name of the wholesale customer office.
                            address:
                              type: object
                              required:
                              - addressLine1
                              - city
                              - country
                              properties:
                                addressLine1:
                                  type: string
                                  example: '"771 Alder Drive"'
                                addressLine2:
                                  type: string
                                  example: '"Cisco Site 5"'
                                city:
                                  type: string
                                  example: '"Milpitas"'
                                stateOrProvince:
                                  type: string
                                  example: '"CA"'
                                  description: State or Province of the customer in ISO 3166 format. This attribute may be
                                    required in specific geographies, please refer to address section in the admin guide for
                                    more information.
                                zipOrPostalCode:
                                  type: string
                                  example: '"95035"'
                                  description: Postal/Zip code of the customer. This attribute may be required in specific
                                    geographies, please refer to address section in the admin guide for more information.
                                country:
                                  type: string
                                  example: '"US"'
                              description: Address of the wholesale customer. (There is a 50 character limit on each address
                                line)
                            timezone:
                              type: string
                              example: '"America/Los_Angeles"'
                              description: Customer timezone for calling package. The full list of supported timezones can
                                be found at [List of Time Zones for Wholesale Provisioning](https://help.webex.com/en-us/article/nuh0amab/List-of-Time-Zones-for-Wholesale-Provisioning).
                            language:
                              type: string
                              example: '"en_us"'
                              description: Determine language for all generated emails and voice announcements.
                            emergencyLocationIdentifier:
                              type: string
                              example: '"95547321"'
                              description: SIP Header for any emergency calls from this location.
                      description: Mandatory when provisioning calling packages.
                    meetings:
                      type: object
                      properties:
                        timezone:
                          type: string
                          example: '"America/Los_Angeles"'
                          description: Customer timezone for meetings package.
                    packages:
                      type: object
                      properties:
                        limits:
                          type: object
                          properties:
                            webex_calling:
                              type: number
                              example: 50
                            common_area_calling:
                              type: number
                              example: 50
                            webex_meetings:
                              type: number
                              example: 50
                            webex_suite:
                              type: number
                              example: 50
                            webex_voice:
                              type: number
                              example: 50
                            cx_essentials:
                              type: number
                              example: 50
                            webex_calling_standard:
                              type: number
                              example: 50
                            attendant_console:
                              type: number
                              example: 50
                          description: Packages followed by their respective limits.
                subPartnerAdminEmail:
                  type: string
                  example: admin@subpartnerorg.com
                  description: The email of the sub partner organization admin.
