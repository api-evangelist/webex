                addressLine1: '"771 Alder Drive"'
                addressLine2: '"Cisco Site 5"'
                city: '"Milpitas"'
                stateOrProvince: '"CA"'
                zipOrPostalCode: '"95035"'
                country: '"US"'
              provisioningParameters:
                calling:
                  location:
                    name: '"Head Office"'
                    address:
                      addressLine1: '"771 Alder Drive"'
                      addressLine2: '"Cisco Site 5"'
                      city: '"Milpitas"'
                      stateOrProvince: '"CA"'
                      zipOrPostalCode: '"95035"'
                      country: '"US"'
                    timezone: '"America/Los_Angeles"'
                    language: '"en_us"'
                    emergencyLocationIdentifier: '"95547321"'
                meetings:
                  timezone: '"America/Los_Angeles"'
                packages:
                  limits:
                    webex_calling: 50
                    common_area_calling: 50
                    webex_meetings: 50
                    webex_suite: 50
                    webex_voice: 50
                    cx_essentials: 50
                    webex_calling_standard: 50
                    attendant_console: 50
              subPartnerAdminEmail: admin@subpartnerorg.com
            schema:
              type: object
              required:
              - packages
