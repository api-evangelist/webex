                    $ref: '#/components/schemas/WholesalePackagesCustomer'
                  description: The complete list of Webex Wholesale packages to be assigned to the customer, including any
                    packages already provisioned. If a package has already been assigned to this customer and is not present
                    in this list, then that package is removed.
                address:
                  type: object
                  required:
                  - addressLine1
                  - city
                  - country
                  properties:
                    addressLine1:
                      type: string
                      example: '"771 Alder Drive"'
                      description: Address line 1.
                    addressLine2:
                      type: string
                      example: '"Cisco Site 5"'
                      description: Address line 2.
                    city:
                      type: string
                      example: '"Milpitas"'
                      description: Customer's city.
                    stateOrProvince:
                      type: string
                      example: '"CA"'
                      description: State or Province of the customer. This attribute may be required in specific geographies,
                        please refer to address section in the admin guide for more information.
                    zipOrPostalCode:
                      type: string
                      example: '"95035"'
                      description: Postal/Zip code of the customer. This attribute may be required in specific geographies,
