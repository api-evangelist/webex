      summary: List Hybrid Connectors
      operationId: List Hybrid Connectors
      description: 'List hybrid connectors for an organization. If no `orgId` is specified, the default is the organization of the authenticated user.


        Only an admin auth token with the `spark-admin:hybrid_connectors_read` scope can list connectors.'
      tags:
      - Hybrid Connectors
      parameters:
      - name: orgId
        in: query
        description: List hybrid connectors in this organization. If an organization is not specified, the organization of the caller will be used.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
  /hybrid/connectors/{connectorId}:
