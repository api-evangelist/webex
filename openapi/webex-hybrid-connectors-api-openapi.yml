      summary: Get Hybrid Connector Details
      operationId: Get Hybrid Connector Details
      description: 'Shows details for a hybrid connector, by ID.


        Only an admin auth token with the `spark-admin:hybrid_connectors_read` scope can see connector details.'
      tags:
      - Hybrid Connectors
      parameters:
      - name: connectorId
        in: path
        description: The ID of the connector.
        required: true
        example: Y2lZY76123
        schema:
          type: string
components:
  schemas:
    AlarmSeverity:
      type: string
      enum:
      - critical
      - warning
      - alert
      - error
    ConnectorType:
      type: string
      enum:
      - expresswayManagement
      - calendar
      - call
      - message
      - expresswayServiceability
      - ecpServiceability
      - videoMesh
      - dataSecurity
      - care
      - careManagement
    Connector:
      type: object
      properties:
        id:
          type: string
          example: Y2lZY76123
          description: A unique identifier for the connector.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3
          description: The ID of the organization to which this hybrid connector belongs.
        hybridClusterId:
          type: string
          example: Y2lZY76123abbb
          description: The ID of the cluster this connector belongs to.
        hostname:
          type: string
          example: foo.example.org
          description: The hostname of the system the connector is running on.
        status:
          $ref: '#/components/schemas/ConnectorStatus'
          description: 'The status of the connector:


            - `operational` indicates that the connector is working as it should.


            - `impaired` indicates that the connector has problems with one or more dependent components.


            - `outage` indicates that the connector is completely non-functional.


            - `maintenanceMode` reports the current maintenance mode state of the connector.'
        created:
          type: string
          example: '2017-09-15T15:53:00Z'
          description: The date and time the connector was created.
        type:
          $ref: '#/components/schemas/ConnectorType'
          description: The type of connector.
        version:
          type: string
          example: 1.9_foo_zz
          description: The version of the software installed.
        alarms:
          type: array
          items:
            $ref: '#/components/schemas/Alarm'
          description: A list of alarms raised on the connector.
    ConnectorStatus:
      type: string
      enum:
      - operational
      - impaired
      - outage
      - maintenanceMode
    Alarm:
      type: object
      properties:
        id:
          type: string
          example: Y2lZY76123af234bbYY
          description: A unique identifier for the alarm.
        created:
          type: string
          example: '2017-09-15T15:53:00Z'
          description: The date and time the alarm was raised.
        severity:
          $ref: '#/components/schemas/AlarmSeverity'
          description: 'The severity level of the alarm:


            - `critical`


            - `error`


            - `warning`


            - `alert`'
        title:
          type: string
          example: Something is wrong
          description: The title of the alarm.
        description:
          type: string
          example: More detail about something being wrong
          description: A description of the alarm.
        hybridConnectorId:
          type: string
          example: Y2lZY76123af234bb
          description: The ID of the connector the alarm is raised on.
    ConnectorCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connector'
          description: An array of hybrid connector objects.
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 Bearer token authentication
      flows:
        authorizationCode:
          authorizationUrl: https://webexapis.com/v1/authorize
          tokenUrl: https://webexapis.com/v1/access_token
          scopes:
            spark:applications_token: Create access tokens for Service Apps
