  /v2/tasks:
    post:
      tags:
      - Tasks
      summary: Create Task
      description: 'This feature is currently in Beta. Contact your Cisco team if you want access to this feature.


        Creates a new contact center task using the v2 task contract. The request body must include a `channelType` discriminator
        to select the task variant — `workItem` for structured form tasks, `customMessaging` for conversational messaging
        tasks, or `telephony` for voice tasks.


        On success, returns a `201` response containing the task ID, which can be used to track the task lifecycle.


        Requires `cjp:task_write` OAuth scope. For partner-initiated inbound tasks (`workItem`, `customMessaging`), the `cjp:task_write`
        scope must be present in the partner application''s access token. When an authenticated agent initiates an outdial
        (`telephony`) task, ensure the `cjp:task_write` scope is included in the agent''s access token.'
      operationId: createTaskRouteV2
      parameters:
      - name: Authorization
        in: header
        description: Bearer token used to authorize the request.
        required: true
        schema:
          type: string
        example: Bearer <AuthToken>
      requestBody:
        description: Request body to create a v2 task.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequestV2'
            examples:
              workItem:
                summary: Create a workItem task
                value:
                  origin:
                    id: customer@domain.com
                    name: Customer Name
                  destination:
                    id: customer-support@biz.com
                    type: businessAddress
                  channelType: workItem
                  channel: support-form
                  channelParams:
                    type: work-item-form
                    message:
                      aliasId: msg-001
                      workItemData:
                        name: customer name
                        email: customer@domain.com
                      timestamp: 1732786800000
              telephony:
                summary: Create a telephony (callback) task
                value:
                  origin:
                    id: '+18000000000'
                    name: null
                  destination:
                    id: '+19780000000'
                    type: dialNumber
                  channelType: telephony
                  channelParams:
                    type: telephony
                    entryPointId: aef6455f-ccd6-4261-bb00-e80f845c01b0
                    outboundType: CALLBACK
                    callback:
                      type: immediate
                      origin: web
                      number: '+19780000000'
              customMessagingText:
                summary: Create a customMessaging task (text only)
                value:
                  origin:
                    id: customer@example.com
                    name: Customer Name
                  destination:
                    id: support@channel.biz
                    type: businessAddress
                  channelType: customMessaging
                  channel: my-custom-channel
                  channelParams:
                    type: text
                    message:
                      aliasId: 123e4567-e89b-12d3-a456-426614174000
                      text: Hello, I need help with my order.
                      timestamp: 1732786800000
              customMessagingWithAttachments:
                summary: Create a customMessaging task (text with attachments)
                value:
                  origin:
                    id: customer@example.com
                    name: Customer Name
                  destination:
                    id: support@channel.biz
                    type: businessAddress
                  channelType: customMessaging
                  channel: my-custom-channel
                  channelParams:
                    type: text-with-attachments
                    message:
                      aliasId: 123e4567-e89b-12d3-a456-426614174001
                      text: Please see the attached screenshot.
                      attachments:
                      - fileName: screenshot.png
                        mimeType: image/png
                        fileUrl: https://cdn.example.com/files/screenshot.png
                      timestamp: 1732786800000
        required: true
      responses:
        '201':
          description: The new task was successfully requested for creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTaskResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized, Token is Invalid
        '403':
          description: Forbidden Request
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
  /v2/tasks/{taskId}/messages:
    post:
      tags:
      - Tasks
      summary: Append Task Message
      description: 'This feature is currently in Beta. Contact your Cisco team if you want access to this feature.


        Appends an inbound message to an existing `workItem` or `customMessaging` task. Use this API after the initial task
        has been created through Create Task. Requires `cjp:task_write` OAuth scope. For partner-initiated inbound message
        appends, the `cjp:task_write` scope must be present in the partner application''s access token.


        On success, returns a `202` response containing the append event identifier as `data.id`. Partners can use this identifier
        to correlate subsequent webhook delivery for the appended message.'
      operationId: appendTaskMessageV2
      parameters:
      - name: Authorization
        in: header
        description: Bearer token used to authorize the request.
        required: true
        schema:
          type: string
        example: Bearer <AuthToken>
      - name: taskId
        in: path
        description: UUID of the existing task to which the message will be appended.
        required: true
        schema:
          type: string
          format: uuid
        example: 044ea619-a0ad-41a3-9ed9-c2563a9bd6b7
      requestBody:
        description: Request body to append a message to an existing `workItem` or `customMessaging` task.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMessageRequest'
            examples:
              workItem:
                summary: Append a workItem message
                value:
                  mediaType: workItem
                  channelParams:
                    type: work-item-form
                    message:
                      aliasId: alias-wi-001
                      workItemData:
                        name: customer name
                        email: customer@domain.com
                      timestamp: 1732786800000
              customMessagingText:
                summary: Append a customMessaging text message
                value:
                  mediaType: customMessaging
                  channelParams:
                    type: text
                    message:
                      aliasId: 123e4567-e89b-12d3-a456-426614174000
                      text: I have additional details to share.
                      timestamp: 1732786800000
              customMessagingWithAttachments:
                summary: Append a customMessaging message with attachments
                value:
                  mediaType: customMessaging
                  channelParams:
                    type: text-with-attachments
                    message:
                      aliasId: 123e4567-e89b-12d3-a456-426614174001
                      text: Please review the attached files.
                      attachments:
                      - fileName: details.pdf
                        mimeType: application/pdf
                        fileUrl: https://cdn.example.com/files/details.pdf
                      timestamp: 1732786800000
        required: true
      responses:
        '202':
          description: Accepted. The response returns the append event identifier in `data.id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMessageResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized, Token is Invalid
        '403':
          description: Forbidden Request
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
components:
  schemas:
    WorkItemForm:
      type: object
      description: Work item message payload.
      required:
      - aliasId
      - workItemData
      - timestamp
      properties:
        aliasId:
          type: string
          description: Identifier of the work item message.
          example: msg-001
        workItemData:
          type: object
          description: Structured key-value payload for the work item form. Maximum 50 entries; keys up to 100 UTF-8 bytes,
            values up to 1024 UTF-8 bytes.
          maxProperties: 50
          additionalProperties:
            type: string
          example:
            name: customer name
            email: customer@domain.com
        timestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp in milliseconds representing when the work item was originated.
          example: 1732786800000
    TaskAttributes:
      required:
      - channelType
      - createdTime
      - lastUpdatedTime
      - owner
      - queue
      - status
      type: object
      properties:
        owner:
          $ref: '#/components/schemas/TaskOwner'
        queue:
          $ref: '#/components/schemas/TaskQueue'
        channelType:
          type: string
          description: Task channel type(s) permitted in the response. Must be lowercase. By default, there is no channel
            type filtering.
          example: email
        status:
          type: string
          description: Current status of the task.
          example: created
          enum:
          - created
          - queued
          - offered
          - assigned
          - abandoned
          - completed
        createdTime:
          type: integer
          description: Created time of the task (epoch milliseconds).
          format: int64
          example: 1591702170000
        lastUpdatedTime:
          type: integer
          description: Last updated time of the task (epoch milliseconds). Updates whenever the underlying data is modified,
            even if the Task view of the data is the same. May also update after task "closure", so not suitable for finding
            a task's "closed time"
          format: int64
          example: 1591712170099
        captureRequested:
          type: boolean
          description: Whether a capture has been requested for this Task. If this is true, a capture should eventually be
            available. False indicates no capture will be made available. If null, it is not yet known whether a capture has
            been requested.
          example: false
        origin:
          type: string
          description: Customer's channel-specific identifier. For telephony, this is the phone number. For email and chat,
            this is the email address.
          example: chatuser@email.com
        destination:
          type: string
          description: Destination the customer contacted. For telephony, this is the number the contact called. For chat,
            this is the URL of the page where the chat takes place. For email, it is the email address contacted.
          example: '+18005555555'
        direction:
          type: string
          description: Indicates which party initiated the Task. If "inbound", call was initiated by customer. If "outbound",
            was initiated by system as part of campaign. If "outdial", was initiated by an agent.
          example: inbound
        reasonCode:
          type: string
          description: Reason code specified by customer to indicate main aim of the task
          example: Credit
      description: Attributes of the task.
    WorkItemAppendTaskRequest:
      title: WorkItem
      type: object
      description: Request body to append an inbound `workItem` message to an existing task.
      required:
      - mediaType
      - channelParams
      properties:
        mediaType:
          type: string
          enum:
          - workItem
          description: Media type for this request. Must be `workItem`.
          example: workItem
        channelParams:
          $ref: '#/components/schemas/WorkItemParams'
    ConferenceResourceRequest:
      description: Request body for a conference.
      properties:
        agentId:
          description: The unique Id of the user logged in as an agent.
          type: string
          format: UUID
          example: 315fbb91-2288-427c-9588-ec764cd46ea4
        to:
          description: The destination ID to consult, maximum length 36 characters.
          type: string
          example: 315fbb91-2288-427c-9588-ec764cd46ea4
        destinationType:
          description: The user can consult to another user in the team(```agent```), dial number(```dialNumber```), entry
            point(```entryPoint```).
          type: string
          example: agent
      required:
      - to
      type: object
    Telephony:
      type: object
      description: 'Request body to create an outbound `telephony` task routed through a configured entry point. `entryPointId`
        is required. When `callback` is provided, its `type` must be `immediate` and `origin` must be `web`.


        **Migrating from v1:** The following fields have been renamed or restructured — `entryPointId` → `channelParams.entryPointId`;
        `destination` (string) → `destination.id`; `origin` (string) → `origin.id`; `attributes` → `globalVariables`; `customAttributes`
        (SIP headers) → `channelParams.sipHeaders`; `mediaType` → `channelType`; `callback.callbackOrigin` → `channelParams.callback.origin`;
        `callback.callbackType` → `channelParams.callback.type`.'
      required:
      - origin
      - destination
      - channelType
      - channelParams
      properties:
        origin:
          title: Origin
          type: object
          description: Origin of the outbound telephony task. May be the agent's information or a configured outbound ANI
            in the organization.
          required:
          - id
          properties:
            id:
              type: string
              description: Outbound ANI or agent identifier used for the telephony call.
              example: '+18000000000'
            name:
              type:
              - string
              - 'null'
              description: Optional display name. May be omitted or null for telephony tasks.
              example: null
        destination:
          title: Destination
          type: object
          description: Destination for the telephony task. The `type` must be `dialNumber`.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The dial number to call. **Migrating from v1:** Previously the top-level `destination` field (plain
                string).
              example: '+19780000000'
            type:
              type: string
              description: Must be `dialNumber` for `telephony` tasks.
              enum:
              - businessAddress
              - dialNumber
              example: dialNumber
        channelType:
          type: string
          enum:
          - telephony
          description: Discriminator field. Must be `telephony` for voice task creation. **Migrating from v1:** Previously
            named `mediaType`.
          example: telephony
        channel:
          type:
          - string
          - 'null'
          description: Not applicable for telephony tasks. May be omitted or set to `null`.
          example: null
        flowSettings:
          $ref: '#/components/schemas/FlowSettings'
        globalVariables:
          $ref: '#/components/schemas/GlobalVariables'
        channelParams:
          $ref: '#/components/schemas/TelephonyParams'
      example:
        origin:
          id: '+18000000000'
          name: null
        destination:
          id: '+19780000000'
          type: dialNumber
        channelType: telephony
        channelParams:
          type: telephony
          entryPointId: aef6455f-ccd6-4261-bb00-e80f845c01b0
          outboundType: CALLBACK
          callback:
            type: immediate
            origin: web
            number: '+19780000000'
    OperationError:
      description: An error message providing details about the operation failure.
      type: object
      properties:
        description:
          type: string
          description: A human readable explanation for the occurrence of an error.
          example: Incorrect Credentials.
    WorkItem:
      type: object
      description: Request body to create an inbound `workItem` task via a configured workItem channel. The `channel` must
        reference an active configured workItem channel in the organization. `workItemData` within `channelParams` carries
        the structured form payload — up to 50 entries, with keys up to 100 UTF-8 bytes and values up to 1024 UTF-8 bytes.
      required:
      - origin
      - destination
      - channelType
      - channel
      - channelParams
      properties:
        origin:
          title: Origin
          type: object
          description: Origin of the task. For inbound `workItem` tasks, this represents the customer.
          required:
          - id
          properties:
            id:
              type: string
              description: Customer's identifier, such as an email address.
              example: customer@domain.com
            name:
              type:
              - string
              - 'null'
              description: Optional human-readable display name for the customer.
              example: Customer Name
        destination:
          title: Destination
          type: object
          description: Destination for the workItem task. The `type` must be `businessAddress`.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: Business address associated with the configured workItem channel entry point.
              example: customer-support@biz.com
            type:
              type: string
              description: Must be `businessAddress` for `workItem` tasks.
              enum:
              - businessAddress
              - dialNumber
              example: businessAddress
        channelType:
          type: string
          enum:
          - workItem
          description: Discriminator field. Must be `workItem` for custom channel task creation.
          example: workItem
        channel:
          type: string
          description: Identifier of the configured workItem channel in the organization. Required for `workItem` requests.
          example: support-form
        flowSettings:
          $ref: '#/components/schemas/FlowSettings'
        globalVariables:
          $ref: '#/components/schemas/GlobalVariables'
        channelParams:
          $ref: '#/components/schemas/WorkItemParams'
      example:
        origin:
          id: customer@domain.com
          name: Customer Name
        destination:
          id: customer-support@biz.com
          type: businessAddress
        channelType: workItem
        channel: support-form
        channelParams:
          type: work-item-form
          message:
            aliasId: msg-001
            workItemData:
              name: customer name
              email: customer@domain.com
            timestamp: 1732786800000
    CreateTaskRequestV2:
      description: Request body for creating a task.
      oneOf:
      - $ref: '#/components/schemas/WorkItem'
      - $ref: '#/components/schemas/CustomMessaging'
      - $ref: '#/components/schemas/Telephony'
      discriminator:
        propertyName: channelType
    TaskApiResponse:
      description: API response for a task.
      required:
      - data
      - meta
      type: object
      properties:
        meta:
          description: Response metadata.
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          description: List of tasks retrieved according to query parameters.
          items:
            $ref: '#/components/schemas/Task'
    ConsultTransferResourceRequest:
      description: Request body for a consult transfer.
      properties:
        to:
          description: The consulted user destination ID to transfer, maximum length 36 characters.
          type: string
          example: 315fbb91-2288-427c-9588-ec764cd46ea4
        destinationType:
          description: The user can transfer to another consulted user in the team(```agent```), dial number(```dialNumber```),
            entry point(```entryPoint```)
          type: string
          example: dialNumber
      required:
      - to
      - destinationType
      type: object
    TransferResourceRequest:
      description: Request body for transferring a task.
      properties:
        to:
          description: The user destination ID or the entry point ID to transfer, maximum length 43 characters.
          type: string
          example: 315fbb91-2288-427c-9588-ec764cd46ea4
        destinationType:
          description: The user can transfer to another user in the team(```agent```), queue(```queue```), dial number(```dialNumber```),
            entry point(```entrypointDialNumber```).
          type: string
          example: dialNumber
      required:
      - to
      - destinationType
      type: object
    PatchTaskRequest:
      description: Request body for patching a task.
      required:
      - attributes
      type: object
      properties:
        attributes:
          type: object
          description: This is a schema free data tuple to pass-on specific data, depending on the outboundType. Supports
            a maximum of 30 tuples. Each tuple can have a key up to 200 bytes (up to 200 UTF-8 characters) and a value up
            to 1024 bytes (up to 1024 UTF-8 characters).
          example:
            channel: sales
    TaskOwner:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          description: ID of the agent last assigned to this task.
          example: e0c7611b-8035-443a-b7a8-dca9f8b8289b
        name:
          type: string
          description: Name of the agent last assigned to this task.
          example: Joseph Lambert
      description: The owner of the task.
    TaskMessageResponse:
      description: Response body after successfully requesting a task message append.
      type: object
      example:
        meta:
          orgId: 658d1102-8c11-4850-a809-d7a99cc1c22f
        data:
          id: 123e4567-e89b-12d3-a456-426614174000
      required:
      - meta
      - data
      properties:
        meta:
          type: object
          description: Response metadata.
          required:
          - orgId
          properties:
            orgId:
              type: string
              format: uuid
              description: UUID of the organization, inferred from the authorization token.
              example: 658d1102-8c11-4850-a809-d7a99cc1c22f
        data:
          type: object
          description: Response data.
          required:
          - id
          properties:
            id:
              type: string
              format: uuid
              description: Append event identifier for the message. If `aliasId` is a valid UUID, the platform reuses it as
                the event identifier; otherwise a UUID is generated. Use this ID to correlate downstream webhook delivery
                for the appended message.
              example: 123e4567-e89b-12d3-a456-426614174000
    CustomMessaging:
      type: object
      description: Request body to create an inbound `customMessaging` task via a configured custom messaging channel. The
        `channel` must reference an active configured custom messaging channel in the organization. Requires the `wxcc_digital_byoc`
        feature flag enabled for the organization — returns `403` if not enabled. Only one message (text or text with attachments)
        is allowed per task creation request.
      required:
      - origin
      - destination
      - channelType
      - channel
      - channelParams
      properties:
        origin:
          title: Origin
          type: object
          description: Origin of the task. For inbound `customMessaging` tasks, this represents the customer.
          required:
          - id
          properties:
            id:
              type: string
              description: Customer's identifier, such as an email address or user ID.
              example: customer@example.com
            name:
              type:
              - string
              - 'null'
              description: Optional human-readable display name for the customer.
              example: Customer Name
          example:
            id: customer@example.com
            name: Customer Name
        destination:
          title: Destination
          type: object
          description: Destination for the customMessaging task. The `type` must be `businessAddress`.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: Business address associated with the configured custom messaging channel entry point.
              example: support@channel.biz
            type:
              type: string
              description: Must be `businessAddress` for `customMessaging` tasks.
              enum:
              - businessAddress
              example: businessAddress
          example:
            id: support@channel.biz
            type: businessAddress
        channelType:
          type: string
          enum:
          - customMessaging
          description: Channel type for this request.
          example: customMessaging
        channel:
          type: string
          description: Identifier of the configured custom messaging channel in the organization. Required for `customMessaging`
            requests.
          example: my-custom-channel
        flowSettings:
          $ref: '#/components/schemas/FlowSettings'
        globalVariables:
          $ref: '#/components/schemas/GlobalVariables'
        channelParams:
          $ref: '#/components/schemas/CustomMessagingParams'
      example:
        origin:
          id: customer@example.com
          name: Customer Name
        destination:
          id: support@channel.biz
          type: businessAddress
        channelType: customMessaging
        channel: my-custom-channel
        channelParams:
          type: text
          message:
            aliasId: 123e4567-e89b-12d3-a456-426614174000
            text: Hello, I need help with my order.
            timestamp: 1732786800000
    CallbackParams:
      type: object
      description: Callback parameters for telephony tasks.
      required:
      - type
      - origin
      properties:
        type:
          type: string
          description: Callback execution mode. Currently only `immediate` is supported. **Migrating from v1:** Previously
            named `callbackType`.
          enum:
          - immediate
          example: immediate
        origin:
          type: string
          description: Channel that originated the callback request. The supported value is `web`. **Migrating from v1:**
            Previously named `callbackOrigin`.
          enum:
          - web
          example: web
        number:
          type:
          - string
          - 'null'
          description: Optional callback number. Provided when the callback flow supplies a specific number to dial back.
          example: '+19780000000'
    GlobalVariables:
      type: object
      description: Schema-free data map to pass specific data depending on the outbound type. Values are validated against
        the global variables configured in the organization. Supports a maximum of 30 tuples. Each tuple can have a key up
        to 200 bytes and a value up to 1024 bytes. **Migrating from v1:** Previously named `attributes`.
      additionalProperties:
