      summary: Create or Update an Organization Setting
      operationId: Create or Update an Organization Setting
      description: This endpoint creates or updates the specified setting for the given organization; however, the 'name'
        of the setting cannot be modified. It is accessible with the scope 'identity:organizations_rw'.
      tags:
      - Settings
      parameters:
      - name: orgId
        in: path
        description: The Webex organization id in Control Hub UUID or API orgId format.
        required: true
        example: 1eb65fdf-9643-417f-9974-ad72cae0e10f
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              key: allow-admin-invite-emails
              value: false
            schema:
              $ref: '#/components/schemas/updateOrgSettingObject'
