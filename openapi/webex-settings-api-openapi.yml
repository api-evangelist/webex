      summary: Get an Organization Setting
      operationId: Get an Organization Setting
      description: This endpoint retrieves the specified setting for the given organization and is accessible with the scope
        'identity:organizations_read'.
      tags:
      - Settings
      parameters:
      - name: orgId
        in: path
        description: The Webex organization id in Control Hub UUID or API orgId format.
        required: true
        example: 1eb65fdf-9643-417f-9974-ad72cae0e10f
        schema:
          type: string
      - name: settingKey
        in: path
        description: The key of the setting.
        required: true
        example: allow-admin-invite-emails
        schema:
          type: string
  /settings/organizations/{orgId}/settings:
