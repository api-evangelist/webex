components:
  schemas:
    PSTNType:
      type: string
      enum:
      - LOCAL_GATEWAY
      - NON_INTEGRATED_CCP
      - INTEGRATED_CCP
      - CISCO_PSTN
      description: " * `LOCAL_GATEWAY` - PSTN connection type for a premises-based connection.\n * `NON_INTEGRATED_CCP` -\
        \ PSTN connection type for a Non-Integrated Cloud Connected PSTN connection.\n * `INTEGRATED_CCP` - PSTN connection\
        \ type for an Integrated Cloud Connected PSTN connection. Updating the location with this connection type is currently\
        \ not supported using the API.\n * `CISCO_PSTN` - PSTN connection type for a Cisco PSTN connection. Updating the location\
        \ with this connection type is currently not supported using the API.\n"
    AddressLookupErrorObject:
      type: object
      description: Object containing details about an error encountered during address lookup.
      properties:
        code:
          type: string
          description: Error code.
          example: PMP4004
        title:
          type: string
          description: Error title.
          example: INVALID_STREET_ADDRESS
        detail:
          type: string
          description: Detailed error message.
          example: The street address provided is invalid.
    PSTNServiceType:
      type: string
      enum:
      - GEOGRAPHIC_NUMBERS
      - TOLLFREE_NUMBERS
      - BUSINESS_TEXTING
      - CONTACT_CENTER
      - SERVICE_NUMBERS
      - NON_GEOGRAPHIC_NUMBERS
      - MOBILE_NUMBERS
      description: " * `GEOGRAPHIC_NUMBERS` - PSTN service type for geographic numbers.\n * `TOLLFREE_NUMBERS` - PSTN service\
        \ type for toll-free numbers.\n * `BUSINESS_TEXTING` - PSTN service type for business texting.\n * `CONTACT_CENTER`\
        \ - PSTN service type for contact center services.\n * `SERVICE_NUMBERS` - PSTN service type for service numbers.\n\
        \ * `NON_GEOGRAPHIC_NUMBERS` - PSTN service type for non-geographic numbers.\n * `MOBILE_NUMBERS` - PSTN service type\
        \ for mobile numbers.\n"
    EmergencyAddressObject:
      type: object
      description: Object containing emergency address details.
      properties:
        address1:
          type: string
          example: 3487 Chase Ave
          description: Primary street information for the emergency address.
        address2:
          type: string
          example: Apt 112
          description: Apartment number or any other secondary information for the emergency address.
        city:
          type: string
          example: Miami Beach
          description: City for the emergency address.
        state:
          type: string
          example: FL
          description: State or Province or Region for the emergency address.
        postalCode:
          type: string
          example: '33140'
          description: Postal code for the emergency address.
        country:
          type: string
          example: US
          description: Country for the emergency address.
    SetUpPSTNLocationConnectionObject:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUElDS1VQL1kyRnNiRkJwWTJ0MWNERT0
          description: A unique identifier for the connection. This is required for non-integrated CCP.
        premiseRouteType:
          type: string
          example: TRUNK
          description: Premise route type. The possible types are TRUNK and ROUTE_GROUP. This is required for the local gateway.
        premiseRouteId:
          type: string
