      summary: Update the Emergency Address for a Phone Number
      operationId: updateEmergencyAddressForPhoneNumber
      description: 'Update the emergency address for a phone number.


        Emergency address settings allow the admin to configure or update the physical address associated with a phone number
        or a location.


        Updating the emergency address for a phone number requires a full administrator auth token with scope of `spark-admin:telephony_pstn_write`.'
      tags:
      - PSTN
      parameters:
      - name: phoneNumber
        in: path
        description: Update the emergency address for this phone number.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1BIT05FX05VTUJFUi8rMTk4NzY1NDMyMTA
        schema:
          type: string
      - name: orgId
        in: query
        description: Update the emergency address of phone number in this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        required: true
        description: JSON object containing emergency address information to be updated for the number. Using an empty JSON
          object deletes the custom emergency address for the number and replaces it with the location's default emergency
          address.
        content:
          application/json:
            examples:
              samplePayload:
                summary: Sample JSON with values
                value:
                  emergencyAddress:
                    address1: 3487 Chase Ave
                    address2: Apt 112
                    city: Miami Beach
                    state: FL
                    postalCode: '33140'
                    country: US
              emptyPayload:
                summary: Empty JSON
                value: {}
            schema:
              type: object
              description: Object containing emergency address details to be updated for the phone number.
              properties:
                emergencyAddress:
                  $ref: '#/components/schemas/EmergencyAddressObject'
  /telephony/pstn/locations/{locationId}/emergencyAddress/lookup:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    description: List of suggested addresses based on the input address. If the input address is valid and
                      unchanged, no errors are returned. If the input address requires corrections, the response includes
                      a suggested address along with error details.
                    items:
                      $ref: '#/components/schemas/SuggestedEmergencyAddressObject'
              examples:
                validAddressExample:
                  summary: Valid address, no errors
                  value:
                    addresses:
                    - address1: 3487 Chase Ave
                      address2: Apt 112
                      city: Miami Beach
                      state: FL
                      postalCode: '33140'
                      country: US
                      meta:
                        houseNumber: '3487'
                        streetName: Chase Ave
                        country: US
                        state: FL
                        city: Miami Beach
                        zipCode: '33140'
                        latitude: '25.8131'
                        longitude: '-80.1300'
                addressWithErrorsExample:
                  summary: Address with corrections and errors
                  value:
                    addresses:
                    - address1: 3487 Chase Ave
                      address2: Apt 112
                      city: Miami Beach
                      state: FL
                      postalCode: '33140'
                      country: US
                      meta:
                        houseNumber: '3487'
                        streetName: Chase Ave
                        country: US
                        state: FL
                        city: Miami Beach
                        zipCode: '33140'
                        latitude: '25.8131'
                        longitude: '-80.1300'
                      errors:
                      - code: PMP4004
                        title: INVALID_STREET_ADDRESS
                        detail: The street address provided is invalid.
