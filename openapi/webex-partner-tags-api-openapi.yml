components:
  schemas:
    TagsRequest:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagsObj'
          description: An array of tags.
    SubscriptionTagsResponse:
      type: object
      properties:
        orgName:
          type: string
          example: Customer Name
          description: Name of the customer organization.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
          description: The unique identifier for the customer organization.
        tags:
          type: array
          items:
            type: string
            example: Tags1,Tags2
          description: An array of tags.
        subscriptionId:
          type: string
          example: Sub119911
          description: The unique identifier for the subscription.
        trial:
          type: string
          example: 'false'
          description: boolean flag for trial or not.
    TagsObj:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: Tag name
          description: Name of the tag.
        description:
          type: string
          example: Tag description
          description: Description of the tag
    CustomerTagsResponse:
      type: object
      properties:
        orgName:
          type: string
          example: Customer Name
          description: Name of the customer organization.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
          description: The unique identifier for the customer organization.
        tags:
          type: array
          items:
            type: string
            example: Tags1,Tags2
          description: An array of tags.
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 Bearer token authentication
      flows:
        authorizationCode:
          authorizationUrl: https://webexapis.com/v1/authorize
          tokenUrl: https://webexapis.com/v1/access_token
          scopes:
            spark:applications_token: Create access tokens for Service Apps
