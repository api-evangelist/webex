      summary: List references for a specific Global Variable
      description: Retrieve a list of all entities that have reference to an existing Global Variable by ID in a given organization.
      operationId: getIncomingReferences_16
      parameters:
      - name: orgid
        in: path
        description: Organization ID to be used for this operation. The specified security token must have permission to interact with the organization.
        required: true
        schema:
