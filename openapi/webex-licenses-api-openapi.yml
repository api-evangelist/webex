      summary: Get License Details
      operationId: Get_License_Details
      description: 'Shows details for a license, by ID.


        Specify the license ID in the `licenseId` parameter in the URI.

        Use the optional query parameter `includeAssignedTo` to get a list of all objects that are assigned with the license. The objects include but not limited to, users including external users. Long result sets will be split into [pages](/docs/basics#pagination).


        Response properties that are not applicable to the license will not be present in the response.'
      tags:
      - Licenses
      parameters:
      - name: licenseId
        in: path
        description: The unique identifier for the license.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvOTZhYmMyYWEtM2RjYy0xMWU1LWExNTItZmUzNDgxOWNkYzlh
        schema:
          type: string
      - name: includeAssignedTo
        in: query
        description: The type of object to whom the license is assigned to.
        example: user
        schema:
          type: string
          enum:
          - user
      - name: next
        in: query
        description: List the next set of users. Applicable only if `includeAssignedTo` is populated.
        example: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0VfVVNFUl9QQUdJTkcvT1RaaFltTXlZV0V0TTJSall5MHhNV1UxTFdFeE5USXRabVV6TkRneE9XTmtZemxo
        schema:
          type: string
      - name: limit
        in: query
        description: A limit on the number of users to be returned in the response. Applicable only if `includeAssignedTo` is populated. limit cannot be more than 300.
        example: 0
        schema:
          type: number
          default: 300
