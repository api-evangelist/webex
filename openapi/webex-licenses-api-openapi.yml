      summary: List Licenses
      operationId: List_Licenses
      description: 'List all licenses for a given organization.  If no `orgId` is specified, the default is the organization of the authenticated user.


        Response properties that are not applicable to the license will not be present in the response.'
      tags:
      - Licenses
      parameters:
      - name: orgId
        in: query
        description: List licenses for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
