      summary: Assign Licenses to Users
      operationId: Assign_Licenses_to_Users
      description: 'Assign licenses and attendee `siteUrls` to existing users. Only an admin can assign licenses. Only existing users can be assigned a license. Assign meeting licenses to users outside your organization (Status will be pending until the user accepts the invite)


        At least one of the following body parameters is required to assign license to the user: `email`, `personId`. For Calling license assignment, properties `phoneNumber` or `extension` are required. If `phoneNumber` is not provided then `locationId` is mandatory.


        When assigning licenses and attendee siteUrls to a user who does not belong to the organization, the licenses and siteUrls remain in pending state until the user accepts them. The `pendingLicenses` and `pendingSiteUrls` are part of the response.'
      tags:
      - Licenses
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              email: john.andersen@example.com
              personId: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
              orgId: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
              licenses:
              - id: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvOTZhYmMyYWEtM2RjYy0xMWU1LWExNTItZmUzNDgxOWNkYzlh
                operation: add
                properties:
                  locationId: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzYzNzE1
                  phoneNumber: '+14085267209'
                  extension: '133'
              - id: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvOTZhYmMyYWEtM2RjYy0xMWU1LTU2eTctMGY0NTU2YWRleWhu
                operation: remove
              - id: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvOTZhYmMyYWEtM2RjYy0xMWU1LTIzNDItMGY0NTU2YWRlZXJm
                operation: add
              siteUrls:
              - siteUrl: mysite.webex.com
                accountType: attendee
                operation: add
            schema:
              $ref: '#/components/schemas/PatchUserLicenses'
components:
  schemas:
    LicenseProperties:
      type: object
      properties:
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzYzNzE1
          description: The ID of the location for this user. Applicable to Webex Calling license.
        phoneNumber:
          type: string
          example: '14085267209'
          description: Work phone number for the user. Applicable to Webex Calling license.
        extension:
          type: string
          example: '133'
          description: Webex Calling extension of the user. Applicable to Webex Calling license.
    LicensewithUsers:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvOTZhYmMyYWEtM2RjYy0xMWU1LWExNTItZmUzNDgxOWNkYzlh
          description: A unique identifier for the license.
        name:
          type: string
          example: Meeting - Webex Meeting Center
          description: Name of the licensed feature.
        totalUnits:
          type: number
          example: 50
          description: Total number of license units allocated.
        consumedUnits:
          type: number
          example: 5
          description: Total number of license units consumed.
        consumedByUsers:
          type: number
          example: 5
          description: Total number of license units consumed by users.
        consumedByWorkspaces:
          type: number
          description: Total number of license units consumed by workspaces.
        subscriptionId:
          type: string
          example: Sub-hydraOct26a
          description: The subscription ID associated with this license. This ID is used in other systems, such as Webex Control Hub.
        siteUrl:
          type: string
          example: site1-example.webex.com
          description: The Webex Meetings site associated with this license.
        siteType:
          type: string
          enum:
          - Control Hub managed site
          - Linked site
          - Site Admin managed site
          description: "The type of site associated with this license.\n * `Control Hub managed site` - The site is managed by Webex Control Hub.\n * `Linked site` - The site is a linked site.\n * `Site Admin managed site` - The site is managed by Site Administration.\n"
        users:
          type: array
          items:
            $ref: '#/components/schemas/Users'
          description: A list of users to whom the license is assigned to.
    License:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvOTZhYmMyYWEtM2RjYy0xMWU1LWExNTItZmUzNDgxOWNkYzlh
          description: A unique identifier for the license.
        name:
          type: string
          example: Meeting - Webex Meeting Center
          description: Name of the licensed feature.
        totalUnits:
          type: number
          example: 50
          description: Total number of license units allocated.
        consumedUnits:
          type: number
          example: 5
          description: Total number of license units consumed.
        consumedByUsers:
          type: number
          example: 5
          description: Total number of license units consumed by users.
        consumedByWorkspaces:
          type: number
          description: Total number of license units consumed by workspaces.
        subscriptionId:
          type: string
          example: Sub-hydraOct26a
          description: The subscription ID associated with this license. This ID is used in other systems, such as Webex Control Hub.
        siteUrl:
          type: string
          example: site1-example.webex.com
          description: The Webex Meetings site associated with this license.
        siteType:
          type: string
          enum:
          - Control Hub managed site
          - Linked site
          - Site Admin managed site
          description: "The type of site associated with this license.\n * `Control Hub managed site` - The site is managed by Webex Control Hub.\n * `Linked site` - The site is a linked site.\n * `Site Admin managed site` - The site is managed by Site Administration.\n"
    LicenseError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      example:
        message: License assignment failed
        errors:
        - errorCode: 400112
          description: 'Changing a user''s Webex Calling license from Professional to Standard is not allowed. The following license(s) could not be applied as requested: {licenses}'
        trackingId: NA_88b8b4ce-6338-4d3a-8d6c-22b37e62354f
    LicenseCollectionResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/License'
    ErrorResponse:
      type: object
      properties:
        message:
