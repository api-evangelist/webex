      operationId: getCustomerDeviceDynamicSettings
      summary: Get Customer Device Dynamic Settings
      description: 'Retrieve dynamic settings for specific device tags at customer level, allowing filters by `familyOrModelDisplayName`
        and `tag` identifier.


        This API lets you request the values of multiple `Device Settings` at once by specifying a list of `familyOrModelDisplayName`
        and tag combinations.


        This requires a full, device, or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      parameters:
      - name: orgId
        in: query
        description: List of device dynamic settings in this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: familyOrModelDisplayName
        in: query
        required: true
        description: The family or model name for the device. If no tag is specified, all tags related to `familyOrModelDisplayName`
          are returned.
        example: Poly
        schema:
          type: string
          minLength: 1
          maxLength: 40
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDeviceDynamicSettingsListPostRequest'
            example:
              tags:
              - '%DO_MENU_ITEM_BACKGROUND%'
              - '%ENABLE_BLUETOOTH%'
              - '%DO_MENU_TITLE_BACKGROUND%'
        description: Request body containing the list of device tags to retrieve settings for.
        required: false
      tags:
      - Device Call Settings With Device Dynamic Settings
