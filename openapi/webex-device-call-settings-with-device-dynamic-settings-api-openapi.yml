      summary: Update Device Dynamic Settings Across Organization or Location
      operationId: updatesDynamicDeviceSettingsAcrossOrganizationOrLocation
      description: 'Creates a job to update device settings at location or organization level.


        The job runs asynchronously and persistently, applying the requested settings in bulk to all relevant devices, which
        may belong to multiple families as specified in the request. If a `locationId` is provided, only devices in that location
        are affected.


        A unique job ID is returned to track status and errors.


        Only one job can run per customer per organization at a time. Additionally, this job cannot run in parallel with other
        device jobs such as [Call device settings](/docs/api/v1/device-call-settings/change-device-settings-across-organization-or-location-job)
        and [Rebuild Phones](/docs/api/v1/device-call-settings/rebuild-phones-configuration).


        Running a job requires a full administrator auth token with a scope of `spark-admin:telephony_config_write`.'
