components:
  schemas:
    LineType:
      type: string
      enum:
      - PRIMARY
      - SHARED_CALL_APPEARANCE
      description: " * `PRIMARY` - Primary line for the member.\n * `SHARED_CALL_APPEARANCE` - Shared line for the member.\
        \ A shared line allows users to receive and place calls to and from another user's extension, using their own device.\n"
    DevicePutItem:
      type: object
      required:
      - tag
      - action
      properties:
        tag:
          type: string
          description: The unique identifier for the setting to be updated.
          example: '%G711U_ORDER%'
          minLength: 1
          maxLength: 64
        action:
          $ref: '#/components/schemas/Action'
        value:
          type: string
          description: The new value to set for the setting. This field is required when `action` is `SET` and ignored otherwise.
          example: '4'
          minLength: 1
          maxLength: 256
    CustomerDevicePostTag:
      type: object
      properties:
        familyOrModelDisplayName:
          type: string
          description: The `familyOrModelDisplayName` of the device.
          example: Poly
        tag:
          type: string
          description: The unique identifier for the setting.
          example: '%G711U_ORDER%'
        value:
          type: string
          description: The current value of the setting at `ORGANIZATION` level. If the tag value is not set at the `ORGANIZATION`
            level, this field will not be included in the response.
          example: '4'
        parentValue:
          type: string
          description: The value inherited from the immediate parent level above `ORGANIZATION`. It can be `SYSTEM_DEFAULT`,
            `REGIONAL_DEFAULT`, or `ORGANIZATION`, depending on which level the setting is actually configured at. If there
            is no parent level for this tag, this field will not be included in the response.
          example: '3'
        parentLevel:
          $ref: '#/components/schemas/DynamicDeviceSettingsCustomerParentLevel'
    LocationParentLevel:
      type: string
      enum:
      - SYSTEM_DEFAULT
      - REGIONAL_DEFAULT
      - ORGANIZATION
      - LOCATION
      description: The level from which the tag's parent value is inherited. If there is no parent level for this tag, this
        field will not be included in the response.
    LocationDeviceDynamicSettingsListPostResponse:
      type: object
      example:
        tags:
        - familyOrModelDisplayName: Poly
          tag: '%G711U_ORDER%'
          value: '4'
          parentValue: '3'
          parentLevel: ORGANIZATION
        lastUpdateTime: 1651396800000
        updateInProgress: false
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/LocationDevicePostResponseTag'
          description: Array of device setting values matching the requested tags.
        lastUpdateTime:
          type: integer
          format: int64
          description: Timestamp of the last update to these settings.
        updateInProgress:
          type: boolean
          description: Flag indicating if an update to these settings is currently in progress.
    MemberType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      description: " * `PEOPLE` - Indicates the associated member is a person.\n * `PLACE` - Indicates the associated member\
        \ is a workspace.\n"
    DevicePostResponseTag:
      type: object
      required:
      - familyOrModelDisplayName
      - tag
      properties:
        familyOrModelDisplayName:
          type: string
          description: The display name of the device family or model associated with the returned tag.
          example: Poly
        tag:
          type: string
          description: The unique identifier for the device setting.
          example: '%G711U_ORDER%'
        value:
          type: string
          description: The current value of the setting at device level. If the tag value is not set at the device level,
            this field will not be included in the response.
          example: '4'
        parentValue:
          type: string
          description: The setting value at the next available `parentLevel`. It is used if `value` is not set and is omitted
            when no parent level exists for the tag.
          example: '3'
        parentLevel:
          $ref: '#/components/schemas/DeviceParentLevel'
    DeviceParentLevel:
      type: string
      enum:
      - SYSTEM_DEFAULT
      - REGIONAL_DEFAULT
      - ORGANIZATION
      - LOCATION
      description: The level from which the tag's parent value is inherited. If there is no parent level for this tag, this
        field will not be included in the response.
    deviceOwner:
      type: object
      required:
      - id
      - type
      properties:
