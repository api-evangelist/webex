      summary: Generate OTP
      operationId: Generate OTP
      description: 'This API allows an admin to generate a One-Time Password (OTP) for user accounts with `userNameType` set as `partner-upn`. The OTP is used by users to log in to any Webex application, whereupon they are asked to change their password.

        The OTP generated by this API has a default length of 6 digits and expires in 7 days.


        Several OTPs can be active for the same user. When the user successfully uses an OTP, all other OTPs are automatically revoked.


        The creation of OTPs is logged in the [Admin Audit Events](https://developer.webex.com/docs/api/v1/admin-audit-events).


        **Possible Error:**


        - 403: The request was forbidden. OTP generation is restricted to users with a `userNameType` of `partner-upn`. This error occurs if the user does not meet the required criteria for OTP generation.


        **Authorization:**


        An OAuth token issued by the Identity Broker is required to access this endpoint. The token must include one of the following scopes:


        - `Identity:one_time_password`

        or


        - `Identity:Config`


        **Administrator Roles:**


        The following administrators have permission to use this API:


        - `Org Full Admin`: Can generate OTPs for non-email-type users in their organization.


        - `Partner Full Admin`: Can generate OTPs for User/Machine Accounts in Customer Orgs.


        - `Org User Admin`: Can generate OTPs for User/Machine Accounts within their organization.'
      tags:
      - Identity Organization
      parameters:
      - name: orgId
        in: path
        description: The Webex Identity-assigned organization identifier for a user's organization.
        required: true
        example: bf732c85-68ca-4867-94e4-937286ad2fd4
        schema:
          type: string
      - name: userId
        in: path
        description: The Common Identity-assigned user identifier for an existing user (`entryUUID`).
        required: true
        example: 73e0e4f2-66f6-417a-b074-d473ed537f58
        schema:
          type: string
components:
  schemas:
    GetOrgResponse:
      type: object
      required:
      - schemas
      - id
      - displayName
      properties:
        schemas:
          type: array
          items:
            type: string
            example: urn:cisco:codev:identity:organization:core:1.0
          description: Output JSON schemas.
        id:
          type: string
          example: 82adacf4-453f-4e2b-a406-2939fddcaad2
          description: Webex Identity assigned organization identifier.
        displayName:
          type: string
          example: Acme, Inc.
          description: Full name of the organization.
        preferredLanguage:
          type: string
          example: en_US
          description: It is the default preferredLanguage for user creation in this org. It is set in ISO639 format.
        meta:
          $ref: '#/components/schemas/metaObject'
          description: Meta data information of organization.
    PasswordPolicyResponse:
      type: object
      example:
        minimumNumeric: '1'
        minimumCapAlpha: '1'
        minimumLowAlpha: '1'
        minimumSpecial: '1'
        minimumLength: '8'
        historyCount: '3'
        maxPasswordAge: '1825'
        notAcceptableStrings: password,passwd,pass,webex,cisco,xebew,ocsic
      properties:
        minimumNumeric:
          type: string
          example: '8'
          description: Minimum number of numeric characters in password.
        minimumCapAlpha:
          type: string
          example: '1'
          description: Minimum number of uppercase alphabetic character letters in a password.
        minimumLowAlpha:
          type: string
          example: '1'
          description: Minimum number of lowercase alphabetic character letters in a password.
        minimumSpecial:
          type: string
          example: '1'
          description: Minimum number of special character included "~!@#$%^&*()-_=+[]{}|;:,.<>/?" in a password.
        minimumLength:
          type: string
          example: '8'
          description: Minimum length of password. Must be between 8 and 256, inclusive.
        historyCount:
          type: string
          example: '3'
          description: The number of former password in history, the new password can't be any one of them. Must be between 1 and 5, inclusive.
        maxPasswordAge:
          type: string
          example: '90'
          description: 'The password expired time, unit: day, that means user need to change password every "X" days. Must be between 90 and 1825, inclusive.'
        notAcceptableStrings:
          type: string
          example: password,passwd,pass,webex,cisco,xebew,ocsic
          description: The password can not be any one in this string list.
    updateOrgObject:
      type: object
      required:
      - schemas
      - displayName
      properties:
        schemas:
          type: array
          items:
            type: string
            example: urn:cisco:codev:identity:organization:core:1.0
          description: Input JSON schemas.
        displayName:
          type: string
          example: Acme_New, Inc.
          description: New full name of the organization.
        preferredLanguage:
          type: string
          example: en_US
          description: It is the default preferredLanguage for user creation in this org. It is set in ISO639 format.
    PasswordPolicyObject:
      type: object
      required:
      - schemas
      - minimumNumeric
      - minimumCapAlpha
      - minimumLowAlpha
      - minimumSpecial
      - minimumLength
      - historyCount
      - maxPasswordAge
      properties:
        schemas:
          type: array
          items:
            type: string
            example: urn:cisco:codev:identity:idbroker:pwdpolicy:schemas:1.0
          description: "Input JSON schemas. It should contain the following schema: \n urn:cisco:codev:identity:idbroker:pwdpolicy:schemas:1.0"
        minimumNumeric:
          type: string
          example: ''
          description: Minimum number of numeric characters in password
        minimumCapAlpha:
          type: string
          example: ''
          description: Minimum number of uppercase alphabetic character letters in password
        minimumLowAlpha:
          type: string
          example: ''
          description: Minimum number of lowercase alphabetic character letters in password
        minimumSpecial:
          type: string
          example: ''
          description: Minimum number of special characters included "~!@#$%^&*()-_=+[]{}|;:,.<>/?" in password
        minimumLength:
          type: string
          example: ''
          description: Minimum length of password. Must be between 8 and 256, inclusive.
        historyCount:
          type: string
          example: ''
          description: The number of former passwords in history, the new password can't be any one of them. Must be between 1 and 5, inclusive.
        maxPasswordAge:
          type: string
          example: ''
          description: 'The password expired time, unit: day, that means user need to change password every "X" days. Must be between 90 and 1825, inclusive.'
        notAcceptableStrings:
          type: string
          example: ''
          description: The password can not be any one in this string list.
    GenerateOtp:
      type: object
      required:
      - oneTimePassword
      - expiresIn
      properties:
        oneTimePassword:
          type: string
          example: '283489'
          description: The One-Time Password generated for the user.
        expiresIn:
          type: number
          example: 604800
          description: 'The expiration time for the OTP in seconds (default: 7 days).'
    AuthenticationConfigPatchObject:
      type: object
      required:
      - schemas
      properties:
        schemas:
          type: array
          items:
            type: string
            example: urn:cisco:codev:identity:idbroker:authnconfig:schemas:1.0
          description: "Input JSON schemas. It should contain the following schema: \n urn:cisco:codev:identity:idbroker:authnconfig:schemas:1.0"
        RememberMyLoginId:
          type: boolean
          example: true
          description: Login Id set to true if it should be remembered.
        RememberMyLoginIdDuration:
          type: number
          example: 30
          description: Specifies the number of days the user's login ID is remembered. Must be between 1 and 120 (inclusive).
        mfaEnabled:
          type: boolean
          example: true
          description: Enable/ Disable multi-factor authentication on an organization.
    metaObject:
      type: object
      required:
      - created
      - lastModified
      - version
      properties:
        created:
          type: string
          example: '"2021-05-13T15:51:09.736Z"'
          description: The date and time the organization was created.
        lastModified:
          type: string
          example: '2024-05-16T12:25:16.739Z'
          description: The last modification time of the organization.
        version:
          type: string
          example: W/\"67863103533\"
          description: The version information of the organization.
    AuthenticationConfigResponse:
      type: object
      example:
        schemas:
        - urn:cisco:codev:identity:idbroker:authnconfig:schemas:1.0
        LockoutDuration: 1
        LockoutDurationMultiplier: 1
        LockoutFailureCount: 5
        LockoutFailureDuration: 5
        RememberMyLoginId: false
        RememberMyLoginIdDuration: 30
        mfaEnabled: true
      properties:
