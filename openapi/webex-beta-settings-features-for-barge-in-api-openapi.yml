      summary: Get Barge-In Settings
      operationId: getBargeInSettings
      description: 'Retrieve Barge-In settings of the user.


        The Barge-In feature enables you to use a Feature Access Code (FAC) to answer a call that was directed to another
        subscriber, or barge-in on the call if it was already answered. Barge-In can be used across locations.


        This API requires a user auth token with a scope of `spark:telephony_config_read`.'
      tags:
      - Beta Settings Features For Barge-In
      parameters: []
