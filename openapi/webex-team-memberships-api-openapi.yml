      summary: List Team Memberships
      operationId: listTeamMemberships
      description: 'Lists all team memberships for a given team, specified by the `teamId` query parameter.


        Use query parameters to filter the response.'
      tags:
      - Team Memberships
      parameters:
      - name: teamId
        in: query
        description: List memberships for a team, by ID.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1RFQU0vMTNlMThmNDAtNDJmYy0xMWU2LWE5ZDgtMjExYTBkYzc5NzY5
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of team memberships in the response.
        example: 100
        schema:
          type: number
          default: 100
