      summary: Create a Team Membership
      operationId: createTeamMembership
      description: Add someone to a team by Person ID or email address, optionally making them a moderator.
      tags:
      - Team Memberships
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              teamId: Y2lzY29zcGFyazovL3VzL1RFQU0vMTNlMThmNDAtNDJmYy0xMWU2LWE5ZDgtMjExYTBkYzc5NzY5
              personId: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
              personEmail: john.andersen@example.com
              isModerator: true
            schema:
              type: object
              required:
              - teamId
              properties:
                teamId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1RFQU0vMTNlMThmNDAtNDJmYy0xMWU2LWE5ZDgtMjExYTBkYzc5NzY5
                  description: The team ID.
