        description: Webex Identity assigned user identifier.
        required: true
        example: 3426a8e3-d414-4bf0-a493-4f6787632a13
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              schemas:
              - urn:ietf:params:scim:api:messages:2.0:PatchOp
              Operations:
              - op: add
                path: roles
                value:
                - value: id_user_admin
                  type: cirole
                  display: Full Administrator.
            schema:
              $ref: '#/components/schemas/PatchUser'
