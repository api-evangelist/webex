      summary: List Meeting Invitees
      operationId: List Meeting Invitees
      description: 'Lists meeting invitees for a meeting with a specified `meetingId`. You can set a maximum number of invitees to return.


        This operation can be used for meeting series, scheduled meetings, and ended or ongoing meeting instance objects. If the specified `meetingId` is for a meeting series, the invitees for the series will be listed; if the `meetingId` is for a scheduled meeting, the invitees for the particular scheduled meeting will be listed; if the `meetingId` is for an ended or ongoing meeting instance, the invitees for the particular meeting instance will be listed. See the [Webex Meetings](/docs/meetings#meeting-series-scheduled-meetings-and-meeting-instances) guide for more information about the types of meetings.


        The list returned is sorted in ascending order by email address.


        Long result sets are split into [pages](/docs/basics#pagination).'
      tags:
      - Invitees
      parameters:
      - name: meetingId
        in: query
        description: Unique identifier for the meeting for which invitees are being requested. The meeting can be a meeting series, a scheduled meeting, or a meeting instance which has ended or is ongoing. The meeting ID of a scheduled [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings) meeting is not supported for this API.
        required: true
        example: 870f51ff287b41be84648412901e0402
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of meeting invitees in the response, up to 100.
        example: '100'
        schema:
          type: number
          default: 10
      - name: hostEmail
        in: query
        description: Email address for the meeting host. This parameter is only used if the user or application calling the API has the admin on-behalf-of scopes. If set, the admin may specify the email of a user in a site they manage and the API will return meeting invitees that are hosted by that user.
        example: brenda.song@example.com
        schema:
          type: string
      - name: panelist
        in: query
        description: Filter invitees or attendees for webinars only. If `true`, returns invitees. If `false`, returns attendees. If `null`, returns both invitees and attendees.
        example: 'true'
        schema:
          type: string
