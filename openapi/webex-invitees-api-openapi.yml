      summary: Delete a Meeting Invitee
      operationId: Delete a Meeting Invitee
      description: 'Removes a meeting invitee identified by a `meetingInviteeId` specified in the URI. The deleted meeting invitee cannot be recovered.


        If the meeting invitee is associated with a meeting series, the invitee will be removed from the entire meeting series. If the invitee is associated with a scheduled meeting, the invitee will be removed from only that scheduled meeting.'
      tags:
      - Invitees
      parameters:
      - name: meetingInviteeId
        in: path
        description: Unique identifier for the invitee to be removed. This parameter only applies to an invitee to a meeting series or a scheduled meeting. It doesn't apply to an invitee to an ended or ongoing meeting instance.
        required: true
        example: 870f51ff287b41be84648412901e0402_2628962
        schema:
          type: string
      - name: hostEmail
        in: query
        description: Email address for the meeting host. This parameter is only used if the user or application calling the API has the admin on-behalf-of scopes. If set, the admin may specify the email of a user in a site they manage and the API will delete a meeting invitee that is hosted by that user.
        example: brenda.song@example.com
        schema:
          type: string
      - name: sendEmail
        in: query
        description: If `true`, send an email to the invitee.
        example: 'true'
        schema:
          type: boolean
          default: 'true'
components:
  schemas:
    CreateInviteeObject:
      type: object
      required:
      - meetingId
      - email
      properties:
        meetingId:
          type: string
          example: 870f51ff287b41be84648412901e0402
          description: Unique identifier for the meeting to which a person is being invited. This attribute only applies to meeting series and scheduled meeting. If it's a meeting series, the meeting invitee is invited to the entire meeting series; if it's a scheduled meeting, the meeting invitee is invited to this individual scheduled meeting. It doesn't apply to an ended or ongoing meeting instance. The meeting ID of a scheduled [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings) meeting is not supported for this API.
        email:
          type: string
          example: john.andersen@example.com
          description: Email address for meeting invitee.
        displayName:
          type: string
          example: John Andersen
          description: 'Display name for meeting invitee. The maximum length of `displayName` is 128 characters. In the Webex app, if the email has been associated with an existing Webex account, the display name associated with the Webex account will be used; otherwise, the `email` will be used as `displayName`. In a Webex site, if `displayName` is specified, it will show `displayName`. If `displayName` is not specified, and the `email` has been associated with an existing Webex account, the display name associated with the Webex account will be used; otherwise, the `email` will be used as `displayName`.


            If the invitee has an existing Webex account, the `displayName` shown in the meeting will be the `displayName` associated with the Webex account; otherwise, `displayName` shown in the meeting will be the `displayName` which is specified by the invitee who does not have a Webex account.'
        coHost:
          type: boolean
          description: Whether or not the invitee is a designated alternate host for the meeting. See [Add Alternate Hosts for Cisco Webex Meetings](https://help.webex.com/b5z6he/) for more details.
        hostEmail:
          type: string
          example: brenda.song@example.com
          description: Email address for the meeting host. This attribute should only be set if the user or application calling the API has the admin on-behalf-of scopes. When used, the admin may specify the email of a user in a site they manage to be the meeting host.
        sendEmail:
          type: boolean
          example: true
          description: If `true`, send an email to the invitee.
        panelist:
          type: boolean
          description: If `true`, the invitee is a designated panelist for the event meeting.
    GetInviteeObject:
      type: object
      required:
      - id
      - email
      - displayName
