components:
  schemas:
    UpdateSnippetObject:
      type: object
      required:
      - text
      properties:
        reason:
          type: string
          example: audit
          description: Reason for snippet update; only required for Compliance Officers.
        text:
          type: string
          example: Hello everybody
          description: Text for the snippet.
    SnippetObject:
      type: object
      required:
      - id
      - text
      - personName
      - personEmail
      - offsetMillisecond
      - durationMillisecond
      properties:
        id:
          type: string
          example: 195d64646ad14be2924ea50f541fd91d_00001
          description: A unique identifier for the snippet.
        text:
          type: string
          example: Hello everyone
          description: Text for the snippet.
        personName:
          type: string
          example: John Andersen
          description: Name of the person generating the speech for the snippet.
        personEmail:
          type: string
          example: john.andersen@example.com
          description: Email address of the person generating the speech for the snippet.
        offsetMillisecond:
          type: number
          example: 1000
          description: Offset from the beginning of the parent transcript in milliseconds indicating the start time of the snippet.
        durationMillisecond:
          type: number
          example: 2000
          description: Duration of the snippet in milliseconds.
    TranscriptObject:
      type: object
      required:
      - id
      - siteUrl
      - startTime
      - meetingTopic
      - meetingId
      - scheduledMeetingId
      - hostUserId
      - vttDownloadLink
      - txtDownloadLink
      - status
      properties:
        id:
          type: string
          example: 195d64646ad14be2924ea50f541fd91d
          description: A unique identifier for the transcript.
        siteUrl:
          type: string
          example: example.webex.com
          description: URL of the Webex site from which the API lists meeting transcripts.
        startTime:
          type: string
          example: '2020-06-01T20:30:15.042Z'
          description: Start time for the meeting transcript in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format.
        meetingTopic:
          type: string
          example: John's Meeting
          description: The meeting's topic.
        meetingId:
          type: string
          example: 0ed74a1c0551494fb7a04e2881bf50ae_I_166022169160077044
          description: Unique identifier for the [meeting instance](/docs/meetings#meeting-series-scheduled-meetings-and-meeting-instances) to which the transcripts belong.
        scheduledMeetingId:
          type: string
          example: 0ed74a1c0551494fb7a04e2881bf50ae_20210401T232500Z
          description: Unique identifier for scheduled meeting with which the current meeting is associated. Only apples to a meeting instance which is happening or has happened. This is the `id` of the scheduled meeting with which the instance is associated.
        meetingSeriesId:
          type: string
          example: 0ed74a1c0551494fb7a04e2881bf50ae
          description: Unique identifier for the parent meeting series to which the recording belongs.
        hostUserId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS83QkFCQkU5OS1CNDNFLTREM0YtOTE0Ny1BMUU5RDQ2QzlDQTA
          description: Unique identifier for the meeting host.
        vttDownloadLink:
          type: string
          example: http://site-example.webex.com/v1/meetingTranscripts/195d64646ad14be2924ea50f541fd91d/download?format=vtt
          description: The download link for the transcript vtt file.
        txtDownloadLink:
          type: string
          example: http://site-example.webex.com/v1/meetingTranscripts/195d64646ad14be2924ea50f541fd91d/download?format=txt
          description: The download link for the transcript txt file.
        status:
          type: string
          enum:
          - available
          - deleted
          description: " * `available` - Transcript is available.\n * `deleted` - Transcript has been deleted.\n"
    DeleteTranscriptObject:
      type: object
      properties:
        reason:
          type: string
          example: audit
          description: Reason for deleting a transcript. Only required when a Compliance Officer is operating on another user's transcript.
        comment:
          type: string
          example: Maintain data privacy
          description: Explanation for deleting a transcript. The comment can be a maximum of 255 characters long.
