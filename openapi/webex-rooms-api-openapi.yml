      summary: Create a Room
      operationId: Create a Room
      description: 'Creates a room. The authenticated user is automatically added as a member of the room. See the [Memberships
        API](/docs/api/v1/memberships) to learn how to add more people to the room.


        To create a 1:1 room, use the [Create Messages](/docs/api/v1/messages/create-a-message) endpoint to send a message
        directly to another person by using the `toPersonId` or `toPersonEmail` parameters.


        Bots are not able to create and simultaneously classify a room. A bot may update a space classification after a person
        of the same owning organization joined the space as the first human user.

        A space can only be put into announcement mode when it is locked.'
      tags:
      - Rooms
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              title: Project Unicorn - Sprint 0
              teamId: Y2lzY29zcGFyazovL3VzL1JPT00vNjRlNDVhZTAtYzQ2Yi0xMWU1LTlkZjktMGQ0MWUzNDIxOTcz
              classificationId: Y2lzY29zcGFyazovL3VzL0NMQVNTSUZJQ0FUSU9OL2YyMDUyZTgyLTU0ZjgtMTFlYS1hMmUzLTJlNzI4Y2U4ODEyNQ
              isLocked: false
              isPublic: false
              description: Company Announcements
              isAnnouncementOnly: false
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                  example: Project Unicorn - Sprint 0
                  description: A user-friendly name for the room.
                teamId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1JPT00vNjRlNDVhZTAtYzQ2Yi0xMWU1LTlkZjktMGQ0MWUzNDIxOTcz
                  description: The ID for the team with which this room is associated.
                classificationId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL0NMQVNTSUZJQ0FUSU9OL2YyMDUyZTgyLTU0ZjgtMTFlYS1hMmUzLTJlNzI4Y2U4ODEyNQ
                  description: The `classificationId` for the room.
                isLocked:
                  type: boolean
                  description: Set the space as locked/moderated and the creator becomes a moderator
                isPublic:
                  type: boolean
                  description: The room is public and therefore discoverable within the org. Anyone can find and join that
                    room. When `true` the `description` must be filled in.
                description:
                  type: string
                  example: Company Announcements
                  description: The description of the space.
                isAnnouncementOnly:
                  type: boolean
                  description: Sets the space into announcement Mode.
