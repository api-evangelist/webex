      summary: List Rooms
      operationId: List Rooms
      description: 'List rooms to which the authenticated user belongs to.


        The `title` of the room for 1:1 rooms will be the display name of the other person. Please use the [memberships API](https://developer.webex.com/docs/api/v1/memberships)
        to list the people in the space.


        Long result sets will be split into [pages](/docs/basics#pagination).


        Known Limitations:

        The underlying database does not support natural sorting by `lastactivity` and will only sort on limited set of results,
        which are pulled from the database in order of `roomId`. For users or bots in more than 3000 spaces this can result
        in anomalies such as spaces that have had recent activity not being returned in the results when sorting by `lastacivity`.'
      tags:
      - Rooms
      parameters:
      - name: teamId
        in: query
        description: List rooms associated with a team, by ID. Cannot be set in combination with `orgPublicSpaces`.
        example: Y2lzY29zcGFyazovL3VzL1JPT00vNjRlNDVhZTAtYzQ2Yi0xMWU1LTlkZjktMGQ0MWUzNDIxOTcz
        schema:
          type: string
      - name: type
        in: query
        description: List rooms by type. Cannot be set in combination with `orgPublicSpaces`.
        example: group
        schema:
          type: string
          enum:
          - direct
          - group
      - name: orgPublicSpaces
        in: query
        description: Shows the org's public spaces joined and unjoined. When set the result list is sorted by the `madePublic`
          timestamp.
        example: 'true'
        schema:
          type: boolean
      - name: from
        in: query
        description: Filters rooms, that were made public after this time. See `madePublic` timestamp
        example: '2022-10-10T17:00:00.000Z'
        schema:
          type: string
      - name: to
        in: query
        description: Filters rooms, that were made public before this time. See `maePublic` timestamp
        example: '2022-10-11T17:00:00.000Z'
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort results. Cannot be set in combination with `orgPublicSpaces`.
        example: id
        schema:
          type: string
          enum:
          - id
          - lastactivity
          - created
      - name: max
        in: query
        description: Limit the maximum number of rooms in the response. Value must be between 1 and 1000, inclusive.
        example: '100'
        schema:
          type: number
          default: 100
