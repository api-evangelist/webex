      description: 'Shows details for a room, by ID.


        The `title` of the room for 1:1 rooms will be the display name of the other person. When a Compliance Officer lists
        1:1 rooms, the "other" person cannot be determined. This means that the room''s title may not be filled in and instead
        shows "Empty Title". Please use the [memberships API](https://developer.webex.com/docs/api/v1/memberships) to list
