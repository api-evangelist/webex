      summary: Update a Room
      operationId: Update a Room
      description: 'Updates details for a room, by ID.


        Specify the room ID in the `roomId` parameter in the URI.

        A space can only be put into announcement mode when it is locked.

        Any space participant or compliance officer can convert a space from public to private. Only a compliance officer
        can convert a space from private to public and only if the space is classified with the lowest category (usually `public`),
        and the space has a description.

        To remove a `description` please use a space character ` ` by itself.


        <div><Callout type="info">When using this method for moving a space under a team, ensure that all moderators in the
        space are also team members. If a moderator is not part of the team, demote or remove them as a moderator. Alternatively,
        add the non-team moderators to the team. This ensures compliance with the requirement that all space moderators must
        be team members for successful operation execution.

        </Callout></div>


        <div><Callout type="info">A Compliance Officer who is not a member of a space can only update the `classificationId`,
        `isAnnouncementOnly`, `description`, and `isPublic` fields.

        </Callout></div>'
      tags:
      - Rooms
      parameters:
      - name: roomId
        in: path
        description: The unique identifier for the room.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              title: Project Unicorn - Sprint 0
              classificationId: Y2lzY29zcGFyazovL3VzL0NMQVNTSUZJQ0FUSU9OL2YyMDUyZTgyLTU0ZjgtMTFlYS1hMmUzLTJlNzI4Y2U4ODEyNQ
              teamId: Y2lzY29zcGFyazovL3VzL1RFQU0vZWUwMWIxMzAtMjJlYi0xMWVjLTg5MTktMGY0NjdjMGNlZmFk
              isLocked: false
              isPublic: false
              description: Company Announcements
              isAnnouncementOnly: false
              isReadOnly: false
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                  example: Project Unicorn - Sprint 0
                  description: A user-friendly name for the room.
                classificationId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL0NMQVNTSUZJQ0FUSU9OL2YyMDUyZTgyLTU0ZjgtMTFlYS1hMmUzLTJlNzI4Y2U4ODEyNQ
                  description: The classificationId for the room.
                teamId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1RFQU0vZWUwMWIxMzAtMjJlYi0xMWVjLTg5MTktMGY0NjdjMGNlZmFk
                  description: The teamId to which this space should be assigned. Only unowned spaces can be assigned to a
                    team. Assignment between teams is unsupported.
                isLocked:
                  type: boolean
                  description: Set the space as locked/moderated and the creator becomes a moderator
                isPublic:
                  type: boolean
                  description: The room is public and therefore discoverable within the org. Anyone can find and join that
                    room. When `true` the `description` must be filled in.
                description:
                  type: string
                  example: Company Announcements
                  description: The description of the space.
                isAnnouncementOnly:
                  type: boolean
                  description: Sets the space into Announcement Mode or clears the Anouncement Mode (`false`)
                isReadOnly:
                  type: boolean
                  description: A compliance officer can set a direct room as read-only, which will disallow any new information
                    exchanges in this space, while maintaing historical data.
