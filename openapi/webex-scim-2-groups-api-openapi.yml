      summary: Get Group Members
      operationId: Get Group Members
      description: 'Returns the members of a group.


        - The default maximum number of members returned is 500.


        - Control parameters are available to page through the members and to control the size of the results.


        - Long result sets are split into [pages](/docs/basics#pagination).


        **Note**

        Location groups are different from SCIM groups. You cannot search for identities in a location via groups.


        <br/>


        **Authorization**


        OAuth token returned by the Identity Broker.


        <br/>


        One of the following OAuth scopes is required:


        - `identity:people_rw`


        - `identity:people_read`


        <br/>


        The following administrators can use this API:


        - `id_full_admin`


        - `id_group_admin`


        - `id_readonly_admin`


        - `id_device_admin`'
      tags:
      - SCIM 2 Groups
      parameters:
      - name: orgId
        in: path
        description: The ID of the organization to which this group belongs. If not specified, the organization ID from the OAuth token is used.
        required: true
        example: e9f9ab27-0459-4cd0-bd72-089bde5a7da6
        schema:
          type: string
      - name: groupId
        in: path
        description: A unique identifier for the group.
        required: true
        example: cb8f48e4-5db2-496b-b43d-83d8d5a2a4b3
        schema:
          type: string
      - name: startIndex
        in: query
        description: The index to start for group pagination.
        example: 1
        schema:
          type: number
      - name: count
        in: query
        description: Non-negative integer that specifies the desired number of search results per page. The maximum value for the count is 500.
        example: 100
        schema:
          type: number
      - name: memberType
        in: query
        description: 'Filter the members by member type. Sample data: `user`, `machine`, `group`.'
        example: user
        schema:
          type: string
