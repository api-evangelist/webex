tags:
- name: Journey - Workspace management API
paths:
  /admin/v1/api/workspace/workspace-id/{workspaceId}:
    get:
      tags:
      - Journey - Workspace management API
      summary: Get Workspace
      description: Get workspace details. Use the cjp scope if you have a contact center license; otherwise, use the cjds
        scope. It requires the appropriate cjds:admin_org_read or cjds:admin_org_write scopes or cjp:config_read or cjp:config_write
        scopes
      operationId: getWorkspaceById
      parameters:
      - name: workspaceId
        in: path
        description: Workspace ID
        required: true
        schema:
          type: string
        example: 6377dafe02e7cc19b03a71b7
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError409'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError429'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError500'
      security:
      - bearerAuth: []
    put:
      tags:
      - Journey - Workspace management API
      summary: Update Workspace
      description: Update workspace by Id. Use the cjp scope if you have a contact center license; otherwise, use the cjds
        scope. It requires the appropriate cjds:admin_org_write or cjp:config_write scopes
      operationId: updateWorkspaceById
      parameters:
      - name: workspaceId
        in: path
        description: Workspace ID
        required: true
        schema:
          type: string
        example: 6377dafe02e7cc19b03a71b7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequestModel'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '409':
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError409'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError429'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError500'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Journey - Workspace management API
      summary: Delete Workspace
      description: Delete Workspace By Id. Use the cjp scope if you have a contact center license; otherwise, use the cjds
        scope. It requires the appropriate cjds:admin_org_write or cjp:config_write scopes
      operationId: deleteWorkspaceById
      parameters:
      - name: workspaceId
        in: path
        description: Workspace ID
        required: true
        schema:
          type: string
        example: 6377dafe02e7cc19b03a71b7
      responses:
        '200':
