components:
  schemas:
    HydraClassification:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NMQVNTSUZJQ0FUSU9OL2YyMDUyZTgyLTU0ZjgtMTFlYS1hMmUzLTJlNzI4Y2U4ODEyNQ
          description: Unique identifier for the org's Space Classification
        rank:
          type: number
          description: Represents the rank of the classification. A number from 0 to 4, in which 0 usually refers to "public", and is the default whenever a rank cannot be determined.
        title:
          type: string
          example: Public
          description: Represents the classification title to be displayed in classified spaces for org users.
        enabled:
          type: boolean
          example: true
          description: Space Classification enabled state.
        description:
          type: string
          example: Does not contain private information
          description: Classification's description.
        lastModified:
          type: string
          example: '2020-02-22T00:06:42.438Z'
          description: The date and time the Space Classification was last changed.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
          description: A unique identifier for the Webex organization.
    OrganizationsSpaceClassificationCollectionResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HydraClassification'
