      summary: Create an ECM folder configuration
      operationId: Create an ECM folder configuration
      description: Adds an existing ECM folder to a room as (default or reference) file storage. There is no data validation
        happening for the request. Please ensure the correct `driveId` and `itemId.` These can be collected from the MS Graph
        API. The `contentUrl` and `displayName` are used only for user convenience. The folder will be configured with the
        MS folder name as `displayName`, and the `contentURL` may be updated or corrected as needed. To assess final configuration,
        please make a GET request on the linkedFolder.
      tags:
      - ECM folder linking
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              roomId: Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
              contentUrl: https://cisco-my.sharepoint.com/personal/naalluri/123
              displayName: OneDrive folder for shared documents
              driveId: '123'
              itemId: '456'
              defaultFolder: 'false'
            schema:
              type: object
              required:
              - roomId
              - contentUrl
              - displayName
              - driveId
              - itemId
              - defaultFolder
              properties:
                roomId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
                  description: A unique identifier for the room.
                contentUrl:
                  type: string
                  example: https://cisco-my.sharepoint.com/personal/naalluri/123
                  description: URL of the ECM folder.
                displayName:
                  type: string
                  example: OneDrive folder for shared documents
                  description: This should match the folder name in the ECM backend.
                driveId:
                  type: string
                  example: '123'
                  description: Sharepoint or OneDrive drive id. It can be queried via MS Graph APIs.
                itemId:
                  type: string
                  example: '456'
                  description: Sharepoint or OneDrive item id. It can be queried via MS Graph APIs.
                defaultFolder:
                  type: string
                  example: 'false'
                  description: Makes the folder the default storage for the space.
