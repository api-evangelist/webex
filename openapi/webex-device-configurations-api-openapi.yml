      summary: Update Device Configurations
      operationId: Update Device Configurations
      description: Edit configurations for the device specified by device ID.
      tags:
      - Device Configurations
      parameters:
      - name: deviceId
        in: query
        description: Update device configurations by device ID.
        required: true
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMl9hL0RFVklDRS9hNmYwYjhkMi01ZjdkLTQzZDItODAyNi0zM2JkNDg3NjYzMTg=
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            example:
            - op: replace
              path: Audio.Ultrasound.MaxVolume/sources/configured/value
              value: 50
            - op: remove
              path: Conference.MaxReceiveCallRate/sources/configured/value
            schema:
              type: object
              properties:
                op:
                  type: string
                  enum:
                  - remove
                  - replace
                  description: " * `remove` - Remove the configured value and revert back to the default from schema, if present.\n * `replace` - Set the configured value.\n"
                path:
                  type: string
                  example: Audio.Ultrasound.MaxVolume/sources/configured/value
                  description: Only paths ending in `/sources/configured/value` are supported.
components:
  schemas:
    DeviceConfiguration:
      type: object
      properties:
        configuration_key:
          type: object
          properties:
            source:
              type: string
              enum:
              - default
              - configured
              description: "The source of the current value that is applied to the device.\n * `default` - Current value comes from the schema default.\n * `configured` - Current value comes from configuredValue.\n"
            sources:
              type: object
              properties:
                default:
                  type: object
                  properties:
                    editability:
                      type: object
                      properties:
                        isEditable:
                          type: boolean
                          description: Whether or not the value is editable on this source (always `false` for `default`).
                        reason:
                          type: string
                          example: FACTORY_DEFAULT
                          description: The reason value is not editable on this source (always `FACTORY_DEFAULT` for `default`).
                configured:
                  type: object
                  properties:
                    editability:
                      type: object
                      properties:
                        isEditable:
                          type: boolean
                          example: true
                          description: Whether or not the value is editable on this source.
                        reason:
                          type: string
                          enum:
                          - NOT_AUTHORIZED
                          - CONFIG_MANAGED_BY_DIFFERENT_AUTHORITY
                          description: "The reason the value is not editable on this source.\n * `NOT_AUTHORIZED` - User is not authorized to edit any values.\n * `CONFIG_MANAGED_BY_DIFFERENT_AUTHORITY` - The configuration is managed by a different authority. For example `CUCM`.\n"
            valueSpace:
              type: object
              properties: {}
              description: '[JSON Schema](http://json-schema.org/) describing the data format of the configuration as specified by the device.'
          description: Key of the configuration.
    DeviceConfigurationCollectionResponse:
      type: object
      required:
      - deviceId
      properties:
        deviceId:
          type: string
          example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMl9hL0RFVklDRS9hNmYwYjhkMi01ZjdkLTQzZDItODAyNi0zM2JkNDg3NjYzMTg=
          description: ID of the device that the configurations are for.
        items:
          $ref: '#/components/schemas/DeviceConfiguration'
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 Bearer token authentication
      flows:
        authorizationCode:
          authorizationUrl: https://webexapis.com/v1/authorize
          tokenUrl: https://webexapis.com/v1/access_token
          scopes:
            spark:applications_token: Create access tokens for Service Apps
