      summary: Query Archive User
      operationId: queryArchiveUser
      description: 'Retrieves archived user information for the specified organization. Supported attributes are `id`, which is the unique identifier of a user in the system, and `username`. It is assigned when the user is created and can be retrieved through **GET Users** API.<br/>


        **Authorization**


        OAuth token issued by the Identity Broker.


        One of the following OAuth scopes is required:


        - `identity:people_rw`.

        - `identity:people_read`.


        The following administrators can use this API:


        - `Account in the specified organization with one of the following roles: id_full_admin, id_user_admin, id_readonly_admin`.

        - `Proxy account managing the specified organization with one of the following roles: id_full_admin, id_user_admin, id_readonly_admin`.


        <br/>'
      tags:
      - Archive Users
      parameters:
      - name: orgId
        in: path
        description: The unique identifier for the organization.
        required: true
        example: 410139c6-3bff-4404-9782-09a456ba2cae
        schema:
          type: string
      - name: filter
        in: query
        description: 'A SCIM-style filter expression used to search archived users. Supported attributes are `username` and `id`, and only the `eq` operator is supported.


          Examples:


          - `username eq "test_user_1@example.com"`

          - `id eq "40929cc6-2df2-4ab5-871c-ec8e38f07b93"`'
        required: true
        example: username eq "test_user_1@example.com"
        schema:
          type: string
