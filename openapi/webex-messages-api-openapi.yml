      summary: List Direct Messages
      operationId: List Direct Messages
      description: 'List all messages in a 1:1 (direct) room. Use the `personId` or `personEmail` query parameter to specify the room. Each message will include content attachments if present.


        The list sorts the messages in descending order by creation date.'
      tags:
      - Messages
      parameters:
      - name: parentId
        in: query
        description: List messages with a parent, by ID.
        example: Y2lzY29zcGFyazovL3VzL01FU1NBR0UvZWM1ZTIzZjAtN2RhMS0xMWU5LTg2NTgtZTkzYzNiODZjZmFm
        schema:
          type: string
      - name: personId
        in: query
        description: List messages in a 1:1 room, by person ID.
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
        schema:
          type: string
      - name: personEmail
        in: query
        description: List messages in a 1:1 room, by person email.
        example: matt@example.com
        schema:
          type: string
  /messages/{messageId}:
    put:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
