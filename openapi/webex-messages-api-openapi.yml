      summary: Delete a Meeting Message
      operationId: Delete a Meeting Message
      description: 'Deletes a Meeting Message from the In Meeting Chat, using its ID.


        This ID can be retrieved by a Compliance Officer using the [events API](/docs/api/v1/events/list-events) filtering on the `meetingMessages` resource type.


        NOTE: When viewing the response from the events API, there are 2 `id` fields. The ID to be used here can be found under the `data` field in the response.


        Specify the `meetingMessage` ID in the `meetingMessageId` parameter in the URI.'
      tags:
      - Messages
      parameters:
      - name: meetingMessageId
        in: path
        description: The unique identifier for the message.
        required: true
        example: Y2lzY29zcGFyazovL3VzL01FRVRJTkdfTUVTU0FHRS85MmRiM2JlMC00M2JkLTExZTYtOGFlOS1kZDViM2RmYzU2NWQ
        schema:
          type: string
