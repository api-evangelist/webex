      summary: List Messages
      operationId: List Messages
      description: 'Lists all messages in a room.  Each message will include content attachments if present.


        The list sorts the messages in descending order by creation date.


        Long result sets will be split into [pages](/docs/basics#pagination).'
      tags:
      - Messages
      parameters:
      - name: roomId
        in: query
        description: List messages in a room, by ID.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
        schema:
          type: string
      - name: parentId
        in: query
        description: List messages with a parent, by ID.
        example: Y2lzY29zcGFyazovL3VzL01FU1NBR0UvZWM1ZTIzZjAtN2RhMS0xMWU5LTg2NTgtZTkzYzNiODZjZmFm
        schema:
          type: string
      - name: mentionedPeople
        in: query
        description: List messages with these people mentioned, by ID. Use `me` as a shorthand for the current API user. Only `me` or the person ID of the current user may be specified. Bots must include this parameter to list messages in group rooms (spaces).
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8yNDlmNzRkOS1kYjhhLTQzY2EtODk2Yi04NzllZDI0MGFjNTM
        schema:
          type: array
          items:
            type: string
            example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8yNDlmNzRkOS1kYjhhLTQzY2EtODk2Yi04NzllZDI0MGFjNTM
          description: List messages with these people mentioned, by ID. Use `me` as a shorthand for the current API user. Only `me` or the person ID of the current user may be specified. Bots must include this parameter to list messages in group rooms (spaces).
      - name: before
        in: query
        description: List messages sent before a date and time.
        example: '2016-04-21T19:01:55.966Z'
        schema:
          type: string
      - name: beforeMessage
        in: query
        description: List messages sent before a message, by ID.
        example: Y2lzY29zcGFyazovL3VzL01FU1NBR0UvOTJkYjNiZTAtNDNiZC0xMWU2LThhZTktZGQ1YjNkZmM1NjVk
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of messages in the response. Cannot exceed 100 if used with `mentionedPeople`.
        example: '100'
        schema:
          type: number
          default: 50
