      summary: Create a Room Tab
      operationId: Create a Room Tab
      description: Add a tab with a specified URL to a room.
      tags:
      - Room Tabs
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              roomId: Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
              contentUrl: https://www.cisco.com
              displayName: Cisco HomePage
            schema:
              type: object
              required:
              - roomId
              - contentUrl
              - displayName
              properties:
                roomId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
                  description: A unique identifier for the room.
                contentUrl:
                  type: string
                  example: https://www.cisco.com
                  description: URL of the Room Tab. Must use `https` protocol.
                displayName:
                  type: string
                  example: Cisco HomePage
                  description: User-friendly name for the room tab.
