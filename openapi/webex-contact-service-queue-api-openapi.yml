    SkillBasedCSQDTO:
      type: object
      description: Contact service queue projection enriched with skill-based routing metadata. Returned by the skill-profile lookup endpoints (`/contact-service-queue/by-skill-profile-id/{id}` and `/contact-service-queue/internal/by-skill-profile-id/{id}`). Extends MappedCSQDTO with the score and match flags computed while evaluating the queue's skill requirements against the caller's skill profile and dynamic skills.
      example:
        id: 26e2df70-0f77-41b8-8e8f-1d76e92c9638
        name: SupportQueue
        channelType: TELEPHONY
        skillScore: 85
        qsrType: PROFICIENCY
        dynamicSkillScore: 70
        skillProfileSkillsMatch: true
        dynamicSkillsMatch: true
      properties:
        organizationId:
          type: string
          format: uuid
          description: ID of the contact center organization. This field is required for all bulk save operations.
          example: f53c8b54-46ca-43f6-ba05-08426a46e23d
          maxLength: 36
          minLength: 32
          pattern: ^[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}$
        id:
          type: string
          format: uuid
          description: Unique identifier of the contact service queue.
          example: 26e2df70-0f77-41b8-8e8f-1d76e92c9638
        version:
          type: integer
          format: int32
          description: The version of this resource. For a newly created resource, it will be 0 unless specified otherwise.
          example: 1
        channelType:
          type: string
          description: Channel type of the contact service queue (for example, `TELEPHONY`, `CHAT`, `EMAIL`, `SOCIAL`).
          example: TELEPHONY
        name:
          type: string
          description: Display name of the contact service queue.
          example: SupportQueue
        skillScore:
          type: integer
          format: int32
          description: Aggregated score (0-100) of how well the queue's static skill requirements match the caller's skill profile. Higher is a better match.
          example: 85
        qsrType:
          type: string
          description: 'Type of queue skill requirement evaluated. Typical values: `PROFICIENCY`, `TEXT`, `BOOLEAN`, `ENUM`.'
          example: PROFICIENCY
        dynamicSkillScore:
          type: integer
          format: int32
          description: Aggregated score (0-100) of how well the queue's dynamic skill requirements match the caller's supplied dynamic skill values.
          example: 70
        skillProfileSkillsMatch:
          type: boolean
          description: '`true` if every static skill requirement defined on the queue is satisfied by the caller''s skill profile.'
          example: true
        dynamicSkillsMatch:
          type: boolean
          description: '`true` if every dynamic skill requirement defined on the queue is satisfied by the caller''s dynamic skill values.'
          example: true
        createdTime:
          type: integer
          format: int64
          description: This is the created time of the entity.
          example: 123456789
        lastUpdatedTime:
          type: integer
          format: int64
          description: This is the updated time of the entity.
          example: 123456789
