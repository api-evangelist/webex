        version:
          type: integer
          format: int32
          description: The version of this resource. For a newly created resource, it will be 0 unless specified otherwise.
          example: 1
        channelType:
          type: string
          description: The channel type of the queue.
        name:
          type: string
          description: Name of the Contact Service Queue.
        skillScore:
          type: integer
          format: int32
          description: The skill score for matching this queue.
        qsrType:
          type: string
          description: The queue skill requirement type.
        dynamicSkillScore:
          type: integer
          format: int32
          description: The dynamic skill score for matching this queue.
        skillProfileSkillsMatch:
