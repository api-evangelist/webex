    QueuePersonalizedAIRoutingDTO:
      type: object
      description: Queue-level Personalized AI Routing configuration. Enables intelligent agent routing based on AI/ML predictions.
      properties:
        aiRoutingMode:
          type: string
          default: NONE
          description: 'AI Routing mode. Valid transitions: NONE → EVALUATION; EVALUATION → ACTIVE or NONE; ACTIVE → NONE. NONE: AI routing disabled (default). EVALUATION: Shadow mode - AI predictions are generated but not used for routing (for testing/validation). ACTIVE: AI routing enabled - contacts are routed based on AI predictions.'
          enum:
          - NONE
          - EVALUATION
          - ACTIVE
          example: EVALUATION
        aiRoutingKPIId:
          type: string
          description: AI Routing KPI ID - the performance metric used by AI to optimize routing decisions. This should reference a valid KPI configured in the AI routing system. Required when aiRoutingMode is EVALUATION or ACTIVE.
          example: 63beec53-8a61-489f-afc6-bb03c8c73834
        evaluationModeStartTime:
          type: integer
          format: int64
          description: Timestamp (epoch milliseconds) when EVALUATION mode was activated. Automatically set by the system when transitioning from NONE to EVALUATION. Used to track evaluation duration and readiness for ACTIVE mode transition.
          example: 1730269619000
          readOnly: true
    QueueAgentsDTO_2:
      type: object
      properties:
        id:
          type: string
          description: Id of an agent in WxCC
          example: b0503c7f-d13c-4d74-9eb5-64f3c818b8c7
        ciUserId:
          type: string
          description: Id of an agent in Common Identity
          example: c71876ae-ddfa-4049-9a1b-298535152578
      required:
      - id
    ContactServiceQueueDTOList:
      type: object
      description: Contact Service Queue schema.
      properties:
        organizationId:
          type: string
          format: uuid
          description: ID of the contact center organization. This field is required for all bulk save operations.
          example: f53c8b54-46ca-43f6-ba05-08426a46e23d
          maxLength: 36
          minLength: 32
          pattern: ^[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}$
        id:
          type: string
          description: ID of this contact center resource. It should not be specified when creating a new resource. However, it is mandatory when updating a resource.
          example: 93912f11-6017-404b-bf14-5331890b1797
        version:
          type: integer
          format: int32
          description: The version of this resource. For a newly created resource, it will be 0 unless specified otherwise.
          example: 1
        name:
          type: string
          description: Name of the Contact Service Queue
          example: Queue-1
        description:
          type: string
          description: (Optional) A short description of the queue.
          example: Queue created by system
        queueType:
          type: string
          description: 'This can be the following


            INBOUND


            OUTBOUND'
          enum:
          - INBOUND
          - OUTBOUND
          example: INBOUND
        checkAgentAvailability:
          type: boolean
          description: This setting specifies whether the system can exclude teams with no logged in agents for the relevant routing strategies. It does not support Social Channel Type.
          example: true
        channelType:
          type: string
          description: "Setting to indicate the channel type. Use uppercase. Supported channel types are: \n\n TELEPHONY, EMAIL, SOCIAL_CHANNEL, and CHAT. \n\nFor TELEPHONY channelType, the following fields are mandatory - recordingPermitted, ivrRequeueUrl, recordingAllCallsPermitted, monitoringPermitted, parkingPermitted, pauseRecordingPermitted, controlFlowScriptUrl, defaultMusicInQueueMediaFileId."
          enum:
          - TELEPHONY
          - EMAIL
          - FAX
          - CHAT
          - VIDEO
          - OTHERS
          - SOCIAL_CHANNEL
          - WORK_ITEM
          - CUSTOM_MESSAGING
          example: TELEPHONY
        socialChannelType:
          type: string
          description: 'This can be the following


            MESSAGEBIRD


            MESSENGER'
          enum:
          - MESSAGEBIRD
          - MESSENGER
          - WHATSAPP
          - APPLE_BUSINESS_CHAT
          - GOOGLE_BUSINESS_MESSAGES
          example: MESSENGER
        serviceLevelThreshold:
          type: integer
          format: int32
          description: The time in seconds that a customer request can be in a queue before the system flags it as outside the service level. It does not support Social Channel Type.
          example: 0
        maxActiveContacts:
          type: integer
          format: int32
          description: The maximum number of simultaneous contacts allowed for this queue. It does not support Social Channel Type.
          example: 5
        maxTimeInQueue:
          type: integer
          format: int32
          description: 'The time in seconds after which the system distributes the queued customer request to the overflow number that you provision for this queue. '
          example: 2
        defaultMusicInQueueMediaFileId:
          type: string
          description: "Identifies the default audio file which will be played for calls when they arrive or are waiting in queue. \nThis setting is available only for the Telephony channel type."
          example: defaultmusic_on_hold.wav
        timezone:
          type: string
          description: (Optional) Any routing strategy for this queue uses the time zone that you select here.
          example: America/New_York
        active:
          type: boolean
          description: Specify whether the queue is active or not active
          example: true
        outdialCampaignEnabled:
          type: boolean
          description: Should be specified only for outdial queues; if enabled, then Call Distribution and Queue Routing Type can be specified.
          example: true
        monitoringPermitted:
          type: boolean
          description: "Indicates whether or not monitoring is permitted. \nThis setting is available only for the Telephony channel type."
          example: true
        parkingPermitted:
          type: boolean
          description: "Indicates whether or not parking is permitted. \nThis setting is available only for the Telephony channel type."
          example: true
        recordingPermitted:
          type: boolean
          description: "Indicates whether or not recording is permitted. \nThis setting is available only for the Telephony channel type."
          example: true
        recordingAllCallsPermitted:
          type: boolean
          description: "Indicates whether or not recording all calls is permitted. \nThis setting is available only for the Telephony channel type."
          example: true
        pauseRecordingPermitted:
          type: boolean
          description: "Indicates whether or not pausing the recording is permitted. \nThis setting is available only for the Telephony channel type."
          example: true
        recordingPauseDuration:
          type: integer
          format: int32
          description: "The duration in seconds of pause in recording. \nThis setting is available only for the Telephony channel type."
          example: 2
        controlFlowScriptUrl:
          type: string
          description: 'The URL for the queue or the default control script of the queue. If you do not use the routing strategy module to configure the control script, the system automatically populates the URL.

            This setting is available only for the Telephony channel type.'
          example: https://flow-control.produs1.ciscoccservice.com/31f1c57f-4fa1-417b-b5c5-6feb6abea062/royal-enfield
        ivrRequeueUrl:
          type: string
          description: This setting is available only for the Telephony channel type.
          example: https://www.youtube.com
        overflowNumber:
          type: string
          description: 'The destination phone number to which the system distributes the customer calls when they exceed the Maximum Time in Queue that you have set in the routing strategy.

            This setting is applicable only for the Telephony channel type and it is optional.'
          example: '1245677'
        vendorId:
          type: string
          description: 'The unique alphanumeric string that maps this queue to the vendor.

            This setting is available only for the Telephony channel type and it is optional.'
          example: AB123CSDR
        routingType:
          type: string
          description: 'This can be one of the following


            LONGEST_AVAILABLE_AGENT


            SKILLS_BASED(skillBasedRoutingType is mandatory to define)'
          enum:
          - LONGEST_AVAILABLE_AGENT
          - SKILLS_BASED
          - CIRCULAR
          - LINEAR
          example: SKILLS_BASED
        skillBasedRoutingType:
          type: string
          description: 'This can be the following


            LONGEST_AVAILABLE_AGENT


            BEST_AVAILABLE_AGENT'
          enum:
          - LONGEST_AVAILABLE_AGENT
          - BEST_AVAILABLE_AGENT
          example: BEST_AVAILABLE_AGENT
        queueRoutingType:
          type: string
          description: 'This can be the following


            TEAM_BASED


            QUEUE_BASED'
          enum:
          - TEAM_BASED
          - SKILL_BASED
          - AGENT_BASED
          example: TEAM_BASED
        xspVersion:
          type: string
          description: (Optional) Used to subscribe for recording events.
          example: xsp-24.0
          maxLength: 80
          minLength: 0
        subscriptionId:
          type: string
          description: (Optional) Used to subscribe for recording events.
