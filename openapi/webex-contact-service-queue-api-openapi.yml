components:
  schemas:
    QueueSkillRequirementDTO_2:
      type: object
      description: Skill requirement for the queue
      properties:
        organizationId:
          type: string
          format: uuid
          description: ID of the contact center organization. This field is required for all bulk save operations.
          example: f53c8b54-46ca-43f6-ba05-08426a46e23d
          maxLength: 36
          minLength: 32
          pattern: ^[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}$
        id:
          type: string
          description: ID of this contact center resource. It should not be specified when creating a new resource. However, it is mandatory when updating a resource.
          example: 93912f11-6017-404b-bf14-5331890b1797
        version:
          type: integer
          format: int32
          description: The version of this resource. For a newly created resource, it will be 0 unless specified otherwise.
          example: 1
        skillId:
          type: string
          description: Skill ID reference
          example: af9eecc5-0472-4549-9a83-2afdae0d4ba0
          minLength: 1
        skillName:
          type: string
          description: Indicates the name of the skill. Once created, name cannot be modified.
          example: German Speaking
        skillType:
          type: string
          description: 'This can be of the following types


            PROFICIENCY: id = 0


            BOOLEAN: id = 1


            TEXT: id = 2


            ENUM: id = 3


            Once created, skillType cannot be modified.

            '
          example: BOOLEAN
        condition:
          type: string
          description: Indicates a value that represents a skill the agent has.
          example: IS_NOT
        skillValue:
          type: string
          description: A short textual description that represents a skill the agent has.
          example: Credit card SME
          minLength: 1
        weight:
          type: integer
          format: int32
          description: Weight for proficiency skill requirement
          example: 100
          maximum: 1000
        dynamicSkill:
          type: boolean
          description: Indicates whether the skill is a dynamic skill or not. Default value is false.
          example: false
        createdTime:
          type: integer
          format: int64
          description: This is the created time of the entity.
        lastUpdatedTime:
          type: integer
          format: int64
          description: This is the updated time of the entity.
      required:
      - condition
      - skillId
      - skillValue
    CallDistributionGroupDTO_2:
      type: object
      properties:
        agentGroups:
          type: array
          items:
            $ref: '#/components/schemas/AgentGroupDTO_2'
          uniqueItems: true
        order:
          type: integer
          format: int32
          description: The order of this call distribution group.
          example: 1
        duration:
          type: integer
          format: int32
          default: 0
          description: (Optional)The duration in seconds after which a contact in queue will be distributed to this group.
          example: 2
    MetaDataReferencesPagingInfo:
      title: MetaDataReferencesPagingInfo
      type: object
      properties:
        orgid:
          maxLength: 36
          minLength: 32
          pattern: ^[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}$
          type: string
          description: Org ID
          format: uuid
          example: 2f9eecc5-0472-4549-9a83-2afdae0d4ba1
        page:
          type: integer
          description: Current page number
          format: int32
          example: 1
        pageSize:
          type: integer
          description: Page size for current data set
          format: int32
          example: 100
        totalPages:
          type: integer
          description: Number of pages
          format: int32
          example: 1
        totalRecords:
          type: integer
          description: Total number of items
          format: int32
          example: 1000
        links:
          type: object
          description: Map of pagination links with self, next, prev, last and first
          example:
            next: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/cad-variable?page=2&pageSize=10
            last: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/cad-variable?page=3&pageSize=10
            prev: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/cad-variable?page=0&pageSize=10
            self: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/cad-variable?page=1&pageSize=10
            first: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/cad-variable?page=0&pageSize=10
        referencedEntities:
          type: array
          description: List of referenced entities
          example:
          - agent-profile
          - entrypoint
          items:
            type: string
        currentEntity:
          type: string
          description: Name of current entity
          example: entity_name
      description: Metadata of response for references with paging information
    DynamicSkillDTO:
      type: object
      description: Data transfer object representing a dynamic skill assignment with its value
      properties:
        skillId:
          type: string
          description: The unique identifier of the dynamic skill
          example: f53c8b54-46ca-43f6-ba05-08426a46e23d
        textValue:
          type: string
          description: Text value for text-type dynamic skills
          example: Sample text skill value
        booleanValue:
          type: boolean
          description: Boolean value for boolean-type dynamic skills
          example: true
        proficiencyValue:
          type: integer
          format: int32
          description: 'Proficiency value for proficiency-type dynamic skills (range: 0-10)'
          example: 7
        enumSkillValues:
          type: array
          description: Set of enumerated skill values for enum-type dynamic skills
          example:
          - SKILL_VALUE_1
          - SKILL_VALUE_2
          items:
            type: string
            description: Enum Skill Value.
          uniqueItems: true
    ResponseEnvelopeMappedCSQDTO:
      type: object
      description: Response Envelope Mapped CSQ schema.
      properties:
        meta:
          type: object
          additionalProperties:
            description: Meta additional property.
          description: Additional properties for Meta.
        data:
          type: array
          description: List of Data.
          items:
            $ref: '#/components/schemas/MappedCSQDTO'
            description: Data item.
    SkillBasedQueueRequestDTO:
      type: object
      description: Request payload used to look up skill-based contact service queues. Supply skillProfileId together with either a userId (to scope by a specific agent) or a list of dynamicSkills (to scope by dynamic skill values). For endpoints that filter by userId, omit dynamicSkills; for endpoints that filter by dynamic skills, omit userId.
      example:
        skillProfileId: af9eecc5-0472-4549-9a83-2afdae0d4ba0
        userId: 660e0a5a-8230-47d7-ae98-047fb180e1ff
        dynamicSkills:
        - skillId: f53c8b54-46ca-43f6-ba05-08426a46e23d
          proficiencyValue: 7
      properties:
        skillProfileId:
          type: string
          format: uuid
          description: Unique identifier of the skill profile to look up queues for.
          example: af9eecc5-0472-4549-9a83-2afdae0d4ba0
        dynamicSkills:
          type: array
          description: Dynamic skill values used to further narrow down the matching skill-based queues. Used by the dynamic-skills lookup endpoint.
          items:
            $ref: '#/components/schemas/DynamicSkillDTO'
            description: Dynamic Skill.
        userId:
          type: string
          format: uuid
          description: Unique identifier of the user (agent) whose skill-based queues should be retrieved. Used by the user-and-skill-profile lookup endpoint.
          example: 660e0a5a-8230-47d7-ae98-047fb180e1ff
    BulkRequestItemDTOContactServiceQueueDTO:
      type: object
      description: List of items in the bulk request.
      properties:
        itemIdentifier:
          type: integer
          format: int32
          description: Unique item identifier for a bulk operation.
          example: 10
        item:
          $ref: '#/components/schemas/ContactServiceQueueDTO'
          description: Item.
        requestAction:
          type: string
          description: Identifier for action type. Possible values are `SAVE` and `DELETE`.
          example: SAVE
    SkillBasedCSQDTO_2:
      type: object
      description: Skill-based Contact Service Queue data transfer object.
      properties:
        organizationId:
          type: string
          format: uuid
