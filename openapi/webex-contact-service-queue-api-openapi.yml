        queueLevelSummariesInclusion:
          type: string
          description: 'Queue level summaries inclusion type. Used only when Queue inclusion for summaries is set to ''Specific Queues'' at the org level AI Assistant->Summaries configuration.

            During entity creation(single or bulk), if this parameter is not provided or null, default will be set to ''EXCLUDED''

            During entity update(single or bulk), if this parameter is not provided or null, the previous value will be retained.This is applicable/available only when AI Assistant add-on offer/license is added to the organization. If the value is missing in response, the consumer should assume a value as EXCLUDED.'
          example: INCLUDED
        queueLevelSentimentAnalysisInclusion:
          type: string
          description: 'Queue level sentiment analysis inclusion type. Used only when Queue inclusion for sentiment analysis is set to ''Specific Queues'' at the org level AI Assistant->Quality Management configuration.

            During entity creation(single or bulk), if this parameter is not provided or null, default will be set to ''EXCLUDED''

            During entity update(single or bulk), if this parameter is not provided or null, the previous value will be retained.This is applicable/available when either AI Assistant/AI Quality Management add-on offer/license is added to the organization. If the value is missing in response, the consumer should assume a value as EXCLUDED.'
          example: INCLUDED
        queueLevelPredictedWaitTimeInclusion:
          type: string
          description: 'Queue level predicted wait time inclusion type. Used only when Queue inclusion for predicted wait time is set to ''Specific Queues'' at the org level AI Assistant->Predicted Wait Time configuration.

            During entity creation(single or bulk), if this parameter is not provided or null, default will be set to ''EXCLUDED''

            During entity update(single or bulk), if this parameter is not provided or null, the previous value will be retained. If the value is missing in response, the consumer should assume a value as EXCLUDED.'
          example: INCLUDED
        queueLevelAutoCsatInclusion:
          type: string
          description: 'Queue level auto CSAT inclusion type. Used only when Queue inclusion for auto CSAT is set to ''Specific Queues'' at the org level AI Assistant->Auto CSAT configuration.

            During entity creation(single or bulk), if this parameter is not provided or null, default will be set to ''EXCLUDED''

            During entity update(single or bulk), if this parameter is not provided or null, the previous value will be retained.This is applicable/available when either AI Assistant/AI Quality Management add-on offer/license is added to the organization. If the value is missing in response, the consumer should assume a value as EXCLUDED.'
          example: INCLUDED
        queueLevelRealTimeTranscriptionsInclusion:
          type: string
          description: 'Queue level real time transcriptions inclusion type. Used only when Queue inclusion for real time transcriptions is set to ''Specific Queues'' at the org level AI Assistant->Real Time Transcriptions configuration.

            During entity creation(single or bulk), if this parameter is not provided or null, default will be set to ''EXCLUDED''

            During entity update(single or bulk), if this parameter is not provided or null, the previous value will be retained.This is applicable/available when either AI Assistant/AI Quality Management add-on offer/license is added to the organization. If the value is missing in response, the consumer should assume a value as EXCLUDED.'
          example: INCLUDED
