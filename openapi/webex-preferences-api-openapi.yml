      summary: Batch Refresh Personal Meeting Room ID
      operationId: Batch Refresh Personal Meeting Room ID
      description: 'Refreshes personal room IDs automatically according to the current personal room ID rule of the target site or by the values specified by the admin user.


        The new personal room IDs are generated by the site''s settings automatically if `systemGenerated` is true; otherwise, replace the existing personal room IDs with the specified values if `systemGenerated` is false or not specified.


        It may take up to 30 minutes to see the updated personal room ID on the Webex meeting page after refreshing the personal room ID due to cache.


        Either all items in `personalMeetingRoomIds` have `personalMeetingRoomId`, or they all have `systemGenerated` which equals true. `personalMeetingRoomId` and `systemGenerated: true` cannot be specified at the same time.


        The items in `personalMeetingRoomIds` either all have `personId` or all have `email` in a single request. Partial `personId` and partial `email` is not allowed in the same request.'
      tags:
      - Preferences
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              siteUrl: example.webex.com
              personalMeetingRoomIds:
              - email: john.andersen@example.com
                personalMeetingRoomId: prABCD23670651
              - email: marcus.hoffmann@example.com
                personalMeetingRoomId: prABCD99751428
              - email: brenda.song@example.com
                personalMeetingRoomId: prABCD56290641
            schema:
              $ref: '#/components/schemas/BatchRefreshPMRIDObject'
components:
  schemas:
    PMRIDResponseObject:
      type: object
      properties:
        email:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host whose personal room ID has been refreshed.
        personId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8yNWJiZjgzMS01YmU5LTRjMjUtYjRiMC05YjU5MmM4YTA4NmI
          description: Unique identifier for the meeting host whose personal room ID has been refreshed.
        personalMeetingRoomId:
          type: string
          example: prABCD23670651
          description: Refreshed personal room ID.
    PMRIDObject:
      type: object
      properties:
        email:
          type: string
          example: john.andersen@example.com
          description: Email address of the meeting host whose personal room ID will be refreshed.
        personId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8yNWJiZjgzMS01YmU5LTRjMjUtYjRiMC05YjU5MmM4YTA4NmI
          description: Unique identifier for the meeting host whose personal room ID will be refreshed.
        systemGenerated:
          type: boolean
          description: Whether or not to automatically refresh the personal room ID by the site's settings. Refresh the personal room ID by the site's settings automatically if `systemGenerated` is true; otherwise, replace the existing personal room ID with the specified value if `systemGenerated` is false or not specified.
        personalMeetingRoomId:
          type: string
          example: prABCD23670651
          description: New personal room ID specified by the admin user.
    PMRObject:
      type: object
      required:
      - topic
      - hostPin
      - personalMeetingRoomLink
      - enabledAutoLock
      - enabledNotifyHost
      - supportCoHost
      - sipAddress
      - dialInIpAddress
      - telephony
      properties:
        topic:
          type: string
          example: John's PMR
          description: Personal Meeting Room topic. The length of `topic` is between 1 and 128. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        hostPin:
          type: string
          example: '4325'
          description: PIN for joining the room as host. The host PIN must be digits of a predefined length, e.g. 4 digits. It cannot contain sequential digits, such as 1234 or 4321, or repeated digits of the predefined length, such as 1111. The predefined length for host PIN can be viewed in user's `My Personal Room` page and it can only be changed by site administrator. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        personalMeetingRoomLink:
          type: string
          example: https://site4-example.webex.com/meet/john
          description: 'Personal Meeting Room link. It cannot be empty. ***Note***: This is a read-only attribute.'
        enabledAutoLock:
          type: boolean
          description: Option to automatically lock the Personal Room a number of minutes after a meeting starts. When a room is locked, invitees cannot enter until the owner admits them. The period after which the meeting is locked is defined by `autoLockMinutes`. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        autoLockMinutes:
          type: number
          description: Number of minutes after which the Personal Room is locked if `enabledAutoLock` is enabled. Valid options are 0, 5, 10, 15 and 20. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        enabledNotifyHost:
          type: boolean
          description: Flag to enable notifying the owner of a Personal Room when someone enters the Personal Room lobby while the owner is not in the room. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        supportCoHost:
          type: boolean
          description: Flag allowing other invitees to host a meeting in the Personal Room without the owner. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        supportAnyoneAsCoHost:
          type: boolean
          description: Whether or not to allow any attendee with a host account on the target site to become a cohost when joining the Personal Room. The target site is user's preferred site. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        allowFirstUserToBeCoHost:
          type: boolean
          description: Whether or not to allow the first attendee with a host account on the target site to become a cohost when joining the Personal Room. The target site is user's preferred site. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        allowAuthenticatedDevices:
          type: boolean
          description: Whether or not to allow authenticated video devices in the user's organization to start or join the meeting without a prompt. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        coHosts:
          type: array
          items:
            type: object
            required:
            - email
            - displayName
            properties:
              email:
                type: string
                example: john.andersen@example.com
                description: Email address for cohost. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
              displayName:
                type: string
                example: John Andersen
                description: Display name for cohost. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
          description: Array defining cohosts for the room if both `supportAnyoneAsCoHost` and `allowFirstUserToBeCoHost` are `false`. This attribute can be modified with the [Update Personal Meeting Room Options](/docs/api/v1/meeting-preferences/update-personal-meeting-room-options) API.
        sipAddress:
          type: string
          example: john.andersen@example.com
          description: SIP address for callback from a video system.
        dialInIpAddress:
          type: string
          example: 192.168.100.100
          description: IP address for callback from a video system.
        telephony:
          type: object
          required:
          - accessCode
          - callInNumbers
          properties:
            accessCode:
              type: string
              example: '1234567890'
              description: Code for authenticating a user to join teleconference. Users join the teleconference using the call-in number or the global call-in number, followed by the value of the `accessCode`.
            callInNumbers:
              type: array
              items:
                type: object
                required:
                - label
                - callInNumber
                - tollType
                properties:
                  label:
                    type: string
                    example: Call-in toll-free number (US/Canada)
                    description: Label for call-in number.
                  callInNumber:
                    type: string
                    example: '123456789'
                    description: Call-in number to join teleconference from a phone.
                  tollType:
                    type: string
                    enum:
                    - toll
                    - tollFree
                    description: Type of toll for the call-in number.
              description: Array of call-in numbers for joining teleconference from a phone.
            links:
              type: object
              required:
              - rel
              - href
              - method
              properties:
                rel:
                  type: string
                  example: globalCallinNumbers
                  description: Link relation describing how the target resource is related to the current context (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
                href:
                  type: string
                  example: /api/v1/meetings/2c87cf8ece4e414a9fe5516e4a0aac76/globalCallinNumbers
                  description: Target resource URI (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
                method:
                  type: string
                  example: GET
                  description: Target resource method (conforming with [RFC5998](https://tools.ietf.org/html/rfc5988)).
              description: '[HATEOAS](https://en.wikipedia.org/wiki/HATEOAS) information of global call-in numbers for joining teleconference from a phone.'
          description: Information for callbacks from meeting to phone or for joining a teleconference using a phone.
    SitesObject:
      type: object
      required:
      - sites
      properties:
        sites:
          type: array
          items:
            type: object
            required:
            - siteUrl
            - default
            properties:
              siteUrl:
                type: string
                example: site1-example.webex.com
                description: 'Access URL for the site. ***Note***: This is a read-only attribute. The value can be assigned as user''s default site with the [Update Default Site](/docs/api/v1/meeting-preferences/update-default-site) API.'
              default:
                type: boolean
                description: Flag identifying the site as the default site. Users can list meetings and recordings, and create meetings on the default site.
          description: Array of sites for the user. Users can have one site or multiple sites. This concept is specific to Webex Meetings. Any `siteUrl` in the site list can be assigned as user's default site with the [Update Default Site](/docs/api/v1/meeting-preferences/update-default-site) API.
    UpdateVideoObject:
      type: object
      required:
      - videoDevices
      properties:
        videoDevices:
          type: array
          items:
            type: object
            required:
            - deviceName
            - deviceAddress
            - isDefault
            properties:
              deviceName:
                type: string
                example: device1
                description: Video system name. It cannot be empty. This attribute can be modified with the [Update Video Options](/docs/api/v1/meeting-preferences/update-video-options) API.
              deviceAddress:
                type: string
                example: device1@example.com
                description: Video address. It cannot be empty and must be in valid email format. This attribute can be modified with the [Update Video Options](/docs/api/v1/meeting-preferences/update-video-options) API.
              isDefault:
                type: boolean
                example: true
                description: Flag identifying the device as the default video device. If user's video device list is not empty, one and only one device must be set as default. This attribute can be modified with the [Update Video Options](/docs/api/v1/meeting-preferences/update-video-options) API.
          description: Array of video devices. If the array is not empty, one device and no more than one devices must be set as default device.
    SchedulingOptionsObject:
      type: object
      required:
      - enabledJoinBeforeHost
      - joinBeforeHostMinutes
      - enabledAutoShareRecording
      properties:
        enabledJoinBeforeHost:
          type: boolean
          description: 'Flag to enable/disable ***Join Before Host***. The period during which invitees can join before the start time is defined by `autoLockMinutes`. This attribute can be modified with the [Update Scheduling Options](/docs/api/v1/meeting-preferences/update-scheduling-options) API. ***Note***: This feature is only effective if the site supports the ***Join Before Host*** feature. This attribute can be modified with the [Update Scheduling Options](/docs/api/v1/meeting-preferences/update-scheduling-options) API.'
        joinBeforeHostMinutes:
          type: number
          description: Number of minutes before the start time that an invitee can join a meeting if `enabledJoinBeforeHost` is true. Valid options are 0, 5, 10 and 15. This attribute can be modified with the [Update Scheduling Options](/docs/api/v1/meeting-preferences/update-scheduling-options) API.
        enabledAutoShareRecording:
          type: boolean
          description: Flag to enable/disable the automatic sharing of the meeting recording with invitees when it is available. This attribute can be modified with the [Update Scheduling Options](/docs/api/v1/meeting-preferences/update-scheduling-options) API.
        enabledWebexAssistantByDefault:
          type: boolean
          description: Flag to automatically enable Webex Assistant whenever you start a meeting. This attribute can be modified with the [Update Scheduling Options](/docs/api/v1/meeting-preferences/update-scheduling-options) API.
        delegateEmails:
          type: array
          items:
            type: string
            example: marcus.hoffmann@example.com, brenda.song@example.com
          description: You can allow other hosts to schedule meetings on your behalf by entering their email addresses here. This attribute can be modified with the [Update Scheduling Options](/docs/api/v1/meeting-preferences/update-scheduling-options), [Insert Delegate Emails](/docs/api/v1/meeting-preferences/insert-delegate-emails), and [Update Scheduling Options](/docs/api/v1/meeting-preferences/delete-delegate-emails) APIs.
    GetVideoObject:
      type: object
      required:
      - videoDevices
      properties:
        videoDevices:
          type: array
          items:
            type: object
            required:
            - deviceName
            - deviceAddress
            - isDefault
            properties:
              deviceName:
                type: string
                example: device1
                description: Video system name. It cannot be empty. This attribute can be modified with the [Update Video Options](/docs/api/v1/meeting-preferences/update-video-options) API.
              deviceAddress:
                type: string
                example: device1@example.com
                description: Video address. It cannot be empty and must be in valid email format. This attribute can be modified with the [Update Video Options](/docs/api/v1/meeting-preferences/update-video-options) API.
              isDefault:
                type: boolean
                example: true
                description: Flag identifying the device as the default video device. If user's video device list is not empty, one and only one device must be set as default. This attribute can be modified with the [Update Video Options](/docs/api/v1/meeting-preferences/update-video-options) API.
          description: Array of video devices. This attribute can be modified with the [Update Video Options](/docs/api/v1/meeting-preferences/update-video-options) API.
