      description: 'This API allows the service client to get the Group/User Schema using `Schema Id` from CI.


        Example:


        - `urn:ietf:params:scim:schemas:core:2.0:Group` is one of the `Group Schema Id`. Using this particular ID, we can fetch all information related to it.


        - `urn:ietf:params:scim:schemas:extension:enterprise:2.0:User` is one of the `User Schema Id`. Using this particular ID, we can fetch all information related to it.


        **Authorization:**


        OAuth token rendered by Identity Broker.


        One of the following OAuth scopes is required:


        - `identity:people_rw`


        - `identity:organizations_rw`


        The following administrators can use this API:


        - `id_full_admin`


        - `id_user_admin`


        - `id_readonly_admin`


        - `id_device_admin`'
      tags:
      - SCIM 2 Schemas
      parameters:
      - name: schemaId
        in: path
        description: The Schema Id of Group/User Schema
        required: true
        example: urn:ietf:params:scim:schemas:core:2.0:Group
        schema:
          type: string
