      summary: List Memberships
      operationId: List Memberships
      description: 'Lists all room memberships. By default, lists memberships for rooms to which the authenticated user belongs.


        Use query parameters to filter the response.


        Use `roomId` to list memberships for a room, by ID.


        **NOTE**: For moderated team spaces, the list of memberships will include only the space moderators if the user is a team member but not a direct participant of the space.


        Use either `personId` or `personEmail` to filter the results. The `roomId` parameter is required when using these parameters.


        When the requester is a compliance officer, they can query by `personId` or `personEmail` **WITHOUT** specifying a `roomId`. The response will include **ALL** memberships for the user where a space is owned by an org to which the user belongs.


        Long result sets will be split into [pages](/docs/basics#pagination).'
      tags:
      - Memberships
      parameters:
      - name: roomId
        in: query
        description: List memberships associated with a room, by ID.
        example: Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0
        schema:
          type: string
      - name: personId
        in: query
        description: List memberships associated with a person, by ID. The `roomId` parameter is required when using this parameter.
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
        schema:
          type: string
      - name: personEmail
        in: query
        description: List memberships associated with a person, by email address. The `roomId` parameter is required when using this parameter.
        example: john.andersen@example.com
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of memberships in the response.
        example: '100'
        schema:
          type: number
          default: 100
