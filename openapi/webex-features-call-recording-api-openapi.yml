        storageRegion:
          type: string
          example: US
          description: Regions where call recordings are stored.
        orgStorageRegionEnabled:
          type: boolean
          example: true
          description: Region-based call recording storage is enabled.
        failureBehavior:
          $ref: '#/components/schemas/FailureBehavior'
