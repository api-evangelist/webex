      summary: Get Call Recording Settings
      operationId: Get Call Recording Settings
      description: 'Retrieve call recording settings for the organization.


        The Call Recording feature enables authorized agents to record any active call that Webex Contact Center manages.


        Retrieving call recording settings requires a full or read-only administrator or location administrator auth token with a scope of `spark-admin:telephony_config_read`.'
      tags:
      - 'Features: Call Recording'
      parameters:
      - name: orgId
        in: query
        description: Retrieve call recording settings from this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi9lNTEzMTg1Zi01YTJmLTQ0OTUtYjM1Yi03MDY3YmY3Y2U0OGU
