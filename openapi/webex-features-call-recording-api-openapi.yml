    CallRecordingJobStatus:
      type: object
      required:
      - id
      - trackingId
      - sourceUserId
      - sourceCustomerId
      - targetCustomerId
      - instanceId
      - latestExecutionStatus
      - vendorId
      - counts
      properties:
        name:
          type: string
          example: managecallrecordingprovider
          description: Name of the job.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0pPQl9JRC8wNjZkOTQzNC1kODEyLTQzODItODVhMC00MjBlOTFlODg3ZTY
          description: Unique identifier of the job.
        trackingId:
          type: string
          example: ADMINBATCHCLIENT_a02c7b0c-4d28-4e98-b47b-0a135a4b287f_0
          description: Unique identifier to track the flow of HTTP requests.
        sourceUserId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODA2NzZhZC0yNjRlLTRmMWMtYmIwYS1jMWZiNmQ0ODlmZTI
          description: Unique identifier of the user who has run the job.
        sourceCustomerId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8zNDEyODExZi0xMWI4LTQ2YTAtYWExNS1lZmEwMjRjODI5ODM
          description: Unique identifier of the customer who has run the job.
        targetCustomerId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8zNDEyODExZi0xMWI4LTQ2YTAtYWExNS1lZmEwMjRjODI5ODM
          description: Unique identifier of the customer for which the job was run.
        instanceId:
          type: number
          example: 637210
          description: Unique identifier to identify the instance of the job.
        jobExecutionStatus:
          type: array
          items:
            $ref: '#/components/schemas/JobExecutionStatusObject'
          description: Displays the most recent step's execution status. Contains execution statuses of all the steps involved in the execution of the job.
        latestExecutionStatus:
          $ref: '#/components/schemas/LatestExecutionStatus'
          description: Most recent status of the job at the time of invocation.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzlmZTFmZDllLTlkM2QtNDUxZi04MDEwLTMwY2U1ZjRlNTYyNQ
          description: Unique identifier of a location.
        vendorId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JFQ09SRElOR19WRU5ET1IvZmYzNzMzOTYtMGVmMC00N2NiLTk5NzEtNzg0MDI5YzZjMTQ3
          description: Unique identifier of a vendor.
        counts:
          $ref: '#/components/schemas/CountObject'
          description: Job statistics.
    ErrorMessageObject:
      type: object
      properties:
        description:
          type: string
          description: Error message.
        code:
          type: string
          description: Internal error code.
        locationId:
          type: string
          description: Error messages describing the location ID in which the error occurs. For a move operation, this is the target location ID.
    MemberType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      description: " * `PEOPLE` - Indicates the associated member is a person.\n * `PLACE` - Indicates the associated member is a workspace.\n"
    CallRecordingVendorsList:
      type: object
      required:
      - vendorId
      - vendorName
      - vendors
      - failureBehavior
      properties:
        vendorId:
          type: string
          description: Unique identifier of the vendor.
        vendorName:
          type: string
          description: Name of the vendor.
        vendors:
          $ref: '#/components/schemas/CallRecordingVendors'
          description: List of call recording vendors
        storageRegion:
          type: string
          description: Call recording storage region. Only applicable for Webex as a vendor and isn't used for other vendors.
        failureBehavior:
          $ref: '#/components/schemas/FailureBehavior'
          description: Call recording failure behavior.
    CallRecordingVendorPatchResponse:
      type: object
      required:
      - jobId
      properties:
        jobId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0pPQl9JRC8yOTQ5ZmRiOC1kODg1LTQxMzAtYjhiNy1jNmJiYmM5ZWQzOTE
          description: Unique job ID of the call recording job.
    Vendor:
      type: object
      required:
      - id
      - name
      - description
      - migrateUserCreationEnabled
      - loginUrl
      - termsOfServiceUrl
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JFQ09SRElOR19WRU5ET1IvZmVjYjYzNGUtYzMyZS00ZWJmLThlYzMtMmVhYjk3Y2IyNjNk
          description: Unique identifier of a vendor.
        name:
          type: string
          example: Dubber
          description: Name of a call recording vendor.
        description:
          type: string
          example: This is the Dubber instance for the US region.
          description: Describing some vendor info.
        migrateUserCreationEnabled:
          type: boolean
          example: true
          description: Users can be migrated.
        loginUrl:
          type: string
          example: https://wxc-us.dubber.net/login?sso=webex
          description: Login URL of the vendor.
        termsOfServiceUrl:
          type: string
          example: https://www.dubber.net/terms
          description: URL to vendor's terms of service.
    GetCallRecordingTermsOfServiceObject:
      type: object
      required:
      - vendorId
      - vendorName
      - termsOfServiceEnabled
      - termsOfServiceUrl
      properties:
        vendorId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JFQ09SRElOR19WRU5ET1IvNTNkYzRjODctODQwOC00ODgyLTk1NzAtZGNhMmJjZGI5Mjgw
          description: A unique identifier for the vendor.
        vendorName:
          type: string
          example: Dubber
          description: A unique name for the vendor.
        termsOfServiceEnabled:
          type: boolean
          example: true
          description: Whether or not the call recording terms of service are enabled.
        termsOfServiceUrl:
          type: string
          example: https://www.dubber.net/terms
          description: 'Url where can be found terms of service for the vendor.


            **NOTE**: This is expected to be empty for webex recording platform.'
    CallRecordingVendor:
      type: object
      required:
      - id
      - name
      - description
      - migrateUserCreationEnabled
      - loginUrl
      - termsOfServiceUrl
      properties:
        id:
          type: string
          description: Unique identifier of the vendor.
        name:
          type: string
          description: Name of the vendor.
        description:
          type: string
          description: Description of the vendor.
        migrateUserCreationEnabled:
          type: boolean
          description: Represents whether user creation is integrated for this vendor. When user creation is integrated, a call recording account in the vendor's system is automatically created when a user is created or added.
        loginUrl:
          type: string
          description: Vendor login page to access user call recordings.
        termsOfServiceUrl:
          type: string
          description: Vendor terms of service URL.
    UserLicenseType:
      type: string
      enum:
      - BASIC_USER
      - PROFESSIONAL_USER
      - WORKSPACE
      - PROFESSIONAL_WORKSPACE
      - VIRTUAL_PROFILE
      description: " * `BASIC_USER` - License type is webex calling standard user.\n * `PROFESSIONAL_USER` - License type is webex calling professional user.\n * `WORKSPACE` - License type is webex calling common area workspace.\n * `PROFESSIONAL_WORKSPACE` - License type is webex calling professional workspace.\n * `VIRTUAL_PROFILE` - License type is webex calling virtual profile.\n"
    JobExecutionStatusObject:
      type: object
      required:
      - id
      - lastUpdated
      - statusMessage
      - createdTime
      - timeElapsed
      properties:
        id:
          type: number
          example: 735206
          description: Unique identifier that identifies each instance of the job.
        startTime:
          type: string
          example: '2023-05-30T13:04:00.469Z'
          description: The date and time with seconds, the job has started in UTC format.
        endTime:
          type: string
          example: '2023-05-30T13:04:03.245Z'
          description: The date and time with seconds, the job has ended in UTC format.
        lastUpdated:
          type: string
          example: '2023-05-30T13:04:03.574Z'
          description: The date and time with seconds, the job has last updated in UTC format post one of the step execution completion.
        statusMessage:
          type: string
          enum:
          - STARTING
          - STARTED
          - COMPLETED
          - FAILED
          - UNKNOWN
          - ABANDONED
          description: "Displays status for overall steps that are part of the job.\n * `STARTING` - Job has started.\n * `STARTED` - Job is in progress.\n * `COMPLETED` - Job has completed.\n * `FAILED` - Job has failed.\n * `UNKNOWN` - Job status is unknown.\n * `ABANDONED` - Job has been abandoned (manually stopped).\n"
        exitCode:
          type: string
          enum:
          - UNKNOWN
          - COMPLETED
          - FAILED
          - STOPPED
          - COMPLETED_WITH_ERRORS
          - COMPLETED_WITH_PENDING_ORDERS
          description: "Exit Code for a job.\n * `UNKNOWN` - Job is in progress.\n * `COMPLETED` - Job has completed successfully.\n * `FAILED` - Job has failed.\n * `STOPPED` - Job has been stopped.\n * `COMPLETED_WITH_ERRORS` - Job has completed with errors.\n * `COMPLETED_WITH_PENDING_ORDERS` - Job has completed with pending number orders.\n"
        createdTime:
          type: string
          example: '2023-05-30T13:04:00.457Z'
          description: The date and time with seconds, the job has created in UTC format.
        timeElapsed:
          type: string
          example: PT2.752S
          description: Time lapsed in seconds since the job execution started.
        stepExecutionStatuses:
          type: array
          items:
            $ref: '#/components/schemas/stepExecutionStatusesObject'
          description: Status of each step within a job.
