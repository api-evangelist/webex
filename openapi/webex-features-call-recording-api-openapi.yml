components:
  schemas:
    CallRecordingVendorUsersResponse:
      type: object
      required:
      - vendorId
      - members
      properties:
        vendorId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JFQ09SRElOR19WRU5ET1IvMGE0MjY3NTQtYTQ3MC00YzJkLThiYTAtZmJjNjc3M2E4YTdj
          description: Call recording vendor ID.
        members:
          type: array
          items:
            $ref: '#/components/schemas/Members'
          description: Contains member details
    ModifyCallRecordingSettingsObject:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Whether or not the call recording is enabled.
    CallRecordingVendorPatch:
      type: object
      required:
      - vendorId
      properties:
        vendorId:
          type: string
          description: Unique identifier of the vendor.
        storageRegion:
          type: string
          description: Call recording storage region. Only applicable for Webex as a vendor and isn't used for other vendors.
        failureBehavior:
          $ref: '#/components/schemas/FailureBehavior'
          description: Call recording failure behavior.
    CallRecordingRegionsResponse:
      type: object
      required:
      - regions
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Regions'
          description: Contains region details.
    ModifyCallRecordingTermsOfServiceObject:
      type: object
      required:
      - termsOfServiceEnabled
      properties:
        termsOfServiceEnabled:
          type: boolean
          example: true
          description: Whether or not the call recording terms of service are enabled.
    FailureBehavior:
      type: string
      enum:
      - PROCEED_WITH_CALL_NO_ANNOUNCEMENT
      - PROCEED_CALL_WITH_ANNOUNCEMENT
      - END_CALL_WITH_ANNOUNCEMENT
      description: " * `PROCEED_WITH_CALL_NO_ANNOUNCEMENT` - Failure behavior will make sure that the call proceeds without announcement.\n * `PROCEED_CALL_WITH_ANNOUNCEMENT` - Failure behavior will make sure that the call proceeds with an announcement.\n * `END_CALL_WITH_ANNOUNCEMENT` - Failure behavior will make sure that the call ends with an announcement.\n"
    Members:
      type: object
      required:
      - id
      - type
      - licenseType
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLXdlc3QtMl9yL1BMQUNFL2U2OTczZDgyLWM1NTUtNDMwOC05NGU3LWI3ZWU2MjczY2YyMg
          description: Unique identifier of the member.
        lastName:
          type: string
          example: jones
          description: Last name of the member.
        firstName:
          type: string
          example: Vickor
          description: First name of the member.
        type:
          $ref: '#/components/schemas/MemberType'
          description: Type of member.
        licenseType:
          $ref: '#/components/schemas/UserLicenseType'
          description: License type of the member.
    CallRecordingJobList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CallRecordingJobStatus'
          description: List of call recording jobs.
    ErrorResponseObject:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemObject'
    stepExecutionStatusesObject:
      type: object
      required:
      - id
      - lastUpdated
      - statusMessage
      - name
      - timeElapsed
      properties:
        id:
          type: number
          example: 3624681
          description: Unique identifier that identifies each step in a job.
        startTime:
          type: string
          example: '2023-05-30T13:04:00.469Z'
          description: The date and time with seconds, the step execution has started in UTC format.
        endTime:
          type: string
          example: '2023-05-30T13:04:03.245Z'
          description: The date and time with seconds, the step execution has ended in UTC format.
        lastUpdated:
          type: string
          example: '2023-05-30T13:04:03.574Z'
          description: The date and time with seconds, the step has last updated in UTC format.
        statusMessage:
          type: string
          enum:
          - STARTING
          - STARTED
          - COMPLETED
          - FAILED
          - UNKNOWN
          - ABANDONED
          description: "Displays status for a step.\n * `STARTING` - Job has started.\n * `STARTED` - Job is in progress.\n * `COMPLETED` - Job has completed.\n * `FAILED` - Job has failed.\n * `UNKNOWN` - Job status is unknown.\n * `ABANDONED` - Job has been abandoned (manually stopped).\n"
        exitCode:
          type: string
          enum:
          - UNKNOWN
          - COMPLETED
          - FAILED
          - STOPPED
          - COMPLETED_WITH_ERRORS
          - COMPLETED_WITH_PENDING_ORDERS
          description: "Exit Code for a step.\n * `UNKNOWN` - Job is in progress.\n * `COMPLETED` - Job has completed successfully.\n * `FAILED` - Job has failed.\n * `STOPPED` - Job has been stopped.\n * `COMPLETED_WITH_ERRORS` - Job has completed with errors.\n * `COMPLETED_WITH_PENDING_ORDERS` - Job has completed with pending number orders.\n"
        name:
          type: string
          example: moveusersvalidateAndMove
          description: Step name.
        timeElapsed:
          type: string
          example: PT2.752S
          description: Time lapsed in seconds since the job execution started.
    LatestExecutionStatus:
      type: string
      enum:
      - STARTING
      - STARTED
      - COMPLETED
      - FAILED
      description: " * `STARTING` - Job has started.\n * `STARTED` - Job is in progress.\n * `COMPLETED` - Job has been completed.\n * `FAILED` - Job has failed.\n"
    Regions:
      type: object
