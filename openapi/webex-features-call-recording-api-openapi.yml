        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1JFQ09SRElOR19WRU5ET1IvMGE0MjY3NTQtYTQ3MC00YzJkLThiYTAtZmJjNjc3M2E4YTdj
          description: Unique identifier of the call recording vendor.
        orgDefaultEnabled:
