      summary: User bulk API
      operationId: User bulk API
      description: "<br/>\n\n**Authorization**\n\nOAuth token rendered by Identity Broker.\n\n<br/>\n\nOne of the following\
        \ OAuth scopes is required:\n\n- `identity:people_rw`\n\n<br/>\n\n**Usage**:\n\n1. The input JSON must conform to\
        \ the following schema: 'urn:ietf:params:scim:api:messages:2.0:BulkRequest'.\n\n1. The request must be accompanied\
        \ with a body in JSON format according to the standard SCIM schema definition.\n   The maximum number of operations\
        \ in a request is 100; an error is thrown if the limit is exceeded.\n\n1. `failOnErrors` parameter\n\n   An integer\
        \ specifies the number of errors that the service provider will accept before the operation is terminated and an error\
        \ response is returned.\n   It is OPTIONAL in a request.\n   Maximum number of operations allowed to fail before the\
        \ server stops processing the request. The value must be between 1 and 100.\n\n1. `operations` parameter\n\n   Contains\
        \ a list of bulk operations for POST/PATCH/DELETE operations. (REQUIRED)\n    + `operations.method`\n\n      The HTTP\
        \ method of the current operation. Possible values are POST, PATCH or DELETE.\n    + `operations.path`\n\n      The\
        \ Resource's relative path. If the method is POST the value must specify a Resource type endpoint;\n      e.g., /Users\
        \ or /Groups whereas all other method values must specify the path to a specific Resource;\n      e.g., /Users/2819c223-7f76-453a-919d-413861904646.\n\
        \    + `operations.data`\n\n      The Resource data as it would appear for a single POST or PATCH Resource operation.\n\
        \      It is REQUIRED in a request when method is POST and PATCH.\n      Refer to corresponding wiki for SCIM 2.0\
        \ POST, PATCH and DELETE API.\n    + `operations.bulkId`\n\n      The transient identifier of a newly created resource,\
        \ unique within a bulk request and created by the client.\n      The bulkId serves as a surrogate resource id enabling\
        \ clients to uniquely identify newly created resources in the response and cross-reference new resources in and across\
        \ operations within a bulk request.\n      It is REQUIRED when \"method\" is \"POST\"."
      tags:
      - Bulk Manage SCIM 2 Users and Groups
      parameters:
      - name: orgId
        in: path
        description: Webex Identity assigned organization identifier for user's organization.
        required: true
        example: 0ae87ade-8c8a-4952-af08-318798958d0c
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              schemas:
              - urn:ietf:params:scim:api:messages:2.0:BulkRequest
              failOnErrors: 99
              operations:
              - method: PATCH
                path: /Users/2819c223-7f76-453a-919d-413861904646
                data: JSON text
                bulkId: ytrewq
            schema:
              $ref: '#/components/schemas/BulkUser'
components:
  schemas:
    BulkUser:
      type: object
      required:
      - schemas
      - failOnErrors
      - operations
      properties:
        schemas:
          type: array
          items:
            type: string
            example: urn:ietf:params:scim:api:messages:2.0:BulkRequest
          description: Input JSON schemas.
        failOnErrors:
          type: number
          example: 99
          description: An integer specifying the maximum number of errors that the service provider will accept before the
            operation is terminated and an error response is returned.
        operations:
          type: array
          items:
            type: object
            required:
            - method
            - path
            properties:
              method:
                type: string
                enum:
                - POST
                - PATCH
                - DELETE
                description: The HTTP method of the current operation.
              path:
                type: string
                example: /Users/2819c223-7f76-453a-919d-413861904646
                description: The resource's relative path. If the method is POST, the value must specify a resource type endpoint,
                  for example `/Users` or `/Groups`. All other method values must specify the path to a specific resource.
              data:
                type: string
                example: JSON text
                description: The Resource JSON data as it appears for a single POST or PATCH resource operation.
              bulkId:
                type: string
                example: ytrewq
                description: The transient identifier of a newly created resource, unique within a bulk request and created
                  by the client.
          description: Contains a list of bulk operations for POST/PATCH/DELETE operations.
