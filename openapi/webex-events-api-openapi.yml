            callingNumber:
              type: string
              example: '910481234'
              description: Telephony; originating number.
            callingLineId:
              type: string
              example: '211'
              description: Telephony.
            calledNumber:
              type: string
              example: '4089671221'
              description: Telephony; destination number.
            calledLineId:
              type: string
              example: '219'
              description: Telephony
            dialedDigits:
              type: string
              example: '123'
              description: Telephony
            callRedirectingNumber:
              type: string
              description: Telephony
            callRedirectedReason:
              type: string
              description: Telephony
            created:
              type: string
              example: '2016-05-16T21:34:59.324Z'
