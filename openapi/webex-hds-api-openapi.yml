      summary: Get availability details for HDS cluster
      operationId: getHDSClusterAvailabilityDetails
      description: 'Get the availability details for an HDS cluster, where each segment specifies the start and end times, as well as the number of online, offline, and total nodes within that segment.

        To obtain the Cluster ID needed for this API, use the [Get organization details API](</docs/api/v1/hds/get-organization-details>)'
      tags:
      - HDS
      parameters:
      - name: clusterId
        in: path
        description: Unique ID of the HDS cluster.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0hZQlJJRF9DTFVTVEVSLzJjM2M5Zjk1LTczZDktNDQ2MC1hNjY4LTA0NzE2MmZmMWJhZDpmMWJmMGI1MC0yMDUyLTQ3ZmUtYjg3ZC01MTFjMmZlNzQ3MWI
        schema:
          type: string
      - name: from
        in: query
