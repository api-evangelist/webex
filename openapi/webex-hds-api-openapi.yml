        required: true
        example: '2021-09-15T15:53:00Z'
        schema:
          type: string
      - name: to
        in: query
        description: The end date and time of the requested data in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format.
        required: true
        example: '2021-09-15T17:53:00Z'
        schema:
          type: string
