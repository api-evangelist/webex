components:
  schemas:
    UserSessionTypes:
      type: object
      properties:
        personId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8yNWJiZjgzMS01YmU5LTRjMjUtYjRiMC05YjU5MmM4YTA4NmI
          description: A unique identifier for the user.
        email:
          type: string
          example: john.andersen@example.com
          description: The email of the user.
        siteUrl:
          type: string
          example: example.webex.com
          description: Site URL for the user.
        sessionTypes:
          type: array
          items:
            $ref: '#/components/schemas/SessionType'
          description: All session types are supported by the user on the site.
    SessionType:
      type: object
      properties:
        id:
          type: string
          example: '3'
          description: The ID of the session type.
        shortName:
          type: string
          example: PRO
          description: The short name of the session type.
        name:
          type: string
          example: Pro Meeting
          description: The name of the session type.
        type:
          type: string
          enum:
          - meeting
          - webinar
          - privateMeeting
          - EventCenter
          - SupportCenter
          - TrainCenter
          description: "The meeting type of meeting that you can create with the session type.\n * `meeting` - Meeting Center.\n\
            \ * `webinar` - Webinar meeting.\n * `privateMeeting` - Private meeting.\n * `EventCenter` - Event Center.\n *\
            \ `SupportCenter` - Support Center.\n * `TrainCenter` - Training Center.\n"
    UpdateUserSessionType:
      type: object
      required:
      - siteUrl
      - sessionTypeIds
      properties:
        siteUrl:
          type: string
          example: example.webex.com
          description: Site URL for the session type.
        personId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8yNWJiZjgzMS01YmU5LTRjMjUtYjRiMC05YjU5MmM4YTA4NmI
          description: A unique identifier for the user.
        email:
          type: string
          example: john.andersen@example.com
          description: The email of the user.
        sessionTypeIds:
          type: array
          items:
            type: string
          example:
          - '3'
          - '9'
          description: An array of the session type ID.
    SiteSessionType:
      type: object
      properties:
        id:
          type: string
          example: '3'
          description: The ID of the session type.
        shortName:
          type: string
          example: PRO
          description: The short name of the session type.
        siteUrl:
          type: string
          example: example.webex.com
          description: Site URL for the session type.
        name:
          type: string
          example: Pro Meeting
          description: The name of the session type.
        type:
          type: string
          enum:
          - meeting
          - webinar
          - privateMeeting
          - EventCenter
          - SupportCenter
          - TrainCenter
          description: "The meeting type of meeting that you can create with the session type.\n * `meeting` - Meeting Center.\n\
            \ * `webinar` - Webinar meeting.\n * `privateMeeting` - Private meeting.\n * `EventCenter` - Event Center.\n *\
            \ `SupportCenter` - Support Center.\n * `TrainCenter` - Training Center.\n"
