      summary: Get Hybrid Cluster Details
      operationId: Get Hybrid Cluster Details
      description: 'Shows details for a hybrid cluster, by ID.


        Only an admin auth token with the `spark-admin:hybrid_clusters_read` scope can see cluster details.'
      tags:
      - Hybrid Clusters
      parameters:
      - name: hybridClusterId
        in: path
        description: The ID of the cluster.
        required: true
        example: Y2lZY76123abbb
        schema:
          type: string
      - name: orgId
        in: query
        description: '

          Find the cluster in this specific organization.

          If this is not specified, the organization of the caller

          will be used.

          '
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
components:
  schemas:
    ClusterCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
          description: An array of hybrid cluster objects.
    Cluster:
      type: object
      properties:
        id:
          type: string
          example: Y2lZY76123abbb
          description: A unique identifier for the cluster.
        orgId:
          type: string
          example: Y2lzY29zcGFyazovL3
          description: The ID of the organization to which this hybrid cluster belongs.
        name:
          type: string
          example: EMEA Oslo 1
          description: The name of the cluster.
        resourceGroupId:
          type: string
          example: Y2lzY29zcGFyazovL3
          description: The ID of the resource group this cluster belongs to.
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 Bearer token authentication
      flows:
        authorizationCode:
          authorizationUrl: https://webexapis.com/v1/authorize
          tokenUrl: https://webexapis.com/v1/access_token
          scopes:
            spark:applications_token: Create access tokens for Service Apps
