      summary: List Group Recordings
      operationId: listGroupRecordings
      description: 'List group recordings for a service app which has group recording access. You can specify a date range, the maximum number of recordings to return, and `personId` or `hostEmail` of whom the recordings will be retrieved.


        * The list returned is sorted in descending order by the date and time that the recordings were created.


        * Only recordings which are in the `available` status and not shared by others can be listed. Those in the `deleted` or `purged` status or shared by others can''t be listed.


        * Long result sets are split into [pages](/docs/basics#pagination).


        * If `siteUrl` is specified, the API lists group recordings on the specified site; otherwise, the API lists group recordings on all the sites managed by the service app. All the sites managed by a service app can be retrieved by the [Get Site List](/docs/api/v1/meeting-preferences/get-site-list) API.


        * One of the `personId` parameter and `hostEmail` header must be specified so that only recordings of meetings hosted by the person of `personId` or `hostEmail` will be returned.


        #### Request Header


        * `timezone`: [Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) in conformance with the [IANA time zone database](https://www.iana.org/time-zones). The default is UTC if `timezone` is not defined.


        * `hostEmail`: Email of the user whose recordings will be retrieved. The `hostEmail` parameter is optional, but one of the `personId` parameter and `hostEmail` header must be specified.'
      tags:
      - Recordings
      parameters:
      - name: personId
        in: query
        description: Person ID of the user whose recordings will be retrieved. The person ID can be retrieved from the [People APIs](/docs/api/v1/people), e.g. [Lit People](/docs/api/v1/people/list-people). Note that a person ID retrieved from the People APIs is a Base64-encoded string, e.g. `Y2lzY29zcGFyazovL3VzL1BFT1BMRS9kNDdiMmU3ZC01ZTBmLTRmNjktYWVmNC1lNGZmOTBhZWE3Yzk`. The person ID in the raw UUID format which is the last part of the Base64-decoded string, e.g. `d47b2e7d-5e0f-4f69-aef4-e4ff90aea7c9`, is also supported. The `personId` parameter is optional, but one of the `personId` parameter and `hostEmail` header must be specified.
        required: false
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9kNDdiMmU3ZC01ZTBmLTRmNjktYWVmNC1lNGZmOTBhZWE3Yzk
        schema:
          type: string
      - name: max
        in: query
        description: Maximum number of recordings to return in a single page. `max` must be equal to or greater than `1` and equal to or less than `100`.
        schema:
          type: number
          default: 10
      - name: from
        in: query
        description: Starting date and time (inclusive) for recordings to return, in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `from` cannot be after `to`. The interval between `from` and `to` must be within 30 days.
        example: '2020-07-12T09:30:00+08:00'
        schema:
          type: string
          default: If only `to` is specified, the default `from` value is 7 days before `to`; if no `to` or `from` is specified, the default `from` value is 7 days before current date and time.
      - name: to
        in: query
        description: Ending date and time (exclusive) for List recordings to return, in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. `to` cannot be before `from`. The interval between `from` and `to` must be within 30 days.
        example: '2020-07-31T09:30:00+08:00'
        schema:
          type: string
          default: If `from` is specified, the default value is 7 days after `from`; if `from` is not specified, the default value is the current date and time.
      - name: siteUrl
        in: query
        description: URL of the Webex site which the API lists recordings from. If not specified, the API lists recordings from user's preferred site. All available Webex sites and preferred site of the user can be retrieved by [Get Site List](/docs/api/v1/meeting-preferences/get-site-list) API.
        example: example.webex.com
        schema:
          type: string
      - name: integrationTag
        in: query
        description: External key of the parent meeting created by an integration application. This parameter is used by the integration application to query recordings by a key in its own domain such as a Zendesk ticket ID, a Jira ID, a Salesforce Opportunity ID, etc. An integrationTag created by one client cannot be accessed or used as a filtering parameter by another client. For example, if a meeting has an `integrationTag` of "Sales" which is created by the client behind the developer portal, then this integrationTag can't be accessed on the meeting or its recordings by another client. Neither can it be used to filter meetings or recordings by a client other than the one that created the integrationTag of "Sales".
        example: dbaeceebea5c4a63ac9d5ef1edfe36b9
        schema:
          type: string
      - name: topic
        in: query
        description: Recording topic. If specified, the API filters recordings by topic in a case-insensitive manner.
        example: John's Meeting
        schema:
          type: string
      - name: format
        in: query
        description: Recording's file format. If specified, the API filters recordings by format.
        example: ARF
        schema:
          type: string
          enum:
          - MP4
          - ARF
      - name: serviceType
        in: query
        description: The service type for recordings. If specified, the API filters recordings by service type.
        example: MeetingCenter
        schema:
          type: string
          enum:
          - MeetingCenter
          - EventCenter
          - SupportCenter
          - TrainingCenter
      - name: timezone
        in: header
        description: e.g. UTC
        required: false
        schema:
          type: string
        example: UTC
      - name: hostEmail
        in: header
        description: Email of the user whose recordings will be retrieved. The `hostEmail` parameter is optional, but one of the `personId` parameter and `hostEmail` header must be specified.
        required: false
        schema:
          type: string
        example: john.andersen@example.com
