components:
  schemas:
    BulkRestoreRecordingObject:
      type: object
      properties:
        restoreAll:
          type: boolean
          description: If not specified or `false`, restores the recordings specified by `recordingIds`. If `true`, restores all recordings from the recycle bin.
        recordingIds:
          type: array
          items:
            type: string
          description: Recording IDs for recovering recordings from the recycle bin in batch. Note that all the recording IDs should belong to the site of `siteUrl` or the user's preferred site if `siteUrl` is not specified.
        siteUrl:
          type: string
          example: example.webex.com
          description: URL of the Webex site from which the API restores recordings. If not specified, the API restores recordings from a user's preferred site. All available Webex sites and preferred sites of a user can be retrieved by [Get Site List](/docs/api/v1/meeting-preferences/get-site-list) API.
    BulkPurgeRecordingObject:
      type: object
      properties:
        purgeAll:
          type: boolean
          description: If not specified or `false`, purges the recordings specified by `recordingIds`. If `true`, purges all recordings from the recycle bin.
        recordingIds:
          type: array
          items:
            type: string
          description: Recording IDs for purging recordings from the recycle bin in batch. Note that all the recording IDs should belong to the site of `siteUrl` or the user's preferred site if `siteUrl` is not specified.
        siteUrl:
          type: string
          example: example.webex.com
          description: URL of the Webex site from which the API purges recordings. If not specified, the API purges recordings from user's preferred site. All available Webex sites and preferred sites of the user can be retrieved by [Get Site List](/docs/api/v1/meeting-preferences/get-site-list) API.
    ShareRecordingByIdObject:
      type: object
      properties:
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This attribute should only be set if the user or application calling the API has the admin-level scopes. When used, the admin may specify the email of a user in a site they manage to be the meeting host. The field is not editable and is only used to share or unshare a recording on behalf of the real meeting host.
        addEmails:
          type: array
          items:
            type: string
          description: Email addresses of users to share the recording with. The maximum size of the array is `100`.
        removeEmails:
          type: array
          items:
            type: string
          description: Email addresses of users to unshare the recording with. The maximum size of the array is `100`.
        sendEmail:
          type: boolean
          description: Whether to send email notifications to the users being shared. The default is `true`.
    ShareRecordingByLinkObject:
      type: object
      properties:
        hostEmail:
          type: string
          example: john.andersen@example.com
          description: Email address for the meeting host. This attribute should only be set if the user or application calling the API has the admin-level scopes. When used, the admin may specify the email of a user in a site they manage to be the meeting host. The field is not editable and is only used to share or unshare a recording link on behalf of the real meeting host.
        webShareLink:
          type: string
          example: https://example.webex.com/recordingservice/sites/example/recording/playback/1234567890abcdef1234567890abcdef
          description: The link for the recording to be shared or unshared.
        addEmails:
          type: array
          items:
            type: string
          description: Email addresses of users to share the recording link with. The maximum size of the array is `100`.
        removeEmails:
          type: array
          items:
            type: string
          description: Email addresses of users to unshare the recording link with. The maximum size of the array is `100`.
        sendEmail:
          type: boolean
          description: Whether to send email notifications to the users being shared. The default is `true`.
