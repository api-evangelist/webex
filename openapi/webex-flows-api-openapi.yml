        severity:
          type: string
          description: Severity of the result.
          enum:
          - ERROR
          - WARNING
          - RECOMMENDATION
          example: RECOMMENDATION
        activityLabel:
          type: string
          description: Label of the activity the result relates to. May be empty.
          example: ''
    DiagramRes:
      title: DiagramRes
