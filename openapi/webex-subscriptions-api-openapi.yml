openapi: 3.0.0
info:
  title: Webex Admin Address Book Subscriptions API
  version: 1.0.0
  description: The Webex Admin APIs provide comprehensive programmatic access to administrative functions for managing Webex organizations, users, licenses, and settings. These APIs enable automation of user provisioning, license assignment, compliance management, and audit event retrieval. Administrators can integrate with enterprise identity systems, enforce security policies, monitor usage, and streamline onboarding/offboarding processes. The APIs support granular control over organizational resources, making them ideal for large-scale deployments and custom admin tooling.
tags:
- name: Subscriptions
paths:
  /v1/subscriptions:
    get:
      tags:
      - Subscriptions
      summary: List Subscriptions
      description: "Retrieve all subscriptions for a given organization. Requires `cjp:config_read` scope.\n\n\n Note: In the response JSON, the 'data' field only contains V1 based subscriptions, while the field 'meta.subscriptionCount' provides the total count encompassing all the created subscriptions in the organization."
      operationId: getSubscriptionByOrgId
      parameters:
      - name: orgId
        in: query
        description: Organization ID to be used for this operation. If unspecified, the Organization ID is inferred from the token. The token must have permissions to interact with the organization.
        required: false
        schema:
          type: string
        example: 97cdbf45-ebe2-4687-8341-44d5c7abf101
      - name: TrackingId
        in: header
        description: Tracking ID to use for this operation, for traceability, debugging, and error reporting purposes. If not provided, we will generate one for you.
        required: false
        schema:
          type: string
        example: NOTIFS_9bcdc696-57fa-4e91-b5aa-57a66a347c23
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionApiListResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: Unauthorized Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: Forbidden Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: An Unexpected Error Occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
    post:
      tags:
      - Subscriptions
      summary: Register Subscription
      description: Create a subscription which would allow consumers to listen to events. If creating a subscription causes the org-level limit to be exceeded, the subscription registration will be denied. Requires `cjp:config_write` scope.
      operationId: createSubscription
      parameters:
      - name: TrackingId
        in: header
        description: Tracking ID to use for this operation, for traceability, debugging, and error reporting purposes. If not provided, we will generate one for you.
        required: false
        schema:
          type: string
        example: NOTIFS_9bcdc696-57fa-4e91-b5aa-57a66a347c23
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCreateApiResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: Unauthorized Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: Forbidden Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: An Unexpected Error Occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
  /v1/subscriptions/{id}:
    get:
      tags:
      - Subscriptions
      summary: Get Subscription
      description: Retrieve a subscription for a given subscription ID. Requires `cjp:config_read` scope.
      operationId: getSubscriptionById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: ID by which to retrieve the subscription.
          format: uuid
          example: 10b4079b-5162-4526-b6a4-4472734fb69b
      - name: orgId
        in: query
        description: Organization ID to be used for this operation. If unspecified, the Organization ID is inferred from the token. The token must have permissions to interact with the organization.
        required: false
        schema:
          type: string
        example: 97cdbf45-ebe2-4687-8341-44d5c7abf101
      - name: TrackingId
        in: header
        description: Tracking ID to use for this operation, for traceability, debugging, and error reporting purposes. If not provided, we will generate one for you.
        required: false
        schema:
          type: string
        example: NOTIFS_9bcdc696-57fa-4e91-b5aa-57a66a347c23
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionApiResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: Unauthorized Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: Forbidden Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: An Unexpected Error Occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
    delete:
      tags:
      - Subscriptions
      summary: Delete Subscription
      description: Deletes a subscription for a given subscription ID. Requires `cjp:config_write` scope.
      operationId: deleteSubscriptionById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: ID of the subscription to be deleted.
          format: uuid
          example: 10b4079b-5162-4526-b6a4-4472734fb69b
      - name: orgId
        in: query
        description: Organization ID to be used for this operation. If unspecified, the Organization ID is inferred from the token. The token must have permissions to interact with the organization.
        required: false
        schema:
          type: string
        example: 97cdbf45-ebe2-4687-8341-44d5c7abf101
      - name: TrackingId
        in: header
        description: Tracking ID to use for this operation, for traceability, debugging, and error reporting purposes. If not provided, we will generate one for you.
        required: false
        schema:
          type: string
        example: NOTIFS_9bcdc696-57fa-4e91-b5aa-57a66a347c23
      responses:
        '204':
          description: No Content
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: Unauthorized Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: Forbidden Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: An Unexpected Error Occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
    patch:
      tags:
      - Subscriptions
      summary: Update Subscription
      description: Updates some of the properties in a subscription, for a given subscription ID. Requires `cjp:config_write` scope.
      operationId: updateSubscriptionById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: ID of the subscription to be updated.
          format: uuid
          example: 10b4079b-5162-4526-b6a4-4472734fb69b
      - name: TrackingId
        in: header
        description: Tracking ID to use for this operation, for traceability, debugging, and error reporting purposes. If not provided, we will generate one for you.
        required: false
        schema:
          type: string
        example: NOTIFS_9bcdc696-57fa-4e91-b5aa-57a66a347c23
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequestUpdate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionApiResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: Unauthorized Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: Forbidden Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: An Unexpected Error Occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
