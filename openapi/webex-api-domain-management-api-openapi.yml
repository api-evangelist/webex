      summary: Get Domain Verification Token
      operationId: Get Domain Verification Token
      description: 'This endpoint helps generate a token for a given domain within the specified organization. The user needs to add this token as a ''TXT'' record to the DNS server.


        **Possible Error:**


        - 409: The request encountered a resource conflict. This error occurs if the domain is either claimed by another organization or by the same organization.


        **Authorization:**


        An ''OAuth'' token issued by the ''Identity Broker'' is required to access this endpoint. The token must include one of the following scopes:


        - `Identity:Organization`


        - `identity:organizations_rw`


        **Administrator Roles:**


        The following administrators can use this API:


        - `id_full_admin`'
      tags:
      - API - Domain Management
      parameters:
      - name: orgId
        in: path
        description: The Webex Identity-assigned organization identifier for a user's organization.
        required: true
        example: bf732c85-68ca-4867-94e4-937286ad2fd4
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              domain: cisco.com
            schema:
              $ref: '#/components/schemas/PostDomainVerificationToken'
