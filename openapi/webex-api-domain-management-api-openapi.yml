      summary: Unclaim Domain
      operationId: Unclaim Domain
      description: 'This API is used to unclaim a domain for the organization. The domain will remain verified, and domain enforcement will still apply to the given organization.


        **Possible Error:**


        - 400: The request was a Bad Request. The domain cannot be unclaimed. This error occurs if the requested parameter is invalid.


