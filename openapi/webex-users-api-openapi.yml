            \ Manage Sites[f_manage_sites], Manage Teams[f_manage_teams], and Manage Dial Plans[f_manage_dial_plans] features.\n\
            \nm_real_time_reports - Refers to the real time reporting module. Has access to Summary View[f_summary_view],\
            \ Agent State Change[f_agent_state_change], Real Time Threshold Alerts[f_realtime_threshold_alerts], and Web CallBack\
            \ Report[f_web_callback_report] features.\n\nm_historical_reports - Refers to the historical reporting module.\n\
            \nm_routing_strategy - Refers to the routing strategy module. Has access to Manage Media Files[f_manage_media_files]\
            \ and Manage Call Flow Scripts[f_manage_call_flow_scripts] features.\n\nm_call_recording - Refers to the call\
            \ recording module.\n\nm_call_monitoring - Refers to the call monitoring module. Has access to Barge In[f_barge_in],\
            \ View Blind Monitor Request[f_view_blind_monitor_requests], Whisper Coach[f_whisper_coach], Mid Call Monitor[f_mid_call_monitor],\
            \ and Restricted Monitor[f_restricted_monitor_only] features.\n\nm_reporting_analytics - Refers to the reporting\
            \ analytics module. Has access to Analyzer Data Exchange[f_analyzer_data_exchange] and Business Rules[f_business_rules]\
            \ features. \n\nm_recording_management - Refers to the recording management module. Has access to Tags[f_tags],\
            \ Security Keys[f_security_keys], Manage Recordings[f_manage_recordings], and Custom Attributes[f_custom_attributes]\
            \ features.\n\nm_agent_desktop - Refers to the agent desktop module.\n\nm_logout_agents - Refers to the agent\
            \ logout module.\n\nm_manage_agent_states - Refers to the agent state module. Has access to Sign Out Agent[f_sign_out_agent]\
            \ and Change Agent State[f_change_agent_state] features.\n\nm_additional_supervisory_features - Refers to the\
            \ additional supervisory features module. Has access to Sign Out Agents[f_sign_out_agents], Change Agent States[f_change_agent_states]\
            \ and Send Messages[f_send_messages] features.\n\nm_multimedia - Refers to the multimedia module. Has access to\
