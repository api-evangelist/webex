            skillId: 2683334c-abec-4c0b-a6b1-211bd81d1b4b
            proficiencyValue: 7
          items:
            $ref: '#/components/schemas/AssignedDynamicSkillsDTO'
        createdTime:
          type: integer
          format: int64
          description: This is the created time of the entity.
        lastUpdatedTime:
          type: integer
          format: int64
          description: This is the updated time of the entity.
