          example: Contact Center Admin Profile
          maxLength: 80
          minLength: 0
          pattern: ^[a-zA-Z0-9,_\-\s]*$
        description:
          type: string
          description: An optional description of the profile.
          example: This profile should be applied only to contact center admins.
          maxLength: 255
          minLength: 0
        profileType:
          type: string
          description: "The type determines the privileges applicable for a profile.\n\nIt can take one of these values:\n\
            \nSTANDARD_AGENT — Has access to Agent Desktop[m_agent_desktop] module.\n\nPREMIUM_AGENT — Has access to Agent\
            \ Desktop[m_agent_desktop] and Multimedia[m_multimedia] module.\n\nSUPERVISOR — Has access to all modules except\
            \ to manage tenants in the Provisioning[m_provisioning] module.\n\nADMINISTRATOR — Has access to all modules.\n\
            \nADMINISTRATOR_ONLY — Has access to Provisioning[m_provisioning], Real Time Reports[m_real_time_reports], Call\
            \ Recording[m_call_recording], IMI Digital Channels[m_imi_digital_channels], and Routing Strategy[m_routing_strategy]\
            \ modules.\n\nIt is required only during a create operation. \n\nThe profile type cannot be changed for an existing\
            \ user profile.\n\n"
          enum:
          - ADMINISTRATOR
          - ADMINISTRATOR_ONLY
          - SUPERVISOR
          - PREMIUM_AGENT
          - STANDARD_AGENT
          - ANALYZER_ADMINISTRATOR
          - ANALYZER_SUPERVISOR
          - ANALYZER_USER
          example: PREMIUM_AGENT
        accessAllModules:
          type: string
          description: 'This can be used to allow users of this profile access to specific or all the Webex Contact Center
            modules.


            It can take one of these values:


            ALL — A contact center user with this profile can access all Contact Center modules.


            SPECIFIC — A contact center user with this profile can access only specific modules.


            '
          enum:
          - SPECIFIC
          - ALL
          - PROVISIONED_VALUE
          - NONE
          example: ALL
        userProfileAppModules:
          type: array
          description: 'Specifies the module(s) a user of this profile has access to.


            It should be chosen when module access is SPECIFIC.


            Please specify all the following modules and their respective access type.


            '
          items:
            $ref: '#/components/schemas/UserProfileAppModuleDTO'
            description: User Profile App Module.
          uniqueItems: true
        accessAllEntryPoints:
          type: string
          description: 'Allow users of this profile access to specific or all the entry points for an organization.


            It can take one of these values:


            ALL — A contact center user with this profile can access all the entry points for an organization.


            SPECIFIC — A contact center user with this profile can access only specific entry points for an organization.


            '
          enum:
          - SPECIFIC
          - ALL
          - PROVISIONED_VALUE
          - NONE
          example: ALL
        accessAllSites:
          type: string
          description: 'Allow users of this profile access to specific or all the sites for an organization.


            It can take one of these values:


            ALL — A contact center user with this profile can access all the sites for an organization.


            SPECIFIC — A contact center user with this profile can access only specific sites for an organization.


            '
          enum:
          - SPECIFIC
          - ALL
          - PROVISIONED_VALUE
          - NONE
          example: ALL
        accessAllQueues:
          type: string
          description: 'Allow users of this profile access to specific or all the contact center queues for an organization.


            It can take one of these values:


            ALL — A contact center user with this profile can access all the contact center queues for an organization.


            SPECIFIC — A contact center user with this profile can access only specific contact center queues for an organization.


            '
          enum:
          - SPECIFIC
          - ALL
          - PROVISIONED_VALUE
          - NONE
          example: ALL
        accessAllTeams:
          type: string
          description: 'Allow users of this profile access to specific or all the contact center teams for an organization.


            It can take one of these values:


            ALL — A contact center user with this profile can access all the contact center teams for an organization.


            SPECIFIC — A contact center user with this profile can access only specific contact center teams for an organization.


            '
          enum:
          - SPECIFIC
          - ALL
          - PROVISIONED_VALUE
          - NONE
          example: ALL
        active:
          type: boolean
          description: Specify whether the User profile is active or not.
          example: true
        editableFolderIds:
          type: array
          description: "Indicates the id(s) of the reporting folders a user of this profile has read and write access to.\
            \ \n"
          items:
            description: Identifier of a folder the user profile can edit
            example: 1
          uniqueItems: true
        viewableFolderIds:
          type: array
          description: "Indicates the id(s) of the reporting folders a user of this profile has read access to. \n"
          items:
            description: Identifier of a folder the user profile can view
            example: 2
          uniqueItems: true
        nonViewableFolderIds:
          type: array
          description: "Indicates the id(s) of the restricted reporting folders for a user of this profile. \n"
          items:
            description: Identifier of a folder hidden from the user profile
            example: 3
          uniqueItems: true
        systemDefault:
          type: boolean
          description: Indicates whether the created resource is system created or not
          example: false
        createdTime:
          type: integer
          format: int64
          description: This is the created time of the entity.
          example: 123456789
        lastUpdatedTime:
          type: integer
          format: int64
          description: This is the updated time of the entity.
          example: 123456789
        entryPoints:
          type: array
          description: "Specify the id(s) of the entry point(s) a user of this profile will have access to. \n\nIt should\
            \ be chosen when entry points access is SPECIFIC. Please see '''Entry Point documentation''', and use Get EntryPoints\
            \ API to fetch the values of entry points.\n\n"
          items:
            description: Entry point identifier assigned to the user profile
            example: f53c8b54-46ca-43f6-ba05-08426a46e23d
          uniqueItems: true
        sites:
          type: array
          description: "Specify the id(s) of the site(s) a user of this profile will have access to. \nIt should be chosen\
            \ when sites access is SPECIFIC. Please see Sites documentation, and use Get Site API to fetch the values of site\
            \ IDs.\n\n"
          items:
            description: Site identifier assigned to the user profile
            example: f53c8b54-46ca-43f6-ba05-08426a46e23d
          uniqueItems: true
        queues:
          type: array
          description: "Specify the id(s) of the queue(s) a user of this profile will have access to. \nIt should be chosen\
            \ when queues access is SPECIFIC. Please see Queues documentation, and use Get Queues API to fetch the values\
            \ of queue IDs.\n\n"
          items:
            description: Queue identifier assigned to the user profile
            example: f53c8b54-46ca-43f6-ba05-08426a46e23d
          uniqueItems: true
        teams:
          type: array
          description: 'Specify the id(s) of the team(s) a user of this profile will have access to.

            It should be chosen when teams access is SPECIFIC. Please see Teams documentation, and use Get Teams API to fetch
            the values of team IDs.


            '
          items:
            description: Team identifier assigned to the user profile
            example: f53c8b54-46ca-43f6-ba05-08426a46e23d
          uniqueItems: true
      required:
      - accessAllEntryPoints
      - accessAllModules
      - accessAllQueues
      - accessAllSites
      - accessAllTeams
      - active
      - name
      - profileType
    UserDetailsRequestDTO:
