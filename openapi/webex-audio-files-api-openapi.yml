  /organization/{orgid}/audio-file/{id}/incoming-references:
    get:
      tags:
      - Audio Files
      summary: List references for a specific Audio File
      description: Retrieve a list of all entities that have reference to an existing Audio File by ID in a given organization.
      operationId: getIncomingReferences_19
      parameters:
      - name: orgid
        in: path
        description: Organization ID to be used for this operation. The specified security token must have permission to interact with the organization.
        required: true
        schema:
          type: string
        example: 2f9eecc5-0472-4549-9a83-2afdae0d4ba1
      - name: id
        in: path
