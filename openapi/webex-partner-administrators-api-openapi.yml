      summary: Get all customers managed by a partner admin
      operationId: Get all customers managed by a partner admin
      description: 'Get all customer organizations managed by given partner admin, in the `managedBy` request parameter. The
        `managedBy` user typically has the role of a Partner Admin. In case where a Partner Full Admin or Partner Read-Only
        admin is selected an error like "The user already has access to all customers managed by their partner organization."
        is shown as a Partner Admin (Full and Read-Only) is able to manage all customers by default. This does not include
        customers managed through Customer Groups.


        This API can be invoked by Partner Full Admin and Partner Readonly Admin.

        Specify the `personId` in the `managedBy` parameter in the URI.'
      tags:
      - Partner Administrators
      parameters:
      - name: managedBy
        in: query
        description: List customer orgs associated with this person ID.
        required: true
        example: Y2LZY29ZCGFYAZOVL3VZL1BFT1BMRS9JOTYWOTZIYI1KYTRHLTQ3NZETYTC2ZI1KNDEZODQWZWVM1TQ
        schema:
          type: string
