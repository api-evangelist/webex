      summary: Unassign partner admin from a customer
      operationId: Unassign partner admin from a customer
      description: 'Unassign a specific partner admin from a customer organization. Unassigning a customer organization from
        a partner admin does not remove the role from the user. If a partner admin is also managing the customer organization
        through a Customer Group, they will continue to have access.

        This API can be used by Partner Full Admin.


        Specify the `orgId` and the `personId` in the path param.'
