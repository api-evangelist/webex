          example: true
    AiAutoCSATDTO:
      type: object
      description: This is applicable/available when either AI Assistant/AI Quality Management add-on offer/license is added to the organization.
      properties:
        enable:
          type: boolean
          description: Used to toggle the state of the AI feature sub feature  configuration from active to inactive and vice-versa. Mandatory for create/update operation. If the value is missing in response, the consumer should assume a value as false.
          example: true
        queuesInclusionType:
          type: string
          description: Provides information whether all or specific queues are selected for Auto CSAT. If the value is missing in response, the consumer should assume a value as ALL.
          enum:
          - ALL
          - SPECIFIC
          example: ALL
        selectedGlobalVariableId:
          type: string
          description: Selected Global Variable ID for Auto CSAT. If the value is missing in response, the consumer should assume a value as null.
          example: af9eecc5-0472-4549-9a83-2afdae0d4ba0
        surveyDataSource:
          type: string
          description: Survey Data Source Type for Auto CSAT. If the value is missing in response, the consumer should assume a value as EXPERIENCE_MANAGEMENT.
          enum:
          - EXPERIENCE_MANAGEMENT
          - GLOBAL_VARIABLE
          example: EXPERIENCE_MANAGEMENT
      required:
      - enable
