            examples:
              realTimeTranscriptsPatchExample:
                summary: Real time transcripts configuration update
                description: Real time transcripts configuration update. Must have access to update.
                value:
                  id: 26e2df70-0f77-41b8-8e8f-1d76e92c9638
                  realtimeTranscripts:
                    enable: true
              suggestedResponsesPatchExample:
                summary: Generated Summaries configuration update
                description: Generated Summaries configuration update. Must have access to update.
                value:
                  id: 26e2df70-0f77-41b8-8e8f-1d76e92c9638
                  generatedSummaries:
                    callDropSummariesEnabled: true
                    virtualAgentTransferSummariesEnabled: true
                    consultTransferSummariesEnabled: true
                    wrapUpSummariesEnabled: true
                    queuesInclusionType: ALL
              agentWellbeingPatchExample:
                summary: Agent Wellbeing configuration update
