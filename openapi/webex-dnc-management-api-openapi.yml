tags:
- name: DNC Management
  description: Operations for managing Do Not Contact (DNC) lists and phone number entries
paths:
  /v3/campaign-management/dncList/{dncListName}/phoneNumber:
    post:
      tags:
      - DNC Management
      summary: Add Phone Number to DNC List
      operationId: addPhoneNumberToDncList
      description: 'Adds a phone number to the specified Do Not Contact (DNC) list. This operation helps ensure compliance
        with applicable rules & regulations by preventing outbound calls to specific numbers.


        **Note:** Phone numbers must be in E.164 format (e.g., +1234567890). Duplicate entries will be rejected with a 409
        error.'
      parameters:
      - name: dncListName
        in: path
        description: This is the Name of the DNC list to which you want to add a phone number. List names are case-sensitive
          and must be URL-encoded if they contain special characters.
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 100
        example: corporate-dnc-list
      requestBody:
        required: true
        description: Phone number details to add to the DNC list
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DncEntryRequest'
            examples:
              basic:
                summary: Basic phone number entry
                value:
                  phoneNumber: '+1234567890'
                  source: customer-request
              with-metadata:
                summary: Entry with additional metadata
                value:
                  phoneNumber: '+1987654321'
                  source: regulatory-compliance
                  reason: Customer opted out via email
      responses:
        '201':
          description: Phone number successfully added to the DNC list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DncEntryResponse'
              example:
                phoneNumber: '+1234567890'
                source: customer-request
                addedDate: '2024-01-15T10:30:00Z'
                addedBy: admin@example.com
        '400':
          description: 'Bad Request: The request was invalid or cannot be otherwise served. An accompanying error message
            will explain further.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: 'Unauthorized: Authentication credentials were missing or incorrect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 'Forbidden: The request is understood, but it has been refused or access is not allowed. User lacks
            required permissions to manage DNC lists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: 'Not Found: The specified DNC list does not exist or the user does not have access to it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: 'Conflict: The phone number already exists in the specified DNC list.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '429':
          description: 'Too Many Requests: Too many requests have been sent in a given amount of time and the request has
            been rate limited. A Retry-After header should be present that specifies how many seconds you need to wait before
            a successful request can be made.'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Number of seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: 'Internal Server Error: Something went wrong on the server. If the issue persists, feel free to contact
            the [Webex Developer Support team](/explore/support).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '502':
          description: 'Bad Gateway: The server received an invalid response from an upstream server while processing the
            request. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadGatewayError'
        '503':
          description: 'Service Unavailable: Server is overloaded with requests. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
        '504':
          description: 'Gateway Timeout: An upstream server failed to respond on time. If your query uses max parameter, please
            try to reduce it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'
  /v3/campaign-management/dncList/{dncListName}/phoneNumber/{phoneNumber}:
    get:
      tags:
      - DNC Management
      summary: Get Phone Number from DNC List
      operationId: getPhoneNumberFromDncList
      description: 'Retrieves details of a specific phone number from the specified Do Not Contact (DNC) list. This operation
        allows you to check if a number is present in the list and view associated metadata.


        **Note:** Phone numbers must be URL-encoded and in E.164 format (e.g., %2B1234567890 for +1234567890).'
      parameters:
      - name: dncListName
        in: path
        description: The name of the DNC list to search in. List names are case-sensitive and must be URL-encoded if they
          contain special characters.
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 100
        example: corporate-dnc-list
      - name: phoneNumber
        in: path
        description: The phone number to retrieve from the DNC list. Must be URL-encoded and in E.164 format (e.g., %2B1234567890
          for +1234567890).
        required: true
        schema:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
        example: '+1234567890'
      responses:
        '200':
          description: Phone number details successfully retrieved from the DNC list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DncEntryResponse'
              example:
                phoneNumber: '+1234567890'
                source: customer-request
                addedDate: '2024-01-15T10:30:00Z'
                addedBy: admin@example.com
                reason: Customer opted out via phone
        '400':
          description: 'Bad Request: The request was invalid or cannot be otherwise served. An accompanying error message
            will explain further.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: 'Unauthorized: Authentication credentials were missing or incorrect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 'Forbidden: The request is understood, but it has been refused or access is not allowed. User lacks
            required permissions to view DNC lists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: 'Not Found: The specified DNC list does not exist, the phone number is not found in the list, or the
            user does not have access to it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                code: 1001
                message: Phone number +1234567890 not found in DNC list 'corporate-dnc-list'
                trackingId: WXC-12345-67892
        '429':
          description: 'Too Many Requests: Too many requests have been sent in a given amount of time and the request has
            been rate limited. A Retry-After header should be present that specifies how many seconds you need to wait before
            a successful request can be made.'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Number of seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: 'Internal Server Error: Something went wrong on the server. If the issue persists, feel free to contact
            the [Webex Developer Support team](/explore/support).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '502':
          description: 'Bad Gateway: The server received an invalid response from an upstream server while processing the
            request. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadGatewayError'
        '503':
          description: 'Service Unavailable: Server is overloaded with requests. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
        '504':
          description: 'Gateway Timeout: An upstream server failed to respond on time. If your query uses max parameter, please
            try to reduce it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'
    delete:
      tags:
      - DNC Management
      summary: Remove Phone Number from DNC List
      operationId: removePhoneNumberFromDncList
      description: 'Removes a phone number from the specified Do Not Contact (DNC) list. This operation allows administrators
        to remove numbers that should no longer be blocked from receiving calls.


        **Note:** Phone numbers must be URL-encoded and in E.164 format (e.g., +1234567890 for +1234567890). If the number
        doesn''t exist in the list, a 404 error will be returned.'
      parameters:
      - name: dncListName
        in: path
        description: The name of the DNC list to remove the phone number from. List names are case-sensitive and must be URL-encoded
          if they contain special characters.
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 100
        example: corporate-dnc-list
      - name: phoneNumber
        in: path
        description: The phone number to remove from the DNC list. Must be URL-encoded and in E.164 format (e.g., %2B1234567890
          for +1234567890).
        required: true
        schema:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
        example: '+1234567890'
      responses:
        '204':
          description: Phone number successfully removed from the DNC list. No content is returned.
        '400':
          description: 'Bad Request: The request was invalid or cannot be otherwise served. An accompanying error message
            will explain further.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: 'Unauthorized: Authentication credentials were missing or incorrect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 'Forbidden: The request is understood, but it has been refused or access is not allowed. User lacks
            required permissions to manage DNC lists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: 'Not Found: The specified DNC list does not exist, the phone number is not found in the list, or the
            user does not have access to it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                code: 1001
                message: Phone number +1234567890 not found in DNC list 'corporate-dnc-list'
                trackingId: WXC-12345-67893
        '429':
          description: 'Too Many Requests: Too many requests have been sent in a given amount of time and the request has
            been rate limited. A Retry-After header should be present that specifies how many seconds you need to wait before
            a successful request can be made.'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Number of seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: 'Internal Server Error: Something went wrong on the server. If the issue persists, feel free to contact
            the [Webex Developer Support team](/explore/support).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '502':
          description: 'Bad Gateway: The server received an invalid response from an upstream server while processing the
            request. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadGatewayError'
        '503':
          description: 'Service Unavailable: Server is overloaded with requests. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
        '504':
          description: 'Gateway Timeout: An upstream server failed to respond on time. If your query uses max parameter, please
            try to reduce it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'
