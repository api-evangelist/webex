      summary: Update a Contact
      operationId: Update a Contact
      description: 'Update details for contact by ID. Only an admin can update a contact.

        Specify the organization ID in the `orgId` parameter in the URI, and specify the contact ID in the `contactId` parameter
        in the URI.


        Use the optional `groupIds` field to update the group IDs by changing the existing array. You can add or remove one
        or all groups. To remove all associated groups, pass an empty array in the `groupIds` field.'
      tags:
      - Organization Contacts
      parameters:
      - name: orgId
        in: path
        description: Webex Identity assigned organization identifier for the user's organization or the organization he manages.
        required: true
        example: d23736ac-8055-433e-b85a-0fc55c96ead8
        schema:
          type: string
      - name: contactId
        in: path
        description: The contact ID.
        required: true
        example: 6847ee0f-5e9c-4403-9f0e-0aa8552f7828
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              schemas: urn:cisco:codev:identity:contact:core:1.0
              displayName: John Andersen
              firstName: John
              lastName: Andersen
              companyName: Cisco Systems
              title: GM
              address: '{\"city\" : \"Milpitas\", \"country\" : \"US\", \"street\" : \"1099 Bird Ave.\", \"zipCode\" : \"99212\"}'
              avatarURL: https://avatar-prod-us-east-2.webexcontent.com/default_avatar~1600
