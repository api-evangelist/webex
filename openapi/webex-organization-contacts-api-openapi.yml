      summary: Get a Contact
      operationId: Get a Contact
      description: 'Shows details for an organization contact by ID.

        Specify the organization ID in the `orgId` parameter in the URI, and specify the contact ID in the `contactId` parameter
        in the URI.


        **NOTE**:

        The `orgId` used in the path for this API are the org UUIDs. They follow a xxxx-xxxx-xxxx-xxxx pattern. If you have
        an orgId in base64 encoded format (starting with Y2.....) you need to base64 decode the id and extract the UUID from
        the slug, before you use it in your API call.'
      tags:
      - Organization Contacts
      parameters:
      - name: orgId
        in: path
        description: Webex Identity assigned organization identifier for the user's organization or the organization he manages.
        required: true
        example: d23736ac-8055-433e-b85a-0fc55c96ead8
        schema:
          type: string
