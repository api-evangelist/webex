      summary: Get Meeting Qualities
      operationId: getMeetingQualities
      description: Get quality data for a meeting, by `meetingId`. Only organization administrators can retrieve meeting quality data.
      tags:
      - Meeting Qualities
      parameters:
      - name: meetingId
        in: query
        description: Unique identifier for the specific meeting instance. **Note:** The `meetingId` can be obtained via the Meeting List API when meetingType=meeting. The `id` attribute in the Meeting List Response is what is needed, for example, `e5dba9613a9d455aa49f6ffdafb6e7db_I_191395283063545470`.
        required: true
        example: e5dba9613a9d455aa49f6ffdafb6e7db_I_191395283063545470
        schema:
          type: string
      - name: max
        in: query
        description: Limit the maximum number of media sessions in the response.
        example: 100
        schema:
          type: number
          default: 100
      - name: offset
        in: query
        description: Offset from the first result that you want to fetch.
        example: 0
        schema:
          type: number
