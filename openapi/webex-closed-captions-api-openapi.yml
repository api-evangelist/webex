      summary: List Meeting Closed Captions
      operationId: getMeetingClosedCaptions
      description: 'Lists closed captions of a finished [meeting instance](/docs/meetings#meeting-series-scheduled-meetings-and-meeting-instances)
        specified by `meetingId`.


        * Closed captions are ready 15 minutes after the meeting is finished.


        * Only **meeting instances** in state `ended` are supported for `meetingId`. **Meeting series**, **scheduled meetings**
        and `in-progress` **meeting instances** are not supported.


        * Currently, a meeting may have only one closed caption associated with its `meetingId`. The response is a closed
        captions array, which may contain multiple values to allow for future expansion, but currently only one closed caption
        is included in the response.'
      tags:
      - Closed Captions
      parameters:
      - name: meetingId
        in: query
        description: Unique identifier for the [meeting instance](/docs/meetings#meeting-series-scheduled-meetings-and-meeting-instances)
          which the closed captions belong to. This parameter only applies to ended meeting instances. It does not apply to
          meeting series, scheduled meetings or scheduled [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings)
          meetings.
        required: true
        example: 0ed74a1c0551494fb7a04e2881bf50ae_I_166022169160077044
        schema:
          type: string
