      summary: Download Meeting Closed Caption Snippets
      operationId: downloadTranscript
      description: 'Download meeting closed caption snippets from the meeting closed caption specified by `closedCaptionId`
        formatted either as a Video Text Track (.vtt) file or plain text (.txt) file.


        #### Request Header


        * `timezone`: *[Time zone](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List) for time stamps in response
        body, defined in conformance with the [IANA time zone database](https://www.iana.org/time-zones). The default value
        is `UTC` if not specified.*'
      tags:
      - Closed Captions
      parameters:
      - name: closedCaptionId
        in: path
        description: Unique identifier for the meeting closed caption.
        required: true
        example: 195d64646ad14be2924ea50f541fd91d
        schema:
          type: string
      - name: format
        in: query
        description: Format for the downloaded meeting closed caption snippets.
        example: vtt
        schema:
          type: string
          default: vtt
          enum:
          - vtt
          - txt
      - name: meetingId
        in: query
        description: Unique identifier for the [meeting instance](/docs/meetings#meeting-series-scheduled-meetings-and-meeting-instances)
          which the closed caption snippets belong to. This parameter only applies to meeting instances in the `ended` state.
          It does not apply to meeting series, scheduled meetings or scheduled [personal room](https://help.webex.com/en-us/article/nul0wut/Webex-Personal-Rooms-in-Webex-Meetings)
          meetings.
        required: true
        example: 870f51ff287b41be84648412901e0402_I_167427437874906709
        schema:
          type: string
      - name: timezone
        in: header
        description: e.g. UTC
        required: false
        schema:
          type: string
        example: UTC
components:
  schemas:
    SnippetObject:
      type: object
      required:
      - id
      - text
      - personName
      - personEmail
      - offsetMillisecond
      - durationMillisecond
      properties:
        id:
          type: string
          example: 195d64646ad14be2924ea50f541fd91d_00001
          description: A unique identifier for the snippet.
        text:
          type: string
          example: Hello everyone
          description: Text for the snippet.
        personName:
          type: string
          example: John Andersen
          description: Name of the person generating the speech for the snippet.
        personEmail:
          type: string
          example: john.andersen@example.com
          description: Email address of the person generating the speech for the snippet.
        offsetMillisecond:
          type: number
          example: 1000
          description: Offset from the beginning of the parent transcript in milliseconds indicating the start time of the
            snippet.
        durationMillisecond:
          type: number
          example: 2000
          description: Duration of the snippet in milliseconds.
    ClosedCaptionObject:
      type: object
      properties:
        id:
          type: string
          example: 195d64646ad14be2924ea50f541fd91d
          description: A unique identifier for the closed caption.
        meetingId:
          type: string
          example: 0ed74a1c0551494fb7a04e2881bf50ae_I_166022169160077044
          description: Unique identifier for the [meeting instance](/docs/meetings#meeting-series-scheduled-meetings-and-meeting-instances)
            which the closed captions belong to.
        vttDownloadLink:
          type: string
          example: http://site-example.webex.com/v1/meetingClosedCaptions/195d64646ad14be2924ea50f541fd91d/download?format=vtt
          description: The download link for the closed caption vtt file.
        txtDownloadLink:
          type: string
          example: http://site-example.webex.com/v1/meetingClosedCaptions/195d64646ad14be2924ea50f541fd91d/download?format=txt
          description: The download link for the closed caption txt file.
        start:
          type: string
          example: '2020-06-01T20:30:15.042Z'
          description: Start time for the meeting closed caption in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant
            format.
