                jobExecutionStatus:
                - id: 3
                  startTime: '2024-05-16T20:24:24.924Z'
                  lastUpdated: '2024-05-16T20:24:24.924Z'
                  statusMessage: STARTED
                  exitCode: UNKNOWN
