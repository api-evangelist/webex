                  timeElapsed: PT5.787S
                latestExecutionStatus: COMPLETED
                latestExecutionExitCode: COMPLETED
                counts:
                  userResendInviteSent: 0
                  userResendInviteFailed: 0
                  userResendInviteSkipped: 1
                  totalUsers: 1
