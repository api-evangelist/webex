      summary: Start Conference
      operationId: Start Conference
      description: 'Join the user''s calls into a conference.  A minimum of two call IDs are required. Each call ID identifies an existing call between the user

        and a participant to be added to the conference.'
      tags:
      - Conference Controls
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              callIds:
              - Y2lzY29z...,Y2lzY30z...
              lineOwnerId: Y2lzY29z...
            schema:
              type: object
              required:
              - callIds
              properties:
                callIds:
                  type: array
                  items:
                    type: string
                    example: Y2lzY29z...,Y2lzY30z...
                  description: List of call identifiers of the participants to join into the conference. A minimum of two call IDs are required.
                lineOwnerId:
                  type: string
                  example: Y2lzY29z...Y
                  description: The ID of a user, workspace, or virtual line for which there is a secondary line on a device owned by the user invoking the API.
