      summary: Create a Report
      operationId: createaReport
      description: 'Create a new report. For each `templateId`, there are a set of validation rules that need to be followed. For example, for templates belonging to Webex, the user needs to provide `siteUrl`. These validation rules can be retrieved via the [Report Templates API](/docs/api/v1/report-templates).


        The ''templateId'' parameter is a number. However, it is a limitation of developer.webex.com platform that it is passed as a string when you try to test the API from here.


        CSV reports for Webex suite services are only supported for organizations based in the North American region. Organizations based in a different region will return blank CSV files for any Teams reports.'
      tags:
      - Reports
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - templateId
              properties:
                templateId:
                  type: number
                  example: 5
                  description: Unique ID representing valid report templates.
                startDate:
                  type: string
                  example: '2020-05-01'
                  description: Data in the report will be from this date onwards.
                endDate:
                  type: string
                  example: '2020-05-05'
                  description: Data in the report will be until this date.
                siteList:
                  type: string
                  example: cisco.webex.com
                  description: Sites belonging to user's organization. This attribute is needed for site-based templates.
