          description: 'Internal Server Error: Something went wrong on the server. If the issue persists, feel free to contact the [Webex Developer Support team](/explore/support).'
        '502':
          description: 'Bad Gateway: The server received an invalid response from an upstream server while processing the request. Try again later.'
        '503':
          description: 'Service Unavailable: Server is overloaded with requests. Try again later.'
        '504':
          description: 'Gateway Timeout: An upstream server failed to respond on time. If your query uses max parameter, please try to reduce it.'
      summary: Switch Mode for Call Forwarding Settings for a Call Queue
      operationId: switchCallQueueCallForwardingMode
      description: 'Switches the current operating mode of the `Call Queue` to the mode as per normal operations.


        Operating modes allow call forwarding to be configured based on predefined schedules, enabling different routing behaviors during business hours, after hours, or holidays.


        Switching operating mode for a `call queue` requires a full, or location administrator auth token with a scope of `spark-admin:telephony_config_write`.'
      tags:
      - 'Features:  Call Queue'
      parameters:
      - name: locationId
        in: path
        description: '`Location` in which this `call queue` exists.'
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OL2E4Mjg5NzIyLTFiODAtNDFiNy05Njc4LTBlNzdhZThjMTA5OA
        schema:
          type: string
      - name: queueId
        in: path
        description: Switch operating mode to normal operations for this `call queue`.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvNDI0OTlmZjUtYWI1ZC00NzU4LTliMWItZjg3MTVhM2UwNmVh
        schema:
          type: string
      - name: orgId
        in: query
        description: Switch operating mode as per normal operations for the `call queue` from this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example: {}
            schema:
              type: object
              properties: {}
components:
  schemas:
    CallQueueCallForwardAvailableNumberObject:
      type: object
      required:
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        extension:
          type: string
          example: '1235'
          description: Extension for a PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
        owner:
          type: object
          required:
          - id
          - type
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9jODhiZGIwNC1jZjU5LTRjMjMtODQ4OC00NTNhOTE3ZDFlMjk
              description: Unique identifier of the owner to which PSTN Phone number is assigned.
            type:
              $ref: '#/components/schemas/NumberOwnerType'
              description: Type of the PSTN phone number's owner.
            firstName:
              type: string
              example: Test
              description: First name of the PSTN phone number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            lastName:
              type: string
              example: Person
              description: Last name of the PSTN phone number's owner. This field will be present only when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
            displayName:
              type: string
              example: TestWorkSpace
              description: Display name of the PSTN phone number's owner. This field will be present except when the owner `type` is `PEOPLE` or `VIRTUAL_LINE`.
    ListCallQueueEssentialsObject:
      type: object
      required:
      - id
      - name
      - hasCxEssentials
      - locationName
      - locationId
      - enabled
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0NBTExfUVVFVUUvNTU1MzY4Y2QtZDg5Mi00YzFlLTk0YjYtNzdjNjRiYWQ3NWMx
          description: A unique identifier for the call queue.
        name:
          type: string
          example: '5714328359'
          description: Unique name for the call queue.
        hasCxEssentials:
          type: boolean
          example: true
          description: Denotes if the call queue has Customer Assist license.
        locationName:
          type: string
          example: WXCSIVDKCPAPIC4S1
          description: Name of location for call queue.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
          description: ID of location for call queue.
        phoneNumber:
          type: string
          example: '+15558675309'
          description: Primary phone number of the call queue.
        extension:
          type: string
          example: '7781'
          description: Primary phone extension of the call queue.
        enabled:
          type: boolean
          example: true
          description: Whether or not the call queue is enabled.
        department:
          type: object
          properties:
            id:
              type: string
              example: Y2lzY29zcGFyazovL3VzL1NDSU1fR1JPVVAvZjA2ZWRiOGMtMjMxNC00ZTcxLWIzNzgtZTdiMmQwNjk3OTliOjk2YWJjMmFhLTNkY2MtMTFlNS1hMTUyLWZlMzQ4MTljZGM5YQ
              description: Unique identifier of the department.
            name:
              type: string
              example: HR
              description: Name of the department.
          description: The department information.
    ModifyPersonPlaceVirtualLineCallQueueObject:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BMQUNFLzgzYjQ0OTIyLWZlOWYtMTFlYi1hNGI4LTMzNjI3YmVkNjdiNQ
          description: ID of person, workspace or virtual line.
        weight:
          type: string
          example: '50'
          description: Weight of person, workspace or virtual line. Only applied when call policy is `WEIGHTED`.
        skillLevel:
          type: number
          example: 1
          description: Skill level of person, workspace or virtual line. Only applied when call routing type is `SKILL_BASED`.
        joinEnabled:
          type: boolean
          example: true
          description: Indicates the join status of the agent for this queue. The default value for newly added agents is `true`.
    AnnouncementAudioFile:
      type: object
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC8zMjAxNjRmNC1lNWEzLTQxZmYtYTMyNi02N2MwOThlNDFkMWQ
          description: Unique identifier of the Announcement file.
        name:
          type: string
          example: Public_Announcement.wav
          description: Name of the announcement file. `name`, `mediaFileType`, `level` are mandatory if `id` is not provided for uploading an announcement.
        mediaFileType:
          type: string
          example: WAV
          description: Media file type of announcement file.
        level:
          type: string
          enum:
          - LOCATION
          - ORGANIZATION
          - ENTITY
          description: The level at which this announcement exists.
    PostCallQueueEssentialCallPolicyObject:
      type: object
      required:
      - routingType
      - policy
      - callBounce
      - distinctiveRing
      properties:
        routingType:
          $ref: '#/components/schemas/HuntRoutingTypeSelection'
          description: Call routing type to use to dispatch calls to agents. The routing type should be `SKILL_BASED` if you want to assign skill level to `agents`. Only certain `policy` are allowed in `SKILL_BASED` type.
        policy:
          $ref: '#/components/schemas/HuntPolicyEssentialSelection'
          description: Call routing policy to use to dispatch calls to `agents`.
        callBounce:
          type: object
          properties:
            callBounceEnabled:
              type: boolean
              example: true
              description: If enabled, bounce calls after the set number of rings.
            callBounceMaxRings:
              type: number
              example: 5
              description: Number of rings after which to bounce call, if `callBounce` is enabled.
            agentUnavailableEnabled:
              type: boolean
              example: true
              description: Bounce if agent becomes unavailable.
            alertAgentEnabled:
              type: boolean
              example: true
              description: Alert agent if call on hold more than `alertAgentMaxSeconds`.
            alertAgentMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to alert agent if `alertAgentEnabled`.
            callBounceOnHoldEnabled:
              type: boolean
              example: true
              description: Bounce if call on hold more than `callBounceMaxSeconds`.
            callBounceOnHoldMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to bounce if `callBounceEnabled`.
          description: Settings for when the call into the hunt group is not answered.
        distinctiveRing:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Whether or not the `distinctiveRing` is enabled.
            ringPattern:
              $ref: '#/components/schemas/RingPatternObject'
              description: Ring pattern for when this call queue is called. Only available when `distinctiveRing` is enabled for the call queue.
          description: Whether or not the call queue has the `distinctiveRing` option enabled.
    CallQueueAlternateAvailableNumberObject:
      type: object
      required:
      - phoneNumber
      - state
      - isMainNumber
      - tollFreeNumber
      - telephonyType
      - isServiceNumber
      properties:
        phoneNumber:
          type: string
          example: '+12056350001'
          description: A unique identifier for the PSTN phone number.
        state:
          $ref: '#/components/schemas/STATE'
          description: Phone number's state.
        isMainNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is used as a location CLID.
        tollFreeNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a toll-free number.
        telephonyType:
          $ref: '#/components/schemas/TelephonyType'
          description: The telephony type for the number.
        isServiceNumber:
          type: boolean
          example: true
          description: If `true`, the phone number is a service number; otherwise, it is a standard number. Service numbers are high-utilization or high-concurrency PSTN phone numbers that are neither mobile nor toll-free.
    NumberOwnerType:
      type: string
      enum:
      - PLACE
      - PEOPLE
      - VIRTUAL_LINE
      - AUTO_ATTENDANT
      - CALL_QUEUE
      - GROUP_PAGING
      - HUNT_GROUP
      - VOICE_MESSAGING
      - OFFICE_ANYWHERE
      - CONTACT_CENTER_LINK
      - CONTACT_CENTER_ADAPTER
      - ROUTE_LIST
      - VOICEMAIL_GROUP
      - COLLABORATE_BRIDGE
      description: " * `PLACE` - PSTN phone number's owner is a workspace.\n * `PEOPLE` - PSTN phone number's owner is a person.\n * `VIRTUAL_LINE` - PSTN phone number's owner is a Virtual Profile.\n * `AUTO_ATTENDANT` - PSTN phone number's owner is an auto-attendant.\n * `CALL_QUEUE` - PSTN phone number's owner is a call queue.\n * `GROUP_PAGING` - PSTN phone number's owner is a group paging.\n * `HUNT_GROUP` - PSTN phone number's owner is a hunt group.\n * `VOICE_MESSAGING` - PSTN phone number's owner is a voice messaging.\n * `OFFICE_ANYWHERE` - PSTN phone number's owner is a Single Number Reach.\n * `CONTACT_CENTER_LINK` - PSTN phone number's owner is a Contact Center link.\n * `CONTACT_CENTER_ADAPTER` - PSTN phone number's owner is a Contact Center adapter.\n * `ROUTE_LIST` - PSTN phone number's owner is a route list.\n * `VOICEMAIL_GROUP` - PSTN phone number's owner is a voicemail group.\n * `COLLABORATE_BRIDGE` - PSTN phone number's owner is a collaborate bridge.\n"
    UserType:
      type: string
      enum:
      - PEOPLE
      - PLACE
      - VIRTUAL_LINE
      description: " * `PEOPLE` - The associated member is a person.\n * `PLACE` - The associated member is a workspace.\n * `VIRTUAL_LINE` - The associated member is a virtual line.\n"
    DirectLineCallerIdNameObject:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
          description: The selection of the direct line caller ID name. Defaults to `DISPLAY_NAME`.
        customName:
          type: string
          example: Hakim Smith
          description: The custom direct line caller ID name. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this workspace.
    ModesGet:
      type: object
      required:
      - normalOperationEnabled
      - id
      - name
      - type
      - level
      - forwardTo
      properties:
        normalOperationEnabled:
          type: boolean
          example: true
          description: Normal operation is enabled or disabled.
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
          description: The ID of the operating mode.
        name:
          type: string
          example: Day
          description: The name of the operating mode.
        type:
          type: string
          enum:
          - NONE
          - SAME_HOURS_DAILY
          - DIFFERENT_HOURS_DAILY
          - HOLIDAY
          description: "The type of the operating mode.\n * `NONE` - The operating mode is not scheduled.\n * `SAME_HOURS_DAILY` - Single time duration for Monday-Friday and single time duration for Saturday-Sunday.\n * `DIFFERENT_HOURS_DAILY` - Individual time durations for every day of the week.\n * `HOLIDAY` - Holidays which have date durations spanning multiple days, as well as an optional yearly recurrence by day or date.\n"
        level:
          type: string
          enum:
          - LOCATION
          - ORGANIZATION
          description: "The level of the operating mode.\n * `LOCATION` - The operating mode is at the location level.\n * `ORGANIZATION` - The operating mode is at the organization level.\n"
        forwardTo:
          type: object
          required:
          - selection
          - destination
          - destinationVoicemailEnabled
          - defaultDestination
          - defaultDestinationVoicemailEnabled
          - defaultForwardToSelection
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "The selection for forwarding.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, the mode's own default forwarding selection is to be applied.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            destination:
              type: string
              example: '+19705550006'
              description: The destination for forwarding. Required when the selection is set to `FORWARD_TO_SPECIFIED_NUMBER`.
            destinationVoicemailEnabled:
              type: boolean
              description: Sending incoming calls to voicemail is enabled/disabled when the destination is an internal phone number and that number has the voicemail service enabled.
            defaultDestination:
              type: string
              example: '00000'
              description: The operating mode's destination.
            defaultDestinationVoicemailEnabled:
              type: boolean
              description: The operating mode's destination voicemail enabled.
            defaultForwardToSelection:
              type: string
              enum:
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "The operating mode's forward to selection.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
          description: Forward to settings.
    ModifyCallQueueStrandedCallsObject:
      type: object
      required:
      - action
      - audioMessageSelection
      properties:
        action:
          type: string
          enum:
          - NONE
          - BUSY
          - TRANSFER
          - NIGHT_SERVICE
          - RINGING
          - ANNOUNCEMENT
          description: "The call processing action type.\n * `NONE` - Call remains in the queue.\n * `BUSY` - Calls are removed from the queue and are provided with the Busy treatment. If the queue is configured with the Call Forwarding Busy or the Voice Messaging service, then the call is handled accordingly.\n * `TRANSFER` - Calls are removed from the queue and are transferred to the configured `transferPhoneNumber`.\n * `NIGHT_SERVICE` - Calls are handled according to the Night Service configuration. If the Night Service action is set to `none`, then this is equivalent to this policy being set to `none` (that is, calls remain in the queue).\n * `RINGING` - Calls are removed from the queue and are provided with ringing until the caller releases the call. The ringback tone played to the caller is localized according to the country code of the caller.\n * `ANNOUNCEMENT` - Calls are removed from the queue and are provided with an announcement that is played in a loop until the caller releases the call.\n"
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureObject'
          description: List of pre-configured Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
    mediaType:
      type: string
      enum:
      - WMA
      - WAV
      - GP
      - MOV
      description: " * `WMA` - WMA File Extension.\n * `WAV` - WAV File Extension.\n * `GP` - 3GP File Extension.\n * `MOV` - MOV File Extension.\n"
    CallQueueCallForwardAvailableNumberListGetObject:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/CallQueueCallForwardAvailableNumberObject'
          description: Array of phone numbers.
    GetPersonPlaceObject:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE1NmE
          description: ID of person or workspace.
        firstName:
          type: string
          example: Hakim
          description: First name of person or workspace.
        lastName:
          type: string
          example: Smith
          description: First name of person or workspace.
        phoneNumber:
          type: string
          example: '+15555551234'
          description: Phone number of person or workspace.
        extension:
          type: string
          example: '1234'
          description: Extension of person or workspace.
        weight:
          type: string
          example: '50'
          description: Weight of person or workspace. Only applied when call policy is `WEIGHTED`.
    GetCallQueueEssentialsCallPolicyObject:
      type: object
      required:
      - policy
      - callBounce
      - distinctiveRing
      properties:
        policy:
          $ref: '#/components/schemas/HuntPolicyEssentialSelection'
          description: Call routing policy to use to dispatch calls to agents.
        callBounce:
          type: object
          required:
          - callBounceEnabled
          - callBounceMaxRings
          - agentUnavailableEnabled
          - alertAgentEnabled
          - alertAgentMaxSeconds
          - callBounceOnHoldEnabled
          - callBounceOnHoldMaxSeconds
          properties:
            callBounceEnabled:
              type: boolean
              example: true
              description: If enabled, bounce calls after the set number of rings.
            callBounceMaxRings:
              type: number
              example: 5
              description: Number of rings after which to bounce call, if call bounce is enabled.
            agentUnavailableEnabled:
              type: boolean
              example: true
              description: Bounce if agent becomes unavailable.
            alertAgentEnabled:
              type: boolean
              example: true
              description: Alert agent if call on hold more than alertAgentMaxSeconds.
            alertAgentMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to alert agent if alertAgentEnabled.
            callBounceOnHoldEnabled:
              type: boolean
              example: true
              description: Bounce if call on hold more than callBounceMaxSeconds.
            callBounceOnHoldMaxSeconds:
              type: number
              example: 20
              description: Number of second after which to bounce if callBounceEnabled.
          description: Settings for when the call into the call queue is not answered.
        distinctiveRing:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              example: true
              description: Whether or not the distinctive ring is enabled.
            ringPattern:
              $ref: '#/components/schemas/RingPatternObject'
              description: Ring pattern for when this callqueue is called. Only available when `distinctiveRing` is enabled for the call queue.
          description: Whether or not the call queue has the distinctive ring option enabled.
    CallQueueAlternateAvailableNumberListGetObject:
      type: object
      required:
      - phoneNumbers
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/CallQueueAlternateAvailableNumberObject'
          description: Array of phone numbers.
    HuntRoutingTypeSelection:
      type: string
      enum:
      - PRIORITY_BASED
      - SKILL_BASED
      description: " * `PRIORITY_BASED` - Default routing type which directly uses the routing policy to dispatch calls to the agents.\n * `SKILL_BASED` - This option uses skill level as the criteria to route calls to agents. When there is more than one agent with the same skill level, the selected `policy` helps dispatch the calls to the agents.\n"
    ModifyCallQueueForcedForwardObject:
      type: object
      required:
      - forcedForwardEnabled
      - playAnnouncementBeforeEnabled
      - audioMessageSelection
      properties:
        forcedForwardEnabled:
          type: boolean
          example: true
          description: Enable or disable call forced forward service routing policy.
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        playAnnouncementBeforeEnabled:
          type: boolean
          example: true
          description: Indicates whether an announcement plays to callers before the action is applied.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureObject'
          description: List of pre-configured Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
    CallForwardSettingsGet:
      type: object
      required:
      - callForwarding
      properties:
        callForwarding:
          type: object
          required:
          - always
          - selective
          properties:
            always:
              type: object
              required:
              - enabled
              - ringReminderEnabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '`Always` call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for "Always" call forwarding.
                ringReminderEnabled:
                  type: boolean
                  description: If `true`, a brief tone will be played on the person's phone when a call has been forwarded.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Settings for forwarding all incoming calls to the destination you choose.
            selective:
              type: object
              required:
              - enabled
              - ringReminderEnabled
              - destinationVoicemailEnabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: '`Busy` call forwarding is enabled or disabled.'
                destination:
                  type: string
                  example: '2225551212'
                  description: Destination for `Busy` call forwarding.
                ringReminderEnabled:
                  type: boolean
                  description: If `true`, a brief tone will be played on the person's phone when a call has been forwarded.
                destinationVoicemailEnabled:
                  type: boolean
                  description: Indicates enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
              description: Selectively forward calls to a designated number, depending on criteria rules. You'll need to have at least one rule for forwarding applied for call forwarding to be active.
            rules:
              type: array
              items:
                $ref: '#/components/schemas/CallForwardRulesGet'
              description: Rules for selectively forwarding calls.
            operatingModes:
              type: object
              required:
              - enabled
              - currentOperatingModeId
              - exceptionType
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: Operating modes are enabled or disabled.
                currentOperatingModeId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL09QRVJBVElOR19NT0RFL2JiOTc1OTcxLTBjZWYtNDdhNi05Yzc5LTliZWFjY2IwYjg4Mg
                  description: The ID of the current operating mode.
                exceptionType:
                  type: string
                  enum:
                  - MANUAL_SWITCH_BACK
                  - AUTOMATIC_SWITCH_BACK_EARLY_START
                  - AUTOMATIC_SWITCH_BACK_EXTENSION
                  - AUTOMATIC_SWITCH_BACK_STANDARD
                  description: "The exception type.\n * `MANUAL_SWITCH_BACK` - The mode was switched to or extended by the user for manual switch back and runs as an exception until the user manual switches the feature back to normal operation or a different mode.\n * `AUTOMATIC_SWITCH_BACK_EARLY_START` - The mode was switched to by the user before its start time and runs as an exception until its end time is reached at which point it automatically switches the feature back to normal operation.\n * `AUTOMATIC_SWITCH_BACK_EXTENSION` - The current mode was extended by the user before its end time and runs as an exception until the extension end time (mode's end time + extension of up to 12 hours) is reached at which point it automatically switches the feature back to normal operation.\n * `AUTOMATIC_SWITCH_BACK_STANDARD` - The mode will remain the current operating mode for the feature until its normal end time is reached.\n"
