      summary: Read the List of Call Queue Agents with Customer Assist
      operationId: listCallQueueAgents
      description: "List all Call Queues Agents for the organization.\n\nAgents can be users, workplace or virtual lines assigned to a call queue. Calls from the call queue are routed to agents based on configuration. \nAn agent can be assigned to one or more call queues and can be managed by supervisors.\n\nRetrieving this list requires a full or read-only administrator auth token with a scope of `spark-admin:telephony_config_read`.\n\n**Note**: The decoded value of the agent's `id`, and the `type` returned in the response, are always returned as `PEOPLE`, even when the agent is a workspace or virtual line. This will be addressed in a future release."
      tags:
      - 'Features:  Call Queue'
      parameters:
      - name: orgId
        in: query
        description: List call queues agents in this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      - name: locationId
        in: query
        description: Return only the call queue agents in this location.
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: queueId
        in: query
        description: Only return call queue agents with the matching queue ID.
        example: '``'
        schema:
          type: string
      - name: max
        in: query
        description: Limit the number of objects returned to this maximum count.
        example: '5'
        schema:
          type: number
      - name: start
        in: query
        description: Start at the zero-based offset in the list of matching objects.
        example: '0'
        schema:
          type: number
      - name: name
        in: query
        description: Returns only the list of call queue agents that match the given name.
        example: Customer Support
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Returns only the list of call queue agents that match the given phone number or extension.
        example: '+15558675309'
        schema:
          type: string
      - name: joinEnabled
        in: query
        description: Returns only the list of call queue agents that match the given `joinEnabled` value.
        example: 'true'
        schema:
          type: boolean
      - name: hasCxEssentials
        in: query
        description: Returns only the list of call queues with Customer Assist license when `true`, otherwise returns the list of Customer Experience Basic call queues.
        example: 'true'
        schema:
          type: boolean
      - name: order
        in: query
        description: Sort results alphabetically by call queue agent's name, in ascending or descending order.
        example: firstName|lastName|firstName-desc|lastName-desc
        schema:
          type: string
