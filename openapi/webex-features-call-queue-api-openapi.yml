      summary: Create a Selective Call Forwarding Rule for a Call Queue
      operationId: createCallQueueSelectiveCallForwardingRule
      description: 'Create a Selective Call Forwarding Rule for the designated Call Queue.


        A selective call forwarding rule for a call queue allows calls to be forwarded or not forwarded to the designated number, based on the defined criteria.


        Note that the list of existing call forward rules is available in the call queue''s call forwarding settings.


        Creating a selective call forwarding rule for a call queue requires a full administrator or location administrator auth token with a scope of `spark-admin:telephony_config_write`.


        **NOTE**: The Call Forwarding Rule ID will change upon modification of the Call Forwarding Rule name.'
      tags:
      - 'Features:  Call Queue'
      parameters:
      - name: locationId
        in: path
        description: Location in which the call queue exists.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzMxMTYx
        schema:
          type: string
      - name: queueId
        in: path
        description: Create the rule for this call queue.
        required: true
        example: Y2lzY29zcGFyazovL3VzL0hVTlRfR1JPVVAvYUhaaFpUTjJNRzh5YjBBMk5EazBNVEk1Tnk1cGJuUXhNQzVpWTJ4a0xuZGxZbVY0TG1OdmJRPT0
        schema:
          type: string
      - name: orgId
        in: query
        description: Create the call queue rule for this organization.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: New Selective Rule
              holidaySchedule: HolidayScheduleOne
              businessSchedule: BusinessScheduleTwo
              callsFrom:
                selection: CUSTOM
                customNumbers:
                  privateNumberEnabled: true
                  unavailableNumberEnabled: true
                  numbers:
                  - '2025551212'
              callsTo:
                numbers: []
              forwardTo:
                selection: FORWARD_TO_DEFAULT_NUMBER
              enabled: true
            schema:
              $ref: '#/components/schemas/CreateForwardingRuleObject'
