          type: array
          items:
            $ref: '#/components/schemas/CallQueuePrimaryAvailableNumberObject'
          description: Array of phone numbers.
    CallQueueQueueSettingsObject:
      type: object
      required:
      - queueSize
      - overflow
      properties:
        queueSize:
          type: number
          example: 50
          description: The maximum number of calls for this call queue. Once this number is reached, the `overflow` settings are triggered.
        callOfferToneEnabled:
          type: boolean
          example: true
          description: Play ringing tone to callers when their call is set to an available agent.
        resetCallStatisticsEnabled:
          type: boolean
          description: Reset caller statistics upon queue entry.
        overflow:
          type: object
          required:
          - action
          - greeting
          properties:
            action:
              type: string
              enum:
              - PERFORM_BUSY_TREATMENT
              - PLAY_RINGING_UNTIL_CALLER_HANGS_UP
              - TRANSFER_TO_PHONE_NUMBER
              description: "Indicates how to handle new calls when the queue is full.\n * `PERFORM_BUSY_TREATMENT` - The caller hears a fast-busy tone.\n * `PLAY_RINGING_UNTIL_CALLER_HANGS_UP` - The caller hears ringing until they disconnect.\n * `TRANSFER_TO_PHONE_NUMBER` - Number where you want to transfer overflow calls.\n"
            sendToVoicemail:
              type: boolean
              description: When `true`, forwards all calls to a voicemail service of an internal number. This option is ignored when an external `transferNumber` is entered.
            transferNumber:
              type: string
              example: '+15555551212'
              description: Destination number for overflow calls when `action` is set to `TRANSFER_TO_PHONE_NUMBER`.
            overflowAfterWaitEnabled:
              type: boolean
              example: true
              description: After calls wait for the configured number of seconds and no agent is available, the overflow treatment is triggered.
            overflowAfterWaitTime:
              type: number
              example: 20
              description: Number of seconds to wait before the overflow treatment is triggered when no agent is available. The minimum value 0, The maximum value is 7200 seconds.
            playOverflowGreetingEnabled:
              type: boolean
              example: true
              description: Indicate overflow audio to be played, otherwise, callers will hear the hold music until the call is answered by a user.
            greeting:
              type: string
              enum:
              - CUSTOM
              - DEFAULT
              description: "Indicates how to handle new calls when the queue is full.\n * `CUSTOM` - Play the custom announcement specified by the `fileName` field.\n * `DEFAULT` - Play default announcement.\n"
            audioAnnouncementFiles:
              type: array
              items:
                $ref: '#/components/schemas/AnnouncementAudioFile'
              description: Array of announcement files to be played as `overflow` greetings. These files are from the list of announcement files associated with this call queue. For `CUSTOM` announcement, a minimum of 1 file is mandatory, and the maximum is 4.
          description: Settings for incoming calls exceed queueSize.
        welcomeMessage:
          type: object
          required:
          - greeting
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled play entrance message. The default value is `true`.
            alwaysEnabled:
              type: boolean
              description: Mandatory entrance message. The default value is `false`.
            greeting:
              type: string
              enum:
              - CUSTOM
              - DEFAULT
              description: "Indicates how to handle new calls when the queue is full.\n * `CUSTOM` - Play the custom announcement specified by the `fileName` field.\n * `DEFAULT` - Play default announcement.\n"
            audioAnnouncementFiles:
              type: array
              items:
                $ref: '#/components/schemas/AnnouncementAudioFile'
              description: Array of announcement files to be played as `welcomeMessage` greetings. These files are from the list of announcement files associated with this call queue. For `CUSTOM` announcement, a minimum of 1 file is mandatory, and the maximum is 4.
          description: Play a message when callers first reach the queue. For example, “Thank you for calling. An agent will be with you shortly.” It can be set as mandatory. If the mandatory option is not selected and a caller reaches the call queue while there is an available agent, the caller will not hear this announcement and is transferred to an agent. The welcome message feature is enabled by default.
        waitMessage:
          type: object
          required:
          - waitMode
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled play Wait Message.
            waitMode:
              type: string
              enum:
              - TIME
              - POSITION
              description: "Estimated wait message operating mode. Supported values `TIME` and `POSITION`.\n * `TIME` - Announce the waiting time.\n * `POSITION` - Announce queue position.\n"
            handlingTime:
              type: number
              example: 100
              description: The number of minutes for which the estimated wait is played. The minimum time is 10 minutes. The maximum time is 100 minutes.
            defaultHandlingTime:
              type: number
              example: 100
              description: The default number of call handling minutes. The minimum time is 1 minutes, The maximum time is 100 minutes.
            queuePosition:
              type: number
              example: 100
              description: The number of the position for which the estimated wait is played. The minimum positions are 10, The maximum positions are 100.
            highVolumeMessageEnabled:
              type: boolean
              description: Play time / Play position High Volume.
            estimatedWaitingTime:
              type: number
              example: 600
              description: The number of estimated waiting times in seconds. The minimum time is 10 seconds. The maximum time is 600 seconds.
            callbackOptionEnabled:
              type: boolean
              description: Callback options enabled/disabled. Default value is false.
            minimumEstimatedCallbackTime:
              type: number
              example: 10
              description: The minimum estimated callback times in minutes. The default value is 30.
            internationalCallbackEnabled:
              type: boolean
              description: The international numbers for callback is enabled/disabled. The default value is `false`.
            playUpdatedEstimatedWaitMessage:
              type: boolean
              example: true
              description: Play updated estimated wait message.
          description: Notify the caller with either their estimated wait time or position in the queue. If this option is enabled, it plays after the welcome message and before the comfort message. By default, it is not enabled.
        comfortMessage:
          type: object
          required:
          - greeting
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled play periodic comfort message.
            timeBetweenMessages:
              type: number
              example: 10
              description: The interval in seconds between each repetition of the comfort message played to queued users. The minimum time is 10 seconds.The maximum time is 600 seconds.
            greeting:
              type: string
              enum:
              - CUSTOM
              - DEFAULT
              description: "Indicates how to handle new calls when the queue is full.\n * `CUSTOM` - Play the custom announcement specified by the `fileName` field.\n * `DEFAULT` - Play default announcement.\n"
            audioAnnouncementFiles:
              type: array
              items:
                $ref: '#/components/schemas/AnnouncementAudioFile'
              description: Array of announcement files to be played as `comfortMessage` greetings. These files are from the list of announcement files associated with this call queue. For `CUSTOM` announcement, a minimum of 1 file is mandatory, and the maximum is 4.
          description: Play a message after the welcome message and before hold music. This is typically a `CUSTOM` announcement that plays information, such as current promotions or information about products and services.
        comfortMessageBypass:
          type: object
          required:
          - greeting
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled play comfort bypass message.
            callWaitingAgeThreshold:
              type: number
              example: 10
              description: The interval in seconds between each repetition of the comfort bypass message played to queued users. The minimum time is 1 seconds. The maximum time is 120 seconds.
            greeting:
              type: string
              enum:
              - CUSTOM
              - DEFAULT
              description: "Indicates how to handle new calls when the queue is full.\n * `CUSTOM` - Play the custom announcement specified by the `fileName` field.\n * `DEFAULT` - Play default announcement.\n"
            audioAnnouncementFiles:
              type: array
              items:
                $ref: '#/components/schemas/AnnouncementAudioFile'
              description: Array of announcement files to be played as `comfortMessageBypass` greetings. These files are from the list of announcements files associated with this call queue. For `CUSTOM` announcement, a minimum of 1 file is mandatory, and the maximum is 4.
          description: Play a shorter comfort message instead of the usual Comfort or Music On Hold announcement to all the calls that should be answered quickly. This feature prevents a caller from hearing a short portion of the standard comfort message that abruptly ends when they are connected to an agent.
        mohMessage:
          type: object
          required:
          - normalSource
          - alternateSource
          properties:
            normalSource:
              type: object
              required:
              - greeting
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: Enable media on hold for queued calls.
                greeting:
                  type: string
                  enum:
                  - CUSTOM
                  - DEFAULT
                  description: "Indicates how to handle new calls when the queue is full.\n * `CUSTOM` - Play the custom announcement specified by the `fileName` field.\n * `DEFAULT` - Play default announcement.\n"
                audioAnnouncementFiles:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnnouncementAudioFile'
                  description: Array of announcement files to be played as `mohMessage` greetings. These files are from the list of announcement files associated with this call queue. For `CUSTOM` announcement, a minimum of 1 file is mandatory, and the maximum is 4.
                audioPlaylistId:
                  type: string
                  description: Identifier of the playlist used for this MOH source.
            alternateSource:
              type: object
              required:
              - greeting
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: Enable media on hold for queued calls.
                greeting:
                  type: string
                  enum:
                  - CUSTOM
                  - DEFAULT
                  description: "Indicates how to handle new calls when the queue is full.\n * `CUSTOM` - Play the custom announcement specified by the `fileName` field.\n * `DEFAULT` - Play default announcement.\n"
                audioAnnouncementFiles:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnnouncementAudioFile'
                  description: Array of announcement files to be played as `mohMessage` greetings. These files are from the list of announcement files associated with this call queue. For `CUSTOM` announcement, a minimum of 1 file is mandatory, and the maximum is 4.
                audioPlaylistId:
                  type: string
                  description: Identifier of the playlist used for this MOH source.
          description: Play music after the comforting message in a repetitive loop.
        whisperMessage:
          type: object
          required:
          - greeting
          properties:
            enabled:
              type: boolean
              example: true
              description: If enabled play the Whisper Message.
            greeting:
              type: string
              enum:
              - CUSTOM
              - DEFAULT
              description: "Indicates how to handle new calls when the queue is full.\n * `CUSTOM` - Play the custom announcement specified by the `fileName` field.\n * `DEFAULT` - Play default announcement.\n"
            audioAnnouncementFiles:
              type: array
              items:
                $ref: '#/components/schemas/AnnouncementAudioFile'
              description: Array of announcement files to be played as `whisperMessage` greetings. These files are from the list of announcement files associated with this call queue. For `CUSTOM` announcement, a minimum of 1 file is mandatory, and the maximum is 4.
          description: Play a message to the agent immediately before the incoming call is connected. The message typically announces the identity of the call queue from which the call is coming.
    GetAnnouncementFileInfo:
      type: object
      required:
      - id
      - fileName
      - fileSize
      - mediaFileType
      - level
      - isTextToSpeech
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0FOTk9VTkNFTUVOVC9kODc5YWZlZC1jNTRhLTQyOTctOGY0Mi02ZmEyMDJjN2E1M2E
          description: ID of the announcement.
        fileName:
          type: string
          example: Greeting-1.wav
          description: Name of greeting file.
        fileSize:
          type: string
          example: '33456'
          description: Size of greeting file in kilo-bytes.
        mediaFileType:
          $ref: '#/components/schemas/mediaType'
          description: Media file type of the announcement.
        level:
          $ref: '#/components/schemas/level'
          description: Level where the announcement is created.
        isTextToSpeech:
          type: boolean
          description: Indicates whether the announcement is a text-to-speech file.
    ListSupervisorObject:
      type: object
      required:
      - id
      - agentCount
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS81OGVkZTIwNi0yNTM5LTQ1ZjQtODg4Ny05M2E3ZWIwZWI3ZDI
          description: A unique identifier for the supervisor.
        firstName:
          type: string
          example: John
          description: First name of the supervisor.
        lastName:
          type: string
          example: Smith
          description: Last name of the supervisor.
        phoneNumber:
          type: string
          example: '+19845550186'
          description: Primary phone number of the supervisor.
        extension:
          type: string
          example: '12554'
          description: Primary phone extension of the supervisor.
        routingPrefix:
          type: string
          example: '34'
          description: Routing prefix of location.
        esn:
          type: string
          example: '3412554'
          description: Routing prefix + extension of a person.
        agentCount:
          type: integer
          example: 2
          description: Number of agents managed by supervisor. A supervisor must manage at least one agent.
    GetCallQueueStrandedCallsObject:
      type: object
      required:
      - action
      - audioMessageSelection
      properties:
        action:
          type: string
          enum:
          - NONE
          - BUSY
          - TRANSFER
          - NIGHT_SERVICE
          - RINGING
          - ANNOUNCEMENT
          description: "The call processing action type.\n * `NONE` - Call remains in the queue.\n * `BUSY` - Calls are removed from the queue and are provided with the Busy treatment. If the queue is configured with the Call Forwarding Busy or the Voice Messaging service, then the call is handled accordingly.\n * `TRANSFER` - Calls are removed from the queue and are transferred to the configured `transferPhoneNumber`.\n * `NIGHT_SERVICE` - Calls are handled according to the Night Service configuration. If the Night Service action is set to `none`, then this is equivalent to this policy being set to `none` (that is, calls remain in the queue).\n * `RINGING` - Calls are removed from the queue and are provided with ringing until the caller releases the call. The ringback tone played to the caller is localized according to the country code of the caller.\n * `ANNOUNCEMENT` - Calls are removed from the queue and are provided with an announcement that is played in a loop until the caller releases the call.\n"
        transferPhoneNumber:
          type: string
          example: '1235557890'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcement to be played.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureGetObject'
          description: List of Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
    GetCallQueueNightServiceObject:
      type: object
      required:
      - nightServiceEnabled
      - playAnnouncementBeforeEnabled
      - announcementMode
      - audioMessageSelection
      - forceNightServiceEnabled
      - manualAudioMessageSelection
      properties:
        nightServiceEnabled:
          type: boolean
          example: true
          description: Whether or not the call queue night service routing policy is enabled.
        action:
          type: string
          enum:
          - BUSY
          - TRANSFER
          description: "The call processing action type.\n * `BUSY` - The caller hears a fast busy tone.\n * `TRANSFER` - Transfers the call to number specified in `transferPhoneNumber`.\n"
        transferPhoneNumber:
          type: string
          example: '1234'
          description: Call gets transferred to this number when action is set to `TRANSFER`. This can also be an extension.
        playAnnouncementBeforeEnabled:
          type: boolean
          example: true
          description: Indicates whether an announcement plays to callers before the action is applied.
        announcementMode:
          type: string
          enum:
          - NORMAL
          - MANUAL
          description: "The type of announcements to played.\n * `NORMAL` - Plays announcement as per `audioMessageSelection`.\n * `MANUAL` - Plays announcement as per `manualAudioMessageSelection`.\n"
        audioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcements to be played when announcementMode is set to `NORMAL`.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        audioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureGetObject'
          description: List of Announcement Audio Files when `audioMessageSelection` is `CUSTOM`.
        businessHoursName:
          type: string
          example: Working Hour
          description: Name of the schedule configured for a night service as one of from `businessHourSchedules` list.
        businessHoursLevel:
          type: string
          enum:
          - ORGANIZATION
          - LOCATION
          description: "The above mentioned schedule is org or location specific. (Must be from `businessHourSchedules` list).\n * `ORGANIZATION` - Schedule is configured across an organization.\n * `LOCATION` - Schedule is configured across a location.\n"
        businessHourSchedules:
          type: array
          items:
            $ref: '#/components/schemas/CallQueueNightSchedulesObject'
          description: Lists the pre-configured business hour schedules.
        forceNightServiceEnabled:
          type: boolean
          example: true
          description: Force night service regardless of business hour schedule.
        manualAudioMessageSelection:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          description: "The type of announcements to be played when announcementMode is set to NORMAL.`MANUAL`.\n * `DEFAULT` - Default Audio Message Selection.\n * `CUSTOM` - Custom Audio Message Selection.\n"
        manualAudioFiles:
          type: array
          items:
            $ref: '#/components/schemas/AudioAnnouncementFileFeatureGetObject'
          description: List Of Audio Files.
    ModifyCallQueueObject:
      type: object
      required:
      - queueSettings
      properties:
        enabled:
          type: boolean
          example: true
          description: Whether or not the call queue is enabled.
        name:
          type: string
          example: CallQueue-1
          description: Unique name for the call queue.
        languageCode:
          type: string
          example: en-US
          description: Language code.
        firstName:
          type: string
          example: Hakim
          description: First name to be shown when calls are forwarded out of this call queue. Defaults to `.`. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        lastName:
          type: string
          example: Smith
          description: Last name to be shown when calls are forwarded out of this call queue. Defaults to the `phoneNumber` if set, otherwise defaults to call group name. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        timeZone:
          type: string
          example: America/Chicago
          description: Time zone for the hunt group.
        phoneNumber:
          type: string
          example: '+12225555309'
          description: Primary phone number of the call queue.
        extension:
          type: string
          example: '5309'
          description: Extension of the call queue.
        alternateNumberSettings:
          type: object
          properties:
            distinctiveRingEnabled:
              type: boolean
              example: true
              description: Distinctive Ringing selected for the alternate numbers in the call queue overrides the normal ringing patterns set for Alternate Numbers.
            alternateNumbers:
              type: array
              items:
                $ref: '#/components/schemas/AlternateNumbersWithPattern'
              description: Allows up to 10 numbers, each with an optional distinctive ring setting override.
          description: The alternate numbers feature allows you to assign multiple phone numbers or extensions to a call queue. Each number will reach the same greeting and each menu will function identically to the main number. The alternate numbers option enables you to have up to ten (10) phone numbers ring into the call queue.
        callPolicies:
          $ref: '#/components/schemas/ModifyCallQueueCallPolicyObject'
          description: Policy controlling how calls are routed to agents.
        callingLineIdPolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Which type of Calling Line ID Policy Selected for Call Queue.\n * `DIRECT_LINE` - Calling Line ID Policy will show the caller's direct line number.\n * `LOCATION_NUMBER` - Calling Line ID Policy will show the main number for the location.\n * `CUSTOM` - Calling Line ID Policy will show the value from the `callingLineIdPhoneNumber` field.\n"
        callingLineIdPhoneNumber:
          type: string
          example: '+12072342368'
          description: Calling line ID Phone number which will be shown if CUSTOM is selected.
        queueSettings:
          $ref: '#/components/schemas/CallQueueQueueSettingsObject'
          description: Overall call queue settings.
        allowCallWaitingForAgentsEnabled:
          type: boolean
          description: Flag to indicate whether call waiting is enabled for agents.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ModifyPersonPlaceVirtualLineCallQueueObject'
          description: People, workspaces and virtual lines that are eligible to receive calls.
        allowAgentJoinEnabled:
          type: boolean
          description: Whether or not to allow agents to join or unjoin a queue.
        phoneNumberForOutgoingCallsEnabled:
          type: boolean
          example: true
          description: When `true`, indicates that the agent's configuration allows them to use the queue's Caller ID for outgoing calls.
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObjectForPut'
          description: Settings for the direct line caller ID name to be shown for this call queue.
        dialByName:
          type: string
          example: Hakim Smith
          description: Sets or clears the name to be used for dial by name functions. To clear the `dialByName`, the attribute must be set to null or empty string. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
    ModifyForwardingRuleObject:
      type: object
      properties:
        name:
          type: string
          example: New Selective Rule
          description: Unique name for the selective rule in the hunt group.
        enabled:
          type: boolean
          example: true
          description: Reflects if rule is enabled.
        holidaySchedule:
          type: string
          example: HolidayScheduleOne
          description: Name of the location's holiday schedule which determines when this selective call forwarding rule is in effect.
        businessSchedule:
          type: string
          example: BusinessScheduleTwo
          description: Name of the location's business schedule which determines when this selective call forwarding rule is in effect.
        forwardTo:
          type: object
          properties:
            selection:
              type: string
              enum:
              - FORWARD_TO_DEFAULT_NUMBER
              - FORWARD_TO_SPECIFIED_NUMBER
              - DO_NOT_FORWARD
              description: "Controls what happens when the rule matches.\n * `FORWARD_TO_DEFAULT_NUMBER` - When the rule matches, forward to the destination for the hunt group.\n * `FORWARD_TO_SPECIFIED_NUMBER` - When the rule matches, forward to the destination for this rule.\n * `DO_NOT_FORWARD` - When the rule matches, do not forward to another number.\n"
            phoneNumber:
              type: string
              example: '+15558675309'
              description: Phone number used if selection is `FORWARD_TO_SPECIFIED_NUMBER`.
          description: Controls what happens when the rule matches including the destination number for the call forwarding.
        callsFrom:
          type: object
          properties:
            selection:
              type: string
              enum:
              - ANY
              - CUSTOM
              description: "If `CUSTOM`, use `customNumbers` to specific which incoming caller ID values cause this rule to match. `ANY` means any incoming call matches assuming the rule is in effect based on the associated schedules.\n * `ANY` - Rule matches for calls from any number.\n * `CUSTOM` - Rule matches based on the numbers and options in `customNumbers`.\n"
            customNumbers:
              type: object
              properties:
                privateNumberEnabled:
                  type: boolean
                  description: Match if caller ID indicates the call is from a private number.
                unavailableNumberEnabled:
                  type: boolean
                  description: Match if caller ID is unavailable.
                numbers:
                  type: array
                  items:
                    type: string
                  description: Array of number strings to be matched against incoming caller ID.
              description: Custom rules for matching incoming caller ID information.
          description: Settings related the rule matching based on incoming caller ID.
        callsTo:
          type: object
          properties:
            numbers:
              type: array
              items:
                $ref: '#/components/schemas/CallForwardingNumbers'
              description: Array of numbers to be matched against the calling destination number.
          description: Settings related to the rule matching based on the destination number.
    DirectLineCallerIdNameObjectForPut:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
          description: The selection of the direct line caller ID name.
        customName:
          type: string
          example: Hakim Smith
          description: Sets or clears the custom direct line caller ID name.  To clear the `customName`, the attribute must be set to null or empty string. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this workspace.
    TelephonyType:
      type: string
      enum:
      - PSTN_NUMBER
      description: ' * `PSTN_NUMBER` - The object is a PSTN number.

        '
    RingPatternObject:
      type: string
      enum:
      - NORMAL
      - LONG_LONG
      - SHORT_SHORT_LONG
      - SHORT_LONG_SHORT
      description: " * `NORMAL` - Normal incoming ring pattern.\n * `LONG_LONG` - Incoming ring pattern of two long rings.\n * `SHORT_SHORT_LONG` - Incoming ring pattern of two short rings, followed by a short ring.\n * `SHORT_LONG_SHORT` - Incoming ring pattern of a short ring, followed by a long ring, followed by a short ring.\n"
    CallForwardingNumbers:
      type: object
      required:
      - type
      properties:
        phoneNumber:
          type: string
          example: '+15558675309'
          description: Only return call queues with matching primary phone number or extension.
        extension:
          type: string
          example: '7781'
          description: Primary phone extension of the call queue.
        type:
          type: string
          enum:
          - PRIMARY
          - ALTERNATE
          description: "Type of\n * `PRIMARY` - Indicates that the given `phoneNumber` or `extension` associated with this rule's containing object is a primary number or extension.\n * `ALTERNATE` - Indicates that the given `phoneNumber` or `extension` associated with this rule's containing object is an alternate number or extension.\n"
    PutPersonPlaceVirtualLineAgentObject:
      type: object
      required:
      - id
      - action
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS81OGVkZTIwNi0yNTM5LTQ1ZjQtODg4Ny05M2E3ZWIwZWI3ZDI
          description: 'ID of person, workspace or virtual line. **WARNING**: The `id` returned is always of type `PEOPLE` even if the agent is a workspace or virtual line. The `type` of the agent `id` will be corrected in a future release.'
        action:
          $ref: '#/components/schemas/AgentAction'
          description: Enumeration that indicates whether an agent needs to be added (`ADD`) or deleted (`DELETE`) from a supervisor.
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: oauth2
