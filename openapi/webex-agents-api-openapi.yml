components:
  schemas:
    StateResourceRequest:
      properties:
        state:
          description: It represents the current state of the user. Can be set to ```Available``` or ```Idle```.
          type: string
          example: Available
        auxCodeId:
          description: 'Auxiliary Codes are status codes which an agent can select in Webex Contact Center Agent Desktop. They are of two types: ```Idle``` and ```Wrap-Up``` codes, and every agent profile must have one of each for the agent to use. Idle codes are used to explain an agent''s unavailability to take customer contacts, such as during a lunch break or a meeting. Wrap-up codes indicate the result of customer contacts, such as successful resolution or escalation of the contact. Creating and managing auxiliary codes requires an administrator role and the appropriate cjp:config_write or cjp:config_read scopes, maximum length 36 characters.'
          type: string
          example: AXUH3oN12eV-WekpnDpl
        lastStateChangeReason:
          description: It represents the reason of the last state change request, maximum length 128 characters.
          type: string
          example: Lunch
        agentId:
          description: User for which state change is initiated, maximum length 36 characters.
          type: string
          example: 1a80ba23-194b-49af-9b93-074b3ecc852a
      required:
      - state
      - auxCodeId
      type: object
      description: Request payload to update an agent state.
    BuddyAgentRequest:
      properties:
        agentProfileId:
          description: The profile ID of a particular agent. Can be obtained from [Users API](/docs/users), maximum length 36 characters.
          type: string
          example: 315fbb91-2288-427c-9588-ec764cd46ea4
        mediaType:
          description: The media type for the request. The supported values are ```telephony```, ```chat```, ```social```, ```email``` and ```workItem```.
          type: string
          example: telephony
        state:
          description: It represents the current state of the returned agents which can be either ```Available``` or ```Idle```. If state is omitted from the payload, the API will return a list of both available and idle agents. This is useful for consult scenarios, since consulting an idle agent is also supported.
          type: string
          example: Available
      required:
      - agentProfileId
      - mediaType
      type: object
      description: Request payload to retrieve buddy agents.
    AgentActivity:
      required:
      - active
      - agentDn
      - agentId
      - agentLogin
      - agentName
      - agentSessionId
      - channelId
      - channelType
      - currentState
      - endTime
      - idleCode
      - idleCodeName
      - isLogin
      - mmProfileType
      - queueId
      - queueName
      - reason
      - siteId
      - siteName
      - startTime
      - subChannelType
      - taskId
      - teamId
      - teamName
      - wrapupCodeName
      type: object
      properties:
        active:
          type: boolean
          description: Active indicates whether the activity is completed (false) or in progress (true).
          example: true
        agentId:
          type: string
          description: Unique identifier of an agent.
          example: AWn8XmdC-MmYjwcdYK2i
        agentDn:
          type: string
          description: Dialed number for the agent.
          example: '5555555'
        agentLogin:
          type: string
          description: Login username of the agent.
          example: agent@mailinator.com
        agentSessionId:
          type: string
          description: Agent Session Id
          example: 72a79e8b-6d2e-4423-869a-01bfebc081e6
        agentName:
          type: string
          description: The name of the agent.
          example: John Smith
        currentState:
          type: string
          description: The activity state (e.g. idle, available, connected, etc.).
          example: idle
        siteId:
          type: string
          description: Unique identifier for a site.
          example: AWn8XmdC-MmYjwcdYK2i
        siteName:
          type: string
          description: The name of the site.
          example: Austin
        teamId:
          type: string
          description: Unique identifier for a team.
          example: AWn8XmdC-MmYjwcdYK2i
        teamName:
          type: string
          description: The name of the team.
          example: email
        isLogin:
          type: integer
          description: Indicates whether the activity was the login event (1) or not (0).
          format: int32
          example: 1
        taskId:
          type: string
          description: Unique identifier for a task.
          example: 35d88b03-6c43-45e4-9fba-99b728ad4750
        channelId:
          type: string
          description: Unique identifier for the channel.
          example: 35d88b03-6c43-45e4-9fba-99b728ad4750
        channelType:
          type: string
          description: Channel type for the activity (e.g. email, telephony, chat, etc.).
          example: email
        subChannelType:
          type: string
          description: SubChannel type for the activity.
          example: email
        idleCodeName:
          type: string
          description: In case of an idle activity, it will have an idle code attached with it (e.g. Break, Meeting, Lunch, etc.).
          example: Break
        idleCode:
          type: string
          description: Unique identifier for the idle code.
          example: AWn8XmdC-MmYjwcdYK2i
        queueId:
          type: string
          description: Unique identifier for the queue.
          example: AWn8XmdC-MmYjwcdYK2i
        queueName:
          type: string
          description: The name of the Queue.
          example: Support Queue
        wrapupCodeName:
          type: string
          description: Selected wrapup code upon finished task.
          example: Sale
        reason:
          type: string
          description: Reason
          example: reason
        startTime:
          type: integer
          description: Epoch timestamp in milliseconds of the start of the activity.
          format: int64
          example: 1605169648658
        endTime:
          type: integer
          description: Epoch timestamp in milliseconds of the end of the activity. If active, it will be -1.
          format: int64
          example: 1605169648658
        mmProfileType:
          type: string
          description: Multimedia profile type
          example: blended
      description: List of agent activities retrieved according to query parameters.
    AgentApiResponse:
      required:
      - data
      - meta
      type: object
      properties:
        meta:
          description: Response metadata.
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          description: List of Agent Statistics records retrieved according to query parameters.
          items:
            $ref: '#/components/schemas/OutAgentStatistics'
      description: Response wrapper for agent statistics.
    ChannelResponse:
      type: object
      properties:
        channelType:
          type: string
          description: Channel Type
          example: chat
        totalAssignedTasks:
          type: integer
          description: Number of tasks assigned within the channel during the agent session.
          format: int32
          example: 3
        totalOfferedTasks:
          type: integer
          description: Number of offered tasks within this channel during the agent's session.
          format: int32
          example: 3
        totalAcceptedTasks:
          type: integer
          description: Number of assigned tasks that were accepted by the agent.
          format: int32
          example: 3
        totalRejectedTasks:
          type: integer
          description: Number of assigned tasks that were rejected by the agent.
          format: int32
          example: 3
        totalTransferredTasks:
          type: integer
          description: Number of tasks that the agent transferred to another agent.
          format: int32
          example: 2
        totalEngagedDuration:
          type: integer
          description: 'The amount of time the agent was engaged with a customer (in milliseconds).

            Note :-

            - Does not include wrap-up time and consult duration

            - Includes conferencing duration since the customer is involved'
          format: int32
          example: 40302
        totalHoldDuration:
          type: integer
          description: The amount of time for which the customer(s) was put on hold (in milliseconds).
          format: int64
          example: 10198
        totalWrapUpDuration:
          type: integer
          description: 'The amount of time spent by the agent wrapping up customer interactions (in milliseconds).

            i.e Sum of all wrap-up time metric for a given agent'
          format: int64
          example: 3552
        totalAvailableTime:
          type: integer
          description: Duration of time(in milliseconds) outside of the idle time when an agent was available and handling contacts after logging in.
          format: int64
          example: 234947
        totalUnAvailableTime:
          type: integer
          description: Amount of time the agent was unavailable (in milliseconds).
          format: int64
          example: 22300
        averageHandledTime:
