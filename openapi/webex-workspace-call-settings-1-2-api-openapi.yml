openapi: 3.0.0
info:
  title: Webex Admin Address Book Workspace Call Settings (1/2) API
  version: 1.0.0
  description: The Webex Admin APIs provide comprehensive programmatic access to administrative functions for managing Webex organizations, users, licenses, and settings. These APIs enable automation of user provisioning, license assignment, compliance management, and audit event retrieval. Administrators can integrate with enterprise identity systems, enforce security policies, monitor usage, and streamline onboarding/offboarding processes. The APIs support granular control over organizational resources, making them ideal for large-scale deployments and custom admin tooling.
tags:
- name: Workspace Call Settings (1/2)
paths:
  /workspaces/{workspaceId}/features/callForwarding:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceCallForwardingGet'
              example:
                callForwarding:
                  always:
                    enabled: false
                    destination: ''
                    ringReminderEnabled: false
                    destinationVoicemailEnabled: false
                  busy:
                    enabled: true
                    destination: '+17084004987'
                    destinationVoicemailEnabled: true
                  noAnswer:
                    enabled: true
                    destination: '+12815550001'
                    numberOfRings: 2
                    systemMaxNumberOfRings: 20
                    destinationVoicemailEnabled: false
                businessContinuity:
                  enabled: false
                  destination: ''
                  destinationVoicemailEnabled: false
        '400':
