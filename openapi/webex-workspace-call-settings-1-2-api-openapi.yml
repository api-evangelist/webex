      summary: Modify Transfer Numbers Settings for a Workspace
      operationId: Modify Transfer Numbers Settings for a Workspace
      description: 'Modify Transfer Numbers Settings for a place.


        When calling a specific call type, this workspace will be automatically transferred to another number. The person assigned the Auto Transfer Number can then approve the call and send it through or reject the call type. You can add up to 3 numbers.


        This API requires a full or user administrator or location administrator auth token with the `spark-admin:workspaces_write` scope or a user auth token with `spark:workspaces_write` scope can be used to update workspace settings.'
      tags:
      - Workspace Call Settings (1/2)
      parameters:
      - name: workspaceId
        in: path
        description: Unique identifier for the workspace.
        required: true
        example: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLWVhc3QtMV9pbnQxMy9QTEFDRS8xNzdmNTNlZC1hNzY2LTRkYTAtOGQ3OC03MjE0MjhjMmFjZTQ=
        schema:
          type: string
      - name: orgId
        in: query
        description: ID of the organization within which the workspace resides. Only admin users of another organization (such as partners) may use this parameter as the default is the same organization as the token used to access the API.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              useCustomTransferNumbers: true
              autoTransferNumber1: '+1205553650'
              autoTransferNumber2: '+1205553651'
              autoTransferNumber3: '+1205553652'
            schema:
              $ref: '#/components/schemas/TransferNumberPatch'
components:
  schemas:
    CallForwardingAlwaysGet:
      type: object
      required:
      - enabled
      - ringReminderEnabled
      - destinationVoicemailEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '"Always" call forwarding is enabled or disabled.'
        destination:
          type: string
          example: '2225551212'
          description: Destination for "Always" call forwarding.
        ringReminderEnabled:
          type: boolean
          description: If `true`, a brief tone will be played on the person's phone when a call has been forwarded.
        destinationVoicemailEnabled:
          type: boolean
          description: Enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
    ModifyPlaceCallerIdGet:
      type: object
      required:
      - selected
      properties:
        selected:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Which type of outgoing Caller ID will be used. This setting is for the number portion.\n * `DIRECT_LINE` - Outgoing caller ID shows the caller's direct line number.\n * `LOCATION_NUMBER` - Outgoing caller ID shows the main number for the location.\n * `CUSTOM` - Outgoing caller ID shows the value from the customNumber field.\n"
        customNumber:
          type: string
          example: '+12815550003'
          description: Custom number which is shown if CUSTOM is selected. This value must be a number from the workspace's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the workspace's location.
        displayName:
          type: string
          example: Clockmaker's shop 7.1
          description: Workspace's caller ID display name. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        displayDetail:
          type: string
          example: .
          description: Workspace's caller ID display details. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        blockInForwardCallsEnabled:
          type: boolean
          example: true
          description: Block this workspace's identity when receiving a call.
        externalCallerIdNamePolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION
          - OTHER
          description: "Designates which type of External Caller ID Name policy is used. Default is `DIRECT_LINE`.\n * `DIRECT_LINE` - Outgoing caller ID shows the caller's direct line name.\n * `LOCATION` - Outgoing caller ID shows the external caller ID name for the location.\n * `OTHER` - Outgoing caller ID shows the value from the `customExternalCallerIdName` field.\n"
        customExternalCallerIdName:
          type: string
          example: Custom external caller name
          description: Custom external caller ID name which is shown if external caller ID name policy is `OTHER`.
        locationExternalCallerIdName:
          type: string
          example: Anna
          description: Location's external caller ID name which is shown if external caller ID name policy is `LOCATION`.
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObjectForPut'
          description: Settings for the direct line caller ID name to be shown for this workspace.
        dialByName:
          type: string
          example: Hakim Smith
          description: Sets or clears the name to be used for dial by name functions. To clear the `dialByName`, the attribute must be set to null or empty string. Characters of `%`,  `+`, `\`, `"` and Unicode characters are not allowed.
    ModifyPlaceCallForwardSettings:
      type: object
      required:
      - callForwarding
      - businessContinuity
      properties:
        callForwarding:
          $ref: '#/components/schemas/CallForwardingPlaceSettingPatch'
          description: Call forwarding settings for a Workspace.
        businessContinuity:
          $ref: '#/components/schemas/BusinessContinuityPatch'
          description: Settings for sending calls to a destination of your choice if your phone is not connected to the network for any reason, such as power outage, failed Internet connection, or wiring problem.
    RingPattern:
      type: string
      enum:
      - NORMAL
      - LONG_LONG
      - SHORT_SHORT_LONG
      - SHORT_LONG_SHORT
      description: " * `NORMAL` - Normal incoming ring pattern.\n * `LONG_LONG` - Incoming ring pattern of two long rings.\n * `SHORT_SHORT_LONG` - Incoming ring pattern of two short rings, followed by a short ring.\n * `SHORT_LONG_SHORT` - Incoming ring pattern of a short ring, followed by a long ring, followed by a short ring.\n"
    DirectLineCallerIdNameObject:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
          description: The selection of the direct line caller ID name. Defaults to `DISPLAY_NAME`.
        customName:
          type: string
          example: Hakim Smith
          description: The custom direct line caller ID name. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this workspace.
    InterceptIncomingPatch:
      type: object
      properties:
        type:
          type: string
          enum:
          - INTERCEPT_ALL
          - ALLOW_ALL
          description: "Incoming calls are intercepted.\n * `INTERCEPT_ALL` - Incoming calls are intercepted.\n * `ALLOW_ALL` - Incoming calls are not intercepted.\n"
        voicemailEnabled:
          type: boolean
          example: true
          description: Enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
        announcements:
          $ref: '#/components/schemas/InterceptAnnouncementsPatch'
          description: Settings related to how incoming calls are handled when the intercept feature is enabled.
    UserMonitoringPatch:
      type: object
      properties:
        enableCallParkNotification:
          type: boolean
          example: true
          description: Call park notification is enabled or disabled.
        monitoredElements:
          type: array
          maxItems: 50
          items:
            type: string
          description: Array of ID strings of monitored elements. Maximum 50 elements.
    PlaceGetNumbersResponse:
      type: object
      required:
      - phoneNumbers
      properties:
        distinctiveRingEnabled:
          type: boolean
          example: true
          description: Enables a distinctive ring pattern for the person.
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
          description: List of phone numbers that are assigned to a person.
    AuthorizationCode:
      type: object
      properties:
        code:
          type: string
          example: '4856'
          description: Access code.
        description:
          type: string
          example: Marketing's access code
          description: The description of the access code.
    InterceptGet:
      type: object
      required:
      - enabled
      - incoming
      - outgoing
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if call intercept is enabled.'
        incoming:
          $ref: '#/components/schemas/InterceptIncomingGet'
          description: Settings related to how incoming calls are handled when the intercept feature is enabled.
        outgoing:
          $ref: '#/components/schemas/InterceptOutGoingGet'
          description: Settings related to how outgoing calls are handled when the intercept feature is enabled.
    UserPlaceAuthorizationCodeListGet:
      type: object
      required:
      - accessCodes
      properties:
        accessCodes:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationCode'
          description: The set of activation codes and description.
    PhoneNumber:
      type: object
      required:
      - primary
      - action
      - directNumber
      properties:
        primary:
          type: boolean
          example: true
          description: If `true` marks the phone number as primary.
        action:
          $ref: '#/components/schemas/Action'
          description: Either 'ADD' to add phone numbers or 'DELETE' to remove phone numbers.
        directNumber:
          type: string
          example: '+12145553567'
          description: Phone numbers that are assigned.
        extension:
          type: string
          example: '1234'
          description: Extension that is assigned.
        ringPattern:
          $ref: '#/components/schemas/RingPattern'
          description: Ring Pattern of this number.
    CallingPermission:
      type: object
      required:
      - callType
      - action
      - transferEnabled
      - isCallTypeRestrictionEnabled
      properties:
        callType:
          type: string
          enum:
          - INTERNAL_CALL
          - TOLL_FREE
          - INTERNATIONAL
          - OPERATOR_ASSISTED
          - CHARGEABLE_DIRECTORY_ASSISTED
          - SPECIAL_SERVICES_I
          - SPECIAL_SERVICES_II
          - PREMIUM_SERVICES_I
          - PREMIUM_SERVICES_II
          - NATIONAL
          description: "Type of the outgoing call.\n * `INTERNAL_CALL` - Internal call type.\n * `TOLL_FREE` - Toll free call type.\n * `INTERNATIONAL` - International call type.\n * `OPERATOR_ASSISTED` - Operator Assisted call type.\n * `CHARGEABLE_DIRECTORY_ASSISTED` - Chargeable Directory Assisted call type.\n * `SPECIAL_SERVICES_I` - Special Services I call type.\n * `SPECIAL_SERVICES_II` - Special Services II call type.\n * `PREMIUM_SERVICES_I` - Premium Services I call type.\n * `PREMIUM_SERVICES_II` - Premium Services II call type.\n * `NATIONAL` - National call type.\n"
        action:
          type: string
          enum:
          - ALLOW
          - BLOCK
          - AUTH_CODE
          - TRANSFER_NUMBER_1
          - TRANSFER_NUMBER_2
          - TRANSFER_NUMBER_3
          description: "Permission for call types.\n * `ALLOW` - The call type is allowed.\n * `BLOCK` - The call type is blocked.\n * `AUTH_CODE` - Access Code action for the specified call type.\n * `TRANSFER_NUMBER_1` - Transfer to Auto Transfer Number 1. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_2` - Transfer to Auto Transfer Number 2. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_3` - Transfer to Auto Transfer Number 3. The answering person can then approve the call and send it through or reject the call.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
        isCallTypeRestrictionEnabled:
          type: boolean
          example: true
          description: Indicates if the restriction is enforced by the system for the corresponding call type and cannot be changed. For example, certain call types (such as `INTERNATIONAL`) may be permanently blocked and this field will be `true` to reflect that the restriction is system-controlled and not editable.
    InterceptIncomingGet:
      type: object
      required:
      - type
      - voicemailEnabled
      - announcements
      properties:
        type:
          type: string
          enum:
          - INTERCEPT_ALL
          - ALLOW_ALL
          description: "Incoming calls are intercepted.\n * `INTERCEPT_ALL` - All incoming calls are intercepted.\n * `ALLOW_ALL` - Incoming calls are not intercepted.\n"
        voicemailEnabled:
          type: boolean
          description: Enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
        announcements:
          $ref: '#/components/schemas/InterceptAnnouncementsGet'
          description: Settings related to how incoming calls are handled when the intercept feature is enabled.
    MonitoredElementUser:
      type: object
      required:
      - id
      - firstName
      - lastName
      - displayName
      - type
      - email
      - numbers
      - location
      - locationId
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
          description: ID of person or workspace.
        firstName:
          type: string
          example: John
          description: First name of person or workspace.
        lastName:
          type: string
          example: Brown
          description: Last name of person or workspace.
        displayName:
          type: string
          example: John Brown
          description: Display name of person or workspace.
        type:
          type: string
          enum:
          - PEOPLE
          - PLACE
          description: "Type of the person or workspace.\n * `PEOPLE` - Object is a user.\n * `PLACE` - Object is a workspace.\n"
        email:
          type: string
          example: john.brown@gmail.com
          description: Email of the person or workspace.
        numbers:
          type: array
          items:
            $ref: '#/components/schemas/UserNumberItem'
          description: The list of phone numbers containing only the primary number for the monitored person, workspace.
        location:
          type: string
          example: Alaska
          description: Name of location for call park.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
          description: ID of the location for call park.
    InterceptPatch:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: '`true` if call interception is enabled.'
        incoming:
          $ref: '#/components/schemas/InterceptIncomingPatch'
          description: Settings related to how incoming calls are handled when the intercept feature is enabled.
        outgoing:
          $ref: '#/components/schemas/InterceptOutGoingPatch'
          description: Settings related to how outgoing calls are handled when the intercept feature is enabled.
    BusinessContinuityPatch:
      type: object
      required:
      - enabled
      - destinationVoicemailEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Business Continuity is enabled or disabled.
        destination:
          type: string
          example: '2225551212'
          description: Destination for Business Continuity.
        destinationVoicemailEnabled:
          type: boolean
          description: Enabled or disabled state of sending incoming calls to the destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
    CLIDPolicySelection:
      type: string
      enum:
      - DIRECT_LINE
      - LOCATION_NUMBER
      - CUSTOM
      description: " * `DIRECT_LINE` - Outgoing caller ID will show the caller's direct line number\n * `LOCATION_NUMBER` - Outgoing caller ID will show the main number for the location.\n * `CUSTOM` - Outgoing caller ID will show the value from the customNumber field.\n"
    UserPlaceAuthorizationCodeListPatch:
      type: object
      properties:
        deleteCodes:
          type: array
          items:
            type: string
          description: Access Codes to delete.
    CallForwardingNoAnswerGet:
      type: object
      required:
      - enabled
      - numberOfRings
      - systemMaxNumberOfRings
      - destinationVoicemailEnabled
      properties:
        enabled:
          type: boolean
          example: true
          description: '"No Answer" call forwarding is enabled or disabled.'
        destination:
          type: string
          example: '+19075552859'
          description: Destination for "No Answer" call forwarding.
        numberOfRings:
          type: number
          example: 2
          description: Number of rings before the call will be forwarded if unanswered.
        systemMaxNumberOfRings:
          type: number
          example: 20
          description: System-wide maximum number of rings allowed for `numberOfRings` setting.
        destinationVoicemailEnabled:
          type: boolean
          example: true
          description: Enables and disables sending incoming to destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
    MonitoredElementCallParkExtension:
      type: object
      required:
      - id
      - name
      - extension
      - location
      - locationId
      properties:
        id:
          type: string
          example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS80NDVkMzMzMC1mNjE3LTExZWItOWQyZS01NzViODE3ZGE2NmE
          description: ID of call park extension.
        name:
          type: string
          example: CPE1
          description: Name of call park extension.
        extension:
          type: string
          example: '8080'
          description: Extension of call park extension.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12348080'
          description: Routing prefix + extension of a person or workspace.
        location:
          type: string
          example: Alaska
          description: Name of location for call park extension.
        locationId:
          type: string
          example: Y2lzY29zcGFyazovL3VzL0xPQ0FUSU9OLzEyMzQ1
          description: ID of location for call park extension.
    TransferNumberPatch:
      type: object
      required:
      - useCustomTransferNumbers
      properties:
        useCustomTransferNumbers:
          type: boolean
          example: true
          description: When `true`, use custom settings for the transfer numbers category of outbound permissions.
        autoTransferNumber1:
          type: string
          example: '"+1201203650"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
        autoTransferNumber2:
          type: string
          example: '"+1201203651"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
        autoTransferNumber3:
          type: string
          example: '"+1201203652"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
    InterceptOutGoingGet:
      type: object
      required:
      - type
      - transferEnabled
      properties:
        type:
          type: string
          enum:
          - INTERCEPT_ALL
          - ALLOW_LOCAL_ONLY
          description: "All outgoing calls are intercepted.\n * `INTERCEPT_ALL` - Outgoing calls are intercepted.\n * `ALLOW_LOCAL_ONLY` - Only non-local calls are intercepted.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
        destination:
          type: string
          example: '`+12225551212'
          description: Number to which the outbound call be transferred.
    InterceptNumberGet:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: If `true`, the caller hears this new number when the call is intercepted.
        destination:
          type: string
          example: '+12225551212'
          description: New number the caller hears announced.
    UserInboundPermissionGet:
      type: object
      required:
      - useCustomEnabled
      - externalTransfer
      - internalCallsEnabled
      - collectCallsEnabled
      properties:
        useCustomEnabled:
          type: boolean
          example: true
          description: Incoming Permission state. If disabled, the default settings are used.
        externalTransfer:
          type: string
          enum:
          - ALLOW_ALL_EXTERNAL
          - ALLOW_ONLY_TRANSFERRED_EXTERNAL
          - BLOCK_ALL_EXTERNAL
          description: "Call transfer setting.\n * `ALLOW_ALL_EXTERNAL` - All external calls are allowed.\n * `ALLOW_ONLY_TRANSFERRED_EXTERNAL` - Only externally transferred external calls are allowed.\n * `BLOCK_ALL_EXTERNAL` - All external calls are blocked.\n"
        internalCallsEnabled:
          type: boolean
          example: true
          description: Flag to indicate if workspace can receive internal calls.
        collectCallsEnabled:
          type: boolean
          example: true
          description: Flag to indicate if workspace can receive collect calls.
    InterceptAnnouncementsGet:
      type: object
      required:
      - greeting
      - newNumber
      - zeroTransfer
      properties:
