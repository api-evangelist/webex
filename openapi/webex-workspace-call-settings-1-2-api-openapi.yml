          description: Number of rings before the call will be forwarded if unanswered. `numberOfRings` must be between 2 and 20, inclusive.
        systemMaxNumberOfRings:
          type: number
          example: 20
          description: Max number of rings before the call will be forwarded if unanswered.
        destinationVoicemailEnabled:
          type: boolean
          example: true
          description: Enables and disables sending incoming to destination number's voicemail if the destination is an internal phone number and that number has the voicemail service enabled.
    CallForwardingPlaceSettingGet:
      type: object
      required:
      - always
      - busy
      - noAnswer
      properties:
        always:
          $ref: '#/components/schemas/CallForwardingAlwaysGet'
          description: Settings for forwarding all incoming calls to the destination you choose.
        busy:
          $ref: '#/components/schemas/CallForwardingBusyGet'
          description: Settings for forwarding all incoming calls to the destination you chose while the phone is in use or the workspace is busy.
        noAnswer:
          $ref: '#/components/schemas/CallForwardingNoAnswerGet'
          description: Settings for forwarding which only occurs when you are away or not answering your phone.
    BusinessContinuityGet:
