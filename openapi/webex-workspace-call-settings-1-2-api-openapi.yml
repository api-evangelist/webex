          type: string
          example: '+19075552859'
          description: Phone number of person or workspace. Either `phoneNumber` or `extension` is mandatory.
        extension:
          type: string
          example: '8080'
          description: Extension of person or workspace. Either `phoneNumber` or `extension` is mandatory.
        routingPrefix:
          type: string
          example: '1234'
          description: Routing prefix of location.
        esn:
          type: string
          example: '12348080'
          description: Routing prefix + extension of a person or workspace.
        primary:
          type: boolean
          example: true
          description: Flag to indicate primary phone.
        tollFreeNumber:
          type: boolean
          example: true
          description: Flag to indicate toll free number.
    ModifyCallingPermission:
      type: object
      properties:
        callType:
          type: string
          enum:
          - INTERNAL_CALL
          - TOLL_FREE
          - INTERNATIONAL
          - OPERATOR_ASSISTED
          - CHARGEABLE_DIRECTORY_ASSISTED
          - SPECIAL_SERVICES_I
          - SPECIAL_SERVICES_II
          - PREMIUM_SERVICES_I
          - PREMIUM_SERVICES_II
          - NATIONAL
          description: "Types for outgoing calls.\n * `INTERNAL_CALL` - Internal call type.\n * `TOLL_FREE` - Toll Free call type.\n * `INTERNATIONAL` - International call type.\n * `OPERATOR_ASSISTED` - Operator Assisted call type.\n * `CHARGEABLE_DIRECTORY_ASSISTED` - Chargeable Directory assisted call type.\n * `SPECIAL_SERVICES_I` - Special Services I call type.\n * `SPECIAL_SERVICES_II` - Special Services II call type.\n * `PREMIUM_SERVICES_I` - Premium Services I call type.\n * `PREMIUM_SERVICES_II` - Premium Services II call type.\n * `NATIONAL` - National call type.\n"
        action:
          type: string
          enum:
          - ALLOW
          - BLOCK
          - AUTH_CODE
          - TRANSFER_NUMBER_1
          - TRANSFER_NUMBER_2
          - TRANSFER_NUMBER_3
          description: "Permission for call types.\n * `ALLOW` - The call type is allowed.\n * `BLOCK` - The call type is blocked.\n * `AUTH_CODE` - Access Code action for the specified call type.\n * `TRANSFER_NUMBER_1` - Transfer to Auto Transfer Number 1. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_2` - Transfer to Auto Transfer Number 2. The answering person can then approve the call and send it through or reject the call.\n * `TRANSFER_NUMBER_3` - Transfer to Auto Transfer Number 3. The answering person can then approve the call and send it through or reject the call.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
    InterceptOutGoingPatch:
      type: object
      properties:
        type:
          type: string
          enum:
          - INTERCEPT_ALL
          - ALLOW_LOCAL_ONLY
          description: "All outgoing calls are intercepted.\n * `INTERCEPT_ALL` - Outgoing calls are intercepted.\n * `ALLOW_LOCAL_ONLY` - Only non-local calls are intercepted.\n"
        transferEnabled:
          type: boolean
          example: true
          description: If `true`, allows transfer and forwarding for the call type.
        destination:
          type: string
          example: '+12225551212'
          description: Number to which the outbound call be transferred.
    SelectionObject:
      type: string
      enum:
      - CUSTOM_NAME
      - DISPLAY_NAME
      description: " * `DISPLAY_NAME` - When this option is selected, `displayName` is to be shown for this workspace.\n * `CUSTOM_NAME` - When this option is selected, `customName` is to be shown for this workspace."
    Action:
      type: string
      enum:
      - ADD
      - DELETE
      description: " * `ADD` - Add action.\n * `DELETE` - Delete action.\n"
    UserOutgoingPermissionGet:
      type: object
      required:
      - useCustomPermissions
      - callingPermissions
      properties:
        useCustomEnabled:
          type: boolean
          example: true
          description: When `true`, indicates that this workspace uses the shared control that applies to all outgoing call settings categories when placing outbound calls.
        useCustomPermissions:
          type: boolean
          example: true
          description: When `true`, indicates that this workspace uses the specified outgoing calling permissions when placing outbound calls.
        callingPermissions:
          type: array
          items:
            $ref: '#/components/schemas/CallingPermission'
          description: Workspace's list of outgoing permissions.
    TransferNumberGet:
      type: object
      required:
      - useCustomTransferNumbers
      properties:
        useCustomTransferNumbers:
          type: boolean
          example: true
          description: When `true`, use custom settings for the transfer numbers category of outbound permissions.
        autoTransferNumber1:
          type: string
          example: '"+1205553650"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
        autoTransferNumber2:
          type: string
          example: '"+1205553651"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
        autoTransferNumber3:
          type: string
          example: '"+1205553652"'
          description: When calling a specific call type, this workspace will be automatically transferred to another number.
    UserInboundPermissionPatch:
      type: object
      properties:
        useCustomEnabled:
          type: boolean
          example: true
          description: Incoming Permission state. If disabled, the default settings are used.
        externalTransfer:
          type: string
          enum:
          - ALLOW_ALL_EXTERNAL
          - ALLOW_ONLY_TRANSFERRED_EXTERNAL
          - BLOCK_ALL_EXTERNAL
          description: "Call transfer setting.\n * `ALLOW_ALL_EXTERNAL` - All external calls are allowed.\n * `ALLOW_ONLY_TRANSFERRED_EXTERNAL` - Only externally transferred external calls are allowed.\n * `BLOCK_ALL_EXTERNAL` - All external calls are blocked.\n"
        internalCallsEnabled:
          type: boolean
          example: true
          description: Flag to indicate if the workspace can receive internal calls.
        collectCallsEnabled:
          type: boolean
          example: true
          description: Flag to indicate if the workspace can receive collect calls.
    InterceptAnnouncementsPatch:
      type: object
      properties:
        greeting:
          type: string
          enum:
          - CUSTOM
          - DEFAULT
          description: "System default message is placed when incoming calls are intercepted.\n * `CUSTOM` - A custom greeting is played when incoming calls are intercepted.\n * `DEFAULT` - A System default greeting is played when incoming calls are intercepted.\n"
        newNumber:
          $ref: '#/components/schemas/InterceptNumberPatch'
          description: Information about the new number announcement.
        zeroTransfer:
          $ref: '#/components/schemas/InterceptNumberPatch'
          description: Information about how the call is handled if zero (0) is pressed.
    CallForwardingPlaceSettingPatch:
      type: object
      required:
      - always
      properties:
        always:
          $ref: '#/components/schemas/CallForwardingAlwaysGet'
          description: Settings for forwarding all incoming calls to the destination you choose.
        busy:
          $ref: '#/components/schemas/CallForwardingBusyGet'
          description: Settings for forwarding all incoming calls to the destination you chose while the phone is in use or the workspace is busy.
        noAnswer:
          $ref: '#/components/schemas/ModifyCallForwardingNoAnswer'
          description: Settings for forwarding which only occurs when you are away or not answering your phone.
    UserMonitoringGet:
      type: object
      required:
      - callParkNotificationEnabled
      properties:
        callParkNotificationEnabled:
          type: boolean
          example: true
          description: Call park notification enabled or disabled.
        monitoredElements:
          $ref: '#/components/schemas/MonitoredElementItem'
          description: Monitored element items.
    CallWaiting:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          example: true
          description: Call Waiting state.
    UserOutgoingPermissionPatch:
      type: object
      properties:
        useCustomEnabled:
          type: boolean
          example: true
          description: When `true`, indicates that this workspace uses the shared control that applies to all outgoing call settings categories when placing outbound calls.
        useCustomPermissions:
          type: boolean
          example: true
          description: When `true`, indicates that this workspace uses the specified outgoing calling permissions when placing outbound calls.
        callingPermissions:
          type: array
          items:
            $ref: '#/components/schemas/ModifyCallingPermission'
          description: Workspace's list of outgoing permissions.
    InterceptNumberPatch:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: If `true`, the caller hears this new number when the call is intercepted.
        destination:
          type: string
          example: '+12225551212'
          description: New number the caller hears announced.
    DirectLineCallerIdNameObjectForPut:
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/SelectionObject'
          description: The selection of the direct line caller ID name.
        customName:
          type: string
          example: Hakim Smith
          description: Sets or clears the custom direct line caller ID name.  To clear the `customName`, the attribute must be set to null or empty string. Required if `selection` is set to `CUSTOM_NAME`.
      description: Settings for the direct line caller ID name to be shown for this workspace.
    PlaceCallForwardingGet:
      type: object
      required:
      - callForwarding
      - businessContinuity
      properties:
        callForwarding:
          $ref: '#/components/schemas/CallForwardingPlaceSettingGet'
          description: Call forwarding settings for a Workspace.
        businessContinuity:
          $ref: '#/components/schemas/BusinessContinuityGet'
          description: Settings for sending calls to a destination of your choice if your phone is not connected to the network for any reason, such as power outage, failed Internet connection, or wiring problem.
    CallForwardingBusyGet:
      type: object
      required:
      - enabled
      - destinationVoicemailEnabled
      properties:
        enabled:
          type: boolean
          description: '"Busy" call forwarding is enabled or disabled.'
        destination:
          type: string
          example: '+19075552859'
          description: Destination for "Busy" call forwarding.
        destinationVoicemailEnabled:
          type: boolean
          description: Enabled or disabled state of sending incoming calls to voicemail when the destination is an internal phone number and that number has the voicemail service enabled.
    UserPlaceAuthorizationCodeAdd:
      type: object
      required:
      - code
      - description
      properties:
        code:
          type: string
          example: '4856'
          description: An Access code.
        description:
          type: string
          example: Marketing's access code
          description: The description of the access code.
    ModifyCallWaiting:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Call Waiting state.
    PlaceCallerIdGet:
      type: object
      required:
      - types
      - selected
      - directNumber
      - locationNumber
      - tollFreeLocationNumber
      - displayName
      - displayDetail
      - blockInForwardCallsEnabled
      - externalCallerIdNamePolicy
      - locationExternalCallerIdName
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/CLIDPolicySelection'
          description: Allowed types for the `selected` field. This field is read-only and cannot be modified.
        selected:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION_NUMBER
          - CUSTOM
          description: "Which type of outgoing Caller ID will be used. This setting is for the number portion.\n * `DIRECT_LINE` - Outgoing caller ID shows the caller's direct line number.\n * `LOCATION_NUMBER` - Outgoing caller ID shows the main number for the location.\n * `CUSTOM` - Outgoing caller ID shows the value from the customNumber field.\n"
        directNumber:
          type: string
          example: '+12815550003'
          description: Direct number which is shown if `DIRECT_LINE` is selected.
        locationNumber:
          type: string
          example: '+12815550002'
          description: Location number which is shown if `LOCATION_NUMBER` is selected
        tollFreeLocationNumber:
          type: boolean
          description: Flag to indicate if the location number is toll-free number.
        customNumber:
          type: string
          example: '+12815550003'
          description: Custom number which is shown if CUSTOM is selected. This value must be a number from the workspace's location or from another location with the same country, PSTN provider, and zone (only applicable for India locations) as the workspace's location.
        displayName:
          type: string
          example: Clockmaker's shop 7.1
          description: Workspace's caller ID display name. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        displayDetail:
          type: string
          example: .
          description: Workspace's caller ID display details. Default is `.`. This field has been deprecated. Please use `directLineCallerIdName` and `dialByName` instead.
        blockInForwardCallsEnabled:
          type: boolean
          example: true
          description: Block this workspace's identity when receiving a call.
        externalCallerIdNamePolicy:
          type: string
          enum:
          - DIRECT_LINE
          - LOCATION
          - OTHER
          description: "Designates which type of External Caller ID Name policy is used. Default is `DIRECT_LINE`.\n * `DIRECT_LINE` - Outgoing caller ID shows the caller's direct line name.\n * `LOCATION` - Outgoing caller ID shows the external caller ID name for the location.\n * `OTHER` - Outgoing caller ID shows the value from the `customExternalCallerIdName` field.\n"
        customExternalCallerIdName:
          type: string
          example: Custom external caller name
          description: Custom external caller ID name which is shown if external caller ID name policy is `OTHER`.
        locationExternalCallerIdName:
          type: string
          example: Anna
          description: Location's external caller ID name which is shown if external caller ID name policy is `LOCATION`.
        directLineCallerIdName:
          $ref: '#/components/schemas/DirectLineCallerIdNameObject'
          description: Settings for the direct line caller ID name to be shown for this workspace.
        dialByName:
          type: string
          example: Hakim Smith
          description: The name to be used for dial by name functions.
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /
          scopes: {}
          tokenUrl: /
      type: oauth2
    bearer-key:
      type: http
      description: e.g. Bearer YOUR_AUTHORIZATION_TOKEN
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 Bearer token authentication
      flows:
        authorizationCode:
          authorizationUrl: https://webexapis.com/v1/authorize
          tokenUrl: https://webexapis.com/v1/access_token
          scopes:
            spark:applications_token: Create access tokens for Service Apps
