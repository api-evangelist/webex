      summary: List Resource Group Memberships
      operationId: List Resource Group Memberships
      description: 'Lists all resource group memberships for an organization.


        Use query parameters to filter the response.'
      tags:
      - Resource Group Memberships
      parameters:
      - name: licenseId
        in: query
        description: List resource group memberships for a license, by ID.
        example: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvMWNjYmJjMTctZDYxNi00ZDc0LTg2NGItYjFmM2IwNzAxZmJhOk1TXzAzMDRjMDkzLTFjM2MtNDRlMC1iYjBhLWU1ZDE2NDM2NmQ1OQ
        schema:
          type: string
      - name: personId
        in: query
        description: List resource group memberships for a person, by ID.
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8wZWZiNWVkMC0wY2FmLTRiNTYtYmMxMS03MzhlOWRhMDU5MjM
        schema:
          type: string
      - name: personOrgId
        in: query
        description: List resource group memberships for an organization, by ID.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8xZWI2NWZkZi05NjQzLTQxN2YtOTk3NC1hZDcyY2FlMGUxMGY
        schema:
          type: string
      - name: status
        in: query
        description: Limit resource group memberships to a specific status.
        example: activated
        schema:
          type: string
          enum:
          - pending
          - activated
          - error
      - name: max
        in: query
        description: Limit the maximum number of resource group memberships in the response.
        example: '100'
        schema:
          type: number
          default: 100
