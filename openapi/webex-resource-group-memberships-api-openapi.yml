      summary: List Resource Group Memberships V2
      operationId: listResourceGroupMembershipsV2
      description: 'Lists all resource group memberships for an organization having filtering option based on entity type (User / Workspace).


        Use query parameters to filter the response.'
      tags:
      - Resource Group Memberships
      parameters:
      - name: licenseId
        in: query
        description: List resource group memberships for a license, by ID.
        example: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvMWNjYmJjMTctZDYxNi00ZDc0LTg2NGItYjFmM2IwNzAxZmJhOk1TXzAzMDRjMDkzLTFjM2MtNDRlMC1iYjBhLWU1ZDE2NDM2NmQ1OQ
        schema:
          type: string
      - name: id
        in: query
        description: List resource group memberships by ID.
        example: Y2lzY29zcGFyazovL3VzL1BFT1BMRS8wZWZiNWVkMC0wY2FmLTRiNTYtYmMxMS03MzhlOWRhMDU5MjM
        schema:
          type: string
      - name: orgId
        in: query
        description: List resource group memberships for an organization, by ID.
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8xZWI2NWZkZi05NjQzLTQxN2YtOTk3NC1hZDcyY2FlMGUxMGY
        schema:
          type: string
      - name: status
        in: query
        description: Limit resource group memberships to a specific status.
        example: activated
        schema:
          type: string
          enum:
          - pending
          - activated
          - error
      - name: type
        in: query
        description: List resource group memberships for an organization, by type. If left blank it will include both User and Workspace type.
        example: User
        schema:
          type: string
          enum:
          - User
          - Workspace
      - name: max
        in: query
        description: Limit the maximum number of resource group memberships in the response.
        example: 100
        schema:
          type: number
          default: 100
