      summary: Update a Resource Group Membership
      operationId: Update a Resource Group Membership
      description: 'Updates a resource group membership, by ID.


        Specify the resource group membership ID in the `resourceGroupMembershipId` URI parameter.


        Only the `resourceGroupId` can be changed with this action. Resource group memberships with a `status` of "pending" cannot be updated. For more information about resource group memberships, see the [Managing Hybrid Services](/docs/api/guides/managing-hybrid-services-licenses#webex-resource-groups) guide.'
      tags:
      - Resource Group Memberships
      parameters:
      - name: resourceGroupMembershipId
        in: path
        description: The unique identifier for the resource group membership.
        required: true
        example: Y2lzY29zcGFyazovL3VzL1JFU09VUkNFX0dST1VQX01FTUJFUlNISVAvcGVyc29uSWQ6bGljZW5zZUlk
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              resourceGroupId: Y2lzY29zcGFyazovL3VzL1JFU09VUkNFX0dST1VQL2RlZmF1bHQ
              licenseId: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvMWNjYmJjMTctZDYxNi00ZDc0LTg2NGItYjFmM2IwNzAxZmJhOk1TXzAzMDRjMDkzLTFjM2MtNDRlMC1iYjBhLWU1ZDE2NDM2NmQ1OQ
              personId: Y2lzY29zcGFyazovL3VzL1BFT1BMRS9mNWIzNjE4Ny1jOGRkLTQ3MjctOGIyZi1mOWM0NDdmMjkwNDY
              personOrgId: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi85NmFiYzJhYS0zZGNjLTExZTUtYTE1Mi1mZTM0ODE5Y2RjOWE
              status: activated
            schema:
              type: object
              required:
              - resourceGroupId
              - licenseId
              - personId
              - personOrgId
              - status
              properties:
                resourceGroupId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL1JFU09VUkNFX0dST1VQL2RlZmF1bHQ
                  description: The resource group ID.
                licenseId:
                  type: string
                  example: Y2lzY29zcGFyazovL3VzL0xJQ0VOU0UvMWNjYmJjMTctZDYxNi00ZDc0LTg2NGItYjFmM2IwNzAxZmJhOk1TXzAzMDRjMDkzLTFjM2MtNDRlMC1iYjBhLWU1ZDE2NDM2NmQ1OQ
                  description: The license ID.
