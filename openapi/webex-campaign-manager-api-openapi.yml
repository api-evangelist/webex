    WeeklyShiftSchedule:
      type: object
      required:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      properties:
        monday:
          type: array
          items:
            $ref: '#/components/schemas/ShiftTime'
          description: List of shift times for Monday. Can be empty if no shifts are scheduled.
        tuesday:
          type: array
          items:
            $ref: '#/components/schemas/ShiftTime'
          description: List of shift times for Tuesday. Can be empty if no shifts are scheduled.
