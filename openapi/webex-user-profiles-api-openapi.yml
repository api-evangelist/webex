  /organization/{orgid}/v3/user-profile:
    get:
      tags:
      - User Profiles
      summary: List user profiles
      description: "Retrieve a list of user profiles in a given organization.\n Note: Returning array fields in the List (Get\
        \ All) API response is deprecated. To retrieve the complete resource with all fields, please use the Get-by-ID API\
        \ instead."
      operationId: getAllConfigWithPagedMetaDataUserProfileGranularAccess
      parameters:
      - name: orgid
        in: path
        description: Organization ID to be used for this operation. The specified security token must have permission to interact
          with the organization.
        required: true
        schema:
          type: string
        example: 2f9eecc5-0472-4549-9a83-2afdae0d4ba1
      - name: filter
        in: query
        description: "Specify a filter based on which the results will be fetched. All the fields are supported except: organizationId,\
          \ userProfileAppModules, entryPoints, sites, queues, teams, editableFolderIds, viewableFolderIds, nonViewableFolderIds,\
          \ createdTime, lastUpdatedTime \n\nThe examples below show some search queries\n- id==\"57efb0e6-5af0-4245-a67d-d3c5045cdb6e\"\
          \n- id!=\"57efb0e6-5af0-4245-a67d-d3c5045cdb6e\"\n- id=in=(\"57efb0e6-5af0-4245-a67d-d3c5045cdb6e\",\"a421e0b2-732e-46f3-a057-39160a53afb9\"\
          )\n- id=out=(\"57efb0e6-5af0-4245-a67d-d3c5045cdb6e\",\"a421e0b2-732e-46f3-a057-39160a53afb9\")\nThis parameter\
          \ uses the RSQL query syntax, a URI-friendly format for expressing criteria for filtering REST entities. For more\
          \ information about RSQL in general, see  <a href=\"https://www.here.com/docs/bundle/data-client-library-developer-guide-java-scala/page/client/rsql.html\"\
          >this reference</a>. For a list of supported operators, see <a href=\"https://github.com/perplexhub/rsql-jpa-specification#rsql-syntax-reference\"\
          >this syntax guide</a>.\n\nNote: values to be used in the filter syntax should not contain spaces. If they do, please\
          \ enclose them in quotes to apply the filter.\n"
        required: false
        schema:
          type: string
        example: id=="2f9eecc5-0472-4549-9a83-2afdae0d4ba1"
      - name: attributes
        in: query
        description: Specify the attributes to be returned. By default, all attributes are returned along with the specified
          columns. All attributes are supported. except (entryPoints,sites, queues, teams, userProfileAppModules,editableFolderIds,
          viewableFolderIds, nonViewableFolderIds)
        required: false
        schema:
          type: string
          format: string
        example: id
      - name: search
        in: query
        description: 'Filter data based on the search keyword.Supported search columns(name, profileType, description)


          The examples below show some search queries

          - "Cisco"

          - field=="name";value=="Cisco"

          - fields=in=("name","description");value=="Cisco"

          '
        required: false
        schema:
          type: string
        example: contact center
      - name: page
        in: query
        description: Defines the number of displayed page. The page number starts from 0.
        schema:
          type: integer
          default: 0
          example: 0
        example: 0
      - name: pageSize
        in: query
        description: Defines the number of items to be displayed on a page. If the number specified is more than allowed max
          page size, the API will automatically adjust the page size to the max page size.
        schema:
          type: integer
          default: 100
          example: 100
        example: 100
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                example:
                  meta:
                    orgid: 2f9eecc5-0472-4549-9a83-2afdae0d4ba1
                    page: 1
                    pageSize: 100
                    totalPages: 1
                    totalRecords: 1000
                    links:
                      next: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/user-profile?page=2&pageSize=10
                      last: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/user-profile?page=3&pageSize=10
                      prev: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/user-profile?page=0&pageSize=10
                      self: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/user-profile?page=1&pageSize=10
                      first: /organization/bde75a64-f4d5-4ffc-a239-feb607c17ef8/user-profile?page=0&pageSize=10
                  data:
                  - organizationId: f53c8b54-46ca-43f6-ba05-08426a46e23d
                    id: 93912f11-6017-404b-bf14-5331890b1797
                    version: 1
                    name: Contact Center Admin Profile
                    description: This profile should be applied only to contact center admins.
                    profileType: PREMIUM_AGENT
                    active: true
                    permissionAccessLevel: ALL
                    resourceAccessLevel: ALL
                    permissions:
                    - id: 00734874-4732-43bb-bfff-d1e75d309eb1
                      name: sites
                      access: NONE
                    editableFolderIds:
                    - 1
                    - 2
                    viewableFolderIds:
                    - 1
                    - 2
                    nonViewableFolderIds:
                    - 1
                    - 2
                    systemDefault: false
                    defaultResourceCollectionId: 80f49a6e-11d7-4651-b730-99ed2f726f61
                    resourceCollections:
                    - id: 80f49a6e-11d7-4651-b730-99ed2f726f61
                      name: Department1
                      description: Department1 description.
                      resources:
                      - name: team
                        accessLevel: SPECIFIC
                        ids:
                        - 00734874-4732-43bb-bfff-d1e75d309eb1
                        - 00734874-4732-43bb-bfff-d1e75d309eb2
                      - name: desktop-profile
                        accessLevel: ALL
                      - name: desktop-layout
                        accessLevel: NONE
                      resourceCount: 2
                    createdTime: 0
                    lastUpdatedTime: 0
                properties:
                  meta:
                    $ref: '#/components/schemas/MetaDataWithPagingInfo'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfileGranularAccessDTO'
              example:
              - accessAllQueues: ALL
                description: This profile should be applied only to contact center admins.
                active: true
                version: 1
                accessAllModules: ALL
                organizationId: f53c8b54-46ca-43f6-ba05-08426a46e23d
                systemDefault: false
                profileType: PREMIUM_AGENT
                accessAllSites: ALL
                name: Contact Center Admin Profile
                createdTime: 123456789
                lastUpdatedTime: 123456789
                id: 93912f11-6017-404b-bf14-5331890b1797
                accessAllEntryPoints: ALL
                accessAllTeams: ALL
