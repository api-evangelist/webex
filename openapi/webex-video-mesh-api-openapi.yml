      summary: List Network Test results
      operationId: List Network Test results
      description: 'Returns the test results of the Network tests triggered for an organization. The tests listed below are run as a part of the Network Test execution on the node.


        <b>Bandwidth Test</b> - Tests the bandwidth parameters of the Video Mesh node''s network. The test is run between the Video Mesh node and cloud services.<br/>

        <b>DNS Resolution Test</b> - Tests the resolution of IP addresses related to cloud services, against the DNS servers configured on the Video Mesh node''s network.<br/>

        <b>HTTPS Connectivity Test</b> - Tests whether the Video Mesh node is able to connect to cloud services via HTTPS protocol.<br/>

        <b>Websocket Connectivity Test</b> - Tests whether the Video Mesh node is able to connect to Webex cloud services via Websocket.<br/>'
      tags:
      - Video Mesh
      parameters:
      - name: orgId
        in: query
        description: Unique ID of the organization.
        required: true
        example: Y2lzY29zcGFyazovL3VzL09SR0FOSVpBVElPTi8yYzNjOWY5NS03M2Q5LTQ0NjAtYTY2OC0wNDcxNjJmZjFiYWQ=
        schema:
          type: string
      - name: triggerType
        in: query
        description: Trigger type.
        required: true
        example: OnDemand
        schema:
          type: string
          enum:
          - OnDemand
          - Periodic
          - All
      - name: from
        in: query
        description: The start date and time of the requested data in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format. The `from` parameter cannot have date and time values that exceed `to`.
        required: true
        example: '2023-01-15T15:53:00Z'
        schema:
          type: string
      - name: to
        in: query
        description: The end date and time of the requested data in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) compliant format.
        required: true
        example: '2023-01-20T15:53:00Z'
        schema:
          type: string
