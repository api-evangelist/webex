naftiko: 1.0.0-alpha2
info:
  label: Webex Device — Device Configurations
  description: 'Webex Device — Device Configurations. 2 operations. Lead operation: List Device Configurations for device.
    Self-contained Naftiko capability covering one Webex business surface.'
  tags:
  - Webex
  - Device Configurations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: device-device-configurations
    baseUri: ''
    description: Webex Device — Device Configurations business capability. Self-contained, no shared references.
    resources:
    - name: deviceConfigurations
      path: /deviceConfigurations
      operations:
      - name: listdeviceconfigurationsfordevice
        method: GET
        description: List Device Configurations for device
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceId
          in: query
          type: string
          description: List device configurations by device ID.
          required: true
        - name: key
          in: query
          type: string
          description: This can optionally be used to filter configurations. Keys are composed of segments. It's possible
            to use absolute paths, wildcards or ranges.
      - name: updatedeviceconfigurations
        method: PATCH
        description: Update Device Configurations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceId
          in: query
          type: string
          description: Update device configurations by device ID.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: device-device-configurations-rest
    port: 8080
    description: REST adapter for Webex Device — Device Configurations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/deviceconfigurations
      name: deviceconfigurations
      description: REST surface for deviceConfigurations.
      operations:
      - method: GET
        name: listdeviceconfigurationsfordevice
        description: List Device Configurations for device
        call: device-device-configurations.listdeviceconfigurationsfordevice
        with:
          deviceId: rest.deviceId
          key: rest.key
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatedeviceconfigurations
        description: Update Device Configurations
        call: device-device-configurations.updatedeviceconfigurations
        with:
          deviceId: rest.deviceId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: device-device-configurations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Device — Device Configurations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-device-configurations-device
      description: List Device Configurations for device
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: device-device-configurations.listdeviceconfigurationsfordevice
      with:
        deviceId: tools.deviceId
        key: tools.key
      outputParameters:
      - type: object
        mapping: $.
    - name: update-device-configurations
      description: Update Device Configurations
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: device-device-configurations.updatedeviceconfigurations
      with:
        deviceId: tools.deviceId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
