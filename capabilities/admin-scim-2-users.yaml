        name: getauser
        description: Get a user
        call: admin-scim-2-users.getauser
        with:
          orgId: rest.orgId
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateauserwithput
        description: Update a user with PUT
        call: admin-scim-2-users.updateauserwithput
        with:
          orgId: rest.orgId
          userId: rest.userId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateauserwithpatch
        description: Update a user with PATCH
        call: admin-scim-2-users.updateauserwithpatch
        with:
          orgId: rest.orgId
          userId: rest.userId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteauser
        description: Delete a user
        call: admin-scim-2-users.deleteauser
        with:
          orgId: rest.orgId
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
