naftiko: 1.0.0-alpha2
info:
  label: Webex Messaging — Webhooks
  description: 'Webex Messaging — Webhooks. 5 operations. Lead operation: List Webhooks. Self-contained Naftiko capability
    covering one Webex business surface.'
  tags:
  - Webex
  - Webhooks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: messaging-webhooks
    baseUri: ''
    description: Webex Messaging — Webhooks business capability. Self-contained, no shared references.
    resources:
    - name: webhooks
      path: /webhooks
      operations:
      - name: listwebhooks
        method: GET
        description: List Webhooks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: max
          in: query
          type: number
          description: Limit the maximum number of webhooks in the response.
        - name: ownedBy
          in: query
          type: string
          description: Limit the result list to org wide webhooks. Only allowed value is `org`.
      - name: createawebhook
        method: POST
        description: Create a Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: webhooks-webhookId
      path: /webhooks/{webhookId}
      operations:
      - name: getwebhookdetails
        method: GET
        description: Get Webhook Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: webhookId
          in: path
          type: string
          description: The unique identifier for the webhook.
          required: true
      - name: updateawebhook
        method: PUT
        description: Update a Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: webhookId
          in: path
          type: string
          description: The unique identifier for the webhook.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deleteawebhook
        method: DELETE
        description: Delete a Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: webhookId
          in: path
          type: string
          description: The unique identifier for the webhook.
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: messaging-webhooks-rest
    port: 8080
    description: REST adapter for Webex Messaging — Webhooks. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/webhooks
      name: webhooks
      description: REST surface for webhooks.
      operations:
      - method: GET
        name: listwebhooks
        description: List Webhooks
        call: messaging-webhooks.listwebhooks
        with:
          max: rest.max
          ownedBy: rest.ownedBy
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createawebhook
        description: Create a Webhook
        call: messaging-webhooks.createawebhook
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webhooks/{webhookid}
      name: webhooks-webhookid
      description: REST surface for webhooks-webhookId.
      operations:
      - method: GET
        name: getwebhookdetails
        description: Get Webhook Details
        call: messaging-webhooks.getwebhookdetails
        with:
          webhookId: rest.webhookId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateawebhook
        description: Update a Webhook
        call: messaging-webhooks.updateawebhook
        with:
          webhookId: rest.webhookId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteawebhook
        description: Delete a Webhook
        call: messaging-webhooks.deleteawebhook
        with:
          webhookId: rest.webhookId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: messaging-webhooks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Messaging — Webhooks. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-webhooks
      description: List Webhooks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: messaging-webhooks.listwebhooks
      with:
        max: tools.max
        ownedBy: tools.ownedBy
      outputParameters:
      - type: object
        mapping: $.
    - name: create-webhook
      description: Create a Webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: messaging-webhooks.createawebhook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-webhook-details
      description: Get Webhook Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: messaging-webhooks.getwebhookdetails
      with:
        webhookId: tools.webhookId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-webhook
      description: Update a Webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: messaging-webhooks.updateawebhook
      with:
        webhookId: tools.webhookId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-webhook
      description: Delete a Webhook
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: messaging-webhooks.deleteawebhook
      with:
        webhookId: tools.webhookId
      outputParameters:
      - type: object
        mapping: $.
