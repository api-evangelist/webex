            8601](https://en.wikipedia.org/wiki/ISO_8601) compliant for
        - name: joinTimeTo
          in: query
          type: string
          description: 'The time participants join a meeting before the specified date and time (exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
            compliant format. '
        - name: timezone
          in: header
          type: string
          description: e.g. UTC
