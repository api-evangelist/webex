        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: max
          in: query
          type: number
          description: Limit the maximum number of participants in the response, up to 100.
        - name: meetingId
          in: query
          type: string
          description: The unique identifier for the meeting. Please note that currently meeting ID of a scheduled [personal
            room](https://help.webex.com/en-us/article/nul0wut/Webex-P
          required: true
        - name: breakoutSessionId
          in: query
          type: string
          description: The unique identifier for a breakout session which happened during an ended meeting instance. If the
            `breakoutSessionId` is specified, the operation returns par
        - name: meetingStartTimeFrom
          in: query
          type: string
          description: Meetings start from the specified date and time(exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
            compliant format. If `meetingStartTimeFrom`
        - name: meetingStartTimeTo
          in: query
          type: string
          description: Meetings start before the specified date and time(exclusive) in any [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
            compliant format. If `meetingStartTimeTo`
        - name: hostEmail
          in: query
          type: string
          description: Email address for the meeting host. This parameter is only used if the user or application calling
            the API has the admin-level scopes, the admin may specify the
        - name: joinTimeFrom
          in: query
