      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-scim-2-groups.searchgroups
      with:
        orgId: tools.orgId
        filter: tools.filter
        attributes: tools.attributes
        excludedAttributes: tools.excludedAttributes
        sortBy: tools.sortBy
        sortOrder: tools.sortOrder
        startIndex: tools.startIndex
        count: tools.count
        includeMembers: tools.includeMembers
        memberType: tools.memberType
      outputParameters:
      - type: object
        mapping: $.
    - name: get-group
      description: Get a group
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-scim-2-groups.getagroup
      with:
        orgId: tools.orgId
        groupId: tools.groupId
        excludedAttributes: tools.excludedAttributes
      outputParameters:
      - type: object
