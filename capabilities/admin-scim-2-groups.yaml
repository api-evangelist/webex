      call: admin-scim-2-groups.updateagroupwithput
      with:
        orgId: tools.orgId
        groupId: tools.groupId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-group-patch
      description: Update a group with PATCH
      hints:
        readOnly: false
