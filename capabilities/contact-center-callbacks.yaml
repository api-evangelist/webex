    capability covering one Webex business surface.'
  tags:
  - Webex
  - Callbacks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
