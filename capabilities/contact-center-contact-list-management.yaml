naftiko: 1.0.0-alpha2
info:
  label: Webex Contact Center — Contact List Management
  description: 'Webex Contact Center — Contact List Management. 5 operations. Lead operation: Create contact list. Self-contained
    Naftiko capability covering one Webex business surface.'
  tags:
  - Webex
  - Contact List Management
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
