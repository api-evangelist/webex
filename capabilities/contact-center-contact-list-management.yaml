  - type: http
    namespace: contact-center-contact-list-management
    baseUri: ''
    description: Webex Contact Center — Contact List Management business capability. Self-contained, no shared references.
    resources:
    - name: v3-campaign-management-campaigns-campaignId-contact-list
      path: /v3/campaign-management/campaigns/{campaignId}/contact-list
      operations:
      - name: createcontactlist
        method: POST
        description: Create contact list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: Campaign ID to which the contact list belongs.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v3-campaign-management-campaigns-campaignId-contact-list-contactListId-contacts
      path: /v3/campaign-management/campaigns/{campaignId}/contact-list/{contactListId}/contacts
      operations:
      - name: createcontactsincontactlist
        method: POST
        description: Create contacts within a contact list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: Campaign ID to which the contact list belongs.
          required: true
        - name: contactListId
          in: path
          type: string
          description: Contact List ID (as a number string).
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v3-campaign-management-campaigns-campaignId-contact-list-contactListId-contacts-
      path: /v3/campaign-management/campaigns/{campaignId}/contact-list/{contactListId}/contacts/{contactId}
      operations:
      - name: updatecontactstatusincontactlist
        method: PATCH
        description: Update a contact's status within a contact list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: Campaign ID.
          required: true
        - name: contactListId
          in: path
          type: string
          description: Contact List ID (as a number string).
          required: true
        - name: contactId
          in: path
          type: string
          description: Contact Unique ID (Customer Unique ID or Account Unique ID or Contact_Phone)
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v3-campaign-management-campaigns-campaignId-contact-list-contactListId-status
      path: /v3/campaign-management/campaigns/{campaignId}/contact-list/{contactListId}/status
      operations:
      - name: updatecontactliststatus
        method: PATCH
        description: Update contact list status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: Campaign ID.
          required: true
        - name: contactListId
          in: path
          type: string
          description: Contact List ID (as a number string).
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v3-campaign-management-campaigns-campaignId-contact-lists
      path: /v3/campaign-management/campaigns/{campaignId}/contact-lists
      operations:
      - name: getcontactlistsincampaign
        method: GET
        description: Get Contact Lists within a Campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: Campaign ID.
          required: true
        - name: status
          in: query
          type: string
          description: Contact List Status filter (Active, Expired, UploadFailed, etc.)
        - name: source
          in: query
          type: string
          description: Contact List Source filter (API, SFTP, ManualFile, GlobalUpload, GlobalSFTP)
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
