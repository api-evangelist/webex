    - path: /v1/v3/campaign-management/campaigns/{campaignid}/contact-list/{contactlistid}/status
      name: v3-campaign-management-campaigns-campaignid-contact-list-contactlistid-status
      description: REST surface for v3-campaign-management-campaigns-campaignId-contact-list-contactListId-status.
      operations:
      - method: PATCH
        name: updatecontactliststatus
        description: Update contact list status
        call: contact-center-contact-list-management.updatecontactliststatus
        with:
          campaignId: rest.campaignId
          contactListId: rest.contactListId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/campaign-management/campaigns/{campaignid}/contact-lists
      name: v3-campaign-management-campaigns-campaignid-contact-lists
      description: REST surface for v3-campaign-management-campaigns-campaignId-contact-lists.
