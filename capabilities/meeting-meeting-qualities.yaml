naftiko: 1.0.0-alpha2
info:
  label: Webex Meetings — Meeting Qualities
  description: 'Webex Meetings — Meeting Qualities. 1 operations. Lead operation: Get Meeting Qualities. Self-contained Naftiko
    capability covering one Webex business surface.'
  tags:
  - Webex
  - Meeting Qualities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: meeting-meeting-qualities
    baseUri: ''
    description: Webex Meetings — Meeting Qualities business capability. Self-contained, no shared references.
    resources:
    - name: meeting-qualities
      path: /meeting/qualities
      operations:
      - name: getmeetingqualities
        method: GET
        description: Get Meeting Qualities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: meetingId
          in: query
          type: string
          description: Unique identifier for the specific meeting instance. **Note:** The `meetingId` can be obtained via
            the Meeting List API when meetingType=meeting. The `id` attri
          required: true
        - name: max
          in: query
          type: number
          description: Limit the maximum number of media sessions in the response.
        - name: offset
          in: query
          type: number
          description: Offset from the first result that you want to fetch.
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: meeting-meeting-qualities-rest
    port: 8080
    description: REST adapter for Webex Meetings — Meeting Qualities. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/meeting/qualities
      name: meeting-qualities
      description: REST surface for meeting-qualities.
      operations:
      - method: GET
        name: getmeetingqualities
        description: Get Meeting Qualities
        call: meeting-meeting-qualities.getmeetingqualities
        with:
          meetingId: rest.meetingId
          max: rest.max
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: meeting-meeting-qualities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Meetings — Meeting Qualities. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-meeting-qualities
      description: Get Meeting Qualities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: meeting-meeting-qualities.getmeetingqualities
      with:
        meetingId: tools.meetingId
        max: tools.max
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
