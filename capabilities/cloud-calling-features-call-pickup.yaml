        description: Update a Call Pickup
        call: cloud-calling-features-call-pickup.updateacallpickup
        with:
          locationId: rest.locationId
          callPickupId: rest.callPickupId
          orgId: rest.orgId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
