naftiko: 1.0.0-alpha2
info:
  label: Webex Contact Center — Campaign Manager
  description: 'Webex Contact Center — Campaign Manager. 3 operations. Lead operation: Start Campaign Request. Self-contained
    Naftiko capability covering one Webex business surface.'
  tags:
  - Webex
  - Campaign Manager
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: contact-center-campaign-manager
    baseUri: ''
    description: Webex Contact Center — Campaign Manager business capability. Self-contained, no shared references.
    resources:
    - name: v1-dialer-campaign
      path: /v1/dialer/campaign
      operations:
      - name: startcampaignroute
        method: POST
        description: Start Campaign Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v1-dialer-campaign-campaignId
      path: /v1/dialer/campaign/{campaignId}
      operations:
      - name: updatecampaignroute
        method: PUT
        description: Update Campaign Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: The unique request id of the campaign that needs to be updated
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: stopcampaignroute
        method: DELETE
        description: Stop Campaign Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: campaignId
          in: path
          type: string
          description: The unique request id of the campaign that needs to be stopped
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: contact-center-campaign-manager-rest
    port: 8080
    description: REST adapter for Webex Contact Center — Campaign Manager. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/dialer/campaign
      name: v1-dialer-campaign
      description: REST surface for v1-dialer-campaign.
      operations:
      - method: POST
        name: startcampaignroute
        description: Start Campaign Request
        call: contact-center-campaign-manager.startcampaignroute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/dialer/campaign/{campaignid}
      name: v1-dialer-campaign-campaignid
      description: REST surface for v1-dialer-campaign-campaignId.
      operations:
      - method: PUT
        name: updatecampaignroute
        description: Update Campaign Request
        call: contact-center-campaign-manager.updatecampaignroute
        with:
          campaignId: rest.campaignId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: stopcampaignroute
        description: Stop Campaign Request
        call: contact-center-campaign-manager.stopcampaignroute
        with:
          campaignId: rest.campaignId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: contact-center-campaign-manager-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Contact Center — Campaign Manager. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: start-campaign-request
      description: Start Campaign Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: contact-center-campaign-manager.startcampaignroute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-campaign-request
      description: Update Campaign Request
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: contact-center-campaign-manager.updatecampaignroute
      with:
        campaignId: tools.campaignId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-campaign-request
      description: Stop Campaign Request
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: contact-center-campaign-manager.stopcampaignroute
      with:
        campaignId: tools.campaignId
      outputParameters:
      - type: object
        mapping: $.
