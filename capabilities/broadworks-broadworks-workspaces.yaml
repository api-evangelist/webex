naftiko: 1.0.0-alpha2
info:
  label: Webex Broadworks Calling — BroadWorks Workspaces
  description: 'Webex Broadworks Calling — BroadWorks Workspaces. 3 operations. Lead operation: Provision a BroadWorks Workspace.
    Self-contained Naftiko capability covering one Webex business surface.'
  tags:
  - Webex
  - BroadWorks Workspaces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: broadworks-broadworks-workspaces
    baseUri: ''
    description: Webex Broadworks Calling — BroadWorks Workspaces business capability. Self-contained, no shared references.
    resources:
    - name: broadworks-workspaces
      path: /broadworks/workspaces
      operations:
      - name: provisionbroadworksworkspace
        method: POST
        description: Provision a BroadWorks Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: broadworks-workspaces-workspaceId
      path: /broadworks/workspaces/{workspaceId}
      operations:
      - name: updatebroadworksworkspace
        method: PUT
        description: Update a Broadworks Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workspaceId
          in: path
          type: string
          description: A unique Cisco identifier for the workspace.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: removebroadworksworkspace
        method: DELETE
        description: Remove a BroadWorks Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workspaceId
          in: path
          type: string
          description: A unique Cisco identifier for the workspace.
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: broadworks-broadworks-workspaces-rest
    port: 8080
    description: REST adapter for Webex Broadworks Calling — BroadWorks Workspaces. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/broadworks/workspaces
      name: broadworks-workspaces
      description: REST surface for broadworks-workspaces.
      operations:
      - method: POST
        name: provisionbroadworksworkspace
        description: Provision a BroadWorks Workspace
        call: broadworks-broadworks-workspaces.provisionbroadworksworkspace
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/broadworks/workspaces/{workspaceid}
      name: broadworks-workspaces-workspaceid
      description: REST surface for broadworks-workspaces-workspaceId.
      operations:
      - method: PUT
        name: updatebroadworksworkspace
        description: Update a Broadworks Workspace
        call: broadworks-broadworks-workspaces.updatebroadworksworkspace
        with:
          workspaceId: rest.workspaceId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: removebroadworksworkspace
        description: Remove a BroadWorks Workspace
        call: broadworks-broadworks-workspaces.removebroadworksworkspace
        with:
          workspaceId: rest.workspaceId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: broadworks-broadworks-workspaces-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Broadworks Calling — BroadWorks Workspaces. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: provision-broadworks-workspace
      description: Provision a BroadWorks Workspace
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: broadworks-broadworks-workspaces.provisionbroadworksworkspace
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-broadworks-workspace
      description: Update a Broadworks Workspace
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: broadworks-broadworks-workspaces.updatebroadworksworkspace
      with:
        workspaceId: tools.workspaceId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: remove-broadworks-workspace
      description: Remove a BroadWorks Workspace
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: broadworks-broadworks-workspaces.removebroadworksworkspace
      with:
        workspaceId: tools.workspaceId
      outputParameters:
      - type: object
        mapping: $.
