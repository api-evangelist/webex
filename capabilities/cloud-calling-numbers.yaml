        with:
          orgId: rest.orgId
          start: rest.start
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: initiatenumberjobs
        description: Initiate Number Jobs
        call: cloud-calling-numbers.initiatenumberjobs
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
