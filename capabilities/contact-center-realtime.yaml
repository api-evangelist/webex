naftiko: 1.0.0-alpha2
info:
  label: Webex Contact Center — Realtime
  description: 'Webex Contact Center — Realtime. 1 operations. Lead operation: Subscribe Realtime Notification. Self-contained
    Naftiko capability covering one Webex business surface.'
  tags:
  - Webex
  - Realtime
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: contact-center-realtime
    baseUri: ''
    description: Webex Contact Center — Realtime business capability. Self-contained, no shared references.
    resources:
    - name: v1-realtime-subscribe
      path: /v1/realtime/subscribe
      operations:
      - name: subscriberealtimeroute
        method: POST
        description: Subscribe Realtime Notification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: contact-center-realtime-rest
    port: 8080
    description: REST adapter for Webex Contact Center — Realtime. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/realtime/subscribe
      name: v1-realtime-subscribe
      description: REST surface for v1-realtime-subscribe.
      operations:
      - method: POST
        name: subscriberealtimeroute
        description: Subscribe Realtime Notification
        call: contact-center-realtime.subscriberealtimeroute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: contact-center-realtime-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Contact Center — Realtime. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: subscribe-realtime-notification
      description: Subscribe Realtime Notification
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: contact-center-realtime.subscriberealtimeroute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
