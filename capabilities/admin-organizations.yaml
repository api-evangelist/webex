naftiko: 1.0.0-alpha2
info:
  label: Webex Admin — Organizations
  description: 'Webex Admin — Organizations. 3 operations. Lead operation: List Organizations. Self-contained Naftiko capability
    covering one Webex business surface.'
  tags:
  - Webex
  - Organizations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-organizations
    baseUri: ''
    description: Webex Admin — Organizations business capability. Self-contained, no shared references.
    resources:
    - name: organizations
      path: /organizations
      operations:
      - name: listorganizations
        method: GET
        description: List Organizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: organizations-orgId
      path: /organizations/{orgId}
      operations:
      - name: getorganizationdetails
        method: GET
        description: Get Organization Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: path
          type: string
          description: The unique identifier for the organization.
          required: true
      - name: deleteorganization
        method: DELETE
        description: Delete Organization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: path
          type: string
          description: The unique identifier for the organization.
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-organizations-rest
    port: 8080
    description: REST adapter for Webex Admin — Organizations. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/organizations
      name: organizations
      description: REST surface for organizations.
      operations:
      - method: GET
        name: listorganizations
        description: List Organizations
        call: admin-organizations.listorganizations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/organizations/{orgid}
      name: organizations-orgid
      description: REST surface for organizations-orgId.
      operations:
      - method: GET
        name: getorganizationdetails
        description: Get Organization Details
        call: admin-organizations.getorganizationdetails
        with:
          orgId: rest.orgId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteorganization
        description: Delete Organization
        call: admin-organizations.deleteorganization
        with:
          orgId: rest.orgId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-organizations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Admin — Organizations. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-organizations
      description: List Organizations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-organizations.listorganizations
      outputParameters:
      - type: object
        mapping: $.
    - name: get-organization-details
      description: Get Organization Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-organizations.getorganizationdetails
      with:
        orgId: tools.orgId
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-organization
      description: Delete Organization
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: admin-organizations.deleteorganization
      with:
        orgId: tools.orgId
      outputParameters:
      - type: object
        mapping: $.
