naftiko: 1.0.0-alpha2
info:
  label: Webex Cloud Calling — Device Call Settings With Device Dynamic Settings
  description: 'Webex Cloud Calling — Device Call Settings With Device Dynamic Settings. 10 operations. Lead operation: Get
