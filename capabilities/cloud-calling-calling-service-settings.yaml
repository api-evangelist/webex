          in: query
          type: string
          description: Retrieve voicemail rules for this organization.
      - name: updatevoicemailrules
        method: PUT
        description: Update Voicemail Rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: query
          type: string
