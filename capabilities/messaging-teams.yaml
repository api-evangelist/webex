naftiko: 1.0.0-alpha2
info:
  label: Webex Messaging — Teams
  description: 'Webex Messaging — Teams. 5 operations. Lead operation: List Teams. Self-contained Naftiko capability covering
    one Webex business surface.'
  tags:
  - Webex
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: messaging-teams
    baseUri: ''
    description: Webex Messaging — Teams business capability. Self-contained, no shared references.
    resources:
    - name: teams
      path: /teams
      operations:
      - name: listteams
        method: GET
        description: List Teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: max
          in: query
          type: number
          description: Limit the maximum number of teams in the response.
      - name: createateam
        method: POST
        description: Create a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: teams-teamId
      path: /teams/{teamId}
      operations:
      - name: getteamdetails
        method: GET
        description: Get Team Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: path
          type: string
          description: The unique identifier for the team.
          required: true
        - name: description
          in: query
          type: string
          description: The teams description.
      - name: updateateam
        method: PUT
        description: Update a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: path
          type: string
          description: The unique identifier for the team.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deleteateam
        method: DELETE
        description: Delete a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: path
          type: string
          description: The unique identifier for the team.
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: messaging-teams-rest
    port: 8080
    description: REST adapter for Webex Messaging — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/teams
      name: teams
      description: REST surface for teams.
      operations:
      - method: GET
        name: listteams
        description: List Teams
        call: messaging-teams.listteams
        with:
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createateam
        description: Create a Team
        call: messaging-teams.createateam
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{teamid}
      name: teams-teamid
      description: REST surface for teams-teamId.
      operations:
      - method: GET
        name: getteamdetails
        description: Get Team Details
        call: messaging-teams.getteamdetails
        with:
          teamId: rest.teamId
          description: rest.description
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateateam
        description: Update a Team
        call: messaging-teams.updateateam
        with:
          teamId: rest.teamId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteateam
        description: Delete a Team
        call: messaging-teams.deleteateam
        with:
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: messaging-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Messaging — Teams. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-teams
      description: List Teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: messaging-teams.listteams
      with:
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
    - name: create-team
      description: Create a Team
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: messaging-teams.createateam
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-team-details
      description: Get Team Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: messaging-teams.getteamdetails
      with:
        teamId: tools.teamId
        description: tools.description
      outputParameters:
      - type: object
        mapping: $.
    - name: update-team
      description: Update a Team
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: messaging-teams.updateateam
      with:
        teamId: tools.teamId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-team
      description: Delete a Team
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: messaging-teams.deleteateam
      with:
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
