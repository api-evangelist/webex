          locationId: rest.locationId
          orgId: rest.orgId
          max: rest.max
          start: rest.start
          phoneNumber: rest.phoneNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/telephony/config/locations/{locationid}/paging/{pagingid}
      name: telephony-config-locations-locationid-paging-pagingid
      description: REST surface for telephony-config-locations-locationId-paging-pagingId.
      operations:
      - method: DELETE
        name: deleteapaginggroup
        description: Delete a Paging Group
        call: cloud-calling-features-paging-group.deleteapaginggroup
        with:
          locationId: rest.locationId
          pagingId: rest.pagingId
          orgId: rest.orgId
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getdetailsforapaginggroup
        description: Get Details for a Paging Group
        call: cloud-calling-features-paging-group.getdetailsforapaginggroup
        with:
          locationId: rest.locationId
          pagingId: rest.pagingId
          orgId: rest.orgId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateapaginggroup
        description: Update a Paging Group
        call: cloud-calling-features-paging-group.updateapaginggroup
        with:
          locationId: rest.locationId
          pagingId: rest.pagingId
          orgId: rest.orgId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/telephony/config/paging
      name: telephony-config-paging
      description: REST surface for telephony-config-paging.
      operations:
      - method: GET
        name: readthelistofpaginggroups
        description: Read the List of Paging Groups
        call: cloud-calling-features-paging-group.readthelistofpaginggroups
        with:
          orgId: rest.orgId
          max: rest.max
          start: rest.start
          locationId: rest.locationId
          name: rest.name
          phoneNumber: rest.phoneNumber
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-calling-features-paging-group-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Webex Cloud Calling — Features:  Paging Group. One tool per consumed operation, routed inline
      through this capability''s consumes block.'
    tools:
    - name: create-new-paging-group
      description: Create a new Paging Group
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-calling-features-paging-group.createanewpaginggroup
      with:
        locationId: tools.locationId
        orgId: tools.orgId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-paging-group-primary-available
