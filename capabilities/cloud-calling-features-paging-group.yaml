        idempotent: true
      call: cloud-calling-features-paging-group.getpaginggroupprimaryavailablephonenumbers
      with:
        locationId: tools.locationId
        orgId: tools.orgId
        max: tools.max
        start: tools.start
        phoneNumber: tools.phoneNumber
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-paging-group
      description: Delete a Paging Group
      hints:
