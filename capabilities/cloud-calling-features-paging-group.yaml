naftiko: 1.0.0-alpha2
info:
  label: 'Webex Cloud Calling — Features:  Paging Group'
  description: 'Webex Cloud Calling — Features:  Paging Group. 6 operations. Lead operation: Create a new Paging Group. Self-contained
    Naftiko capability covering one Webex business surface.'
  tags:
  - Webex
  - 'Features:  Paging Group'
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-calling-features-paging-group
    baseUri: ''
    description: 'Webex Cloud Calling — Features:  Paging Group business capability. Self-contained, no shared references.'
    resources:
    - name: telephony-config-locations-locationId-paging
      path: /telephony/config/locations/{locationId}/paging
      operations:
      - name: createanewpaginggroup
        method: POST
        description: Create a new Paging Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: locationId
          in: path
          type: string
          description: Create the paging group for this location.
          required: true
        - name: orgId
          in: query
          type: string
          description: Create the paging group for this organization.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: telephony-config-locations-locationId-paging-availableNumbers
      path: /telephony/config/locations/{locationId}/paging/availableNumbers
      operations:
      - name: getpaginggroupprimaryavailablephonenumbers
        method: GET
        description: Get Paging Group Primary Available Phone Numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: locationId
          in: path
          type: string
          description: Return the list of phone numbers for this location within the given organization. The maximum length
            is 36.
          required: true
        - name: orgId
          in: query
          type: string
          description: List numbers for this organization.
        - name: max
          in: query
          type: number
          description: Limit the number of phone numbers returned to this maximum count. The default is 2000.
        - name: start
          in: query
          type: number
          description: Start at the zero-based offset in the list of matching phone numbers. The default is 0.
        - name: phoneNumber
          in: query
          type: array
          description: Filter phone numbers based on the comma-separated list provided in the `phoneNumber` array.
    - name: telephony-config-locations-locationId-paging-pagingId
      path: /telephony/config/locations/{locationId}/paging/{pagingId}
      operations:
      - name: deleteapaginggroup
        method: DELETE
        description: Delete a Paging Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: locationId
          in: path
          type: string
          description: Location from which to delete a paging group.
          required: true
        - name: pagingId
          in: path
          type: string
          description: Delete the paging group with the matching ID.
          required: true
        - name: orgId
          in: query
          type: string
          description: Delete the paging group from this organization.
      - name: getdetailsforapaginggroup
        method: GET
        description: Get Details for a Paging Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: locationId
          in: path
          type: string
          description: Retrieve settings for a paging group in this location.
          required: true
        - name: pagingId
          in: path
          type: string
          description: Retrieve settings for the paging group with this identifier.
          required: true
        - name: orgId
          in: query
          type: string
          description: Retrieve paging group settings from this organization.
      - name: updateapaginggroup
        method: PUT
        description: Update a Paging Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: locationId
          in: path
          type: string
          description: Update settings for a paging group in this location.
          required: true
        - name: pagingId
          in: path
          type: string
          description: Update settings for the paging group with this identifier.
          required: true
        - name: orgId
          in: query
          type: string
          description: Update paging group settings from this organization.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: telephony-config-paging
      path: /telephony/config/paging
      operations:
      - name: readthelistofpaginggroups
        method: GET
        description: Read the List of Paging Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: query
          type: string
          description: List paging groups for this organization.
        - name: max
          in: query
          type: number
          description: Limit the number of objects returned to this maximum count. Default is 2000
        - name: start
          in: query
          type: number
          description: Start at the zero-based offset in the list of matching objects. Default is 0
        - name: locationId
          in: query
          type: string
          description: Return only paging groups with matching location ID. Default is all locations
        - name: name
          in: query
          type: string
          description: Return only paging groups with the matching name.
        - name: phoneNumber
          in: query
          type: string
          description: Return only paging groups with matching primary phone number or extension.
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-calling-features-paging-group-rest
    port: 8080
    description: 'REST adapter for Webex Cloud Calling — Features:  Paging Group. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.'
    resources:
    - path: /v1/telephony/config/locations/{locationid}/paging
      name: telephony-config-locations-locationid-paging
      description: REST surface for telephony-config-locations-locationId-paging.
      operations:
      - method: POST
        name: createanewpaginggroup
        description: Create a new Paging Group
        call: cloud-calling-features-paging-group.createanewpaginggroup
        with:
          locationId: rest.locationId
          orgId: rest.orgId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/telephony/config/locations/{locationid}/paging/availablenumbers
      name: telephony-config-locations-locationid-paging-availablenumbers
      description: REST surface for telephony-config-locations-locationId-paging-availableNumbers.
      operations:
      - method: GET
        name: getpaginggroupprimaryavailablephonenumbers
        description: Get Paging Group Primary Available Phone Numbers
