naftiko: 1.0.0-alpha2
info:
  label: Webex Contact Center — Agent Summaries
  description: 'Webex Contact Center — Agent Summaries. 1 operations. Lead operation: List summaries. Self-contained Naftiko
    capability covering one Webex business surface.'
  tags:
  - Webex
  - Agent Summaries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: contact-center-agent-summaries
    baseUri: ''
    description: Webex Contact Center — Agent Summaries business capability. Self-contained, no shared references.
    resources:
    - name: generated-summaries-search
      path: /generated-summaries/search
      operations:
      - name: listsummaries
        method: POST
        description: List summaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: contact-center-agent-summaries-rest
    port: 8080
    description: REST adapter for Webex Contact Center — Agent Summaries. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/generated-summaries/search
      name: generated-summaries-search
      description: REST surface for generated-summaries-search.
      operations:
      - method: POST
        name: listsummaries
        description: List summaries
        call: contact-center-agent-summaries.listsummaries
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: contact-center-agent-summaries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Contact Center — Agent Summaries. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-summaries
      description: List summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: contact-center-agent-summaries.listsummaries
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
