naftiko: 1.0.0-alpha2
info:
  label: Webex Admin — Roles
  description: 'Webex Admin — Roles. 2 operations. Lead operation: List Roles. Self-contained Naftiko capability covering
    one Webex business surface.'
  tags:
  - Webex
  - Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-roles
    baseUri: ''
    description: Webex Admin — Roles business capability. Self-contained, no shared references.
    resources:
    - name: roles
      path: /roles
      operations:
      - name: listroles
        method: GET
        description: List Roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: roles-roleId
      path: /roles/{roleId}
      operations:
      - name: getroledetails
        method: GET
        description: Get Role Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roleId
          in: path
          type: string
          description: The unique identifier for the role.
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-roles-rest
    port: 8080
    description: REST adapter for Webex Admin — Roles. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/roles
      name: roles
      description: REST surface for roles.
      operations:
      - method: GET
        name: listroles
        description: List Roles
        call: admin-roles.listroles
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/roles/{roleid}
      name: roles-roleid
      description: REST surface for roles-roleId.
      operations:
      - method: GET
        name: getroledetails
        description: Get Role Details
        call: admin-roles.getroledetails
        with:
          roleId: rest.roleId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Admin — Roles. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-roles
      description: List Roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-roles.listroles
      outputParameters:
      - type: object
        mapping: $.
    - name: get-role-details
      description: Get Role Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-roles.getroledetails
      with:
        roleId: tools.roleId
      outputParameters:
      - type: object
        mapping: $.
