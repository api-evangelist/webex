naftiko: 1.0.0-alpha2
info:
  label: Webex Admin — Partner Administrators
  description: 'Webex Admin — Partner Administrators. 5 operations. Lead operation: Get all customers managed by a partner
    admin. Self-contained Naftiko capability covering one Webex business surface.'
  tags:
  - Webex
  - Partner Administrators
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WEBEX_API_KEY: WEBEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-partner-administrators
    baseUri: ''
    description: Webex Admin — Partner Administrators business capability. Self-contained, no shared references.
    resources:
    - name: partner-organizations
      path: /partner/organizations
      operations:
      - name: getallcustomersmanagedbyapartneradmin
        method: GET
        description: Get all customers managed by a partner admin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: managedBy
          in: query
          type: string
          description: List customer orgs associated with this person ID.
          required: true
    - name: partner-organizations-partnerAdmin-personId
      path: /partner/organizations/partnerAdmin/{personId}
      operations:
      - name: revokeallpartneradminrolesforagivenpersonid
        method: DELETE
        description: Revoke all partner admin roles for a given person ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: personId
          in: path
          type: string
          description: ID of the user whose partner roles needs to be revoked.
          required: true
    - name: partner-organizations-orgId-partnerAdmin-personId-assign
      path: /partner/organizations/{orgId}/partnerAdmin/{personId}/assign
      operations:
      - name: assignpartneradmintoacustomer
        method: POST
        description: Assign partner admin to a customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: path
          type: string
          description: The ID of the customer organization.
          required: true
        - name: personId
          in: path
          type: string
          description: User ID of the partner admin in the partners org.
          required: true
    - name: partner-organizations-orgId-partnerAdmin-personId-unassign
      path: /partner/organizations/{orgId}/partnerAdmin/{personId}/unassign
      operations:
      - name: unassignpartneradminfromacustomer
        method: DELETE
        description: Unassign partner admin from a customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: path
          type: string
          description: The ID of the customer organization.
          required: true
        - name: personId
          in: path
          type: string
          description: User ID of the partner admin in the partners org.
          required: true
    - name: partner-organizations-orgId-partnerAdmins
      path: /partner/organizations/{orgId}/partnerAdmins
      operations:
      - name: getallpartneradminsassignedtoacustomer
        method: GET
        description: Get all partner admins assigned to a customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orgId
          in: path
          type: string
          description: List partner admins associated with this customer org ID.
          required: true
    authentication:
      type: bearer
      token: '{{env.WEBEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-partner-administrators-rest
    port: 8080
    description: REST adapter for Webex Admin — Partner Administrators. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/partner/organizations
      name: partner-organizations
      description: REST surface for partner-organizations.
      operations:
      - method: GET
        name: getallcustomersmanagedbyapartneradmin
        description: Get all customers managed by a partner admin
        call: admin-partner-administrators.getallcustomersmanagedbyapartneradmin
        with:
          managedBy: rest.managedBy
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/partner/organizations/partneradmin/{personid}
      name: partner-organizations-partneradmin-personid
      description: REST surface for partner-organizations-partnerAdmin-personId.
      operations:
      - method: DELETE
        name: revokeallpartneradminrolesforagivenpersonid
        description: Revoke all partner admin roles for a given person ID
        call: admin-partner-administrators.revokeallpartneradminrolesforagivenpersonid
        with:
          personId: rest.personId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/partner/organizations/{orgid}/partneradmin/{personid}/assign
      name: partner-organizations-orgid-partneradmin-personid-assign
      description: REST surface for partner-organizations-orgId-partnerAdmin-personId-assign.
      operations:
      - method: POST
        name: assignpartneradmintoacustomer
        description: Assign partner admin to a customer
        call: admin-partner-administrators.assignpartneradmintoacustomer
        with:
          orgId: rest.orgId
          personId: rest.personId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/partner/organizations/{orgid}/partneradmin/{personid}/unassign
      name: partner-organizations-orgid-partneradmin-personid-unassign
      description: REST surface for partner-organizations-orgId-partnerAdmin-personId-unassign.
      operations:
      - method: DELETE
        name: unassignpartneradminfromacustomer
        description: Unassign partner admin from a customer
        call: admin-partner-administrators.unassignpartneradminfromacustomer
        with:
          orgId: rest.orgId
          personId: rest.personId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/partner/organizations/{orgid}/partneradmins
      name: partner-organizations-orgid-partneradmins
      description: REST surface for partner-organizations-orgId-partnerAdmins.
      operations:
      - method: GET
        name: getallpartneradminsassignedtoacustomer
        description: Get all partner admins assigned to a customer
        call: admin-partner-administrators.getallpartneradminsassignedtoacustomer
        with:
          orgId: rest.orgId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-partner-administrators-mcp
    port: 9090
    transport: http
    description: MCP adapter for Webex Admin — Partner Administrators. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-all-customers-managed-partner
      description: Get all customers managed by a partner admin
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-partner-administrators.getallcustomersmanagedbyapartneradmin
      with:
        managedBy: tools.managedBy
      outputParameters:
      - type: object
        mapping: $.
    - name: revoke-all-partner-admin-roles
      description: Revoke all partner admin roles for a given person ID
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: admin-partner-administrators.revokeallpartneradminrolesforagivenpersonid
      with:
        personId: tools.personId
      outputParameters:
      - type: object
        mapping: $.
    - name: assign-partner-admin-customer
      description: Assign partner admin to a customer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: admin-partner-administrators.assignpartneradmintoacustomer
      with:
        orgId: tools.orgId
        personId: tools.personId
      outputParameters:
      - type: object
        mapping: $.
    - name: unassign-partner-admin-customer
      description: Unassign partner admin from a customer
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: admin-partner-administrators.unassignpartneradminfromacustomer
      with:
        orgId: tools.orgId
        personId: tools.personId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-all-partner-admins-assigned
      description: Get all partner admins assigned to a customer
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-partner-administrators.getallpartneradminsassignedtoacustomer
      with:
        orgId: tools.orgId
      outputParameters:
      - type: object
        mapping: $.
