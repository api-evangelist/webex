aid: webex
name: Webex
description: >-
  Cisco Webex is a comprehensive collaboration platform offering APIs for messaging, meetings, calling, devices, and
  contact center workflows. The Webex Developer Platform enables developers to build integrations, bots, embedded apps,
  and automations using REST APIs, SDKs, and webhooks. Webex supports OAuth 2.0 authentication and provides separate API
  surfaces for messaging, video conferencing, cloud calling, admin management, and more.
