aid: webex
name: Webex
description: Cisco Webex is a comprehensive collaboration platform offering APIs for messaging, meetings, calling, devices,
  and contact center workflows. The Webex Developer Platform enables developers to build integrations, bots, embedded apps,
  and automations using REST APIs, SDKs, and webhooks. Webex supports OAuth 2.0 authentication and provides separate API surfaces
  for messaging, video conferencing, cloud calling, admin management, and more.
type: Index
position: Consumer
access: 3rd-Party
image: https://developer.webex.com/images/webex-logo.png
tags:
  - Calling
  - Collaboration
  - Communication
  - Enterprise
  - Messaging
  - Video Conferencing
url: https://raw.githubusercontent.com/api-evangelist/webex/refs/heads/main/apis.yml
created: '2025-02-06'
modified: '2026-05-19'
