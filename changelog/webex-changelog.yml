entries:
- breaking: true
  highlights:
  - The SDK no longer includes dangerous permissions in its library manifest; applications must now explicitly declare all necessary permissions
    in their own AndroidManifest.xml.
  - The SDK will no longer prompt users for system permissions; it is now the application's responsibility to request these permissions at runtime.
  - If required permissions are missing, the SDK will report this via WebexError.ErrorCode.PERMISSION_REQUIRED, providing a list of the missing
    permissions in error.data.
  date: '2025-12-10'
